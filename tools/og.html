<!doctype html><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#0d0f12;color:#e8ebef;font-family:"Onest",system-ui,sans-serif;position:relative;overflow:hidden}
.shots{position:absolute;right:-60px;top:70px;display:grid;grid-template-columns:repeat(2,300px);gap:16px;transform:rotate(-6deg)}
.shots span{padding:14px;display:block}
.shots img{width:100%;border-radius:6px;display:block}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,#0d0f12 38%,rgba(14,15,12,0) 75%)}
.copy{position:absolute;left:64px;top:64px;bottom:64px;width:620px;display:flex;flex-direction:column;justify-content:space-between}
.tag{font-size:26px;color:#a3a9b2}
h1{font-weight:800;font-size:112px;line-height:.92;letter-spacing:-.04em;text-transform:uppercase}
p{font-size:32px;line-height:1.25;max-width:560px}
b{display:inline-block;background:#f2b544;color:#0d0f12;padding:10px 20px;font-size:26px;font-weight:500;margin-top:24px}
</style>
<div class="shots">
<span style="background:#f2b544"><img src="../public/shots/dizeltrade.webp"></span>
<span style="background:#34d399"><img src="../public/shots/tradinglearn.webp"></span>
<span style="background:#e8b84b"><img src="../public/shots/caspianflow.webp"></span>
<span style="background:#f0c9a4"><img src="../public/shots/restaurant.webp"></span>
</div><div class="fade"></div>
