<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotFactory — Telegram Bot Builder</title>
<style>
:root {
  --tg-bg: #ffffff;
  --tg-text: #1c1c1e;
  --tg-hint: #8e8e93;
  --tg-link: #2481cc;
  --tg-button: #2481cc;
  --tg-button-text: #ffffff;
  --tg-secondary-bg: #f2f2f7;
  --tg-card-bg: #ffffff;
  --tg-border: #e5e5ea;
  --tg-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 8px rgba(0,0,0,.04);
  --tg-shadow-md: 0 4px 16px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.06);
  --tg-red: #ff3b30;
  --tg-green: #34c759;
  --tg-surface: #f9f9fb;
  --radius: 14px;
  --radius-sm: 10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --preview-bg: #e5ddd5;
  --preview-bubble: #ffffff;
  --preview-bubble-text: #1c1c1e;
  --preview-header: #2481cc;
}
[data-theme="dark"] {
  --tg-bg: #1c1c1e;
  --tg-text: #ffffff;
  --tg-hint: #8e8e93;
  --tg-link: #5aadec;
  --tg-button: #2481cc;
  --tg-button-text: #ffffff;
  --tg-secondary-bg: #2c2c2e;
  --tg-card-bg: #2c2c2e;
  --tg-border: #3a3a3c;
  --tg-shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 8px rgba(0,0,0,.2);
  --tg-shadow-md: 0 4px 16px rgba(0,0,0,.4), 0 1px 4px rgba(0,0,0,.2);
  --tg-red: #ff453a;
  --tg-green: #30d158;
  --tg-surface: #1c1c1e;
  --preview-bg: #1a1a2e;
  --preview-bubble: #2c2c2e;
  --preview-bubble-text: #ffffff;
  --preview-header: #1d3557;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  background: #e8ecf0;
  color: var(--tg-text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: background .25s, color .25s;
}
[data-theme="dark"] body { background: #111113; }

/* Demo banner */
.demo-banner {
  width: 100%;
  background: linear-gradient(135deg, #2481cc 0%, #1a6ab0 100%);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  padding: 7px 16px;
  letter-spacing: .3px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.demo-banner .badge {
  background: rgba(255,255,255,.22);
  border-radius: 20px;
  padding: 2px 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
}

/* Wrapper */
.stage {
  flex: 1;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px 16px 32px;
  gap: 28px;
}

/* Phone mockup */
.phone-wrap {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.phone {
  width: 375px;
  max-width: 100%;
  background: var(--tg-bg);
  border-radius: 36px;
  box-shadow: 0 12px 48px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.1), inset 0 0 0 1px rgba(0,0,0,.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 720px;
  position: relative;
  transition: background .25s;
}
.phone-notch {
  width: 120px;
  height: 22px;
  background: #111;
  border-radius: 0 0 18px 18px;
  margin: 0 auto;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
}
.phone-inner {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding-top: 28px;
  overflow: hidden;
}

/* App header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px 10px;
  background: var(--tg-bg);
  border-bottom: 1px solid var(--tg-border);
  flex-shrink: 0;
  transition: background .25s, border-color .25s;
}
.header-left { display: flex; flex-direction: column; gap: 1px; }
.app-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--tg-text);
  display: flex;
  align-items: center;
  gap: 5px;
  line-height: 1.2;
}
.header-greeting {
  font-size: 12px;
  color: var(--tg-hint);
  font-weight: 400;
}
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--tg-hint);
  transition: background .15s;
}
.icon-btn:hover { background: var(--tg-secondary-bg); }

/* Scrollable content area */
.app-content {
  flex: 1;
  overflow-y: auto;
  padding: 14px 14px 120px;
  background: var(--tg-secondary-bg);
  transition: background .25s;
  scrollbar-width: thin;
  scrollbar-color: var(--tg-border) transparent;
}
.app-content::-webkit-scrollbar { width: 4px; }
.app-content::-webkit-scrollbar-track { background: transparent; }
.app-content::-webkit-scrollbar-thumb { background: var(--tg-border); border-radius: 4px; }

/* Published banner */
.published-banner {
  background: var(--tg-card-bg);
  border: 1.5px solid var(--tg-green);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 14px;
  display: none;
  align-items: center;
  gap: 10px;
  box-shadow: var(--tg-shadow);
  transition: background .25s;
}
.published-banner.show { display: flex; }
.published-banner .pub-icon { font-size: 20px; flex-shrink: 0; }
.published-banner .pub-info { flex: 1; }
.published-banner .pub-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--tg-green);
  line-height: 1.3;
}
.published-banner .pub-link {
  font-size: 12px;
  color: var(--tg-link);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-top: 2px;
}
.published-banner .pub-link:hover { text-decoration: underline; }

/* Section label */
.section-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--tg-hint);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin: 0 4px 8px;
}

/* Block cards */
.blocks-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 12px;
}
.block-card {
  background: var(--tg-card-bg);
  border-radius: var(--radius);
  box-shadow: var(--tg-shadow);
  overflow: hidden;
  transition: background .25s, box-shadow .2s, transform .15s;
  cursor: default;
  border: 1.5px solid transparent;
}
.block-card.dragging {
  opacity: .55;
  transform: scale(.98);
  box-shadow: var(--tg-shadow-md);
  border-color: var(--tg-button);
}
.block-card.drag-over {
  border-color: var(--tg-button);
  box-shadow: 0 0 0 3px rgba(36,129,204,.18);
}
.block-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  cursor: pointer;
  user-select: none;
  transition: background .15s;
}
.block-header:hover { background: var(--tg-secondary-bg); }
.drag-handle {
  color: var(--tg-hint);
  font-size: 16px;
  cursor: grab;
  line-height: 1;
  padding: 2px 2px;
  flex-shrink: 0;
  opacity: .55;
}
.drag-handle:active { cursor: grabbing; }
.block-icon { font-size: 18px; flex-shrink: 0; }
.block-meta { flex: 1; min-width: 0; }
.block-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--tg-text);
  line-height: 1.3;
}
.block-preview {
  font-size: 12px;
  color: var(--tg-hint);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
  margin-top: 1px;
}
.block-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.block-chevron {
  font-size: 12px;
  color: var(--tg-hint);
  transition: transform .22s;
  display: inline-block;
  margin-right: 2px;
}
.block-card.expanded .block-chevron { transform: rotate(90deg); }
.delete-btn {
  background: none;
  border: none;
  cursor: pointer;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: var(--tg-hint);
  transition: background .15s, color .15s;
  flex-shrink: 0;
}
.delete-btn:hover { background: rgba(255,59,48,.12); color: var(--tg-red); }

/* Block editor */
.block-editor {
  display: none;
  border-top: 1px solid var(--tg-border);
  padding: 14px;
  background: var(--tg-secondary-bg);
  transition: background .25s, border-color .25s;
}
.block-card.expanded .block-editor { display: block; }
.block-editor textarea {
  width: 100%;
  background: var(--tg-card-bg);
  border: 1.5px solid var(--tg-border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-family: var(--font);
  font-size: 14px;
  color: var(--tg-text);
  resize: vertical;
  min-height: 80px;
  outline: none;
  transition: border-color .18s, background .25s, color .25s;
  line-height: 1.5;
}
.block-editor textarea:focus { border-color: var(--tg-button); }
.editor-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--tg-hint);
  margin-bottom: 7px;
  display: block;
}

/* Buttons block editor */
.btn-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
.btn-item {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--tg-card-bg);
  border: 1.5px solid var(--tg-border);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  transition: border-color .18s, background .25s;
}
.btn-item:focus-within { border-color: var(--tg-button); }
.btn-item input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  font-family: var(--font);
  font-size: 13px;
  color: var(--tg-text);
  font-weight: 500;
}
.btn-item .del-btn-item {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--tg-hint);
  font-size: 14px;
  padding: 2px 4px;
  border-radius: 6px;
  transition: color .15s, background .15s;
}
.btn-item .del-btn-item:hover { color: var(--tg-red); background: rgba(255,59,48,.1); }
.add-btn-link {
  background: none;
  border: none;
  cursor: pointer;
  font-family: var(--font);
  font-size: 13px;
  color: var(--tg-link);
  font-weight: 500;
  padding: 4px 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: opacity .15s;
}
.add-btn-link:hover { opacity: .75; }

/* Add block button */
.add-block-wrap { margin-top: 4px; }
.add-block-btn {
  width: 100%;
  background: var(--tg-card-bg);
  border: 1.5px dashed var(--tg-border);
  border-radius: var(--radius);
  color: var(--tg-link);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  padding: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: background .15s, border-color .15s;
}
.add-block-btn:hover {
  background: rgba(36,129,204,.06);
  border-color: var(--tg-button);
}

/* Block type popup */
.popup-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 50;
  display: none;
  align-items: flex-end;
  border-radius: 36px;
  overflow: hidden;
}
.popup-overlay.open { display: flex; }
.popup-sheet {
  width: 100%;
  background: var(--tg-bg);
  border-radius: 20px 20px 0 0;
  padding: 8px 16px 28px;
  box-shadow: 0 -4px 24px rgba(0,0,0,.15);
  transition: background .25s;
}
.popup-handle {
  width: 40px;
  height: 4px;
  background: var(--tg-border);
  border-radius: 4px;
  margin: 8px auto 16px;
}
.popup-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--tg-hint);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 12px;
}
.popup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.popup-type-btn {
  background: var(--tg-secondary-bg);
  border: none;
  border-radius: var(--radius);
  padding: 16px 14px;
  cursor: pointer;
  font-family: var(--font);
  text-align: left;
  transition: background .15s, transform .1s;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.popup-type-btn:hover { background: rgba(36,129,204,.1); transform: scale(.98); }
.popup-type-btn:active { transform: scale(.96); }
.popup-type-btn .pt-icon { font-size: 22px; line-height: 1; }
.popup-type-btn .pt-label { font-size: 13px; font-weight: 600; color: var(--tg-text); }
.popup-type-btn .pt-desc { font-size: 11px; color: var(--tg-hint); }
.popup-cancel {
  width: 100%;
  background: var(--tg-secondary-bg);
  border: none;
  border-radius: var(--radius);
  padding: 14px;
  margin-top: 10px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  color: var(--tg-text);
  cursor: pointer;
  transition: background .15s;
}
.popup-cancel:hover { background: var(--tg-border); }

/* Publish bar */
.publish-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 16px 24px;
  background: var(--tg-bg);
  border-top: 1px solid var(--tg-border);
  z-index: 20;
  transition: background .25s, border-color .25s;
}
.publish-btn {
  width: 100%;
  background: var(--tg-button);
  color: var(--tg-button-text);
  border: none;
  border-radius: var(--radius);
  padding: 15px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: background .2s, opacity .2s, transform .1s;
  letter-spacing: .1px;
  position: relative;
  overflow: hidden;
}
.publish-btn:hover { background: #1a6ab0; }
.publish-btn:active { transform: scale(.98); }
.publish-btn:disabled { opacity: .7; cursor: default; transform: none; }
.publish-btn.success { background: var(--tg-green); }

/* Spinner */
.spinner {
  width: 18px; height: 18px;
  border: 2.5px solid rgba(255,255,255,.35);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Desktop preview panel */
.preview-panel {
  width: 340px;
  flex-shrink: 0;
  display: none;
}
@media (min-width: 820px) {
  .preview-panel { display: block; }
}
.preview-label {
  font-size: 12px;
  font-weight: 600;
  color: #888;
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom: 12px;
  text-align: center;
}
.tg-chat {
  background: var(--preview-bg);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--tg-shadow-md);
  min-height: 500px;
  display: flex;
  flex-direction: column;
  transition: background .25s;
}
.tg-chat-header {
  background: var(--preview-header);
  color: #fff;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.bot-avatar {
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,.25);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}
.bot-info .bot-name { font-size: 14px; font-weight: 700; line-height: 1.2; }
.bot-info .bot-status { font-size: 11px; opacity: .8; }
.tg-messages {
  flex: 1;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(0,0,0,.15) transparent;
}
.msg-bubble {
  background: var(--preview-bubble);
  color: var(--preview-bubble-text);
  border-radius: 14px 14px 14px 4px;
  padding: 9px 12px;
  max-width: 90%;
  font-size: 13px;
  line-height: 1.5;
  box-shadow: 0 1px 2px rgba(0,0,0,.12);
  white-space: pre-wrap;
  word-break: break-word;
  transition: background .25s, color .25s;
}
.msg-empty {
  text-align: center;
  color: #aaa;
  font-size: 13px;
  padding: 32px 16px;
  font-style: italic;
}
.preview-buttons {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 4px;
  align-self: stretch;
}
.preview-btn-item {
  background: var(--tg-button);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 500;
  text-align: center;
  cursor: default;
  font-family: var(--font);
}

/* Dark mode toggle label */
.dark-toggle-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #aaa;
  margin-top: 14px;
  justify-content: center;
}
.toggle-switch {
  position: relative;
  width: 38px;
  height: 22px;
  cursor: pointer;
}
.toggle-switch input { display: none; }
.toggle-track {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 11px;
  transition: background .2s;
}
.toggle-thumb {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 16px;
  height: 16px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  transition: transform .2s;
}
.toggle-switch input:checked ~ .toggle-track { background: var(--tg-button); }
.toggle-switch input:checked ~ .toggle-thumb { transform: translateX(16px); }

/* Toast */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1c1c1e;
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: 20px;
  opacity: 0;
  transition: opacity .3s, transform .3s;
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Responsive adjustments */
@media (max-width: 440px) {
  .stage { padding: 0; }
  .phone { border-radius: 0; min-height: 100svh; box-shadow: none; }
  .phone-notch { display: none; }
  .phone-inner { padding-top: 0; }
}
</style>
</head>
<body>

<div class="demo-banner">
  <span class="badge">Demo</span>
  BotFactory — Telegram Bot Builder &nbsp;·&nbsp; Интерактивное демо
</div>

<div class="stage">
  <!-- Phone mockup -->
  <div class="phone-wrap">
    <div class="phone" id="phone">
      <div class="phone-notch"></div>
      <div class="phone-inner">

        <!-- Header -->
        <div class="app-header">
          <div class="header-left">
            <div class="app-title">🤖 BotFactory</div>
            <div class="header-greeting">Привет, Алекс 👋</div>
          </div>
          <div class="header-actions">
            <button class="icon-btn" id="darkToggleBtn" title="Тема" aria-label="Переключить тему">🌙</button>
          </div>
        </div>

        <!-- Scrollable content -->
        <div class="app-content" id="appContent">

          <!-- Published banner -->
          <div class="published-banner" id="publishedBanner">
            <div class="pub-icon">✅</div>
            <div class="pub-info">
              <div class="pub-title">Бот опубликован!</div>
              <a href="#" class="pub-link" onclick="return false;">@mybot → Ссылка на бота 🔗</a>
            </div>
          </div>

          <div class="section-label">Блоки бота</div>

          <!-- Blocks list -->
          <div class="blocks-list" id="blocksList"></div>

          <!-- Add block button -->
          <div class="add-block-wrap">
            <button class="add-block-btn" id="addBlockBtn">
              <span>＋</span> Добавить блок
            </button>
          </div>
        </div>

        <!-- Block type popup -->
        <div class="popup-overlay" id="popupOverlay">
          <div class="popup-sheet">
            <div class="popup-handle"></div>
            <div class="popup-title">Тип блока</div>
            <div class="popup-grid" id="popupGrid"></div>
            <button class="popup-cancel" id="popupCancel">Отмена</button>
          </div>
        </div>

        <!-- Publish bar -->
        <div class="publish-bar">
          <button class="publish-btn" id="publishBtn">
            <span id="publishBtnContent">🚀 Опубликовать бота</span>
          </button>
        </div>

      </div><!-- /phone-inner -->
    </div><!-- /phone -->

    <!-- Dark mode toggle below phone -->
    <div class="dark-toggle-wrap">
      <span>☀️</span>
      <label class="toggle-switch" title="Тёмная тема">
        <input type="checkbox" id="darkModeCheck">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
      <span>🌙</span>
      <span style="margin-left:4px;">Тёмная тема</span>
    </div>
  </div><!-- /phone-wrap -->

  <!-- Desktop preview panel -->
  <div class="preview-panel">
    <div class="preview-label">📱 Превью бота</div>
    <div class="tg-chat">
      <div class="tg-chat-header">
        <div class="bot-avatar">🤖</div>
        <div class="bot-info">
          <div class="bot-name">@mybot</div>
          <div class="bot-status">бот · онлайн</div>
        </div>
      </div>
      <div class="tg-messages" id="tgMessages">
        <div class="msg-empty">Добавьте блоки, чтобы увидеть превью</div>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ─── Data model ───────────────────────────────────────────────────────────────
let nextId = 10;
const BLOCK_DEFS = {
  greeting: { icon: '👋', name: 'Приветствие', desc: 'Первое сообщение', defaultText: 'Привет! Я твой умный помощник. Что хочешь узнать?' },
  description: { icon: '📝', name: 'Описание', desc: 'О чём этот бот', defaultText: 'Помогу с заказами, расписанием и ответами на вопросы.' },
  buttons: { icon: '🔘', name: 'Кнопки', desc: 'Быстрые действия', defaultButtons: ['📦 Мои заказы', '📅 Расписание', '❓ Помощь'] },
  reward: { icon: '🎁', name: 'Выдача', desc: 'Финальный ответ', defaultText: 'Спасибо за обращение! Ваш запрос принят.' }
};

let blocks = [
  { id: 1, type: 'greeting', text: 'Привет! Я твой умный помощник. Что хочешь узнать?' },
  { id: 2, type: 'description', text: 'Помогу с заказами, расписанием и ответами на вопросы.' },
  { id: 3, type: 'buttons', buttons: ['📦 Мои заказы', '📅 Расписание', '❓ Помощь'] },
  { id: 4, type: 'reward', text: 'Спасибо за обращение! Ваш запрос принят.' }
];

let expandedId = null;
let published = false;
let dragSrcIdx = null;

// ─── Render ───────────────────────────────────────────────────────────────────
function getPreview(block) {
  const def = BLOCK_DEFS[block.type];
  if (block.type === 'buttons') {
    return block.buttons.length ? block.buttons.join(' · ') : 'Нет кнопок';
  }
  return block.text || def.defaultText || '';
}

function renderBlocks() {
  const list = document.getElementById('blocksList');
  list.innerHTML = '';
  blocks.forEach((block, idx) => {
    const def = BLOCK_DEFS[block.type];
    const expanded = expandedId === block.id;
    const card = document.createElement('div');
    card.className = 'block-card' + (expanded ? ' expanded' : '');
    card.setAttribute('draggable', 'true');
    card.dataset.idx = idx;

    const preview = getPreview(block);

    let editorHtml = '';
    if (block.type === 'buttons') {
      const btnItems = block.buttons.map((b, bi) =>
        `<div class="btn-item">
          <input type="text" value="${escHtml(b)}" data-bi="${bi}" class="btn-text-input" placeholder="Текст кнопки…">
          <button class="del-btn-item" data-bi="${bi}" title="Удалить">✕</button>
        </div>`
      ).join('');
      editorHtml = `
        <div class="block-editor">
          <span class="editor-label">Кнопки</span>
          <div class="btn-list" id="btnList-${block.id}">${btnItems}</div>
          <button class="add-btn-link" id="addBtnLink-${block.id}">＋ Добавить кнопку</button>
        </div>`;
    } else {
      editorHtml = `
        <div class="block-editor">
          <span class="editor-label">Текст блока</span>
          <textarea rows="3" class="block-textarea" placeholder="Введите текст…">${escHtml(block.text || '')}</textarea>
        </div>`;
    }

    card.innerHTML = `
      <div class="block-header">
        <span class="drag-handle" title="Перетащить">⠿</span>
        <span class="block-icon">${def.icon}</span>
        <div class="block-meta">
          <div class="block-name">${def.name}</div>
          <div class="block-preview">${escHtml(preview)}</div>
        </div>
        <div class="block-actions">
          <span class="block-chevron">▶</span>
          <button class="delete-btn" title="Удалить блок">🗑</button>
        </div>
      </div>
      ${editorHtml}
    `;

    // Header click — expand/collapse
    const header = card.querySelector('.block-header');
    header.addEventListener('click', (e) => {
      if (e.target.closest('.delete-btn') || e.target.closest('.drag-handle')) return;
      expandedId = expanded ? null : block.id;
      renderBlocks();
      renderPreview();
    });

    // Delete
    card.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      blocks.splice(idx, 1);
      if (expandedId === block.id) expandedId = null;
      renderBlocks();
      renderPreview();
      showToast('Блок удалён');
    });

    // Text editor
    if (block.type !== 'buttons') {
      const ta = card.querySelector('.block-textarea');
      ta.addEventListener('input', () => {
        block.text = ta.value;
        // Update preview text in header without full re-render
        card.querySelector('.block-preview').textContent = block.text;
        renderPreview();
      });
    } else {
      // Buttons editor
      const btnList = card.querySelector(`#btnList-${block.id}`);
      btnList.addEventListener('input', (e) => {
        if (e.target.classList.contains('btn-text-input')) {
          const bi = parseInt(e.target.dataset.bi);
          block.buttons[bi] = e.target.value;
          card.querySelector('.block-preview').textContent = getPreview(block);
          renderPreview();
        }
      });
      btnList.addEventListener('click', (e) => {
        const delBtn = e.target.closest('.del-btn-item');
        if (delBtn) {
          const bi = parseInt(delBtn.dataset.bi);
          block.buttons.splice(bi, 1);
          renderBlocks();
          renderPreview();
        }
      });
      card.querySelector(`#addBtnLink-${block.id}`).addEventListener('click', () => {
        block.buttons.push('');
        renderBlocks();
        // re-expand and focus last input
        expandedId = block.id;
        renderBlocks();
        setTimeout(() => {
          const inputs = document.querySelectorAll(`#btnList-${block.id} .btn-text-input`);
          if (inputs.length) inputs[inputs.length - 1].focus();
        }, 0);
      });
    }

    // Drag & drop
    card.addEventListener('dragstart', (e) => {
      dragSrcIdx = idx;
      setTimeout(() => card.classList.add('dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.block-card').forEach(c => c.classList.remove('drag-over'));
      dragSrcIdx = null;
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      document.querySelectorAll('.block-card').forEach(c => c.classList.remove('drag-over'));
      if (dragSrcIdx !== null && dragSrcIdx !== idx) card.classList.add('drag-over');
    });
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if (dragSrcIdx === null || dragSrcIdx === idx) return;
      const moved = blocks.splice(dragSrcIdx, 1)[0];
      blocks.splice(idx, 0, moved);
      dragSrcIdx = null;
      renderBlocks();
      renderPreview();
    });

    list.appendChild(card);
  });
}

// ─── Preview ──────────────────────────────────────────────────────────────────
function renderPreview() {
  const container = document.getElementById('tgMessages');
  if (!container) return;
  if (!blocks.length) {
    container.innerHTML = '<div class="msg-empty">Добавьте блоки, чтобы увидеть превью</div>';
    return;
  }
  let html = '';
  blocks.forEach(block => {
    if (block.type === 'buttons') {
      if (block.buttons.length) {
        html += `<div class="preview-buttons">`;
        block.buttons.forEach(b => {
          html += `<div class="preview-btn-item">${escHtml(b || '…')}</div>`;
        });
        html += `</div>`;
      }
    } else {
      const text = block.text || BLOCK_DEFS[block.type].defaultText || '';
      if (text.trim()) html += `<div class="msg-bubble">${escHtml(text)}</div>`;
    }
  });
  container.innerHTML = html || '<div class="msg-empty">Нет контента для отображения</div>';
}

// ─── Popup ────────────────────────────────────────────────────────────────────
function buildPopup() {
  const grid = document.getElementById('popupGrid');
  grid.innerHTML = Object.entries(BLOCK_DEFS).map(([type, def]) => `
    <button class="popup-type-btn" data-type="${type}">
      <span class="pt-icon">${def.icon}</span>
      <span class="pt-label">${def.name}</span>
      <span class="pt-desc">${def.desc}</span>
    </button>`
  ).join('');
  grid.querySelectorAll('.popup-type-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      addBlock(btn.dataset.type);
      closePopup();
    });
  });
}

function openPopup() {
  document.getElementById('popupOverlay').classList.add('open');
}
function closePopup() {
  document.getElementById('popupOverlay').classList.remove('open');
}

// ─── Add block ────────────────────────────────────────────────────────────────
function addBlock(type) {
  const def = BLOCK_DEFS[type];
  const newBlock = { id: ++nextId, type };
  if (type === 'buttons') {
    newBlock.buttons = def.defaultButtons ? [...def.defaultButtons] : [];
  } else {
    newBlock.text = def.defaultText || '';
  }
  blocks.push(newBlock);
  expandedId = newBlock.id;
  renderBlocks();
  renderPreview();
  showToast(`Блок "${def.name}" добавлен`);
  // Scroll to bottom
  setTimeout(() => {
    const content = document.getElementById('appContent');
    content.scrollTop = content.scrollHeight;
  }, 50);
}

// ─── Publish ──────────────────────────────────────────────────────────────────
function setupPublish() {
  const btn = document.getElementById('publishBtn');
  btn.addEventListener('click', () => {
    if (btn.disabled) return;
    btn.disabled = true;
    document.getElementById('publishBtnContent').innerHTML =
      '<div class="spinner"></div> Публикуем…';
    setTimeout(() => {
      published = true;
      btn.classList.add('success');
      document.getElementById('publishBtnContent').textContent = '✅ Бот активен!';
      document.getElementById('publishedBanner').classList.add('show');
      // Scroll to top to show banner
      document.getElementById('appContent').scrollTop = 0;
      showToast('🎉 Бот успешно опубликован!');
      // Allow re-publish after 3s
      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove('success');
        document.getElementById('publishBtnContent').textContent = '🚀 Обновить бота';
      }, 3000);
    }, 1800);
  });
}

// ─── Dark mode ────────────────────────────────────────────────────────────────
function setupDarkMode() {
  const check = document.getElementById('darkModeCheck');
  const btn = document.getElementById('darkToggleBtn');

  function applyTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    btn.textContent = dark ? '☀️' : '🌙';
    btn.title = dark ? 'Светлая тема' : 'Тёмная тема';
    check.checked = dark;
  }

  check.addEventListener('change', () => applyTheme(check.checked));
  btn.addEventListener('click', () => applyTheme(!check.checked));

  // Check system preference
  if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
    applyTheme(true);
  }
}

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

// ─── Util ─────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
function init() {
  buildPopup();
  renderBlocks();
  renderPreview();
  setupPublish();
  setupDarkMode();

  document.getElementById('addBlockBtn').addEventListener('click', openPopup);
  document.getElementById('popupCancel').addEventListener('click', closePopup);
  document.getElementById('popupOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('popupOverlay')) closePopup();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
