<style>
/* Shared kit for the Showroom demos. Inlined into each demo by tools/build-demos.mjs.
   Per-demo files set the tokens (colour, fonts); everything here reads them. */
:root {
  --bg: #0b0c0a; --surface: #121311; --raised: #1a1c18; --hover: #1f211c;
  --border: #242620; --rule: #1b1d19;
  --text: #f0f1ec; --muted: #a2a59a; --faint: #82857a;
  --accent: #c8f03c; --accent-ink: #0b0c0a;
  --pos: #4ccb86; --neg: #f0645f; --warn: #e8b04b;
  --pos-bg: rgba(76,203,134,.13); --neg-bg: rgba(240,100,95,.14); --warn-bg: rgba(232,176,75,.14); --neutral-bg: rgba(255,255,255,.07);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --radius: 10px; --radius-s: 6px;
  --side: 232px; --pad: 28px; --gap: 16px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f3f0; --surface: #ffffff; --raised: #f6f6f3; --hover: #eeeeea;
  --border: #e4e4de; --rule: #efefea;
  --text: #15160f; --muted: #5d6056; --faint: #6f7266;
  --pos: #1e7a4c; --neg: #b8302b; --warn: #8a5a0a;
  --pos-bg: #dcf5e6; --neg-bg: #fde8e6; --warn-bg: #fbefd2; --neutral-bg: #ecece7;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* demo notice */
.notice { display: flex; justify-content: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
.notice b { color: var(--text); font-weight: 600; }

/* shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100svh - 29px); }
.side { position: sticky; top: 0; height: calc(100svh - 29px); display: flex; flex-direction: column; padding: 18px 12px 14px; border-right: 1px solid var(--border); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark .ic { width: 18px; height: 18px; stroke-width: 2; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }

.nav a:hover { background: var(--hover); color: var(--text); }
.nav a.on { background: var(--raised); color: var(--text); }
.nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; font-size: 12px; font-weight: 600; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; border-top: 1px solid var(--border); }

.who { min-width: 0; } .who b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .who span { font-size: 12px; color: var(--muted); }

.main { min-width: 0; padding: var(--pad) var(--pad) 48px; max-width: 1320px; width: 100%; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.head h1 { font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.head p { color: var(--muted); margin-top: 2px; }

/* finding line: the one thing that needs attention */

.finding .ic { color: var(--warn); }
.finding span { flex: 1; min-width: 0; }
.finding .btn { flex: none; }

/* grid + cards */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h2 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }

.kpi b small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi span { color: var(--muted); font-size: 13px; }
.big { font: 700 44px/1 var(--display); letter-spacing: -.03em; }
.big small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.muted { color: var(--muted); } .pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); } .acc { color: var(--accent); } .r { text-align: right; }

/* table as grid: .tbl > .tr (set --cols on .tbl) */
.tbl { width: 100%; }
.tr { display: grid; grid-template-columns: var(--cols); gap: 12px; align-items: center; min-height: 48px; padding: 6px 12px; margin: 0 -12px; border-radius: 8px; transition: background-color .15s; }
.tr:not(.th):hover { background: var(--hover); }
.tr[data-open] { cursor: pointer; }
.th { min-height: 32px; font-size: 12px; color: var(--faint); }
.tr + .tr { box-shadow: 0 -1px 0 var(--rule); }
.tr.th + .tr { box-shadow: none; }
.cell-main b { display: block; font-weight: 600; } .cell-main span { font-size: 12px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
.pill.pos { background: var(--pos-bg); color: var(--pos); } .pill.neg { background: var(--neg-bg); color: var(--neg); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--raised); font-weight: 500; cursor: pointer; transition: transform .12s var(--ease), background-color .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--raised); margin-bottom: var(--gap); }
.tabs button { height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.tabs button.on { background: var(--surface); color: var(--text); font-weight: 500; }

.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s var(--ease); }
.bar.thick { height: 10px; border-radius: 5px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); outline: none; transition: border-color .15s; }
.field textarea { height: 80px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 40; animation: fade .18s ease both; }
.modal { width: 100%; max-width: 440px; max-height: 92svh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; animation: pop .22s var(--ease) both; }
.modal h2 { font-size: 18px; margin-bottom: 4px; letter-spacing: -.01em; } .modal > p { color: var(--muted); margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* charts */
.chart { width: 100%; }
.chart text { font: 12px var(--font); fill: var(--faint); }
.chart .grid-l { stroke: var(--rule); stroke-width: 1; }
.chart .tip { pointer-events: none; }

/* phone: sidebar becomes a bottom tab bar */
.tabbar { display: none; }
@media (max-width: 899px) {
  :root { --pad: 16px; }
  .app { display: block; }
  .side { display: none; }
  .main { padding: 18px 16px 96px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); cursor: pointer; position: relative; }
  .tabbar a.on { color: var(--text); }
  .tabbar a.on .ic { color: var(--accent); }
  .tabbar .count { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; }
  .head h1 { font-size: 22px; }
  .kpis { gap: 24px; }
  .kpi b { font-size: 24px; }
  .hm { display: none !important; }
  .finding { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.brow { margin-bottom: 14px; } .brow:last-child { margin-bottom: 0; }
.brow-t { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.brow-t em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 6px; }
.brow-t b { font-weight: 600; }
@media (max-width: 899px) { .tr { grid-template-columns: var(--colsm, var(--cols)); } }

:root[data-theme="light"] {
  --bg: #eef2f6; --surface: #ffffff; --raised: #f3f6f9; --hover: #eaf0f6; --border: #dde4ec; --rule: #eaeff4;
  --text: #121a24; --muted: #53606f; --faint: #66737f;
  --accent: #1b78c8; --accent-ink: #ffffff; --accent-bg: #e3f0fb;
  --font: "Manrope", system-ui, sans-serif; --display: "Manrope", system-ui, sans-serif;
}
.brand-name, .head h1, .big, .kpi b { font-weight: 800; letter-spacing: -.02em; }
.nav .count { background: var(--accent); color: #fff; }

/* builder */
.build { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.flow { position: relative; display: flex; flex-direction: column; gap: 10px; padding-left: 28px; }
.flow::before { content: ""; position: absolute; left: 11px; top: 18px; bottom: 54px; width: 2px; background: var(--border); border-radius: 1px; }
.step { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); animation: pop .25s var(--ease) both; transition: border-color .15s; }
.step::before { content: attr(data-n); position: absolute; left: -28px; top: 14px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); }
.step.open { border-color: var(--accent); }
.step.open::before { border-color: var(--accent); color: var(--accent); }
.step-h { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--radius); }
.step-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); }
.step-h b { display: block; font-weight: 700; } .step-h span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-h .ic.chev { color: var(--faint); transition: transform .2s var(--ease); } .step.open .chev { transform: rotate(180deg); }
.step-b { padding: 4px 14px 14px 60px; }
.step-b .field { margin-bottom: 10px; }
.step-b textarea { width: 100%; }
.opt-row { display: flex; gap: 6px; margin-bottom: 6px; } .opt-row input { flex: 1; min-width: 0; }
.step-tools { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.add-step { margin-top: 4px; justify-self: start; }

/* phone */
.phone { position: sticky; top: 16px; width: 340px; border: 1px solid var(--border); border-radius: 28px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; height: min(640px, calc(100svh - 70px)); }
.tg-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.tg-av { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; }
.tg-h b { display: block; font-size: 14px; } .tg-h span { font-size: 12px; color: var(--muted); }
.tg-h .btn { margin-left: auto; }
.chat { flex: 1; overflow: auto; padding: 14px 12px; background: #dfe8ef; display: flex; flex-direction: column; gap: 6px; }
.m { max-width: 84%; padding: 8px 11px; border-radius: 14px; background: #fff; align-self: flex-start; border-bottom-left-radius: 4px; animation: pop .2s var(--ease) both; word-wrap: break-word; }
.m.me { align-self: flex-end; background: #d4ecb8; border-radius: 14px; border-bottom-right-radius: 4px; }
.m small { display: block; margin-top: 4px; font-size: 11px; color: #5f7a90; }
.m.file { display: flex; align-items: center; gap: 8px; }
.m.file .ic { color: var(--accent); }
.inl { display: flex; flex-direction: column; gap: 4px; align-self: stretch; animation: pop .2s var(--ease) both; }
.inl button { height: 34px; border: 0; border-radius: 10px; background: rgba(27,120,200,.88); color: #fff; font-weight: 600; cursor: pointer; transition: background-color .15s, transform .12s; }
.inl button:hover { background: #1b78c8; } .inl button:active { transform: scale(.97); }
.inl button.pay { background: #2f9e57; }
.note { align-self: center; font-size: 12px; color: #54697b; background: rgba(255,255,255,.6); padding: 3px 10px; border-radius: 10px; }
.tg-f { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); }
.tg-f input { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--border); border-radius: 18px; padding: 0 14px; background: var(--bg); outline: none; }
.tg-f input:focus { border-color: var(--accent); }

.tg-f input:disabled, .tg-f button:disabled { opacity: .45; cursor: default; }
.bmode { display: none; } .dm { display: none; }

/* dashboard */
.funnel { display: flex; flex-direction: column; gap: 14px; }
.fn { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: 14px; align-items: center; }

.fn b { text-align: right; font-weight: 700; }
.fn-note { margin-top: 14px; color: var(--muted); }
.botrow-n { display: flex; align-items: center; gap: 10px; }
.botrow-n .step-ic { width: 32px; height: 32px; }

@media (max-width: 1099px) { .build { grid-template-columns: minmax(0, 1fr); } .phone { position: relative; top: 0; width: 100%; max-width: 380px; margin: 0 auto; height: 560px; } }

<script>
/* Shared helpers for the Showroom demos (inlined by tools/build-demos.mjs). */

const MINUS = '−';
const signed = (n, f = fmt) => (n > 0 ? '+' : n < 0 ? MINUS : '') + f(Math.abs(n));

const ICONS = {
  home: 'M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10',

  truck: 'M2 6h12v10H2zM14 10h4l3 3v3h-7M4 17.5a1.5 1.5 0 103 0 1.5 1.5 0 10-3 0M16 17.5a1.5 1.5 0 103 0 1.5 1.5 0 10-3 0',

const niceMax = (m) => { const mag = 10 ** Math.floor(Math.log10(m)); for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k * mag >= m * 1.02) return k * mag; return 10 * mag; };

/* bars: values with a marked bar; labels under, 3 faint gridlines */
function barsSVG(w, { labels, values, mark = values.length - 1, h = 190, fmtV = fmt, unit = '' }) {
  const L = 36, B = 26, T = 8, ph = h - B - T, pw = w - L - 4;
  const max = niceMax(Math.max(...values)), bw = Math.min(46, pw / values.length * 0.56), step = pw / values.length;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = max / 3 * i, y = T + ph - (v / max) * ph; g += `<line class="grid-l" x1="${L}" x2="${w}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtV(v)}</text>`; }
  const bars = values.map((v, i) => {
    const x = L + step * i + (step - bw) / 2, bh = Math.max(2, (v / max) * ph), y = T + ph - bh;
    const on = Array.isArray(mark) ? mark.includes(i) : i === mark;
    return `<g><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--accent)" opacity="${on ? 1 : .38}"><title>${esc(labels[i])}: ${fmtV(v)} ${unit}</title></rect>
      <text x="${x + bw / 2}" y="${h - 8}" text-anchor="middle" ${on ? 'style="fill:var(--text)"' : ''}>${esc(labels[i])}</text>
      ${on ? `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmtV(v)}</text>` : ''}</g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(labels.map((l, i) => l + ' ' + fmtV(values[i])).join(', '))}">${g}${bars}</svg>`;
}
/* line: one series, 2px, no markers, end value labelled */
function lineSVG(w, { labels, values, h = 190, fmtV = fmt, xAt }) {
  const L = 44, B = 26, T = 12, R = 44, ph = h - B - T, pw = w - L - R;
  const max = niceMax(Math.max(...values)), n = values.length;
  const X = (i) => L + (pw * i) / (n - 1), Y = (v) => T + ph - (v / max) * ph;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = max / 3 * i, y = Y(v); g += `<line class="grid-l" x1="${L}" x2="${w - R + 20}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtV(v)}</text>`; }
  const d = values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const xs = (xAt || labels.map((_, i) => i)).map((i) => `<text x="${X(i)}" y="${h - 8}" text-anchor="middle">${esc(labels[i])}</text>`).join('');
  const last = values[n - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc('Динамика: ' + labels.map((l, i) => l + ' ' + fmtV(values[i])).join(', '))}">${g}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${X(n - 1) + 8}" y="${Y(last) + 4}" style="fill:var(--text);font-weight:600">${fmtV(last)}</text>${xs}</svg>`;
}
/* ring: progress with the total inside */
function ringSVG(size, { value, label, sub }) {
  const r = size / 2 - 8, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label + ' ' + (sub || ''))}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--raised)" stroke-width="8"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * value} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="${sub ? '48%' : '52%'}" text-anchor="middle" style="font:700 ${size / 4.4}px var(--display);fill:var(--text)">${esc(label)}</text>${sub ? `<text x="50%" y="62%" text-anchor="middle" style="font:12px var(--font);fill:var(--muted)">${esc(sub)}</text>` : ''}</svg>`;
}

}

/* ── builder ──────────────────────────────────────────── */
const summary = (s) => s.t === 'buttons' ? s.opts.join(' · ') || 'Нет кнопок' : s.t === 'pay' ? `${rub(s.price)} · ${s.text}` : s.t === 'give' ? `${s.file ? '📎 ' + s.file : ''}` || s.text : s.text;
function stepEditor(s, i) {
  const ta = `<div class="field"><label>Текст сообщения</label><textarea data-f="text" data-i="${i}">${esc(s.text)}</textarea></div>`;
  let body = ta;
  if (s.t === 'buttons') body += `<div class="field"><label>Кнопки</label>${s.opts.map((o, k) => `<div class="opt-row"><input data-f="opt" data-i="${i}" data-o="${k}" value="${esc(o)}"><button class="btn sm" data-act="delOpt" data-i="${i}" data-o="${k}" aria-label="Удалить кнопку">${ic('x')}</button></div>`).join('')}<button class="btn sm" data-act="addOpt" data-i="${i}" ${s.opts.length >= 5 ? 'disabled' : ''}>${ic('plus')}Кнопка</button></div>`;
  if (s.t === 'pay') body += `<div class="field"><label>Цена, ₽</label><input data-f="price" data-i="${i}" type="number" min="0" value="${s.price}"></div>`;
  if (s.t === 'give') body += `<div class="field"><label>Файл или ссылка</label><input data-f="file" data-i="${i}" value="${esc(s.file || '')}"></div>`;
  return body + `<div class="step-tools"><button class="btn sm" data-act="mv" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''}>${ic('up')}Выше</button><button class="btn sm" data-act="mv" data-i="${i}" data-d="1" ${i === bot().steps.length - 1 ? 'disabled' : ''}>${ic('down')}Ниже</button><button class="btn sm" data-act="delStep" data-i="${i}">${ic('trash')}Удалить</button></div>`;
}
function builder() {
  const b = bot(), p = botPrice(b);
  const flow = b.steps.map((s, i) => `<article class="step${openStep === i ? ' open' : ''}" data-n="${i + 1}"><button class="step-h" data-act="toggle" data-i="${i}" aria-expanded="${openStep === i}"><span class="step-ic">${ic(STEP[s.t][1])}</span><div><b>${STEP[s.t][0]}</b><span>${esc(summary(s))}</span></div>${ic('down', 'chev')}</button>${openStep === i ? `<div class="step-b">${stepEditor(s, i)}</div>` : ''}</article>`).join('');
  return head('Конструктор', `Сценарий бота ${esc(b.user)}. Справа он работает по-настоящему.`,
    `<select id="bot-sel" class="btn" aria-label="Бот">${S.bots.map((x) => `<option value="${x.id}" ${x.id === cur ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select><button class="btn primary" data-act="publish">${b.live ? 'Снять с публикации' : 'Опубликовать'}</button>`) +
    `<div class="tabs bmode" role="tablist"><button class="${mode === 'flow' ? 'on' : ''}" data-act="mode" data-m="flow">Сценарий</button><button class="${mode === 'chat' ? 'on' : ''}" data-act="mode" data-m="chat">Превью</button></div>
    <div class="build" data-mode="${mode}">
      <div class="flow">${flow}<button class="btn add-step" data-act="addStep">${ic('plus')}Добавить блок</button></div>
      <aside class="phone" aria-label="Превью бота"><div class="tg-h"><span class="tg-av">${esc(b.name[0])}</span><div><b>${esc(b.name)}</b><span>бот · ${b.live ? 'онлайн' : 'черновик'}${p ? ' · ' + rub(p) : ''}</span></div><button class="btn sm" data-act="restart">${ic('play')}Заново</button></div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <form class="tg-f" id="tg-form"><input id="tg-in" placeholder="Сообщение" autocomplete="off" aria-label="Ответ боту"><button aria-label="Отправить" id="tg-send">${ic('arrow')}</button></form></aside>
    </div>`;
}

/* preview engine: runs the real scenario; a step that needs the buyer pauses the run */
let run = null;
function resetRun() { run = null; }
function startRun() { run = { i: 0, log: [], wait: null, done: false, name: '' }; step(); }
function step() {
  const steps = bot().steps;
  while (run.i < steps.length) {
    const s = steps[run.i];
    if (s.t === 'msg') run.log.push({ k: 'bot', text: s.text });
    else if (s.t === 'remind') run.log.push({ k: 'note', text: `Если не оплатят, через час бот напомнит: «${s.text}»` });
    else if (s.t === 'give') { run.log.push({ k: 'bot', text: s.text }); if (s.file) run.log.push({ k: 'file', text: s.file }); }
    else { run.log.push({ k: 'bot', text: (s.t === 'ask' ? s.text : s.text).replace('{имя}', run.name || 'друг') }); run.wait = s; break; }
    run.i++;
  }
  if (run.i >= steps.length) run.done = true;
}
function drawChat() {
  const c = $('#chat'); if (!c) return;
  if (!run) startRun();
  const last = run.log.map((m) => m.k).lastIndexOf('bot');
  const lastBot = run.done ? run.log.length - 1 - [...run.log].reverse().findIndex((m) => m.k === 'bot' || m.k === 'file') : -1;
  c.innerHTML = run.log.map((m, i) => m.k === 'me' ? `<div class="m me">${esc(m.text)}</div>`
    : m.k === 'note' ? `<div class="note">${esc(m.text)}</div>`
    : m.k === 'file' ? `<div class="m file">${ic('file')}<b>${esc(m.text)}</b>${run.done && i === lastBot ? '<small>Собрано в @DragDropBot</small>' : ''}</div>`
    : `<div class="m">${esc(m.text)}${run.done && i === lastBot ? '<small>Собрано в @DragDropBot</small>' : ''}</div>`).join('') + waitUI();
  c.scrollTop = c.scrollHeight;
  const ask = run.wait && run.wait.t === 'ask';
  $('#tg-in').disabled = !ask; $('#tg-send').disabled = !ask; $('#tg-in').placeholder = ask ? 'Ответьте боту…' : run.done ? 'Сценарий закончен' : 'Выберите кнопку';
}
function waitUI() {
  const w = run.wait; if (!w || run.done) return run.done ? '' : '';
  if (w.t === 'buttons') return `<div class="inl">${w.opts.map((o, k) => `<button data-act="pick" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  if (w.t === 'pay') return `<div class="inl"><button class="pay" data-act="pay">Оплатить ${rub(w.price)}</button></div>`;
  return '';
}
function answer(text) {
  if (!run.wait) return;
  const inp = $('#tg-in'), v = (text ?? inp.value).trim(); if (!v) return;
  if (run.wait.t === 'ask') run.name = v;
  run.log.push({ k: 'me', text: v }); run.wait = null; run.i++; inp.value = ''; step(); drawChat();
}

/* ── sales + buyers ───────────────────────────────────── */
function sales() {
  const list = S.sales.filter((s) => !salesBot || s.bot === salesBot), sum = list.reduce((a, s) => a + s.amount, 0);
  const rows = list.map((s) => { const b = S.bots.find((x) => x.id === s.bot); return `<div class="tr" style="--cols:1fr 1.3fr 1.3fr .8fr;--colsm:1fr auto"><div class="cell-main hm"><b>${dLabel(s.ago)}</b><span>${hhmm(s.min)}</span></div><div class="cell-main dm"><b>${esc(s.buyer)}</b><span>${dLabel(s.ago)}, ${hhmm(s.min)} · ${esc(b.name)}</span></div><div class="hm">${esc(s.buyer)}</div><div class="hm">${esc(b.name)}</div><div class="r"><b>${rub(s.amount)}</b></div></div>`; }).join('');
  return head('Продажи', `${list.length} оплат на ${rub(sum)} за 7 дней`) +
    `<div class="tabs"><button class="${!salesBot ? 'on' : ''}" data-act="sbot" data-id="0">Все</button>${S.bots.map((b) => `<button class="${salesBot === b.id ? 'on' : ''}" data-act="sbot" data-id="${b.id}">${esc(b.name.split(' ')[0])}</button>`).join('')}</div>
    <section class="card"><div class="tbl"><div class="tr th" style="--cols:1fr 1.3fr 1.3fr .8fr;--colsm:1fr auto"><span>Когда</span><span class="hm">Покупатель</span><span class="hm">Бот</span><span class="r">Сумма</span></div>${rows}</div></section>`;
}
function buyers() {
  const map = {};
  S.sales.forEach((s) => { const x = map[s.buyer] || (map[s.buyer] = { n: s.buyer, c: 0, sum: 0, ago: 99 }); x.c++; x.sum += s.amount; x.ago = Math.min(x.ago, s.ago); });
  const list = Object.values(map).sort((a, b) => b.sum - a.sum);
  const rows = list.map((x) => `<div class="tr" style="--cols:1.4fr .6fr .9fr 1fr;--colsm:1fr auto"><div class="cell-main"><b>${esc(x.n)}</b><span class="muted">${x.c} ${x.c === 1 ? 'покупка' : x.c < 5 ? 'покупки' : 'покупок'} · ${dLabel(x.ago).toLowerCase()}</span></div><div class="hm r">${x.c}</div><div class="hm r">${dLabel(x.ago)}</div><div class="r"><b>${rub(x.sum)}</b></div></div>`).join('');
  const rep = list.filter((x) => x.c > 1).length;
  return head('Покупатели', `${list.length} человек, ${rep} купили больше одного раза`) +
    `<section class="card"><div class="tbl"><div class="tr th" style="--cols:1.4fr .6fr .9fr 1fr;--colsm:1fr auto"><span>Покупатель</span><span class="hm r">Покупок</span><span class="hm r">Последняя</span><span class="r">Всего</span></div>${rows}</div></section>`;
}

function mount() {
  const a = $('#ch-rev');
  if (a) { const vals = [], labels = []; for (let ago = 6; ago >= 0; ago--) { vals.push(S.sales.filter((s) => s.ago === ago).reduce((x, s) => x + s.amount, 0) / 1000); labels.push(ago === 0 ? 'Ср' : WD[dayOf(ago).getDay()]); }
    chart(a, (w) => barsSVG(w, { labels, values: vals, fmtV: (x) => fmtD(x, x % 1 ? 1 : 0) + 'к' })); }
  drawChat();
}

/* ── actions ──────────────────────────────────────────── */
const ACT = {
  fbot(d) { fbot = +d.id; render(); },
  sbot(d) { salesBot = +d.id; render(); },
  mode(d) { mode = d.m; render(); },
  toggle(d) { openStep = openStep === +d.i ? -1 : +d.i; render(); },
  restart() { resetRun(); drawChat(); },
  pick(d) { const w = run.wait; run.log.push({ k: 'me', text: w.opts[+d.k] }); run.wait = null; run.i++; step(); drawChat(); },
  pay() { const w = run.wait; run.log.push({ k: 'note', text: `Оплата ${rub(w.price)} прошла` }); run.wait = null; run.i++; step(); drawChat(); },
  mv(d) { const s = bot().steps, i = +d.i, j = i + +d.d; [s[i], s[j]] = [s[j], s[i]]; openStep = j; resetRun(); render(); },
  delStep(d) { bot().steps.splice(+d.i, 1); openStep = -1; resetRun(); render(); toast('Блок удалён'); },
  addOpt(d) { bot().steps[+d.i].opts.push('Новая кнопка'); resetRun(); render(); },
  delOpt(d) { bot().steps[+d.i].opts.splice(+d.o, 1); resetRun(); render(); },
  publish() { const b = bot(); b.live = !b.live; toast(b.live ? 'Бот опубликован' : 'Бот снят с публикации'); render(); },
  addRemind(d) {
    const b = S.bots.find((x) => x.id === +d.bot), at = b.steps.findIndex((s) => s.t === 'pay');
    b.steps.splice(at + 1, 0, { t: 'remind', text: 'Вы не закончили оплату. Курс ждёт вас, ссылка действует сутки.' });
    cur = b.id; openStep = at + 1; resetRun(); toast('Напоминание добавлено в сценарий'); go('builder');
  },
  addStep() {
    modal(`<h2>Новый блок</h2><p>Добавится в конец сценария.</p><div class="field"><label>Тип</label><select id="n-t">${Object.entries(STEP).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" id="n-ok">Добавить</button></div>`, () => {
      $('#n-ok').onclick = () => {
        const t = $('#n-t').value, def = { msg: { text: 'Новое сообщение' }, ask: { text: 'Как вас зовут?' }, buttons: { text: 'Выберите вариант', opts: ['Вариант 1', 'Вариант 2'] }, pay: { text: 'Оплата заказа', price: 1000 }, give: { text: 'Спасибо! Вот ваш доступ.', file: 'Ссылка' }, remind: { text: 'Напоминаю про ваш заказ' } }[t];
        const s = bot().steps; s.push({ t, ...structuredClone(def) }); openStep = s.length - 1; closeModal(); resetRun(); render();
      };
    });
  },
  newBot() {
    modal(`<h2>Новый бот</h2><p>Выберите заготовку, потом поправите под себя.</p><div class="field"><label>Название</label><input id="b-n" placeholder="Например, Запись на массаж"></div>
      <div class="field"><label>Заготовка</label><select id="b-t">${Object.entries(TPL).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('')}</select></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" id="b-ok">Создать</button></div>`, () => {
      $('#b-ok').onclick = () => {
        const n = $('#b-n').value.trim(); if (!n) { $('#b-n').focus(); return; }
        const t = $('#b-t').value, id = Math.max(...S.bots.map((x) => x.id)) + 1;
        S.bots.push({ id, name: n, user: '@' + ['new', 'bot', id].join('_'), tpl: t, live: false, steps: TPL[t].steps(), starts: 0, answered: 0, atPay: 0 });
        PRICE[id] = botPrice(S.bots.at(-1)); DAYS[id] = [];
        cur = id; openStep = 0; resetRun(); closeModal(); toast('Бот создан. Это черновик, поправьте сценарий'); go('builder');
      };
    });
  },
};
render();
</script>
</body>
</html>
