<style>
/* Shared kit for the Showroom demos. Inlined into each demo by tools/build-demos.mjs.
   Per-demo files set the tokens (colour, fonts); everything here reads them. */
:root {
  --bg: #0b0c0a; --surface: #121311; --raised: #1a1c18; --hover: #1f211c;
  --border: #242620; --rule: #1b1d19;
  --text: #f0f1ec; --muted: #a2a59a; --faint: #82857a;
  --accent: #c8f03c; --accent-ink: #0b0c0a;
  --pos: #4ccb86; --neg: #f0645f; --warn: #e8b04b;
  --pos-bg: rgba(76,203,134,.13); --neg-bg: rgba(240,100,95,.14); --warn-bg: rgba(232,176,75,.14); --neutral-bg: rgba(255,255,255,.07);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --radius: 10px; --radius-s: 6px;
  --side: 232px; --pad: 28px; --gap: 16px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f3f0; --surface: #ffffff; --raised: #f6f6f3; --hover: #eeeeea;
  --border: #e4e4de; --rule: #efefea;
  --text: #15160f; --muted: #5d6056; --faint: #6f7266;
  --pos: #1e7a4c; --neg: #b8302b; --warn: #8a5a0a;
  --pos-bg: #dcf5e6; --neg-bg: #fde8e6; --warn-bg: #fbefd2; --neutral-bg: #ecece7;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* demo notice */
.notice { display: flex; justify-content: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
.notice b { color: var(--text); font-weight: 600; }

/* shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100svh - 29px); }
.side { position: sticky; top: 0; height: calc(100svh - 29px); display: flex; flex-direction: column; padding: 18px 12px 14px; border-right: 1px solid var(--border); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark .ic { width: 18px; height: 18px; stroke-width: 2; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { padding: 16px 10px 6px; font-size: 12px; color: var(--faint); }
.nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.nav a:hover { background: var(--hover); color: var(--text); }
.nav a.on { background: var(--raised); color: var(--text); }
.nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; font-size: 12px; font-weight: 600; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; border-top: 1px solid var(--border); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; background: var(--raised); color: var(--text); }
.who { min-width: 0; } .who b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .who span { font-size: 12px; color: var(--muted); }

.main { min-width: 0; padding: var(--pad) var(--pad) 48px; max-width: 1320px; width: 100%; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.head h1 { font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.head p { color: var(--muted); margin-top: 2px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* finding line: the one thing that needs attention */
.finding { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: var(--gap); border-radius: var(--radius); background: var(--warn-bg); color: var(--text); }
.finding .ic { color: var(--warn); }
.finding span { flex: 1; min-width: 0; }
.finding .btn { flex: none; }

/* grid + cards */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h2 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.card-h span { color: var(--muted); font-size: 12px; }
.kpis { display: flex; gap: 40px; margin-bottom: 22px; flex-wrap: wrap; }
.kpi b { display: block; font: 700 30px/1.1 var(--display); letter-spacing: -.02em; }
.kpi b small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi span { color: var(--muted); font-size: 13px; }
.big { font: 700 44px/1 var(--display); letter-spacing: -.03em; }
.big small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.muted { color: var(--muted); } .pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); } .acc { color: var(--accent); } .r { text-align: right; }

/* table as grid: .tbl > .tr (set --cols on .tbl) */
.tbl { width: 100%; }
.tr { display: grid; grid-template-columns: var(--cols); gap: 12px; align-items: center; min-height: 48px; padding: 6px 12px; margin: 0 -12px; border-radius: 8px; transition: background-color .15s; }
.tr:not(.th):hover { background: var(--hover); }
.tr[data-open] { cursor: pointer; }
.th { min-height: 32px; font-size: 12px; color: var(--faint); }
.tr + .tr { box-shadow: 0 -1px 0 var(--rule); }
.tr.th + .tr { box-shadow: none; }
.cell-main b { display: block; font-weight: 600; } .cell-main span { font-size: 12px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
.pill.pos { background: var(--pos-bg); color: var(--pos); } .pill.neg { background: var(--neg-bg); color: var(--neg); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--raised); font-weight: 500; cursor: pointer; transition: transform .12s var(--ease), background-color .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--raised); margin-bottom: var(--gap); }
.tabs button { height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.tabs button.on { background: var(--surface); color: var(--text); font-weight: 500; }
:root[data-theme="light"] .tabs button.on { box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s var(--ease); }
.bar.thick { height: 10px; border-radius: 5px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); outline: none; transition: border-color .15s; }
.field textarea { height: 80px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 40; animation: fade .18s ease both; }
.modal { width: 100%; max-width: 440px; max-height: 92svh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; animation: pop .22s var(--ease) both; }
.modal h2 { font-size: 18px; margin-bottom: 4px; letter-spacing: -.01em; } .modal > p { color: var(--muted); margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.snack { position: fixed; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; max-width: min(380px, calc(100vw - 32px)); padding: 12px 8px 12px 16px; border-radius: 6px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; opacity: 0; transform: translateY(12px); transition: opacity .2s, transform .25s var(--ease); pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.snack.show { opacity: 1; transform: none; pointer-events: auto; }
.snack button { flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: inherit; opacity: .65; cursor: pointer; font: inherit; } .snack button:hover { opacity: 1; }
.fxbar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; padding: 9px 16px; text-align: center; font-weight: 600; font-size: 13px; background: var(--accent); color: var(--accent-ink); transform: translateY(-100%); transition: transform .25s var(--ease); pointer-events: none; }
.fxbar.show { transform: none; }
.corner { position: fixed; top: 52px; right: 16px; width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; }
.cn { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,.28); opacity: 0; transform: translateX(24px); transition: opacity .22s, transform .26s var(--ease); }
.cn.show { opacity: 1; transform: none; }
.cn i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); } .cn small { color: var(--faint, var(--muted)); font-size: 11px; }
.flash { position: fixed; z-index: 70; transform: translate(-50%, calc(-100% + 6px)); padding: 7px 12px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .15s, transform .2s var(--ease); pointer-events: none; text-align: center; }
.flash::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: inherit; transform: translateX(-50%) rotate(45deg); }
.flash.show { opacity: 1; transform: translate(-50%, -100%); }
.push { position: fixed; top: 10px; left: 50%; width: min(380px, calc(100vw - 20px)); z-index: 70; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 11px 14px; border-radius: 18px; background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: var(--text); border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,.28); transform: translate(-50%, -140%); transition: transform .35s var(--ease); pointer-events: none; }
.push.show { transform: translate(-50%, 0); }
.push i { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-weight: 800; }
.push b { display: block; font-size: 13px; } .push span { display: block; font-size: 13px; color: var(--muted); } .push small { align-self: start; color: var(--faint, var(--muted)); font-size: 11px; }
@media (max-width: 899px) { .snack { bottom: 76px; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* charts */
.chart { width: 100%; }
.chart text { font: 12px var(--font); fill: var(--faint); }
.chart .grid-l { stroke: var(--rule); stroke-width: 1; }
.chart .tip { pointer-events: none; }

/* phone: sidebar becomes a bottom tab bar */
.tabbar { display: none; }
@media (max-width: 899px) {
  :root { --pad: 16px; }
  .app { display: block; }
  .side { display: none; }
  .main { padding: 18px 16px 96px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); cursor: pointer; position: relative; }
  .tabbar a.on { color: var(--text); }
  .tabbar a.on .ic { color: var(--accent); }
  .tabbar .count { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; }
  .head h1 { font-size: 22px; }
  .kpis { gap: 24px; }
  .kpi b { font-size: 24px; }
  .hm { display: none !important; }
  .finding { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.brow { margin-bottom: 14px; } .brow:last-child { margin-bottom: 0; }
.brow-t { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.brow-t em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 6px; }
.brow-t b { font-weight: 600; }
@media (max-width: 899px) { .tr { grid-template-columns: var(--colsm, var(--cols)); } }

:root {
  --bg: #080b10; --surface: #0f141b; --raised: #161c26; --hover: #1b2330; --border: #1f2833; --rule: #171e28;
  --text: #ecf0f6; --muted: #9aa5b5; --faint: #7a8696;
  --accent: #8b7bff; --accent-ink: #0c0a1f; --accent-bg: rgba(139,123,255,.14);
  --pos: #25d195; --neg: #ff6b78; --warn: #f0b34a;
  --font: "Geologica", system-ui, sans-serif; --display: "Geologica", system-ui, sans-serif;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
}

/* top bar */

.ni .ic { width: 15px; height: 15px; } .ni.good { color: var(--pos); background: var(--pos-bg); } .ni.bad { color: var(--neg); background: var(--neg-bg); } .ni.xp { color: var(--accent); background: var(--accent-bg); }

#chart { outline: none; touch-action: pan-y; border-radius: 6px; } #chart:focus-visible { box-shadow: 0 0 0 2px var(--accent); }

.quick { display: flex; gap: 6px; } .quick button { flex: 1; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; font-size: 12px; } .quick button:hover { color: var(--text); background: var(--hover); }

.ob-h { color: var(--faint); padding: 0 8px 6px; }
.ob .lv { position: relative; width: 100%; height: 22px; align-items: center; padding: 0 8px; border: 0; background: none; cursor: pointer; border-radius: 4px; }
.ob .lv::before { content: ''; position: absolute; top: 1px; bottom: 1px; right: 0; width: var(--d); background: var(--neg-bg); border-radius: 3px; transition: width .4s var(--ease); }

/* courses */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: var(--gap); }
.ccard { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.ccov { position: relative; height: 112px; } .ccov svg { width: 100%; height: 100%; }

.lesson { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 52px; padding: 6px 0; }
.lesson + .lesson { border-top: 1px solid var(--rule); }
.dotx { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; font-size: 11px; color: var(--muted); }
.dotx.done { background: var(--pos); border-color: var(--pos); color: #04150e; } .dotx .ic { width: 13px; height: 13px; stroke-width: 3; }
.dotx.cur { border-color: var(--accent); color: var(--accent); }
.lesson.lock { opacity: .55; } .lesson b { font-weight: 500; display: block; } .lesson small { color: var(--muted); }
.crumbs { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }

.reader { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }
.video { position: relative; border-radius: var(--radius); overflow: hidden; background: #0a0e15; aspect-ratio: 16 / 9; }
.video svg { width: 100%; height: 100%; }
.vplay { position: absolute; inset: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.vplay i { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.92); color: #0c0a1f; display: grid; place-items: center; transition: transform .16s var(--ease-out); }
.vplay:hover i { transform: scale(1.05); } .vplay:active i { transform: scale(.97); } .vplay i .ic { width: 26px; height: 26px; fill: currentColor; stroke: none; }
.vplay.on i { opacity: 0; } .vplay.on:hover i, .vplay.on:focus-visible i { opacity: .85; }
.vbar { display: flex; align-items: center; gap: 10px; padding: 10px 2px 0; font-size: 12px; color: var(--muted); }
.vbar .bar { flex: 1; }
.pts { display: grid; gap: 10px; } .pts li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; } .pts .ic { color: var(--accent); width: 16px; height: 16px; margin-top: 2px; }
.opts { display: flex; flex-direction: column; gap: 8px; }

.opts button:hover:not([disabled]) { background: var(--hover); border-color: var(--faint); }

.opts button.ok { border-color: var(--pos); background: var(--pos-bg); } .opts button.bad { border-color: var(--neg); background: var(--neg-bg); }

.outline a { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.outline a:hover { background: var(--hover); } .outline a.on { background: var(--raised); } .outline a.lock { opacity: .55; }
.outline .dotx { width: 22px; height: 22px; }
textarea.note { width: 100%; min-height: 110px; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); resize: vertical; outline: none; }

/* achievements, profile, plans */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.badge { display: flex; gap: 12px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); min-width: 0; }

.badge > div { flex: 1; min-width: 0; } .badge small { color: var(--faint); font-size: 12px; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 280px; }

.choice { display: grid; gap: 8px; margin: 14px 0; }
.choice label { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; }
.choice label:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
.choice input { accent-color: var(--accent); } .choice span { flex: 1; } .choice small { color: var(--muted); }

.sw input:checked + i { background: var(--accent); border-color: transparent; } .sw input:checked + i::after { transform: translateX(16px); background: var(--accent-ink); }

.savebar { position: sticky; bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; margin-top: var(--gap); border-radius: 10px; background: var(--raised); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.25); flex-wrap: wrap; }

<script>
/* Shared helpers for the Showroom demos (inlined by tools/build-demos.mjs). */

const ICONS = {

const ic = (name, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[name] || ICONS.grid}"/></svg>`;

/* Feedback messages. Each demo picks a style with <html data-fx="…">:
   pill (bottom centre) · snack (bottom-left, dismissible) · banner (top bar) · corner (stacked cards)
   flash (bubble at the pointer) · push (phone-style notification) · none (silent, warnings only) */
let lastPt = { x: innerWidth / 2, y: innerHeight * .6 };
addEventListener('pointerdown', (e) => { lastPt = { x: e.clientX, y: e.clientY }; }, true);
const WARN = /^(enter|check|not |only |describe|volume must|this period|generation limit|project limit)/i;
const fxHost = (cls, tag = 'div') => { let el = $('.' + cls); if (!el) { el = document.createElement(tag); el.className = cls; document.body.appendChild(el); } return el; };
const fxTimers = {};
const fxLater = (key, fn, ms) => { clearTimeout(fxTimers[key]); fxTimers[key] = setTimeout(fn, ms); };
const FX = {
  pill(msg) {
    const t = fxHost('toast'); t.setAttribute('role', 'status'); t.textContent = msg; void t.offsetWidth; t.classList.add('show');
    fxLater('pill', () => t.classList.remove('show'), 2600);
  },
  snack(msg) {
    const t = fxHost('snack'); t.setAttribute('role', 'status');
    t.innerHTML = `<span></span><button type="button" aria-label="Dismiss">✕</button>`; t.firstChild.textContent = msg;
    t.lastChild.onclick = () => t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
    fxLater('snack', () => t.classList.remove('show'), 4200);
  },
  banner(msg) {
    const t = fxHost('fxbar'); t.setAttribute('role', 'status'); t.textContent = msg; void t.offsetWidth; t.classList.add('show');
    fxLater('banner', () => t.classList.remove('show'), 3000);
  },
  corner(msg) {
    const host = fxHost('corner'); host.setAttribute('role', 'status');
    const c = document.createElement('div'); c.className = 'cn'; c.innerHTML = `<i></i><span></span><small>now</small>`; c.children[1].textContent = msg;
    host.prepend(c); while (host.children.length > 3) host.lastChild.remove();
    requestAnimationFrame(() => c.classList.add('show'));
    setTimeout(() => { c.classList.remove('show'); setTimeout(() => c.remove(), 260); }, 4200);
  },
  flash(msg) {
    const t = fxHost('flash'); t.setAttribute('role', 'status'); t.textContent = msg; t.classList.remove('show'); void t.offsetWidth;
    const w = Math.min(280, innerWidth - 24);
    t.style.maxWidth = w + 'px';
    t.style.left = Math.max(12 + w / 2, Math.min(innerWidth - 12 - w / 2, lastPt.x)) + 'px';
    t.style.top = Math.max(48, lastPt.y - 18) + 'px';
    t.classList.add('show'); fxLater('flash', () => t.classList.remove('show'), 2200);
  },
  push(msg) {
    const brand = ($('.brand-name') || {}).textContent || document.title.split(/[—·-]/)[0].trim();
    const t = fxHost('push'); t.setAttribute('role', 'status');
    t.innerHTML = `<i></i><div><b></b><span></span></div><small>now</small>`;
    t.querySelector('i').textContent = (brand || 'A')[0]; t.querySelector('b').textContent = brand; t.querySelector('span').textContent = msg;
    t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
    fxLater('push', () => t.classList.remove('show'), 4200);
  },
};
function toast(msg) {
  const fx = document.documentElement.dataset.fx || 'pill';
  const warn = WARN.test(msg);
  if (fx === 'none' && !warn) return;
  (FX[fx === 'none' ? 'flash' : fx] || FX.pill)(msg);
}
function modal(html, onMount) {
  closeModal();
  const s = document.createElement('div');
  s.className = 'scrim'; s.id = 'scrim';
  s.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  s.addEventListener('mousedown', (e) => { if (e.target === s) closeModal(); });
  document.body.appendChild(s);
  const f = $('input,select,textarea', s); if (f) f.focus();
  if (onMount) onMount(s);
  return s;
}
function closeModal() { const s = $('#scrim'); if (s) s.remove(); }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* charts: drawn in SVG at the width they are given, redrawn on resize */
const NS = 'http://www.w3.org/2000/svg';
const charts = [];
function chart(el, draw) {
  const run = () => { const w = Math.max(160, el.clientWidth); el.innerHTML = draw(w); };
  charts.push({ el, run }); run();
}
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => charts.forEach((c) => { if (document.contains(c.el)) c.run(); }), 120); });
const niceMax = (m) => { const mag = 10 ** Math.floor(Math.log10(m)); for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k * mag >= m * 1.02) return k * mag; return 10 * mag; };

/* bars: values with a marked bar; labels under, 3 faint gridlines */
function barsSVG(w, { labels, values, mark = values.length - 1, h = 190, fmtV = fmt, unit = '' }) {
  const L = 36, B = 26, T = 8, ph = h - B - T, pw = w - L - 4;
  const max = niceMax(Math.max(...values)), bw = Math.min(46, pw / values.length * 0.56), step = pw / values.length;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = max / 3 * i, y = T + ph - (v / max) * ph; g += `<line class="grid-l" x1="${L}" x2="${w}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtV(v)}</text>`; }
  const bars = values.map((v, i) => {
    const x = L + step * i + (step - bw) / 2, bh = Math.max(2, (v / max) * ph), y = T + ph - bh;
    const on = Array.isArray(mark) ? mark.includes(i) : i === mark;
    return `<g><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--accent)" opacity="${on ? 1 : .38}"><title>${esc(labels[i])}: ${fmtV(v)} ${unit}</title></rect>
      <text x="${x + bw / 2}" y="${h - 8}" text-anchor="middle" ${on ? 'style="fill:var(--text)"' : ''}>${esc(labels[i])}</text>
      ${on ? `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmtV(v)}</text>` : ''}</g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(labels.map((l, i) => l + ' ' + fmtV(values[i])).join(', '))}">${g}${bars}</svg>`;
}
/* line: one series, 2px, no markers, end value labelled */
function lineSVG(w, { labels, values, h = 190, fmtV = fmt, xAt }) {
  const L = 44, B = 26, T = 12, R = 44, ph = h - B - T, pw = w - L - R;
  const max = niceMax(Math.max(...values)), n = values.length;
  const X = (i) => L + (pw * i) / (n - 1), Y = (v) => T + ph - (v / max) * ph;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = max / 3 * i, y = Y(v); g += `<line class="grid-l" x1="${L}" x2="${w - R + 20}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtV(v)}</text>`; }
  const d = values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const xs = (xAt || labels.map((_, i) => i)).map((i) => `<text x="${X(i)}" y="${h - 8}" text-anchor="middle">${esc(labels[i])}</text>`).join('');
  const last = values[n - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc('Trend: ' + labels.map((l, i) => l + ' ' + fmtV(values[i])).join(', '))}">${g}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${X(n - 1) + 8}" y="${Y(last) + 4}" style="fill:var(--text);font-weight:600">${fmtV(last)}</text>${xs}</svg>`;
}
/* ring: progress with the total inside */
function ringSVG(size, { value, label, sub }) {
  const r = size / 2 - 8, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label + ' ' + (sub || ''))}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--raised)" stroke-width="8"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * value} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="${sub ? '48%' : '52%'}" text-anchor="middle" style="font:700 ${size / 4.4}px var(--display);fill:var(--text)">${esc(label)}</text>${sub ? `<text x="50%" y="62%" text-anchor="middle" style="font:12px var(--font);fill:var(--muted)">${esc(sub)}</text>` : ''}</svg>`;
}
const barRow = (label, pct, right, sub) => `<div class="brow"><div class="brow-t"><span>${label}${sub ? ` <em>${sub}</em>` : ''}</span><b>${right}</b></div><div class="bar"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div></div>`;

function candleSVG(w) {

  let mn = Math.min(...v.map((x) => x.l)), mx = Math.max(...v.map((x) => x.h)); const span0 = mx - mn;
  lines.forEach(([p]) => { if (p > mn - span0 * .5 && p < mx + span0 * .5) { mn = Math.min(mn, p); mx = Math.max(mx, p); } });

  let g = ''; for (let i = 0; i <= 4; i++) { const p = mn + (mx - mn) * i / 4, y = Y(p); g += `<line class="grid-l" x1="${L}" x2="${w - R + 4}" y1="${y}" y2="${y}"/><text x="${w - R + 10}" y="${y + 4}">${pxn(p)}</text>`; }
  const kk = [1, 2, 3, 4, 6, 12, 24, 48, 72].find((k) => k * step >= 62) || 96;
  v.forEach((x, i) => { const d = new Date(x.t), hr = d.getHours(); if (kk < 24 ? hr % kk === 0 : (hr === 0 && Math.round(x.t / D) % (kk / 24) === 0)) { const cx = L + step * i + step / 2; if (cx > 24 && cx < w - R - 20) g += `<line class="grid-l" x1="${cx}" x2="${cx}" y1="${Tp}" y2="${vb}" opacity=".6"/><text x="${cx}" y="${h - 7}" text-anchor="middle">${hr === 0 ? DF.format(x.t) : TF.format(x.t)}</text>`; } });
  const cs = v.map((x, i) => { const cx = L + step * i + step / 2, up = x.c >= x.o, col = up ? 'var(--pos)' : 'var(--neg)', vh = x.vol / mv * VH;
    return `<rect x="${cx - bw / 2}" y="${vb - vh}" width="${bw}" height="${vh}" fill="${col}" opacity=".22"/><line x1="${cx}" x2="${cx}" y1="${Y(x.h)}" y2="${Y(x.l)}" stroke="${col}" stroke-width="1"/><rect x="${cx - bw / 2}" y="${Y(Math.max(x.o, x.c))}" width="${bw}" height="${Math.max(1.2, Math.abs(Y(x.o) - Y(x.c)))}" fill="${col}" rx="${bw > 4 ? 1 : 0}"/>`; }).join('');
  const lv = lines.filter(([p]) => p > mn && p < mx).map(([p, c, nm]) => `<line x1="${L}" x2="${w - R + 4}" y1="${Y(p)}" y2="${Y(p)}" stroke="${c}" stroke-width="1" stroke-dasharray="5 4" opacity=".85"/><text x="${L + 6}" y="${Y(p) - 4}" style="fill:${c}">${nm} ${px(p)}</text>`).join('');
  const cur = price(T.sym), ly = clamp(Y(cur), Tp, Tp + ph);

  if (CH.hi != null && CH.hi < n) {

      <rect x="${w - R + 4}" y="${hy - 10}" width="${R - 4}" height="20" rx="4" fill="var(--raised)" stroke="var(--border)"/><text x="${w - R + 9}" y="${hy + 4}" style="fill:var(--text)">${pxn(hp)}</text>
      <rect x="${lx}" y="${h - 21}" width="${lw}" height="19" rx="4" fill="var(--raised)" stroke="var(--border)"/><text x="${lx + lw / 2}" y="${h - 7}" text-anchor="middle" style="fill:var(--text)">${lab}</text></g>`;

  return head('Settings', 'Preferences for this device and your account') +
    `<div class="grid"><section class="card c6"><div class="card-h"><h2>Appearance</h2></div><div class="set-row"><div><b>Theme</b><small>Applies immediately.</small></div><div class="seg" role="group" aria-label="Theme">${[['dark', 'Dark'], ['light', 'Light']].map(([k, t]) => `<button data-act="theme" data-v="${k}" aria-pressed="${SET.theme === k}">${t}</button>`).join('')}</div></div>
      <div class="set-row"><div><b>Language</b><small>More languages are on the roadmap.</small></div><select class="sel" disabled aria-label="Language"><option>English (UK)</option></select></div><div class="set-row"><div><b>Account currency</b><small>Virtual balance and P&amp;L.</small></div><span class="pill">EUR · €</span></div></section>
    <section class="card c6"><div class="card-h"><h2>Simulator defaults</h2><span>Used for new orders</span></div>${num('defSize', 'Default order size, €', 10, e.defSize)}<div class="row2">${num('defSl', 'Default stop-loss, %', .1, e.defSl)}${num('defTp', 'Default take-profit, %', .1, e.defTp)}</div>${sw('confirmClose', 'Confirm before closing positions', 'Ask before a manual close realises P&L.')}</section>
    <section class="card c6"><div class="card-h"><h2>Notifications</h2></div>${sw('nFill', 'Order fills and stops', 'When an order fills or a stop or target triggers.')}${sw('nStreak', 'Streak reminders', 'A nudge in the evening if you have not learned today.')}${sw('nWeekly', 'Weekly league summary', 'Your leaderboard movement every Monday.')}${sw('nEmail', 'Email copies', 'Also send these to ' + esc(ME.email) + '.')}</section>
    <section class="card c6"><div class="card-h"><h2>Account</h2></div><div class="set-row"><div><b>Reset paper account</b><small>Closes positions, cancels orders and clears the journal. Courses and XP are kept.</small></div><button class="btn danger" data-act="reset">Reset</button></div>
      <div class="set-row"><div><b>Delete account</b><small>For your security, deletion is handled by support within 30 days.</small></div><button class="btn" disabled title="Contact support to delete your account">${ic('lock')}Delete</button></div><div class="set-row"><div><b>Sign out</b><small>Signed in as ${esc(ME.email)}.</small></div><button class="btn" data-act="signout">Sign out</button></div></section></div>
    ${dirty ? `<div class="savebar" role="region" aria-label="Unsaved changes"><span>You have unsaved changes.</span><div style="display:flex;gap:8px"><button class="btn" data-act="sDiscard">Discard</button><button class="btn primary" data-act="sSave">Save settings</button></div></div>` : ''}`;
}

/* ── sign in ─────────────────────────────────────────── */
const DEMO_PW = 'paper-trade-2026';
function authView(err = '') {
  $('#app').hidden = true; $('#tabbar').hidden = true; const a = $('#auth'); a.hidden = false;
  a.innerHTML = `<div class="auth"><section class="card auth-card"><div class="brand" style="padding:0"><div class="brand-mark"><svg class="ic" viewBox="0 0 24 24"><path d="${ICONS.trend}"/></svg></div><div><div class="brand-name">TradingLearn</div><div class="brand-sub">Academy and simulator</div></div></div>
  <h1>Sign in</h1><p>Welcome back. Your paper account, courses and streak are waiting.</p>${err ? `<div class="auth-err" role="alert">${ic('alert')}<span>${err}</span></div>` : ''}
  <form id="signin" novalidate><div class="field"><label for="a-email">Email</label><input id="a-email" type="email" autocomplete="username" value="${esc(ME.email)}"></div>
  <div class="field"><label for="a-pw">Password</label><div class="pw"><input id="a-pw" type="password" autocomplete="current-password" value="${DEMO_PW}"><button type="button" class="btn sm ghost" data-act="pwShow" aria-label="Show password">Show</button></div></div>
  <div class="field"><label><input type="checkbox" checked> Keep me signed in on this device</label></div><button class="btn primary" id="a-go" type="submit" style="width:100%;height:42px">Sign in</button></form>
  <div style="display:flex;justify-content:space-between;margin-top:14px"><button class="lnk" data-act="forgot">Forgot password?</button><span class="muted" style="font-size:12px">${VERSION}</span></div>
  <div class="demo-cred">Demo credentials are prefilled: <b>${esc(ME.email)}</b> · <b>${DEMO_PW}</b></div></section></div>`;
  $('#a-go').focus();
}

/* ── actions ──────────────────────────────────────────── */
const reRenderTicket = () => { const t = $('#ticket'); if (t) t.innerHTML = ticketHTML(); };
const ACT = {
  x() { closeModal(); },
  sym(d) { T.sym = d.v; T.lim = ''; T.err = {}; CH.hi = null; render(); },
  range(d) { CH.range = d.v; CH.hi = null; render(); },
  dir(d) { T.dir = d.v; T.err = {}; reRenderTicket(); },
  otype(d) { T.type = d.v; T.err = {}; if (d.v !== 'market' && !T.lim) { const p = price(T.sym), long = T.dir === 'long', s = d.v === 'limit' ? (long ? -1 : 1) : (long ? 1 : -1); T.lim = +(p * (1 + s * .005)).toFixed(dec(p)); } reRenderTicket(); },
  pct(d) { T.size = Math.max(0, Math.floor(freeCash() * +d.v / 100 / 10) * 10); T.err = {}; reRenderTicket(); },
  obp(d) { const p = +d.v, cur = price(T.sym); T.type = 'limit'; T.dir = p < cur ? 'long' : 'short'; T.lim = +p.toFixed(dec(p)); T.err = {}; reRenderTicket(); say(`Limit price set to ${px(p)}`); },
  ptab(d) { PT = d.v; render(); },
  submit() {
    T.err = validateTicket(); if (Object.keys(T.err).length) { reRenderTicket(); const f = $('#ticket [aria-invalid=true]'); if (f) f.focus(); return; }
    const o = { sym: T.sym, dir: T.dir, type: T.type, size: +T.size, sl: T.useSl ? +T.sl : 0, tp: T.useTp ? +T.tp : 0 };
    if (T.type === 'market') { openPos(o, price(T.sym)); say(`${T.sym} ${T.dir} opened at ${px(price(T.sym))}`); if (T.useSl) taskDone('sl'); }
    else { ORD.push({ ...o, id: ++nid, price: +T.lim, placed: Date.now() }); PT = 'ord'; say(`${T.type === 'limit' ? 'Limit' : 'Stop'} order placed at ${px(+T.lim)}`); if (T.type === 'limit') taskDone('limit'); T.lim = ''; T.type = 'market'; }
    progress(); render();
  },
  close(d) {
    const p = POS.find((x) => x.id === +d.id); if (!p) return;
    const doIt = () => { closePos(p, 'manual'); render(); };
    if (SET.confirmClose) confirmBox(`Close ${p.sym} ${p.dir}?`, `The position closes at the market price, about ${px(price(p.sym))}. Current result: <b class="${cl(upnl(p))}">${eurS(upnl(p))}</b>.`, 'Close position', doIt); else doIt();
  },
  cancelOrd(d) { const o = ORD.find((x) => x.id === +d.id), i = ORD.indexOf(o); if (!o) return; ORD.splice(i, 1); render(); say(`${o.sym} ${o.type} order cancelled`, () => { ORD.splice(i, 0, o); render(); }); },
  calc() { openCalc(); },
  calcApply() { const r = calcBody(); if (!r.ok) return; if (r.size < 10) return say('Not enough free funds for this size'); T.size = r.size; T.sl = CALC.stop; T.useSl = true; T.err = {}; closeModal(); if (page !== 'practice') go('practice'); else reRenderTicket(); taskDone('calc'); render(); say(`Size set to ${eur(T.size, 0)} with a ${CALC.stop}% stop`); },
  reset() {
    confirmBox('Reset the paper account?', `Open positions close without a result, ${pl(ORD.length, 'order')} ${ORD.length === 1 ? 'is' : 'are'} cancelled and ${pl(J.length, 'journal entry', 'journal entries')} ${J.length === 1 ? 'is' : 'are'} cleared. The balance returns to ${eur(START, 0)}. Courses, XP and badges are kept.`, 'Reset account', () => {
      const snap = { J, POS, ORD }; J = []; POS = []; ORD = []; render(); say('Paper account reset to €10,000', () => { ({ J, POS, ORD } = snap); render(); });
    }, true);
  },
  riskq() { RQ = { i: 0, a: [] }; modal(rqBody()); },
  rqPick(d) { RQ.a[RQ.i] = +d.v; rqDraw(); },
  rqNext() { if (RQ.a[RQ.i] == null) return; RQ.i++; rqDraw(); },
  rqBack() { RQ.i = Math.max(0, RQ.i - 1); rqDraw(); },
  rqApply(d) { RISKP = PROFILES[+d.v]; SET.defSl = RISKP.sl; T.sl = RISKP.sl; SD = null; closeModal(); notify('Risk profile: ' + RISKP.n, `Risk per trade ${RISKP.risk}%, default stop ${RISKP.sl}%.`, 'shield', 'profile', 'xp'); say(`Risk profile saved: ${RISKP.n}`); progress(); render(); },
  taskGo(d) { const l = LES.find((x) => x.id === +d.id); if (l.task === 'journal') { go('journal'); return say('Open any trade and add a note'); } if (l.task === 'calc') { if (page !== 'practice') go('practice'); return openCalc(); } if (l.task === 'limit') { T.type = 'market'; go('practice'); ACT.otype({ v: 'limit' }); return say('Limit price prefilled below the market'); } go('practice'); const f = $('#f-size'); if (f) f.focus(); },
  toLearn() { go('learn'); },
  course(d) { CID = d.id; LID = null; render(); window.scrollTo(0, 0); },
  lesson(d) { const l = LES.find((x) => x.id === +d.id); if (proLocked(l)) return paywall(`${crs(l.c).t} is part of Pro.`); if (lesLocked(l)) return say('Finish the previous lesson first'); page = 'learn'; CID = l.c; LID = l.id; QZ = null; POP = null; render(); window.scrollTo(0, 0); },
  nextLesson() { const l = LES.find((x) => !x.done && !lesLocked(x) && !proLocked(x)); if (l) ACT.lesson({ id: l.id }); },
  cf(d) { CF.f = d.v; render(); }, cfClear() { CF.f = 'all'; CF.q = ''; render(); },
  play() { const l = LES.find((x) => x.id === LID), total = l.min * 60 - 17; if (VID.pos >= total) VID.pos = 0; VID.playing = !VID.playing; const b = $('.vplay'); if (b) { b.classList.toggle('on', VID.playing); b.setAttribute('aria-label', (VID.playing ? 'Pause' : 'Play') + ' video'); b.innerHTML = `<i>${ic(VID.playing ? 'pause' : 'play')}</i>`; } },
  saveNote() { const l = LES.find((x) => x.id === LID); l.note = $('#l-note').value.slice(0, 1000); say(l.note ? 'Notes saved' : 'Notes cleared'); },
  qPick(d) { QZ.pick = +d.v; $('#quiz').innerHTML = quizHTML(LES.find((x) => x.id === LID)); },
  qCheck() { const l = LES.find((x) => x.id === LID); if (QZ.pick == null) return; QZ.checked = true; if (QZ.pick === l.q[QZ.i].a) QZ.right++; $('#quiz').innerHTML = quizHTML(l); },
  qNext() { const l = LES.find((x) => x.id === LID); QZ.i++; QZ.pick = null; QZ.checked = false;
    if (QZ.i >= l.q.length) { const sc = [QZ.right, l.q.length]; if (sc[0] / sc[1] >= .5) { const best = !l.score || sc[0] >= l.score[0] ? sc : l.score; completeLesson(l, best); return render(); } }
    $('#quiz').innerHTML = quizHTML(l); },
  qRetake() { QZ = { lid: LID, i: 0, pick: null, checked: false, right: 0, review: false }; $('#quiz').innerHTML = quizHTML(LES.find((x) => x.id === LID)); },
  jsort(d) { if (JF.sort === d.v) JF.dir *= -1; else { JF.sort = d.v; JF.dir = d.v === 'sym' ? 1 : -1; } render(); },
  jpg(d) { JF.pg += +d.v; render(); }, jclear() { Object.assign(JF, { q: '', sym: 'all', side: 'all', res: 'all', tag: 'all', pg: 1 }); render(); },
  trade(d) { const t = J.find((x) => x.id === +d.id); if (!t) return; DRAW = { id: t.id, tags: [...t.tags], note: t.note }; openDrawer(tradeDrawer(t)); DRAW = { id: t.id, tags: [...t.tags], note: t.note }; },
  dtag(d) { const i = DRAW.tags.indexOf(d.v); if (i >= 0) DRAW.tags.splice(i, 1); else DRAW.tags.push(d.v); $$('#drawer .tagc').forEach((b) => b.setAttribute('aria-pressed', DRAW.tags.includes(b.dataset.v))); },
  dclose() { closeDrawer(); },
  dsave() { const t = J.find((x) => x.id === DRAW.id), note = $('#d-note').value.trim();
    if (note.length > 500) { const c = $('#d-cnt'); c.textContent = `${note.length} / 500 · shorten the note by ${note.length - 500} characters`; c.classList.add('over'); $('#d-note').setAttribute('aria-invalid', 'true'); $('#d-note').focus(); return; }
    const prev = { tags: t.tags, note: t.note }; t.tags = [...DRAW.tags]; t.note = note; closeDrawer(); if (note) taskDone('journal'); progress(); render(); say(`Journal entry T-${t.id} saved`, () => { Object.assign(t, prev); render(); }); },
  csv() { csv(); },
  af(d) { AF.f = d.v; render(); },
  lbper(d) { LBS.per = d.v; LBS.pg = 1; LBS.loading = true; render(); setTimeout(() => { LBS.loading = false; if (page === 'rank') render(); }, 450); },
  lbpg(d) { LBS.pg += +d.v; render(); },
  lbme() { LBS.q = ''; const per = LBS.per, mine = [...LB.map((x) => x.ret[per]), myRet(per)].sort((a, b) => b - a).indexOf(myRet(per)); LBS.pg = Math.floor(mine / 15) + 1; render(); const m = $('.tr.me'); if (m) m.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); },
  editProfile() { editProfile(); },
  paywall(d) { paywall(d && d.v ? `${d.v} is part of Pro.` : ''); },
  trial(d) {
    const btn = $('[data-act=trial]'); const c = $('input[name=cyc]:checked'); PLANCYCLE = c ? c.value : PLANCYCLE; btn.classList.add('busy'); btn.textContent = 'Starting trial';
    setTimeout(() => { PLAN.tier = 'pro'; PLAN.cycle = PLANCYCLE; PLAN.trialEnd = Date.now() + 7 * D; PLAN.invoices.unshift({ id: 'INV-2026-0' + (142 + PLAN.invoices.length), t: Date.now(), d: `Pro ${PLANCYCLE === 'year' ? 'yearly' : 'monthly'} · 7-day trial`, amt: 0, s: 'Paid' });
      closeModal(); notify('Welcome to Pro', 'Trading psychology and Building a strategy are unlocked.', 'zap', 'learn', 'xp'); say('Pro trial started. All courses unlocked'); render(); }, 800);
  },
  cyc(d) { PLANCYCLE = d.v; render(); },
  cancelPro() { confirmBox('Cancel your Pro trial?', 'You lose access to the psychology and strategy courses straight away. Your progress in them is kept if you return.', 'Cancel subscription', () => { PLAN.tier = 'free'; PLAN.trialEnd = null; render(); say('Subscription cancelled. You are on the Free plan'); }, true); },
  theme(d) { SET.theme = d.v; if (SD) SD.theme = d.v; document.documentElement.dataset.theme = d.v; render(); },
  sDiscard() { SD = null; render(); },
  sSave() {
    const e = {}; if (!(SD.defSize >= 10 && SD.defSize <= 100000)) e.defSize = 'Enter an amount from €10 to €100,000.'; if (!(SD.defSl >= .1 && SD.defSl <= 50)) e.defSl = 'Use 0.1 to 50%.'; if (!(SD.defTp >= .1 && SD.defTp <= 200)) e.defTp = 'Use 0.1 to 200%.';
    if (Object.keys(e).length) { SD.err = e; render(); return; } delete SD.err;
    Object.assign(SET, SD); T.size = SET.defSize; T.sl = SET.defSl; T.tp = SET.defTp; SD = null; render(); say('Settings saved');
  },
  bell() { POP = POP === 'bell' ? null : 'bell'; drawTop(); },
  menu() { POP = POP === 'menu' ? null : 'menu'; drawTop(); const f = $('.pop.menu [role=menuitem]'); if (f) f.focus(); },
  readAll() { const was = NT.filter((n) => !n.read); was.forEach((n) => { n.read = true; }); drawTop(); say(`${pl(was.length, 'notification')} marked as read`, () => { was.forEach((n) => { n.read = false; }); drawTop(); }); },
  clearNtf() { const was = NT; NT = []; drawTop(); say('Notifications cleared', () => { NT = was; drawTop(); }); },
  ntf(d) { const n = NT.find((x) => x.id === +d.id); n.read = true; go(n.go); },
  help() { POP = null; drawTop(); helpModal(); }, keys() { POP = null; drawTop(); helpModal('keys'); }, helpTab(d) { helpModal(d.v); },
  signout() { closeModal(); POP = null; closeDrawer(true); signedIn = false; authView(); },
  pwShow() { const i = $('#a-pw'), b = $('[data-act=pwShow]'); const sh = i.type === 'password'; i.type = sh ? 'text' : 'password'; b.textContent = sh ? 'Hide' : 'Show'; b.setAttribute('aria-label', sh ? 'Hide password' : 'Show password'); },
  forgot() { authView(''); const e = $('.auth-card > p'); e.innerHTML = `We would email a reset link to <b>${esc($('#a-email').value || ME.email)}</b>. In this demo, just use the prefilled password.`; },
};

/* ── events ───────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  if (POP && !e.target.closest('.anchor')) { POP = null; drawTop(); }
  const a = e.target.closest('[data-page]'); if (a) { e.preventDefault(); return go(a.dataset.page); }
  const act = e.target.closest('[data-act]'); if (act && ACT[act.dataset.act] && !act.disabled) ACT[act.dataset.act](act.dataset);
});
document.addEventListener('keydown', (e) => {
  const typing = e.target.matches('input, textarea, select');
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-page], .tr.click, .outline a') && !typing) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape') { if ($('#scrim')) return; if (POP) { POP = null; drawTop(); return; } if ($('#drawer')) return closeDrawer(); if (typing) e.target.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || !signedIn || $('#scrim') || $('#drawer')) return;
  if (e.key === '/') { const s = $('[data-search]'); if (s) { e.preventDefault(); s.focus(); s.select(); } }
  if (e.key === '?') { e.preventDefault(); helpModal('keys'); }
  if (page === 'practice' && (e.key === 'b' || e.key === 's')) { T.dir = e.key === 'b' ? 'long' : 'short'; reRenderTicket(); }
}, true);
let qT;
document.addEventListener('input', (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === 'f-size' || id === 'f-lim' || id === 'f-sl' || id === 'f-tp') { const k = { 'f-size': 'size', 'f-lim': 'lim', 'f-sl': 'sl', 'f-tp': 'tp' }[id]; T[k] = k === 'lim' ? v : +v; if (T.err[k]) { delete T.err[k]; e.target.removeAttribute('aria-invalid'); const er = e.target.parentNode.querySelector('.err'); if (er) er.remove(); } const r = $('#risk'); if (r) r.innerHTML = riskHTML(); }
  if (id === 'c-risk' || id === 'c-stop') { CALC[id === 'c-risk' ? 'risk' : 'stop'] = +v; $('#c-out').innerHTML = calcBody().html; }
  if (id === 'l-note') { const c = $('#n-cnt'); c.textContent = `${fmt(v.length)} / 1,000`; }
  if (id === 'd-note') { DRAW.note = v; const c = $('#d-cnt'); c.textContent = `${v.length} / 500`; c.classList.toggle('over', v.length > 500); }
  if (id === 'jq' || id === 'lq' || id === 'cq') { clearTimeout(qT); qT = setTimeout(() => { if (id === 'jq') { JF.q = v; JF.pg = 1; } else if (id === 'lq') { LBS.q = v; LBS.pg = 1; } else CF.q = v; render(); const s = $('#' + id); if (s) { s.focus(); s.setSelectionRange(v.length, v.length); } }, 160); }
  if (e.target.dataset.set && e.target.type === 'number') { SD[e.target.dataset.set] = +v; if (SD.err) delete SD.err[e.target.dataset.set]; const dirty = Object.keys(SET).some((k) => SET[k] !== SD[k]); if (!!$('.savebar') !== dirty) { render(); const f = $('#' + id); if (f) { f.focus(); } } }
});
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'u-sl' || id === 'u-tp') { T[id === 'u-sl' ? 'useSl' : 'useTp'] = e.target.checked; reRenderTicket(); }
  if (['jsym', 'jside', 'jres', 'jtag'].includes(id)) { JF[id.slice(1)] = e.target.value; JF.pg = 1; render(); }
  if (e.target.dataset.set && e.target.type === 'checkbox') { SD[e.target.dataset.set] = e.target.checked; render(); }
  if (e.target.name === 'cyc') PLANCYCLE = e.target.value;
});
document.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target;
  const mark = (inp, msg) => { inp.setAttribute('aria-invalid', 'true'); const s = document.createElement('span'); s.className = 'err'; s.textContent = msg; inp.closest('.field').appendChild(s); };
  $$('.err', f).forEach((x) => x.remove()); $$('[aria-invalid]', f).forEach((x) => x.removeAttribute('aria-invalid'));
  if (f.id === 'signin') {
    const em = $('#a-email'), pw = $('#a-pw'); let bad = false;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())) { mark(em, 'Enter a valid email address.'); bad = true; }
    if (pw.value.length < 8) { mark(pw.closest('.pw'), 'The password has at least 8 characters.'); bad = true; }
    if (bad) return $('[aria-invalid]', f).focus();
    const b = $('#a-go'); b.classList.add('busy'); b.textContent = 'Signing in';
    setTimeout(() => { if (em.value.trim().toLowerCase() !== ME.email || pw.value !== DEMO_PW) return authView('Incorrect email or password. Use the demo credentials below.');
      signedIn = true; $('#auth').hidden = true; $('#auth').innerHTML = ''; $('#app').hidden = false; $('#tabbar').hidden = false; page = 'practice'; CID = LID = null; render(); }, 700);
  }
  if (f.id === 'pform') {
    const n = $('#p-name'), em = $('#p-email'), bio = $('#p-bio'); let bad = false;
    if (n.value.trim().length < 2) { mark(n, 'Enter your name (at least 2 characters).'); bad = true; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em.value.trim())) { mark(em, 'Enter a valid email address, for example name@example.com.'); bad = true; }
    if (bio.value.length > 160) { mark(bio, `Shorten this by ${bio.value.length - 160} characters.`); bad = true; }
    if (bad) return $('[aria-invalid]', f).focus();
    ME.name = n.value.trim().replace(/\s+/g, ' '); ME.email = em.value.trim(); ME.country = $('#p-country').value; ME.bio = bio.value.trim(); closeModal(); render(); say('Profile updated');
  }
  if (f.id === 'contact') {
    const t = $('#h-topic'), m = $('#h-msg'); let bad = false;
    if (!t.value) { mark(t, 'Choose a topic.'); bad = true; } if (m.value.trim().length < 20) { mark(m, `Add a little more detail (at least 20 characters, ${m.value.trim().length} so far).`); bad = true; }
    if (bad) return $('[aria-invalid]', f).focus();
    closeModal(); const id = 'TL-' + (++tickets); notify('Support request ' + id + ' received', 'We will reply to ' + ME.email + ' within one working day.', 'chat', 'practice'); say(`Message sent. Ticket ${id}`);
  }
});
document.documentElement.dataset.theme = SET.theme;
render();
</script>
