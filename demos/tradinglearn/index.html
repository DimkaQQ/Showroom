/* Shared kit for the Showroom demos. Inlined into each demo by tools/build-demos.mjs.

:root {

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 40; animation: fade .18s ease both; }
.modal { width: 100%; max-width: 440px; max-height: 92svh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; animation: pop .22s var(--ease) both; }
.modal h2 { font-size: 18px; margin-bottom: 4px; letter-spacing: -.01em; } .modal > p { color: var(--muted); margin-bottom: 18px; }

.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* charts */
.chart { width: 100%; }
.chart text { font: 12px var(--font); fill: var(--faint); }

.tabbar { display: none; }

function barsSVG(w, { labels, values, mark = values.length - 1, h = 190, fmtV = fmt, unit = '' }) {
  const L = 36, B = 26, T = 8, ph = h - B - T, pw = w - L - 4;

  const bars = values.map((v, i) => {
    const x = L + step * i + (step - bw) / 2, bh = Math.max(2, (v / max) * ph), y = T + ph - bh;
    const on = Array.isArray(mark) ? mark.includes(i) : i === mark;
    return `<g><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--accent)" opacity="${on ? 1 : .38}"><title>${esc(labels[i])}: ${fmtV(v)} ${unit}</title></rect>
      <text x="${x + bw / 2}" y="${h - 8}" text-anchor="middle" ${on ? 'style="fill:var(--text)"' : ''}>${esc(labels[i])}</text>
      ${on ? `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmtV(v)}</text>` : ''}</g>`;
  }).join('');

}
/* line: one series, 2px, no markers, end value labelled */

    : quiz ? `<div class="coach">${ic('graduation')}<span>Следующий урок: «${quiz.t}», 1 вопрос, +${XP} XP.</span><button class="btn sm primary" data-act="quiz" data-id="${quiz.id}">Пройти</button></div>` : '';
  const c = last(sym), chg = (price(sym) / MARKET[sym][MARKET[sym].length - 25].c - 1) * 100;
  return head('Практика', `Виртуальный депозит. Баланс ${usd(balance())}, свободно ${usd(freeCash())}`, `<div class="lvl"><span class="muted">Ур. ${level()}</span><div class="bar"><i style="width:${xp() % PER / PER * 100}%"></i></div><span class="muted">${xp()} XP</span></div>`) + coach +
    `<div class="kpis"><div class="kpi"><b id="k-eq">${usd(equity())}</b><span>Капитал</span></div><div class="kpi"><b id="k-un" class="${unreal() >= 0 ? 'pos' : 'neg'}">${pnlF(unreal())}</b><span>Открытый результат</span></div><div class="kpi"><b>${pnlF(realized())}</b><span>Закрытый результат</span></div></div>
    <div class="term"><div><section class="card"><div class="chart-h"><span class="px" id="c-px">${px(price(sym))}</span><span id="c-chg" class="${chg >= 0 ? 'pos' : 'neg'}">${chg >= 0 ? '+' : '−'}${Math.abs(chg).toFixed(2)}% за сутки</span><div class="syms">${Object.keys(SYM).map((k) => `<button class="${k === sym ? 'on' : ''}" data-act="sym" data-v="${k}">${k}</button>`).join('')}</div></div><div id="chart"></div></section>
      <section class="card" style="margin-top:var(--gap)"><div class="card-h"><h2>Открытые позиции</h2><span>${POS.length}</span></div><div id="pos">${posHTML()}</div></section></div>
      <aside class="card"><div class="card-h"><h2>Новая сделка</h2><span>${sym}/USDT</span></div>
        <div class="dirs"><button class="l ${dir === 'long' ? 'on' : ''}" data-act="dir" data-v="long">Лонг</button><button class="s ${dir === 'short' ? 'on' : ''}" data-act="dir" data-v="short">Шорт</button></div>
        <div class="field"><label for="f-size">Размер, $</label><input id="f-size" type="number" min="1" value="${size}"><div class="quick">${[10, 25, 50].map((p) => `<button data-act="pct" data-v="${p}">${p}%</button>`).join('')}</div></div>
        <div class="field"><label><input type="checkbox" id="u-sl" ${useSl ? 'checked' : ''}> Стоп-лосс, %</label><input id="f-sl" type="number" step="0.1" min="0.1" value="${sl}" ${useSl ? '' : 'disabled'}></div>
        <div class="field"><label><input type="checkbox" id="u-tp" ${useTp ? 'checked' : ''}> Тейк-профит, %</label><input id="f-tp" type="number" step="0.1" min="0.1" value="${tp}" ${useTp ? '' : 'disabled'}></div>
        <div class="risk" id="risk"></div><button class="btn ${dir === 'long' ? 'long' : 'short'}" style="width:100%;height:42px" data-act="open">${dir === 'long' ? 'Купить' : 'Продать'} ${sym}</button></aside></div>`;
}
function posHTML() {
  if (!POS.length) return '<p class="empty">Позиций нет. Откройте сделку справа.</p>';
  return POS.map((p) => { const u = upnl(p); return `<div class="pos-row"><div><b>${p.sym} ${p.dir === 'long' ? 'лонг' : 'шорт'}</b><small>${usd(p.size, 0)} · вход ${px(p.entry)}</small></div><div class="hm"><small>Стоп</small>${p.sl ? px(p.sl) : '—'}</div><div class="hm"><small>Тейк</small>${p.tp ? px(p.tp) : '—'}</div><div><b class="${u >= 0 ? 'pos' : 'neg'}">${pnlF(u)}</b><small>${(u / p.size * 100).toFixed(2)}%</small></div><button class="btn sm" data-act="close" data-id="${p.id}">Закрыть</button></div>`; }).join('');
}
function drawRisk() {
  const el = $('#risk'); if (!el) return;
  const cash = freeCash(), risk = useSl ? size * sl / 100 : size, gain = useTp ? size * tp / 100 : null;
  el.innerHTML = `${useSl ? `Если сработает стоп, потеряете <b>${usd(risk)}</b> (${fmtD(risk / balance() * 100)}% депозита).` : '<b>Без стопа</b> вы рискуете всей суммой сделки.'}${gain !== null ? ` Тейк принесёт <b>${usd(gain)}</b>${useSl ? `, это 1 к ${fmtD(gain / risk)}` : ''}.` : ''}${size > cash ? ` <b class="neg">Не хватает свободных средств: ${usd(cash)}.</b>` : ''}`;
}
function mount() {
  if (page !== 'practice') return;
  const c = $('#chart'); chart(c, (w) => candleSVG(w)); drawRisk();
}

/* live market: only the chart, price and open P&L repaint; the form is never touched */
setInterval(() => {
  if (!document.hidden) {
    for (const [k, s] of Object.entries(SYM)) { const cd = last(k); cd.c *= 1 + (Math.random() - .495) * s.vol * .45; cd.h = Math.max(cd.h, cd.c); cd.l = Math.min(cd.l, cd.c); }
    checkExits();
    if (page === 'practice') {
      const c = $('#chart'); if (c) c.innerHTML = candleSVG(Math.max(160, c.clientWidth));
      const chg = (price(sym) / MARKET[sym][MARKET[sym].length - 25].c - 1) * 100;
      $('#c-px').textContent = px(price(sym)); $('#c-chg').textContent = `${chg >= 0 ? '+' : '−'}${Math.abs(chg).toFixed(2)}% за сутки`; $('#c-chg').className = chg >= 0 ? 'pos' : 'neg';
      $('#k-eq').textContent = usd(equity()); $('#k-un').textContent = pnlF(unreal()); $('#k-un').className = unreal() >= 0 ? 'pos' : 'neg'; $('#pos').innerHTML = posHTML();
    }
  }
}, 1500);
setInterval(() => { if (!document.hidden) for (const k of Object.keys(SYM)) { const cd = last(k); MARKET[k].push({ o: cd.c, h: cd.c, l: cd.c, c: cd.c }); MARKET[k].shift(); } }, 12000);

function closePos(p, how, at) {
  const exit = at ?? price(p.sym);
  J.unshift({ id: nextJ++, sym: p.sym, dir: p.dir, size: p.size, entry: p.entry, exit, ago: 0, how }); POS = POS.filter((x) => x !== p);
  const t = J[0], r = pnlOf(t); toast(`${p.sym} закрыта (${how}): ${pnlF(r)}`);
}
function checkExits() {
  [...POS].forEach((p) => { const cur = price(p.sym), long = p.dir === 'long';
    if (p.sl && (long ? cur <= p.sl : cur >= p.sl)) { closePos(p, 'стоп', p.sl); if (page === 'practice') render(); }
    else if (p.tp && (long ? cur >= p.tp : cur <= p.tp)) { closePos(p, 'тейк', p.tp); if (page === 'practice') render(); } });
}

/* ── learn ────────────────────────────────────────────── */
function learn() {
  const body = [1, 2, 3].map((c) => { const ls = LES.filter((l) => l.c === c), d = ls.filter((l) => l.done).length, lk = locked(c);
    return `<section class="course"><div class="course-h"><span class="ch"><span class="cover">${coverSVG(c)}</span><h3>${c}. ${COURSES[c]}</h3></span><span class="muted">${lk ? 'Откроется после курса ' + (c - 1) : `${d} из ${ls.length}`}</span></div><div class="bar" style="margin-bottom:8px"><i style="width:${d / ls.length * 100}%"></i></div>
    ${ls.map((l) => `<div class="lesson ${l.done ? 'done' : ''} ${lk ? 'lock' : ''}"><span class="dot">${l.done ? ic('check') : ''}</span><div><b>${l.t}</b><small>${l.task ? 'Практика на графике' : 'Вопрос · 1 мин'}</small></div>${l.done ? '<span class="pill pos">+' + XP + ' XP</span>' : lk ? ic('lock') : l.task ? '<button class="btn sm primary" data-act="goPractice">Попробовать</button>' : `<button class="btn sm primary" data-act="quiz" data-id="${l.id}">Пройти</button>`}</div>`).join('')}</section>`; }).join('');
  return head('Курсы', `${LES.filter((l) => l.done).length} из ${LES.length} уроков. Каждые ${PER} XP открывают новый уровень.`) + `<section class="card">${body}</section>`;
}

/* ── journal ──────────────────────────────────────────── */
function journal() {
  const ts = [...J].sort((a, b) => a.ago - b.ago), res = ts.map(pnlOf), wins = res.filter((r) => r > 0), loss = res.filter((r) => r < 0);
  const sums = {}; J.forEach((t) => { sums[t.sym] = (sums[t.sym] || 0) + pnlOf(t); }); const mxs = Math.max(...Object.values(sums).map(Math.abs));
  const bySym = Object.entries(sums).sort((a, b) => b[1] - a[1]).map(([k, v]) => barRow(k, Math.abs(v) / mxs * 100, `<span class="${v >= 0 ? 'pos' : 'neg'}">${pnlF(v)}</span>`, (n => n + ' ' + (n % 10 === 1 && n !== 11 ? 'сделка' : n % 10 > 1 && n % 10 < 5 && (n < 10 || n > 20) ? 'сделки' : 'сделок'))(J.filter((t) => t.sym === k).length))).join('');
  const rows = ts.map((t) => { const r = pnlOf(t); return `<div class="tr" style="--cols:1fr .8fr 1fr 1fr 1fr .8fr;--colsm:1fr auto"><div class="cell-main"><b>${t.sym} ${t.dir === 'long' ? 'лонг' : 'шорт'}</b><span>${t.ago === 0 ? 'только что' : t.ago < 24 ? t.ago + ' ч назад' : Math.round(t.ago / 24) + ' дн назад'}<span class="dm"> · ${t.how}</span></span></div><span class="hm r">${usd(t.size, 0)}</span><span class="hm r">${px(t.entry)}</span><span class="hm r">${px(t.exit)}</span><span class="hm"><span class="pill ${t.how === 'стоп' ? 'neg' : ''}">${t.how}</span></span><b class="r ${r >= 0 ? 'pos' : 'neg'}">${pnlF(r)}</b></div>`; }).join('');
  return head('Журнал сделок', `${J.length} закрытых сделок. Баланс ${usd(balance())} = ${usd(START, 0)} ${realized() >= 0 ? '+' : '−'} ${usd(Math.abs(realized()))}`) +
    `<div class="kpis"><div class="kpi"><b>${Math.round(wins.length / res.length * 100)}<small>%</small></b><span>Прибыльных сделок</span></div><div class="kpi"><b class="pos">${pnlF(wins.reduce((a, b) => a + b, 0) / (wins.length || 1))}</b><span>Средняя прибыль</span></div><div class="kpi"><b class="neg">${pnlF(loss.reduce((a, b) => a + b, 0) / (loss.length || 1))}</b><span>Средний убыток</span></div><div class="kpi"><b class="${realized() >= 0 ? 'pos' : 'neg'}">${pnlF(realized())}</b><span>Итого</span></div></div>
    <div class="grid"><section class="card c4"><div class="card-h"><h2>Результат по инструментам</h2></div>${bySym}</section><section class="card c8"><div class="card-h"><h2>Сделки</h2></div><div class="tbl"><div class="tr th" style="--cols:1fr .8fr 1fr 1fr 1fr .8fr;--colsm:1fr auto"><span>Сделка</span><span class="hm r">Размер</span><span class="hm r">Вход</span><span class="hm r">Выход</span><span class="hm">Закрыта</span><span class="r">Результат</span></div>${rows}</div></section></div>`
;
}
/* ── rank ─────────────────────────────────────────────── */
function rank() {
  const me = ['Вы', Math.round(equity())], all = [...RIVALS, me].sort((a, b) => b[1] - a[1]), pos = all.findIndex((x) => x === me) + 1;
  return head('Рейтинг', `Вы на ${pos}-м месте из ${all.length} по капиталу за месяц`) + `<section class="card"><div class="tbl">${all.map((x, i) => `<div class="tr ${x === me ? 'me' : ''}" style="--cols:48px 1fr auto"><b>${i + 1}</b><span>${x === me ? '<b>Вы</b>' : esc(x[0])}</span><b class="r">${usd(x[1], 0)}</b></div>`).join('')}</div></section>`;
}

/* ── actions ──────────────────────────────────────────── */
const levelBefore = () => level();
function finishLesson(l) { const lv = levelBefore(); l.done = true; toast(level() > lv ? `Урок пройден! Новый уровень: ${level()}` : `Урок пройден: +${XP} XP`); }
const ACT = {
  sym(d) { sym = d.v; render(); }, dir(d) { dir = d.v; render(); }, goLearn() { go('learn'); }, goPractice() { go('practice'); },
  pct(d) { size = Math.floor(freeCash() * +d.v / 100); $('#f-size').value = size; drawRisk(); },
  open() {
    if (!(size >= 1)) return toast('Укажите размер сделки');
    if (size > freeCash()) return toast('Не хватает свободных средств');
    const cur = price(sym), long = dir === 'long', f = (pc) => cur * (1 + (long ? 1 : -1) * pc / 100);
    POS.push({ id: nextPos++, sym, dir, size, entry: cur, sl: useSl ? f(-sl) : null, tp: useTp ? f(tp) : null });
    const task = LES.find((l) => l.task && !l.done); if (task && useSl) finishLesson(task); else toast(`${sym}: позиция открыта`);
    render();
  },
  close(d) { closePos(POS.find((p) => p.id === +d.id), 'вручную'); render(); },
  quiz(d) {
    const l = LES.find((x) => x.id === +d.id);
    modal(`<h2>${l.t}</h2><p>${l.q}</p><div class="opts">${l.o.map((o, i) => `<button data-act="ans" data-id="${l.id}" data-i="${i}">${o}</button>`).join('')}</div>`);
  },
  ans(d) { const l = LES.find((x) => x.id === +d.id); if (+d.i === l.a) { closeModal(); finishLesson(l); render(); } else toast('Не совсем. Подумайте ещё раз'); },
};
setInterval(() => {
  if (document.hidden) return;
  RIVALS.forEach((r) => { r[1] = Math.max(1000, Math.round(r[1] * (1 + (Math.random() - .48) * .004))); });
  if (page === 'rank' && !$('#scrim')) render();
}, 3000);
render();
</script>
</body>
</html>
