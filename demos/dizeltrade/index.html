<style>
/* Shared kit for the Showroom demos. Inlined into each demo by tools/build-demos.mjs.

:root {
  --bg: #0b0c0a; --surface: #121311; --raised: #1a1c18; --hover: #1f211c;
  --border: #242620; --rule: #1b1d19;
  --text: #f0f1ec; --muted: #a2a59a; --faint: #82857a;
  --accent: #c8f03c; --accent-ink: #0b0c0a;
  --pos: #4ccb86; --neg: #f0645f; --warn: #e8b04b;
  --pos-bg: rgba(76,203,134,.13); --neg-bg: rgba(240,100,95,.14); --warn-bg: rgba(232,176,75,.14); --neutral-bg: rgba(255,255,255,.07);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;

:root[data-theme="light"] {

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* demo notice */

.notice b { color: var(--text); font-weight: 600; }

/* shell */

.side { position: sticky; top: 0; height: calc(100svh - 29px); display: flex; flex-direction: column; padding: 18px 12px 14px; border-right: 1px solid var(--border); background: var(--surface); }

.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.head h1 { font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.head p { color: var(--muted); margin-top: 2px; }

.finding span { flex: 1; min-width: 0; }

/* table as grid: .tbl > .tr (set --cols on .tbl) */
.tbl { width: 100%; }
.tr { display: grid; grid-template-columns: var(--cols); gap: 12px; align-items: center; min-height: 48px; padding: 6px 12px; margin: 0 -12px; border-radius: 8px; transition: background-color .15s; }
.tr:not(.th):hover { background: var(--hover); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
.pill.pos { background: var(--pos-bg); color: var(--pos); } .pill.neg { background: var(--neg-bg); color: var(--neg); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--raised); font-weight: 500; cursor: pointer; transition: transform .12s var(--ease), background-color .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--raised); margin-bottom: var(--gap); }
.tabs button { height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }

.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }

.bar.thick { height: 10px; border-radius: 5px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); outline: none; transition: border-color .15s; }
.field textarea { height: 80px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 40; animation: fade .18s ease both; }
.modal { width: 100%; max-width: 440px; max-height: 92svh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; animation: pop .22s var(--ease) both; }
.modal h2 { font-size: 18px; margin-bottom: 4px; letter-spacing: -.01em; } .modal > p { color: var(--muted); margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* charts */
.chart { width: 100%; }
.chart text { font: 12px var(--font); fill: var(--faint); }
.chart .grid-l { stroke: var(--rule); stroke-width: 1; }
.chart .tip { pointer-events: none; }

/* phone: sidebar becomes a bottom tab bar */
.tabbar { display: none; }
@media (max-width: 899px) {

  .side { display: none; }
  .main { padding: 18px 16px 96px; }

  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); cursor: pointer; position: relative; }
  .tabbar a.on { color: var(--text); }
  .tabbar a.on .ic { color: var(--accent); }
  .tabbar .count { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; }
  .head h1 { font-size: 22px; }
  .kpis { gap: 24px; }
  .kpi b { font-size: 24px; }
  .hm { display: none !important; }
  .finding { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.brow { margin-bottom: 14px; } .brow:last-child { margin-bottom: 0; }
.brow-t { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.brow-t em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 6px; }
.brow-t b { font-weight: 600; }
@media (max-width: 899px) { .tr { grid-template-columns: var(--colsm, var(--cols)); } }

:root { --display: "Unbounded", "Onest", system-ui, sans-serif; --accent: #c8f03c; }
.big, .kpi b { font-weight: 600; }
.tank-wrap { display: flex; gap: 22px; align-items: stretch; }
.tank { flex: none; }
.tank-list { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-width: 0; }
.tank-list dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; }
.tank-list dt { color: var(--muted); } .tank-list dd { text-align: right; font-weight: 600; }
.trip { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; }
.trip + .trip { border-top: 1px solid var(--rule); }
.trip-ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--raised); color: var(--accent); }
.trip b { display: block; font-weight: 600; } .trip span { color: var(--muted); font-size: 13px; }
.load { display: inline-flex; align-items: center; gap: 8px; }
@media (max-width: 899px) { .trip { grid-template-columns: 36px 1fr; } .trip .btn { grid-column: 2; justify-self: start; } .tank-wrap { flex-direction: row; } }
</style>

const NS = 'http://www.w3.org/2000/svg';
const charts = [];
function chart(el, draw) {

const niceMax = (m) => { const mag = 10 ** Math.floor(Math.log10(m)); for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k * mag >= m * 1.02) return k * mag; return 10 * mag; };

/* bars: values with a marked bar; labels under, 3 faint gridlines */
function barsSVG(w, { labels, values, mark = values.length - 1, h = 190, fmtV = fmt, unit = '' }) {
  const L = 36, B = 26, T = 8, ph = h - B - T, pw = w - L - 4;
  const max = niceMax(Math.max(...values)), bw = Math.min(46, pw / values.length * 0.56), step = pw / values.length;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = max / 3 * i, y = T + ph - (v / max) * ph; g += `<line class="grid-l" x1="${L}" x2="${w}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtV(v)}</text>`; }
  const bars = values.map((v, i) => {
    const x = L + step * i + (step - bw) / 2, bh = Math.max(2, (v / max) * ph), y = T + ph - bh;
    const on = Array.isArray(mark) ? mark.includes(i) : i === mark;
    return `<g><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--accent)" opacity="${on ? 1 : .38}"><title>${esc(labels[i])}: ${fmtV(v)} ${unit}</title></rect>
      <text x="${x + bw / 2}" y="${h - 8}" text-anchor="middle" ${on ? 'style="fill:var(--text)"' : ''}>${esc(labels[i])}</text>
      ${on ? `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmtV(v)}</text>` : ''}</g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(labels.map((l, i) => l + ' ' + fmtV(values[i])).join(', '))}">${g}${bars}</svg>`;
}
/* line: one series, 2px, no markers, end value labelled */
function lineSVG(w, { labels, values, h = 190, fmtV = fmt, xAt }) {
  const L = 44, B = 26, T = 12, R = 44, ph = h - B - T, pw = w - L - R;
  const max = niceMax(Math.max(...values)), n = values.length;
  const X = (i) => L + (pw * i) / (n - 1), Y = (v) => T + ph - (v / max) * ph;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = max / 3 * i, y = Y(v); g += `<line class="grid-l" x1="${L}" x2="${w - R + 20}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtV(v)}</text>`; }
  const d = values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const xs = (xAt || labels.map((_, i) => i)).map((i) => `<text x="${X(i)}" y="${h - 8}" text-anchor="middle">${esc(labels[i])}</text>`).join('');
  const last = values[n - 1];
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc('Динамика: ' + labels.map((l, i) => l + ' ' + fmtV(values[i])).join(', '))}">${g}<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${X(n - 1) + 8}" y="${Y(last) + 4}" style="fill:var(--text);font-weight:600">${fmtV(last)}</text>${xs}</svg>`;
}
/* ring: progress with the total inside */
function ringSVG(size, { value, label, sub }) {
  const r = size / 2 - 8, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label + ' ' + (sub || ''))}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--raised)" stroke-width="8"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c * value} ${c}" transform="rotate(-90 ${size / 2} ${size / 2})"/>
    <text x="50%" y="${sub ? '48%' : '52%'}" text-anchor="middle" style="font:700 ${size / 4.4}px var(--display);fill:var(--text)">${esc(label)}</text>${sub ? `<text x="50%" y="62%" text-anchor="middle" style="font:12px var(--font);fill:var(--muted)">${esc(sub)}</text>` : ''}</svg>`;
}
const barRow = (label, pct, right, sub) => `<div class="brow"><div class="brow-t"><span>${label}${sub ? ` <em>${sub}</em>` : ''}</span><b>${right}</b></div><div class="bar"><i style="width:${Math.max(0, Math.min(100, pct))}%"></i></div></div>`;

    `<div class="kpis"><div class="kpi"><b>${fmt(S.months.reduce((s, m) => s + m[1], 0))}<small>куб</small></b><span>Отгружено с января</span></div>
      <div class="kpi"><b>${best[0]}<small>${best[1]} куб</small></b><span>Лучший месяц</span></div>
      <div class="kpi"><b>${fmt(avgPrice())}<small>₽/куб</small></b><span>Средняя цена продажи</span></div></div>
    <div class="grid"><section class="card c8"><div class="card-h"><h2>Отгрузки, куб в месяц</h2></div><div id="ch-line"></div></section>
      <section class="card c4"><div class="card-h"><h2>Выручка по клиентам</h2><span>млн ₽</span></div>
        ${[...S.orders].sort((a, b) => b.delivered * b.price - a.delivered * a.price).map((o) => barRow(esc(o.client), (o.delivered * o.price) / (Math.max(...S.orders.map((x) => x.delivered * x.price))) * 100, mln(o.delivered * o.price))).join('')}</section>
      <section class="card c12"><div class="card-h"><h2>По месяцам</h2><span>выручка по средней цене</span></div>
        <div class="tbl" style="--cols:1fr 1fr 1fr 1fr;--colsm:1fr 1fr 1fr"><div class="tr th"><span>Месяц</span><span class="r">Куб</span><span class="r">Выручка, млн ₽</span><span class="r hm">К прошлому месяцу</span></div>
        ${rows.map((r) => `<div class="tr"><span>${r.m}${r.m === 'Июн' ? ' <span class="muted">(неполный)</span>' : ''}</span><span class="r">${r.v}</span><span class="r">${mln(r.rev)}</span><span class="r hm ${r.d > 0 ? 'pos' : r.d < 0 ? 'neg' : 'muted'}">${r.d == null ? '—' : signed(r.d) + ' куб'}</span></div>`).join('')}</div></section></div>`;
}

function mountCharts() {
  const labels = S.months.map((m) => m[0]), values = S.months.map((m) => m[1]);
  const a = $('#ch-months'); if (a) chart(a, (w) => barsSVG(w, { labels, values, unit: 'куб' }));
  const b = $('#ch-line'); if (b) chart(b, (w) => lineSVG(w, { labels, values }));
}

/* ── actions ──────────────────────────────────────────── */
const ACT = {
  deliver({ id }) {
    const t = S.trips.find((x) => x.id === +id); t.status = 'done';
    const o = order(t.order); o.transit -= t.vol; o.delivered += t.vol;
    truck(t.truck).status = 'base'; truck(t.truck).last = t.site; truck(t.truck).trips += 1;
    toast(`Доставлено: ${t.vol} куб в ${t.site}`); render();
  },
  confirmRc({ id }) { const r = S.receipts.find((x) => x.id === +id); r.ok = true; toast(`Приёмка принята: +${r.vol} куб на базе`); render(); },
  newReceipt() {
    modal(`<h2>Принял топливо</h2><p>Новая приёмка уйдёт на подтверждение.</p>
      <div class="field"><label>Поставщик</label><select id="f-src"><option>Роснефть-Тында</option><option>Газпромнефть</option><option>Камыш (частник)</option></select></div>
      <div class="field"><label>Объём, куб</label><input id="f-vol" type="number" min="1" max="500" value="100"></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" id="f-ok">Записать</button></div>`, () => {
      $('#f-ok').onclick = () => {
        const vol = +$('#f-vol').value; if (!(vol > 0)) return;
        S.receipts.unshift({ id: Date.now(), src: $('#f-src').value, vol, ttn: 'ТТН-2026-' + (1902 + S.receipts.length - 4), date: TODAY, ok: false, jun: true });
        closeModal(); toast('Приёмка записана, ждёт подтверждения'); render();
      };
    });
  },
  newTrip(data = {}) {
    const free = S.trucks.filter((t) => t.status !== 'transit');
    if (!free.length) { toast('Все машины в рейсе'); return; }
    modal(`<h2>Новый рейс</h2><p>Топливо спишется с базы сразу. Сейчас на базе ${fmt(stock())} куб.</p>
      <div class="field"><label>Машина</label><select id="f-truck">${free.map((t) => `<option value="${t.id}">${esc(t.name)} · бак ${t.tank} куб</option>`).join('')}</select></div>
      <div class="field"><label>Заказ</label><select id="f-order">${S.orders.map((o) => `<option value="${o.id}">${esc(o.client)} · осталось ${fmt(o.total - o.delivered - o.transit)} куб</option>`).join('')}</select></div>
      <div class="field"><label>Объект</label><select id="f-site"></select></div>
      <div class="field"><label>Объём, куб</label><input id="f-vol" type="number" min="1" value="12"><span id="f-err" class="neg" style="font-size:13px"></span></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" id="f-ok">Отправить в рейс</button></div>`, () => {
      const sync = () => {
        const o = order(+$('#f-order').value), t = truck(+$('#f-truck').value);
        $('#f-site').innerHTML = o.sites.map((s) => `<option>${esc(s)}</option>`).join('');
        $('#f-vol').max = t.tank; if (+$('#f-vol').value > t.tank) $('#f-vol').value = t.tank;
      };
      $('#f-order').onchange = sync; $('#f-truck').onchange = sync; sync();
      $('#f-ok').onclick = () => {
        const t = truck(+$('#f-truck').value), o = order(+$('#f-order').value), vol = +$('#f-vol').value, left = o.total - o.delivered - o.transit;
        const err = !(vol > 0) ? 'Укажите объём' : vol > t.tank ? `В бак ${t.name} влезает ${t.tank} куб` : vol > stock() ? `На базе только ${fmt(stock())} куб` : vol > left ? `По заказу осталось ${left} куб` : '';
        if (err) { $('#f-err').textContent = err; return; }
        S.trips.unshift({ id: Date.now(), truck: t.id, order: o.id, site: $('#f-site').value, vol, date: TODAY, status: 'transit' });
        t.status = 'transit'; o.transit += vol; S.shippedJun += vol;
        closeModal(); toast(`${t.name} выехала: ${vol} куб`); render();
      };
    });
  },
};
function openOrder(id) {
  const o = order(id), trips = S.trips.filter((t) => t.order === id);
  modal(`<h2>${esc(o.client)}</h2><p>Заказ от ${o.date} · ${fmt(o.price)} ₽/куб · ${fmt(o.total * o.price)} ₽</p>
    <div class="brow-t"><span>Доставлено</span><b>${fmt(o.delivered)} из ${fmt(o.total)} куб</b></div><div class="bar thick" style="margin-bottom:6px"><i style="width:${pctOf(o.delivered, o.total)}%"></i></div>
    <p class="muted" style="margin:0 0 14px">${o.transit ? `В пути ${o.transit} куб · ` : ''}осталось отгрузить ${fmt(o.total - o.delivered - o.transit)} куб</p>
    ${trips.length ? trips.map((t) => `<div class="trip" style="grid-template-columns:1fr auto"><div><b>${esc(truck(t.truck).name)} → ${esc(t.site)}</b><span>${t.date} · ${t.vol} куб</span></div><span class="pill ${t.status === 'transit' ? 'warn' : 'pos'}"><i></i>${t.status === 'transit' ? 'В рейсе' : 'Доставлен'}</span></div>`).join('') : '<p class="muted">Рейсов пока нет.</p>'}
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button></div>`);
}

render();
</script>
</body>
</html>
