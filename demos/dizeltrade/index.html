<style>
/* Shared kit for the Showroom demos. Inlined into each demo by tools/build-demos.mjs.
   Per-demo files set the tokens (colour, fonts); everything here reads them. */
:root {
  --bg: #0b0c0a; --surface: #121311; --raised: #1a1c18; --hover: #1f211c;
  --border: #242620; --rule: #1b1d19;
  --text: #f0f1ec; --muted: #a2a59a; --faint: #82857a;
  --accent: #c8f03c; --accent-ink: #0b0c0a;
  --pos: #4ccb86; --neg: #f0645f; --warn: #e8b04b;
  --pos-bg: rgba(76,203,134,.13); --neg-bg: rgba(240,100,95,.14); --warn-bg: rgba(232,176,75,.14); --neutral-bg: rgba(255,255,255,.07);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --radius: 10px; --radius-s: 6px;
  --side: 232px; --pad: 28px; --gap: 16px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f3f0; --surface: #ffffff; --raised: #f6f6f3; --hover: #eeeeea;
  --border: #e4e4de; --rule: #efefea;
  --text: #15160f; --muted: #5d6056; --faint: #6f7266;
  --pos: #1e7a4c; --neg: #b8302b; --warn: #8a5a0a;
  --pos-bg: #dcf5e6; --neg-bg: #fde8e6; --warn-bg: #fbefd2; --neutral-bg: #ecece7;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* demo notice */
.notice { display: flex; justify-content: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
.notice b { color: var(--text); font-weight: 600; }

/* shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100svh - 29px); }
.side { position: sticky; top: 0; height: calc(100svh - 29px); display: flex; flex-direction: column; padding: 18px 12px 14px; border-right: 1px solid var(--border); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark .ic { width: 18px; height: 18px; stroke-width: 2; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { padding: 16px 10px 6px; font-size: 12px; color: var(--faint); }
.nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.nav a:hover { background: var(--hover); color: var(--text); }
.nav a.on { background: var(--raised); color: var(--text); }
.nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; font-size: 12px; font-weight: 600; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; border-top: 1px solid var(--border); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; background: var(--raised); color: var(--text); }
.who { min-width: 0; } .who b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .who span { font-size: 12px; color: var(--muted); }

.main { min-width: 0; padding: var(--pad) var(--pad) 48px; max-width: 1320px; width: 100%; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.head h1 { font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.head p { color: var(--muted); margin-top: 2px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* finding line: the one thing that needs attention */
.finding { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: var(--gap); border-radius: var(--radius); background: var(--warn-bg); color: var(--text); }
.finding .ic { color: var(--warn); }
.finding span { flex: 1; min-width: 0; }
.finding .btn { flex: none; }

/* grid + cards */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h2 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.card-h span { color: var(--muted); font-size: 12px; }
.kpis { display: flex; gap: 40px; margin-bottom: 22px; flex-wrap: wrap; }
.kpi b { display: block; font: 700 30px/1.1 var(--display); letter-spacing: -.02em; }
.kpi b small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi span { color: var(--muted); font-size: 13px; }
.big { font: 700 44px/1 var(--display); letter-spacing: -.03em; }
.big small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.muted { color: var(--muted); } .pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); } .acc { color: var(--accent); } .r { text-align: right; }

/* table as grid: .tbl > .tr (set --cols on .tbl) */
.tbl { width: 100%; }
.tr { display: grid; grid-template-columns: var(--cols); gap: 12px; align-items: center; min-height: 48px; padding: 6px 12px; margin: 0 -12px; border-radius: 8px; transition: background-color .15s; }
.tr:not(.th):hover { background: var(--hover); }
.tr[data-open] { cursor: pointer; }
.th { min-height: 32px; font-size: 12px; color: var(--faint); }
.tr + .tr { box-shadow: 0 -1px 0 var(--rule); }
.tr.th + .tr { box-shadow: none; }
.cell-main b { display: block; font-weight: 600; } .cell-main span { font-size: 12px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
.pill.pos { background: var(--pos-bg); color: var(--pos); } .pill.neg { background: var(--neg-bg); color: var(--neg); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--raised); font-weight: 500; cursor: pointer; transition: transform .12s var(--ease), background-color .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--raised); margin-bottom: var(--gap); }
.tabs button { height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.tabs button.on { background: var(--surface); color: var(--text); font-weight: 500; }
:root[data-theme="light"] .tabs button.on { box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s var(--ease); }
.bar.thick { height: 10px; border-radius: 5px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); outline: none; transition: border-color .15s; }
.field textarea { height: 80px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 40; animation: fade .18s ease both; }
.modal { width: 100%; max-width: 440px; max-height: 92svh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; animation: pop .22s var(--ease) both; }
.modal h2 { font-size: 18px; margin-bottom: 4px; letter-spacing: -.01em; } .modal > p { color: var(--muted); margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.snack { position: fixed; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; max-width: min(380px, calc(100vw - 32px)); padding: 12px 8px 12px 16px; border-radius: 6px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; opacity: 0; transform: translateY(12px); transition: opacity .2s, transform .25s var(--ease); pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.snack.show { opacity: 1; transform: none; pointer-events: auto; }
.snack button { flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: inherit; opacity: .65; cursor: pointer; font: inherit; } .snack button:hover { opacity: 1; }
.fxbar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; padding: 9px 16px; text-align: center; font-weight: 600; font-size: 13px; background: var(--accent); color: var(--accent-ink); transform: translateY(-100%); transition: transform .25s var(--ease); pointer-events: none; }
.fxbar.show { transform: none; }
.corner { position: fixed; top: 52px; right: 16px; width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; }
.cn { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,.28); opacity: 0; transform: translateX(24px); transition: opacity .22s, transform .26s var(--ease); }
.cn.show { opacity: 1; transform: none; }
.cn i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); } .cn small { color: var(--faint, var(--muted)); font-size: 11px; }
.flash { position: fixed; z-index: 70; transform: translate(-50%, calc(-100% + 6px)); padding: 7px 12px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .15s, transform .2s var(--ease); pointer-events: none; text-align: center; }
.flash::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: inherit; transform: translateX(-50%) rotate(45deg); }
.flash.show { opacity: 1; transform: translate(-50%, -100%); }
.push { position: fixed; top: 10px; left: 50%; width: min(380px, calc(100vw - 20px)); z-index: 70; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 11px 14px; border-radius: 18px; background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: var(--text); border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,.28); transform: translate(-50%, -140%); transition: transform .35s var(--ease); pointer-events: none; }
.push.show { transform: translate(-50%, 0); }
.push i { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-weight: 800; }
.push b { display: block; font-size: 13px; } .push span { display: block; font-size: 13px; color: var(--muted); } .push small { align-self: start; color: var(--faint, var(--muted)); font-size: 11px; }
@media (max-width: 899px) { .snack { bottom: 76px; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* charts */
.chart { width: 100%; }
.chart text { font: 12px var(--font); fill: var(--faint); }
.chart .grid-l { stroke: var(--rule); stroke-width: 1; }
.chart .tip { pointer-events: none; }

/* phone: sidebar becomes a bottom tab bar */
.tabbar { display: none; }
@media (max-width: 899px) {
  :root { --pad: 16px; }
  .app { display: block; }
  .side { display: none; }
  .main { padding: 18px 16px 96px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); cursor: pointer; position: relative; }
  .tabbar a.on { color: var(--text); }
  .tabbar a.on .ic { color: var(--accent); }
  .tabbar .count { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; }
  .head h1 { font-size: 22px; }
  .kpis { gap: 24px; }
  .kpi b { font-size: 24px; }
  .hm { display: none !important; }
  .finding { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.brow { margin-bottom: 14px; } .brow:last-child { margin-bottom: 0; }
.brow-t { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }

@media (max-width: 899px) { .tr { grid-template-columns: var(--colsm, var(--cols)); } }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.split { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; margin: 4px 0 16px; } .split i { display: block; height: 100%; }
.help dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin-bottom: 16px; } .help dt kbd { font: 12px var(--font); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; } .help dd { color: var(--muted); }

@media (max-width: 1180px) { .kgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 899px) {
  .topbar { padding: 0 12px 0 16px; } .tb-brand { display: flex; } .tb-ctx { display: none; } .ub { padding: 3px; border: 0; background: none; } .ub > div { display: none; }
  .kgrid, .kgrid.k4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .search kbd { display: none; } .search { max-width: none; }

function notes() {
  const L = [], st = stock();
  if (st < REORDER) { const t = ix().L.reduce((a, r, i, X) => (r.bal < REORDER && (!i || X[i - 1].bal >= REORDER) ? r.t : a), now()); L.push({ key: 'low' + t, sev: 'neg', t, title: 'Low base stock', text: `${fmt(st)} m³ in the tank, below the ${fmt(REORDER)} m³ reorder level.`, go: 'base' }); }
  pendingRc().forEach((r) => L.push({ key: 'rc' + r.id, sev: 'warn', t: r.t, title: 'Receipt awaiting confirmation', text: `${r.no} from ${r.sup}, ${fmtD(r.v15, 1)} m³ at 15 °C.`, go: 'base' }));
  if (can('fleet')) S.maint.filter((m) => mst(m) === 'over' || m.due - TODAY <= 7).forEach((m) => L.push({ key: 'mt' + m.id + ':' + m.due, sev: m.due < TODAY ? 'neg' : 'warn', t: Math.min(now(), (m.due - 7) * 1440 + 360), title: m.due < TODAY ? 'Maintenance overdue' : 'Maintenance due this week', text: `${TRK(m.truck).name} (${TRK(m.truck).plate}): ${m.kind}, due ${fd(m.due)}.`, go: 'fleet' }));
  if (can('finance')) {
    const od = overdueInv(); if (od.length) L.push({ key: 'od' + od.length, sev: 'warn', t: TODAY * 1440 + 360, title: `${plural(od.length, 'invoice')} overdue`, text: `${eur(od.reduce((s, i) => s + openOf(i), 0))} past the due date.`, go: 'finance' });
    S.cust.filter((c) => balOf(c) > c.limit).forEach((c) => L.push({ key: 'cl' + c.id, sev: 'neg', t: TODAY * 1440 + 362, title: 'Credit limit exceeded', text: `${c.name}: ${eur0(balOf(c))} of ${eur0(c.limit)}.`, go: 'customers' }));
  }
  return L.concat(EVN).sort((a, b) => b.t - a.t);
}

function chrome() {
  const cnt = { orders: S.orders.filter((o) => ['confirmed', 'partial'].includes(ost(o))).length, base: pendingRc().length, fleet: maintOver().length, finance: can('finance') ? overdueInv().length : 0 };
  const item = (k) => { const [label, icon] = PAGES[k], locked = PAGE_PERM[k] && !can(PAGE_PERM[k]); return `<a data-page="${k}" role="link" tabindex="0" ${page === k ? 'aria-current="page"' : ''}>${ic(icon)}<span>${label}</span>${locked ? `<span class="lk" title="Not available for your role">${ic('lock')}</span>` : cnt[k] ? `<span class="count" title="Needs attention">${cnt[k]}</span>` : ''}</a>`; };
  $('#nav').innerHTML = item('dashboard') + '<div class="nav-label">Operations</div>' + ['orders', 'base', 'fleet'].map(item).join('') + '<div class="nav-label">Finance</div>' + ['customers', 'finance'].map(item).join('') + '<div class="nav-label">Insights</div>' + ['analytics', 'audit'].map(item).join('');
  const tb = [['dashboard', 'Home', 'home'], ['orders', 'Orders', 'box'], ['base', 'Stock', 'drop'], ['customers', 'Customers', 'users']];
  $('#tabbar').innerHTML = tb.map(([k, l, i]) => `<a data-page="${k}" role="link" tabindex="0">${ic(i)}<span>${l}</span>${cnt[k] ? `<b class="count">${cnt[k]}</b>` : ''}</a>`).join('') + `<a data-act="more" role="button" tabindex="0" class="${['fleet', 'finance', 'analytics', 'audit'].includes(page) ? 'on' : ''}">${ic('more')}<span>More</span></a>`;
  const u = USERS[me], un = notes().filter((n) => !READ.has(n.key)).length;
  $('#ub').innerHTML = `<span class="avatar">${u.ini}</span><div><b>${esc(u.name)}</b><small>${u.role}</small></div>`;
  $('#ub').setAttribute('aria-label', `Account menu, ${u.name}, ${u.role}`);
  $('#bell').innerHTML = ic('bell') + (un ? `<span class="dot">${un > 9 ? '9+' : un}</span>` : '');
  $('#bell').setAttribute('aria-label', `Notifications, ${un} unread`);
  ctx();
  setNav(page);
}

/* ── tables: search, filter chips, sort, paging, selection, export ── */
const TS = {}, TC = {}, PS = 15;
function table(cfg) {
  TC[cfg.key] = cfg;
  const st = TS[cfg.key] || (TS[cfg.key] = { q: '', sort: cfg.sort, dir: cfg.dir || -1, page: 0, f: 'all', sel: new Set() });
  const all = cfg.rows();
  const chips = cfg.filters ? `<div class="chips" role="group" aria-label="Filter ${cfg.noun}">${cfg.filters.map(([id, label, fn]) => `<button type="button" class="chip ${st.f === id ? 'on' : ''}" aria-pressed="${st.f === id}" data-chip="${cfg.key}:${id}">${label}<span>${fmt(all.filter(fn).length)}</span></button>`).join('')}</div>` : '';
  return `<div class="toolbar"><label class="search">${ic('search')}<span class="sr">Search ${cfg.noun}</span><input type="search" data-q="${cfg.key}" value="${esc(st.q)}" placeholder="${cfg.ph}" autocomplete="off"><kbd aria-hidden="true">/</kbd></label><span class="sp"></span>${cfg.tools || ''}${cfg.csv ? `<button type="button" class="btn" data-act="export" data-key="${cfg.key}">${ic('download')}Export CSV</button>` : ''}</div>${chips}<div id="tb-${cfg.key}">${tbody(cfg.key)}</div>`;
}
function tbody(key) {
  const cfg = TC[key], st = TS[key];
  let rows = cfg.rows();
  const f = cfg.filters && cfg.filters.find((x) => x[0] === st.f); if (f) rows = rows.filter(f[2]);
  const q = st.q.trim().toLowerCase(); if (q) rows = rows.filter((r) => cfg.text(r).toLowerCase().includes(q));
  const col = cfg.cols.find((c) => c.k === st.sort);
  if (col && col.v) rows = rows.map((r) => [col.v(r), r]).sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0) * st.dir).map((x) => x[1]);
  st.vis = rows;
  const total = rows.length, pages = Math.max(1, Math.ceil(total / PS)); st.page = Math.max(0, Math.min(st.page, pages - 1));
  const view = rows.slice(st.page * PS, st.page * PS + PS), bulk = cfg.bulk;
  const cols = (bulk ? '22px ' : '') + cfg.cols.map((c) => c.w).join(' '), colsm = (bulk ? '22px ' : '') + cfg.cols.filter((c) => !c.hm).map((c) => c.wm || c.w).join(' ');
  if (!total) return `<div class="empty">${ic(q ? 'search' : 'list')}<b>${q ? `No ${cfg.noun} match “${esc(st.q)}”` : `No ${cfg.noun} here yet`}</b><span>${q || st.f !== 'all' ? 'Try a different search or filter.' : cfg.emptyText || ''}</span>${q || st.f !== 'all' ? `<button type="button" class="btn sm" data-act="clearFilters" data-key="${key}">Clear search and filters</button>` : ''}</div>`;
  const allSel = view.length && view.every((r) => st.sel.has(r.id));
  const th = `<div class="tr th">${bulk ? `<span class="ck"><input type="checkbox" data-ckall="${key}" ${allSel ? 'checked' : ''} aria-label="Select all on this page"></span>` : ''}${cfg.cols.map((c) => `<span class="${c.cls || ''} ${c.hm ? 'hm' : ''}" ${c.v ? `aria-sort="${st.sort === c.k ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'}"` : ''}>${c.v ? `<button type="button" class="sort ${st.sort === c.k ? 'on' : ''}" data-sort="${key}:${c.k}">${c.l}${ic(st.sort === c.k && st.dir > 0 ? 'up' : 'down')}</button>` : c.l}</span>`).join('')}</div>`;
  const tr = view.map((r) => `<div class="tr ${st.sel.has(r.id) ? 'sel' : ''}" ${cfg.open ? `data-row="${key}" data-rid="${r.id}" tabindex="0"` : ''}>${bulk ? `<span class="ck"><input type="checkbox" data-ck="${key}:${r.id}" ${st.sel.has(r.id) ? 'checked' : ''} aria-label="Select ${esc(cfg.label(r))}"></span>` : ''}${cfg.cols.map((c) => `<span class="${c.cls || ''} ${c.hm ? 'hm' : ''}">${c.c(r)}</span>`).join('')}</div>`).join('');
  const bar = bulk && st.sel.size ? `<div class="bulk" role="region" aria-label="Bulk actions"><b>${plural(st.sel.size, 'selected', 'selected')}</b>${bulk.map(([op, label, p]) => p ? gb(p, label, `data-act="bulk" data-key="${key}" data-op="${op}"`, 'btn sm') : `<button type="button" class="btn sm" data-act="bulk" data-key="${key}" data-op="${op}">${label}</button>`).join('')}<button type="button" class="btn sm" data-act="clearSel" data-key="${key}">Clear</button></div>` : '';
  return `${bar}<div class="tbl" role="table" aria-label="${cfg.noun}" style="--cols:${cols};--colsm:${colsm}">${th}${tr}</div>
    <div class="pager"><span>${fmt(st.page * PS + 1)}–${fmt(Math.min(total, st.page * PS + PS))} of ${fmt(total)}</span><div><button type="button" class="btn sm" data-pg="${key}:-1" ${st.page ? '' : 'disabled'} aria-label="Previous page">${ic('left')}</button><span>Page ${st.page + 1} of ${pages}</span><button type="button" class="btn sm" data-pg="${key}:1" ${st.page < pages - 1 ? '' : 'disabled'} aria-label="Next page">${ic('right')}</button></div></div>`;
}
const refresh = (key) => { const el = $('#tb-' + key); if (el) el.innerHTML = tbody(key); };
function csv(name, headRow, rows) {
  const q = (v) => { const s = String(v == null ? '' : v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const url = URL.createObjectURL(new Blob(['﻿' + [headRow, ...rows].map((r) => r.map(q).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
  A(now(), me, 'Export', `Exported ${plural(rows.length, 'row')} to ${name}`); S.audit.sort((a, b) => b.t - a.t);
  toast(`Exported ${plural(rows.length, 'row')} to ${name}`);
}

/* ── map ─────────────────────────────────────────────── */
const PX = (lo, la) => [320 + (lo - 12.37) * 50.4, 122 - (la - 51.34) * 80];
const MAJOR = new Set(['Berlin', 'Hanover', 'Frankfurt', 'Nuremberg', 'Wrocław', 'Poznań', 'Prague', 'Brno', 'Dresden']);
const LBL = { Dresden: [11, 4, 'start'], Chemnitz: [-11, 4, 'end'], 'Ústí nad Labem': [11, 12, 'start'], Liberec: [11, 4, 'start'], 'Plzeň': [-11, 4, 'end'], Erfurt: [-11, 4, 'end'], Magdeburg: [-11, 4, 'end'], Kassel: [0, -12, 'middle'] };
const posOn = (city, p) => { const a = PX(...HUB), b = PX(...CITY[city]); return [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p]; };
function mapSVG() {
  const trs = transit(), on = new Set(trs.map((t) => OR(t.order).site));
  const [hx, hy] = PX(...HUB);
  const border = `<path class="bd" d="M${PX(14.8, 50.87).join(',')} L${PX(15.04, 51.27).join(',')} L${PX(14.6, 52.6).join(',')} L${PX(14.2, 53.4).join(',')}"/><path class="bd" d="M${PX(12.1, 50.3).join(',')} L${PX(13.0, 50.45).join(',')} L${PX(14.3, 50.88).join(',')} L${PX(14.8, 50.87).join(',')} L${PX(16.3, 50.66).join(',')} L${PX(18.3, 49.9).join(',')}"/><path class="bd" d="M${PX(12.1, 50.3).join(',')} L${PX(12.5, 49.7).join(',')} L${PX(13.8, 48.8).join(',')}"/>`;
  const sites = Object.entries(CITY).map(([n, [lo, la]]) => {
    const [x, y] = PX(lo, la), a = on.has(n), [dx, dy, an] = LBL[n] || [0, y < hy ? -12 : 22, 'middle'];
    return `<line class="rt ${a ? 'on' : ''}" x1="${hx}" y1="${hy}" x2="${x}" y2="${y}"/><circle class="site ${a ? 'on' : ''}" cx="${x}" cy="${y}" r="${a ? 7 : 5}"><title>${n} · ${kmTo(n)} km</title></circle>${a || MAJOR.has(n) ? `<text x="${x + dx}" y="${y + dy}" text-anchor="${an}" ${a ? 'style="fill:var(--text)"' : ''}>${n === 'Ústí nad Labem' ? 'Ústí n. L.' : n}</text>` : ''}`;
  }).join('');
  return `<svg class="map" viewBox="0 0 640 320" role="img" aria-label="Map of trips on the road from Leipzig base">${border}${sites}<circle class="hub" cx="${hx}" cy="${hy}" r="10"/><text x="${hx}" y="${hy - 16}" text-anchor="middle" style="fill:var(--text);font-weight:600">Leipzig base</text>
    ${trs.map((t) => { const [x, y] = posOn(OR(t.order).site, t.p); return `<g data-mk="${t.id}" transform="translate(${x} ${y})"><circle class="pulse" r="9"/><circle class="mk" r="8"/><title>${esc(TRK(t.truck).name)} → ${OR(t.order).site}</title></g>`; }).join('')}</svg>`;
}
function tankSVG(level) {
  const W = 84, H = 210, y0 = 6, ph = H - 12, fill = ph * Math.max(0, Math.min(1, level)), ry = y0 + ph * (1 - REORDER / CAP);
  const ticks = [0.25, 0.5, 0.75].map((t) => `<line x1="10" x2="26" y1="${y0 + ph * (1 - t)}" y2="${y0 + ph * (1 - t)}" stroke="var(--border)" stroke-width="2"/>`).join('');
  return `<svg class="tank" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${Math.round(level * 100)}% full of ${fmt(CAP)} m³">
    <rect x="1" y="${y0}" width="${W - 2}" height="${ph}" rx="14" fill="var(--raised)" stroke="var(--border)" stroke-width="2"/>
    <clipPath id="tk"><rect x="1" y="${y0}" width="${W - 2}" height="${ph}" rx="14"/></clipPath>
    <rect x="0" y="${y0 + ph - fill}" width="${W}" height="${fill}" fill="${level * CAP < REORDER ? 'var(--warn)' : 'var(--accent)'}" clip-path="url(#tk)" style="transition:y .6s var(--ease),height .6s var(--ease)"/>
    ${ticks}<line x1="1" x2="${W - 1}" y1="${ry}" y2="${ry}" stroke="var(--neg)" stroke-width="1.5" stroke-dasharray="4 3"><title>Reorder level ${fmt(REORDER)} m³</title></line></svg>`;
}

/* ── charts ──────────────────────────────────────────── */
function comboSVG(w, { labels, bars, line, h = 230 }) {
  const L = 46, R = 42, T = 16, B = 26, ph = h - T - B, pw = w - L - R, n = labels.length, step = pw / n, bw = Math.min(42, step * .5);
  const bmax = niceMax(Math.max(...bars)), lmax = Math.max(10, Math.ceil(Math.max(...line) / 2) * 2 + 2);
  let g = '';
  for (let i = 0; i <= 3; i++) { const y = T + ph - ph * i / 3; g += `<line class="grid-l" x1="${L}" x2="${w - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmt(bmax * i / 3)}</text><text x="${w - R + 8}" y="${y + 4}">${fmtD(lmax * i / 3, 0)}%</text>`; }
  const cx = (i) => L + step * i + step / 2, ly = (v) => T + ph - v / lmax * ph;
  const b = bars.map((v, i) => { const bh = Math.max(2, v / bmax * ph); return `<rect x="${cx(i) - bw / 2}" y="${T + ph - bh}" width="${bw}" height="${bh}" rx="2" fill="var(--accent)" opacity="${i === n - 1 ? .55 : .9}"><title>${labels[i]}: ${fmt(v)} m³ delivered</title></rect><text x="${cx(i)}" y="${h - 8}" text-anchor="middle">${labels[i]}</text>`; }).join('');
  const d = line.map((v, i) => `${i ? 'L' : 'M'}${cx(i).toFixed(1)},${ly(v).toFixed(1)}`).join(' ');
  const dots = line.map((v, i) => `<circle cx="${cx(i)}" cy="${ly(v)}" r="3.5" fill="var(--c2)" stroke="var(--surface)" stroke-width="2"><title>${labels[i]}: gross margin ${fmtD(v, 1)}%</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(labels.map((l, i) => `${l}: ${fmt(bars[i])} m³, margin ${fmtD(line[i], 1)}%`).join('; '))}">${g}${b}<path d="${d}" fill="none" stroke="var(--c2)" stroke-width="2" stroke-linejoin="round"/>${dots}</svg>`;
}
function linesSVG(w, { labels, series, h = 210, unit = '' }) {
  const L = 50, R = 16, T = 14, B = 26, ph = h - T - B, pw = w - L - R, n = labels.length, all = series.flatMap((s) => s.v);
  const lo = Math.floor(Math.min(...all) / 50) * 50 - 25, hi = Math.ceil(Math.max(...all) / 50) * 50 + 25;
  const X = (i) => L + pw * i / (n - 1), Y = (v) => T + ph - (v - lo) / (hi - lo) * ph;
  let g = ''; for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3, y = Y(v); g += `<line class="grid-l" x1="${L}" x2="${w - R}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`; }
  const xs = labels.map((l, i) => `<text x="${X(i)}" y="${h - 8}" text-anchor="middle">${l}</text>`).join('');
  const p = series.map((s) => `<path d="${s.v.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${s.col}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ''}/>${s.v.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${s.col}"><title>${s.name}, ${labels[i]}: €${fmt(v)}${unit}</title></circle>`).join('')}`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(series.map((s) => s.name + ': ' + s.v.map((v, i) => labels[i] + ' €' + fmt(v)).join(', ')).join('; '))}">${g}${xs}${p}</svg>`;
}
function stockSVG(w) {
  const h = 200, L = 46, R = 12, T = 12, B = 26, ph = h - T - B, pw = w - L - R, days = 42, L0 = ix().L, pts = [];
  let j = 0, bal = 0;
  for (let d = TODAY - days + 1; d <= TODAY; d++) { const end = d === TODAY ? now() : (d + 1) * 1440; while (j < L0.length && L0[j].t < end) bal = L0[j++].bal; pts.push(bal); }
  const X = (i) => L + pw * i / (days - 1), Y = (v) => T + ph - v / CAP * ph;
  let g = ''; [0, 1000, 2000, CAP].forEach((v) => { g += `<line class="grid-l" x1="${L}" x2="${w - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`; });
  const d = pts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const xs = pts.map((_, i) => ((days - 1 - i) % 7 ? '' : `<text x="${X(i)}" y="${h - 8}" text-anchor="middle">${fds(TODAY - days + 1 + i)}</text>`)).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Base stock, last ${days} days, from ${fmt(pts[0])} to ${fmt(pts[days - 1])} m³">${g}<path d="${d} L${X(days - 1)},${Y(0)} L${X(0)},${Y(0)}Z" fill="var(--accent)" opacity=".1"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <line x1="${L}" x2="${w - R}" y1="${Y(REORDER)}" y2="${Y(REORDER)}" stroke="var(--neg)" stroke-dasharray="5 4"/><text x="${w - R}" y="${Y(REORDER) - 6}" text-anchor="end" style="fill:var(--neg)">Reorder level ${fmt(REORDER)} m³</text>${xs}</svg>`;
}
function mountCharts() {
  const M = monthly();
  const a = $('#ch-months'); if (a) chart(a, (w) => barsSVG(w, { labels: M.map((m) => m.m), values: M.map((m) => m.vol), unit: 'm³' }));
  const b = $('#ch-combo'); if (b) chart(b, (w) => comboSVG(w, { labels: M.map((m) => m.m), bars: M.map((m) => m.vol), line: M.map((m) => m.pct) }));
  const c = $('#ch-price'); if (c) chart(c, (w) => linesSVG(w, { labels: M.map((m) => m.m), unit: '/m³', series: [{ name: 'Average sell price', col: 'var(--accent)', v: M.map((m) => Math.round(m.rev / (m.vol || 1))) }, { name: 'Purchase cost', col: 'var(--c2)', dash: 1, v: COST }] }));
  const s = $('#ch-stock'); if (s) chart(s, stockSVG);

/* ── dashboard ───────────────────────────────────────── */
function dashboard() {
  const st = stock(), pend = pendingRc(), pv = pend.reduce((s, r) => s + r.v15, 0), trs = transit(), today = S.trips.filter((t) => t.status === 'planned' && t.day === TODAY);
  const M = monthly(), jun = M[5], od = overdueInv(), odSum = od.reduce((s, i) => s + openOf(i), 0), u = USERS[me];
  const greet = CLK < 720 ? 'Good morning' : CLK < 1080 ? 'Good afternoon' : 'Good evening';
  const waiting = S.orders.filter((o) => ['confirmed', 'partial'].includes(ost(o)));
  let finding = '';
  if (st < REORDER) finding = `<div class="finding neg" role="alert">${ic('alert')}<span><b>Low base stock.</b> ${fmt(st)} m³ is below the ${fmt(REORDER)} m³ reorder level.${pend.length ? ` Confirming ${pend[0].no} (${fmtD(pend[0].v15, 1)} m³) brings it to ${fmt(st + pv)} m³.` : ' Book a supplier delivery.'}</span>${pend.length ? gb('stock', 'Confirm receipt', `data-act="confirmRc" data-id="${pend[0].id}"`, 'btn sm') : gb('stock', 'Log receipt', 'data-act="newReceipt"', 'btn sm')}</div>`;
  else if (pend.length) finding = `<div class="finding">${ic('alert')}<span>Receipt ${pend[0].no} from ${esc(pend[0].sup)}, ${fmtD(pend[0].v15, 1)} m³ at 15 °C, is awaiting confirmation.</span>${gb('stock', 'Confirm', `data-act="confirmRc" data-id="${pend[0].id}"`, 'btn sm')}</div>`;
  const acts = me === 'accountant' ? `<button type="button" class="btn" data-page="customers">${ic('users')}Customers</button><button type="button" class="btn primary" data-page="finance">${ic('coin')}Open receivables</button>` : `${gb('stock', `${ic('drop')}Log receipt`, 'data-act="newReceipt"')}${gb('orders', `${ic('plus')}New order`, 'data-act="newOrder"', 'btn primary')}`;
  const k5 = can('finance') ? `<button type="button" class="kc ${od.length ? 'alert' : ''}" data-page="finance"><span>Overdue receivables</span><b>${eurC(odSum)}</b><em>${plural(od.length, 'invoice')} past due</em></button>` : `<button type="button" class="kc ${waiting.length ? 'warnk' : ''}" data-page="orders"><span>Awaiting a truck</span><b>${fmt(waiting.length)}<small>${waiting.length === 1 ? 'order' : 'orders'}</small></b><em>${fmt(waiting.reduce((s, o) => s + oq(o).rem, 0))} m³ to schedule</em></button>`;
  const right = can('finance') ? (() => {
    const rows = S.cust.map((c) => [c, overOf(c)]).filter((x) => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 5), mx = rows.length ? rows[0][1] : 1;
    return `<section class="card c5"><div class="card-h"><h2>Overdue by customer</h2><span>${eur0(odSum)} in total</span></div>${rows.length ? rows.map(([c, v]) => barRow(`<a data-act="openCust" data-id="${c.id}" href="#" style="text-decoration:underline;text-decoration-color:var(--border)">${esc(c.name)}</a>`, v / mx * 100, eur0(v), c.cc)).join('') : '<div class="empty"><b>Nothing overdue</b><span>Every invoice is within its payment terms.</span></div>'}</section>`;
  })() : `<section class="card c5"><div class="card-h"><h2>Orders awaiting a truck</h2><span>${plural(waiting.length, 'order')}</span></div>${waiting.length ? waiting.slice(0, 5).map((o) => `<div class="trip"><div class="trip-ic">${ic('box')}</div><div><b>${esc(CU(o.cust).name)}</b><span>${o.no} · ${fmt(oq(o).rem)} m³ to ${esc(o.site)}</span></div>${gb('ops', 'Schedule', `data-act="schedule" data-id="${o.id}"`, 'btn sm')}</div>`).join('') : '<div class="empty"><b>All orders scheduled</b></div>'}</section>`;
  return head(`${greet}, ${esc(u.name.split(' ')[0])}`, `${DL.format(dt(TODAY))} · ${u.role} view`, acts) + finding +
    `<div class="kgrid">
      <button type="button" class="kc ${st < REORDER ? 'warnk' : ''}" data-page="base"><span>Base stock</span><b>${fmt(st)}<small>m³</small></b><em>${pct(st, CAP)}% of ${fmt(CAP)} m³ capacity</em></button>
      <button type="button" class="kc" data-page="fleet"><span>On the road</span><b>${fmt(trs.reduce((s, t) => s + t.vol, 0))}<small>m³</small></b><em>${plural(trs.length, 'trip')} · ${fmt(today.length)} more to load today</em></button>
      <button type="button" class="kc" data-page="orders"><span>Delivered in June</span><b>${fmt(jun.vol)}<small>m³</small></b><em>${plural(jun.n, 'delivery', 'deliveries')} to date</em></button>
      <button type="button" class="kc" data-page="analytics"><span>Revenue in June (net)</span><b>${eurC(jun.rev)}</b><em>Gross margin ${fmtD(jun.pct, 1)}%</em></button>
      ${k5}
    </div>
    <div class="grid">
      <section class="card c5"><div class="card-h"><h2>Base stock</h2><span>tank T1 · capacity ${fmt(CAP)} m³</span></div>
        <div class="tank-wrap">${tankSVG(st / CAP)}
          <div class="tank-list"><div><div class="big">${fmt(st)}<small>m³</small></div><div class="muted" style="margin-top:6px">${pct(st, CAP)}% full · at 15 °C</div></div>
            <dl><dt>Received in June</dt><dd class="pos">${signed(Math.round(S.rc.filter((r) => r.ok && mon(r.day) === 5).reduce((s, r) => s + r.v15, 0)))}</dd><dt>Loaded in June</dt><dd>${signed(-S.trips.filter((t) => loaded(t) && mon(t.day) === 5).reduce((s, t) => s + t.vol, 0))}</dd><dt>Awaiting confirmation</dt><dd class="${pv ? 'warn' : 'muted'}">${pv ? fmtD(pv, 1) : '—'}</dd><dt>Reorder level</dt><dd>${fmt(REORDER)}</dd></dl></div></div>
        <ul class="feedl" aria-label="Latest activity">${S.audit.filter((a) => a.cat !== 'Access' && a.cat !== 'Export').slice(0, 5).map((a) => `<li><b>${Math.floor(a.t / 1440) === TODAY ? hm(a.t % 1440) : fds(Math.floor(a.t / 1440))}</b><span>${esc(a.text)}</span></li>`).join('')}</ul>
      </section>
      <section class="card c7"><div class="card-h"><h2>Trips on the road${trs.length ? ` · ${trs.length}` : ''}</h2><span>${fmt(trs.reduce((s, t) => s + t.vol, 0))} m³ on the road · live</span></div>
        ${mapSVG()}${trs.length ? trs.map((t) => { const o = OR(t.order); return `<div class="trip"><div class="trip-ic">${ic('truck')}</div><div><b>${esc(TRK(t.truck).name)} → ${esc(o.site)}</b><span>${esc(DRV(t.driver).name)} · ${t.vol} m³ · ${esc(CU(o.cust).name)} · ETA ${hm(t.dep + durTo(o.site))}</span><div class="tp"><i data-tp="${t.id}" style="width:${Math.round(t.p * 100)}%"></i></div></div>${gb('ops', `${ic('check')}Delivered`, `data-act="deliver" data-id="${t.id}"`, 'btn sm')}</div>`; }).join('') : `<div class="empty"><b>No trucks on the road</b><span>Every loaded trip has been delivered.</span></div>`}
        ${today.length ? `<div class="sec">Still to load today · ${today.length}</div>${today.map((t) => `<div class="trip"><div class="trip-ic" style="color:var(--warn)">${ic('clock')}</div><div><b>${esc(TRK(t.truck).name)} → ${esc(OR(t.order).site)}</b><span>${t.no} · ${t.vol} m³ · ETD ${hm(t.etd)} · ${esc(DRV(t.driver).name)}</span></div>${gb('ops', 'Load &amp; dispatch', `data-act="dispatch" data-id="${t.id}"`, 'btn sm')}</div>`).join('')}` : ''}
      </section>
      <section class="card c7"><div class="card-h"><h2>Monthly deliveries, m³</h2><span>June to date</span></div><div id="ch-months"></div></section>
      ${right}
    </div>`;
}

/* ── orders ──────────────────────────────────────────── */

/* ── base & stock ────────────────────────────────────── */

  const led = { key: 'ledger', noun: 'ledger entries', ph: 'Search document or counterparty', sort: 't', rows: () => ix().L, open: true, label: (r) => r.doc,

    text: (r) => `${r.no} ${r.sup} ${r.ls}`,
    filters: [['all', 'All', () => true], ['p', 'Awaiting confirmation', (r) => !r.ok], ['ok', 'Confirmed', (r) => r.ok]],
    cols: [
      { k: 't', l: 'Receipt', w: '120px', v: (r) => r.t, c: (r) => `<span class="cell-main"><b>${r.no}</b><span>${fds(r.day)}, ${hm(r.t % 1440)}</span></span>` },
      { k: 'sup', l: 'Supplier', w: 'minmax(0,1.5fr)', v: (r) => r.sup, c: (r) => `<span class="cell-main"><b>${esc(r.sup)}</b><span>Delivery note ${r.ls}</span></span>` },

    ],

/* ── fleet ───────────────────────────────────────────── */

  const n = (s) => S.trucks.filter((t) => tst(t) === s).length;
  const nextDue = (t) => S.maint.filter((m) => m.truck === t.id).sort((a, b) => a.due - b.due)[0];
  const lastTrip = (t) => S.trips.filter((x) => x.truck === t.id && x.status === 'delivered').pop();
  const trucks = { key: 'trucks', noun: 'trucks', ph: 'Search truck, plate or driver', sort: 'name', dir: 1, rows: () => S.trucks, label: (t) => t.name,
    text: (t) => `${t.name} ${t.plate} ${DRV(t.driver).name}`,
    filters: [['all', 'All', () => true], ['own', 'Own fleet', (t) => t.own], ['hire', 'Hoffmann Spedition', (t) => !t.own], ['road', 'On the road', (t) => tst(t) === 'transit'], ['av', 'Available', (t) => tst(t) === 'available']],

      { k: 'drv', l: 'Driver', w: '1fr', hm: 1, v: (t) => DRV(t.driver).name, c: (t) => esc(DRV(t.driver).name) },
      { k: 'loc', l: 'Location', w: '1.1fr', hm: 1, c: (t) => { const tr = S.trips.find((x) => x.truck === t.id && x.status === 'transit'), l = lastTrip(t); return tr ? `<span>→ ${esc(OR(tr.order).site)} · ${Math.round(tr.p * 100)}%</span>` : t.ws != null ? '<span class="warn">Workshop · no GPS for 4 days</span>' : `<span class="muted">Leipzig base${l ? ` · last ${esc(OR(l.order).site)}` : ''}</span>`; } },
      { k: 'odo', l: 'Odometer', w: '100px', cls: 'r', hm: 1, v: (t) => t.odo, c: (t) => `${fmt(t.odo)} km` },

  const maint = { key: 'maint', noun: 'maintenance items', ph: 'Search truck or item', sort: 'due', dir: 1, rows: () => S.maint, label: (m) => m.kind,
    text: (m) => `${TRK(m.truck).name} ${TRK(m.truck).plate} ${m.kind}`,

    cols: [
      { k: 'what', l: 'Truck and item', w: 'minmax(0,1.8fr)', v: (m) => TRK(m.truck).name, c: (m) => `<span class="cell-main"><b>${esc(TRK(m.truck).name)} · ${TRK(m.truck).plate}</b><span>${esc(m.kind)}</span></span>` },
      { k: 'iv', l: 'Interval', w: '100px', hm: 1, c: (m) => `<span class="muted">${m.iv >= 365 ? plural(m.iv / 365, 'year') : plural(m.iv, 'day')}</span>` },
      { k: 'due', l: 'Due', w: '1fr', hm: 1, v: (m) => m.due, c: (m) => `<span class="cell-main"><b>${fd(m.due)}</b><span>${m.due < TODAY ? plural(TODAY - m.due, 'day') + ' overdue' : m.due === TODAY ? 'today' : 'in ' + plural(m.due - TODAY, 'day')}</span></span>` },
      { k: 'st', l: 'Status', w: '110px', cls: 'r', v: (m) => m.due, c: (m) => pill(...MST[mst(m)]) },
      { k: 'a', l: '', w: '108px', cls: 'r', c: (m) => (mst(m) === 'ok' ? '' : gb('fleet', 'Mark done', `data-act="maintDone" data-id="${m.id}"`, 'btn sm')) },

      { k: 'n', l: 'Trips in June', w: '96px', cls: 'r', v: (d) => S.trips.filter((t) => t.driver === d.id && mon(t.day) === 5 && loaded(t)).length, c: (d) => fmt(S.trips.filter((t) => t.driver === d.id && mon(t.day) === 5 && loaded(t)).length) },
    ] };
  return head('Fleet', `${plural(S.trucks.length, 'truck')} · ${fmt(n('transit'))} on the road · ${fmt(n('available'))} available · ${fmt(n('workshop'))} in workshop`, gb('ops', `${ic('truck')}Schedule delivery`, 'data-act="schedule"', 'btn primary')) +
    tabs('fleet', [['trucks', 'Trucks'], ['maint', `Maintenance${maintOver().length ? ` · ${maintOver().length} overdue` : ''}`], ['drivers', 'Drivers']]) +
    `<div class="card">${TAB.fleet === 'trucks' ? table(trucks) : TAB.fleet === 'maint' ? table(maint) : table(drv)}</div>`;

/* ── customers ───────────────────────────────────────── */

let DR = null;

    ${fld('o-n', 'Note for the driver', `<textarea id="o-n" maxlength="240" placeholder="Gate code, contact on site, unloading hours">${edit ? esc(o.note) : ''}</textarea>`)}
    <div id="o-cr" aria-live="polite"></div>
    ${me === 'admin' ? '<label class="chk"><input type="checkbox" id="o-ov"> Override the credit limit (Admin). The override is recorded in the audit log.</label>' : ''}
    <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="button" class="btn primary" id="o-ok">${edit ? 'Save changes' : 'Create order'}</button></div></div>`, () => {
    const extra = () => { const c = CU(+$('#o-c').value), v = +$('#o-v').value || 0, p = +$('#o-p').value || 0, base0 = edit ? o.vol * o.price : 0; return (v * p - base0) * (c.cc === 'DE' ? 1.19 : 1) + (edit ? 0 : 0); };
    const exp = () => { const c = CU(+$('#o-c').value); return balOf(c) + pipeOf(c) - (edit ? 0 : 0) + extra(); };
    const sync = () => { const c = CU(+$('#o-c').value); $('#o-cr').innerHTML = creditBox(c, pipeOf(c) + extra()); };
    $('#o-c').onchange = () => { const c = CU(+$('#o-c').value); $('#o-s').value = c.city; $('#o-p').value = COST[5] + c.markup; sync(); };
    $('#o-v').oninput = sync; $('#o-p').oninput = sync; sync();
    $('#o-ok').onclick = () => {
      const c = CU(+$('#o-c').value), v = +$('#o-v').value, p = +$('#o-p').value, d = dayOf($('#o-d').value), ov = $('#o-ov') && $('#o-ov').checked, over = exp() - c.limit;
      let e = ferr('o-v', !(Number.isInteger(v) && v >= 5 && v <= 400) ? 'Enter a whole volume between 5 and 400 m³.' : v < minVol ? `At least ${fmt(minVol)} m³ is already scheduled or delivered.` : '');
      e += ferr('o-p', !(p >= 1000 && p <= 2500) ? 'Enter a price between €1,000 and €2,500 per m³.' : '');
      e += ferr('o-d', !(d >= TODAY) ? `The delivery date cannot be before ${fd(TODAY)}.` : '');
      if (!e && over > 0 && extra() > 0 && !ov) { $('#o-cr').insertAdjacentHTML('beforeend', `<p class="err" role="alert" style="color:var(--neg);font-size:13px;margin-top:8px">Credit limit exceeded by ${eur0(over)}. ${me === 'admin' ? 'Tick the override to proceed.' : 'Ask an Admin to override, or record a payment first.'}</p>`); return; }
      if (e) return;
      if (edit) {
        const was = `${o.vol} m³ at €${o.price}`; Object.assign(o, { vol: v, price: p, site: $('#o-s').value, req: d, note: $('#o-n').value.trim() });
        audit_('Order', `Edited ${o.no}: ${was} → ${v} m³ at €${p}${ov && over > 0 ? ' · credit override' : ''}`); closeModal(); after(); toast(`${o.no} updated`); return;
      }
      const id = S.orders.length + 1, n = { id, no: 'SO-2026-' + String(id).padStart(4, '0'), cust: c.id, day: TODAY, t: now(), vol: v, price: p, site: $('#o-s').value, status: 'open', note: $('#o-n').value.trim(), req: d, by: me };
      S.orders.push(n); audit_('Order', `Created ${n.no} for ${c.name} · ${fmt(v)} m³${ov && over > 0 ? ` · credit limit overridden by ${eur0(over)}` : ''}`);
      closeModal(); after(); toast(`${n.no} created for ${c.name}`); openDrawer('order', id);
    };
  });
}

/* ── events ──────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  const t = e.target;
  if (POP && !t.closest('#pop') && !t.closest('[data-act="notifs"],[data-act="userMenu"],[data-act="more"]')) closePop();
  const note = t.closest('[data-note]'); if (note) { const n = notes().find((x) => x.key === note.dataset.note); READ.add(note.dataset.note); closePop(); if (n) go(n.go); return; }
  const pg = t.closest('[data-page]'); if (pg) { e.preventDefault(); go(pg.dataset.page); return; }
  const act = t.closest('[data-act]');
  if (act && !act.disabled) { e.preventDefault(); const f = ACT[act.dataset.act]; if (f) f(act.dataset, act); return; }
  const tab = t.closest('[data-tab]'); if (tab) { const [p, k] = tab.dataset.tab.split(':'); TAB[p] = k; render(); return; }
  const chip = t.closest('[data-chip]'); if (chip) { const [k, f] = chip.dataset.chip.split(':'); Object.assign(TS[k], { f, page: 0 }); TS[k].sel.clear(); render(); return; }
  const so = t.closest('[data-sort]'); if (so) { const [k, c] = so.dataset.sort.split(':'), st = TS[k]; st.dir = st.sort === c ? -st.dir : (c === 'name' || c === 'cust' ? 1 : -1); st.sort = c; st.page = 0; refresh(k); $(`[data-sort="${k}:${c}"]`).focus(); return; }
  const pgr = t.closest('[data-pg]'); if (pgr) { const [k, d] = pgr.dataset.pg.split(':'); TS[k].page += +d; refresh(k); const b = $(`[data-pg="${k}:${d}"]`); if (b && !b.disabled) b.focus(); return; }
  if (t.closest('.ck')) return;
  const row = t.closest('[data-row]'); if (row) openRow(row.dataset.row, +row.dataset.rid);
});
function openRow(key, id) {
  if (key === 'orders') openDrawer('order', id);
  else if (key === 'inv') openDrawer('inv', id);
  else if (key === 'cust') openDrawer('cust', id);
  else if (key === 'pay') openDrawer('inv', S.pay.find((p) => p.id === id).inv);
  else if (key === 'ledger') { const r = ix().L[id - 1]; if (r && r.trip) openDrawer('order', TP(r.trip).order); else if (r && r.type === 'in') { TAB.base = 'rc'; TS.rc && (TS.rc.q = r.doc); render(); } }
}
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.ck) { const [k, id] = t.dataset.ck.split(':'); t.checked ? TS[k].sel.add(+id) : TS[k].sel.delete(+id); refresh(k); const b = $(`[data-ck="${k}:${id}"]`); if (b) b.focus(); }
  if (t.dataset.ckall) { const k = t.dataset.ckall, st = TS[k], view = st.vis.slice(st.page * PS, st.page * PS + PS); view.forEach((r) => (t.checked ? st.sel.add(r.id) : st.sel.delete(r.id))); refresh(k); const b = $(`[data-ckall="${k}"]`); if (b) b.focus(); }
});
document.addEventListener('input', (e) => { const k = e.target.dataset && e.target.dataset.q; if (k) { TS[k].q = e.target.value; TS[k].page = 0; refresh(k); } });
window.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === 'Escape') { if ($('#scrim')) return; if (POP) { const a = POP.anchor; closePop(); a && a.focus(); e.preventDefault(); return; } if (DR) { closeDrawer(); e.preventDefault(); } return; }
  if (!signedIn || $('#scrim')) return;
  if (e.key === '/' && !typing) { const q = $('[data-q]'); if (q) { e.preventDefault(); q.focus(); q.select(); } return; }
  if (e.key === '?' && !typing) { e.preventDefault(); ACT.help(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && !typing) {
    const el = document.activeElement;
    if (el.matches('[data-row]')) { e.preventDefault(); openRow(el.dataset.row, +el.dataset.rid); }
    else if (el.matches('a[data-page], a[data-act]')) { e.preventDefault(); el.click(); }
  }
}, true);

/* ── live: trucks drive their routes; on arrival the trip closes and is invoiced ─ */
setInterval(() => {
  if (document.hidden || $('#scrim') || !signedIn || booting) return;
  CLK++; let arrived = null;
  transit().forEach((t) => { t.p = Math.min(1, t.p + .012 + (t.id % 3) * .004); if (t.p >= 1 && !arrived) arrived = t; });
  if (arrived) { ACT.deliver({ id: arrived.id }, null, 'system'); return; }
  ctx();
  if (page !== 'dashboard') return;
  transit().forEach((t) => { const g = $(`[data-mk="${t.id}"]`), [x, y] = posOn(OR(t.order).site, t.p); if (g) g.setAttribute('transform', `translate(${x} ${y})`); const b = $(`[data-tp="${t.id}"]`); if (b) b.style.width = Math.round(t.p * 100) + '%'; });
}, 1400);

render();
</script>
</body>
