<style>
/* Shared kit for the Showroom demos. Inlined into each demo by tools/build-demos.mjs.
   Per-demo files set the tokens (colour, fonts); everything here reads them. */
:root {
  --bg: #0b0c0a; --surface: #121311; --raised: #1a1c18; --hover: #1f211c;
  --border: #242620; --rule: #1b1d19;
  --text: #f0f1ec; --muted: #a2a59a; --faint: #82857a;
  --accent: #c8f03c; --accent-ink: #0b0c0a;
  --pos: #4ccb86; --neg: #f0645f; --warn: #e8b04b;
  --pos-bg: rgba(76,203,134,.13); --neg-bg: rgba(240,100,95,.14); --warn-bg: rgba(232,176,75,.14); --neutral-bg: rgba(255,255,255,.07);
  --font: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: var(--font);
  --radius: 10px; --radius-s: 6px;
  --side: 232px; --pad: 28px; --gap: 16px;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f3f3f0; --surface: #ffffff; --raised: #f6f6f3; --hover: #eeeeea;
  --border: #e4e4de; --rule: #efefea;
  --text: #15160f; --muted: #5d6056; --faint: #6f7266;
  --pos: #1e7a4c; --neg: #b8302b; --warn: #8a5a0a;
  --pos-bg: #dcf5e6; --neg-bg: #fde8e6; --warn-bg: #fbefd2; --neutral-bg: #ecece7;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: var(--accent-ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* demo notice */
.notice { display: flex; justify-content: center; gap: 8px; padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--surface); border-bottom: 1px solid var(--border); }
.notice b { color: var(--text); font-weight: 600; }

/* shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100svh - 29px); }
.side { position: sticky; top: 0; height: calc(100svh - 29px); display: flex; flex-direction: column; padding: 18px 12px 14px; border-right: 1px solid var(--border); background: var(--surface); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand-mark .ic { width: 18px; height: 18px; stroke-width: 2; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { padding: 16px 10px 6px; font-size: 12px; color: var(--faint); }
.nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.nav a:hover { background: var(--hover); color: var(--text); }
.nav a.on { background: var(--raised); color: var(--text); }
.nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; font-size: 12px; font-weight: 600; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 0; border-top: 1px solid var(--border); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; background: var(--raised); color: var(--text); }
.who { min-width: 0; } .who b { display: block; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .who span { font-size: 12px; color: var(--muted); }

.main { min-width: 0; padding: var(--pad) var(--pad) 48px; max-width: 1320px; width: 100%; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.head h1 { font-size: 24px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; }
.head p { color: var(--muted); margin-top: 2px; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* finding line: the one thing that needs attention */
.finding { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: var(--gap); border-radius: var(--radius); background: var(--warn-bg); color: var(--text); }
.finding .ic { color: var(--warn); }
.finding span { flex: 1; min-width: 0; }
.finding .btn { flex: none; }

/* grid + cards */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.card-h h2 { font-size: 15px; font-weight: 600; letter-spacing: -.005em; }
.card-h span { color: var(--muted); font-size: 12px; }
.kpis { display: flex; gap: 40px; margin-bottom: 22px; flex-wrap: wrap; }
.kpi b { display: block; font: 700 30px/1.1 var(--display); letter-spacing: -.02em; }
.kpi b small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi span { color: var(--muted); font-size: 13px; }
.big { font: 700 44px/1 var(--display); letter-spacing: -.03em; }
.big small { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.muted { color: var(--muted); } .pos { color: var(--pos); } .neg { color: var(--neg); } .warn { color: var(--warn); } .acc { color: var(--accent); } .r { text-align: right; }

/* table as grid: .tbl > .tr (set --cols on .tbl) */
.tbl { width: 100%; }
.tr { display: grid; grid-template-columns: var(--cols); gap: 12px; align-items: center; min-height: 48px; padding: 6px 12px; margin: 0 -12px; border-radius: 8px; transition: background-color .15s; }
.tr:not(.th):hover { background: var(--hover); }
.tr[data-open] { cursor: pointer; }
.th { min-height: 32px; font-size: 12px; color: var(--faint); }
.tr + .tr { box-shadow: 0 -1px 0 var(--rule); }
.tr.th + .tr { box-shadow: none; }
.cell-main b { display: block; font-weight: 600; } .cell-main span { font-size: 12px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--neutral-bg); color: var(--muted); white-space: nowrap; }
.pill.pos { background: var(--pos-bg); color: var(--pos); } .pill.neg { background: var(--neg-bg); color: var(--neg); } .pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--raised); font-weight: 500; cursor: pointer; transition: transform .12s var(--ease), background-color .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--hover); border-color: var(--faint); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--raised); margin-bottom: var(--gap); }
.tabs button { height: 28px; padding: 0 14px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.tabs button.on { background: var(--surface); color: var(--text); font-weight: 500; }
:root[data-theme="light"] .tabs button.on { box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s var(--ease); }
.bar.thick { height: 10px; border-radius: 5px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); outline: none; transition: border-color .15s; }
.field textarea { height: 80px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 40; animation: fade .18s ease both; }
.modal { width: 100%; max-width: 440px; max-height: 92svh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; animation: pop .22s var(--ease) both; }
.modal h2 { font-size: 18px; margin-bottom: 4px; letter-spacing: -.01em; } .modal > p { color: var(--muted); margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.snack { position: fixed; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 14px; max-width: min(380px, calc(100vw - 32px)); padding: 12px 8px 12px 16px; border-radius: 6px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; opacity: 0; transform: translateY(12px); transition: opacity .2s, transform .25s var(--ease); pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.snack.show { opacity: 1; transform: none; pointer-events: auto; }
.snack button { flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: inherit; opacity: .65; cursor: pointer; font: inherit; } .snack button:hover { opacity: 1; }
.fxbar { position: fixed; top: 0; left: 0; right: 0; z-index: 70; padding: 9px 16px; text-align: center; font-weight: 600; font-size: 13px; background: var(--accent); color: var(--accent-ink); transform: translateY(-100%); transition: transform .25s var(--ease); pointer-events: none; }
.fxbar.show { transform: none; }
.corner { position: fixed; top: 52px; right: 16px; width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; }
.cn { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,.28); opacity: 0; transform: translateX(24px); transition: opacity .22s, transform .26s var(--ease); }
.cn.show { opacity: 1; transform: none; }
.cn i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); } .cn small { color: var(--faint, var(--muted)); font-size: 11px; }
.flash { position: fixed; z-index: 70; transform: translate(-50%, calc(-100% + 6px)); padding: 7px 12px; border-radius: 8px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .15s, transform .2s var(--ease); pointer-events: none; text-align: center; }
.flash::after { content: ''; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: inherit; transform: translateX(-50%) rotate(45deg); }
.flash.show { opacity: 1; transform: translate(-50%, -100%); }
.push { position: fixed; top: 10px; left: 50%; width: min(380px, calc(100vw - 20px)); z-index: 70; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 11px 14px; border-radius: 18px; background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); color: var(--text); border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,.28); transform: translate(-50%, -140%); transition: transform .35s var(--ease); pointer-events: none; }
.push.show { transform: translate(-50%, 0); }
.push i { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-style: normal; font-weight: 800; }
.push b { display: block; font-size: 13px; } .push span { display: block; font-size: 13px; color: var(--muted); } .push small { align-self: start; color: var(--faint, var(--muted)); font-size: 11px; }
@media (max-width: 899px) { .snack { bottom: 76px; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* charts */
.chart { width: 100%; }
.chart text { font: 12px var(--font); fill: var(--faint); }
.chart .grid-l { stroke: var(--rule); stroke-width: 1; }
.chart .tip { pointer-events: none; }

/* phone: sidebar becomes a bottom tab bar */
.tabbar { display: none; }
@media (max-width: 899px) {
  :root { --pad: 16px; }
  .app { display: block; }
  .side { display: none; }
  .main { padding: 18px 16px 96px; }
  .tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--border); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; color: var(--muted); cursor: pointer; position: relative; }
  .tabbar a.on { color: var(--text); }
  .tabbar a.on .ic { color: var(--accent); }
  .tabbar .count { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .c4, .c5, .c6, .c7, .c8 { grid-column: span 12; }
  .head h1 { font-size: 22px; }
  .kpis { gap: 24px; }
  .kpi b { font-size: 24px; }
  .hm { display: none !important; }
  .finding { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
.brow { margin-bottom: 14px; } .brow:last-child { margin-bottom: 0; }
.brow-t { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.brow-t em { font-style: normal; color: var(--muted); font-size: 12px; margin-left: 6px; }
.brow-t b { font-weight: 600; }
@media (max-width: 899px) { .tr { grid-template-columns: var(--colsm, var(--cols)); } }

:root[data-theme="light"] {
  --bg: #f6f5f1; --surface: #ffffff; --raised: #f2f1ec; --hover: #ecebe5; --border: #e3e1d9; --rule: #eeede7;
  --text: #17181a; --muted: #5a5d62; --faint: #6d7076;
  --accent: #0c8a5f; --accent-ink: #ffffff; --accent-bg: #dff3ea;

}
.head h1, .big, .kpi b { font-weight: 600; letter-spacing: -.025em; }

/* top navigation instead of a sidebar: this one is a consumer product */
.app { display: block; min-height: 0; } .side { display: none; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 28px; height: 60px; padding: 0 var(--pad); background: var(--surface); border-bottom: 1px solid var(--border); }
.top .brand { padding: 0; } .top .brand-name { font-weight: 700; }
.top .nav { flex-direction: row; gap: 4px; } .top .nav a { height: 36px; }
.top .who-top { margin-left: auto; display: flex; align-items: center; gap: 10px; } .top .who-top b { font-weight: 500; }
.main { margin: 0 auto; max-width: 1240px; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.chip { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s, border-color .15s; }
.chip:hover { color: var(--text); border-color: var(--faint); }
.chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
.filters select { height: 34px; border-radius: 17px; border: 1px solid var(--border); background: var(--surface); padding: 0 12px; margin-left: auto; }
.cars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
.car { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; transition: border-color .15s, transform .2s var(--ease); animation: pop .3s var(--ease) both; }
.car:hover { border-color: var(--faint); transform: translateY(-2px); }
.car-art { display: block; position: relative; aspect-ratio: 8 / 5; overflow: hidden; }
.car-art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.car-b { padding: 14px 16px 16px; }
.car-b h3 { font-size: 16px; font-weight: 600; }
.car-b .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.car-f { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; gap: 8px; }
.car-f b { font-size: 20px; font-weight: 600; } .car-f small { color: var(--muted); font-size: 13px; }
.free { font-size: 12px; color: var(--accent); font-weight: 500; }
.free.busy { color: var(--faint); }

/* detail */
.modal.wide { max-width: 860px; padding: 0; overflow: auto; }
.det { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.det-l { padding: 24px; } .det-r { padding: 24px; border-left: 1px solid var(--border); background: var(--raised); }
.det-art { border-radius: 12px; }
.specs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0 22px; }
.specs div b { display: block; font-weight: 600; } .specs div span { font-size: 12px; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.cal .dw { text-align: center; font-size: 12px; color: var(--faint); padding-bottom: 2px; }
.day { height: 38px; border-radius: 8px; border: 0; background: var(--surface); color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; transition: background-color .12s; }
.day:hover:not(:disabled) { background: var(--hover); }
.day:disabled { background: transparent; color: var(--faint); cursor: not-allowed; text-decoration: line-through; opacity: .6; }
.day.in { background: var(--accent-bg); border-radius: 0; } .day.edge, .day.edge:hover:not(:disabled) { background: var(--accent); color: #fff; border-radius: 8px; }
.day.past { visibility: hidden; }
.sum .lines div { display: flex; justify-content: space-between; padding: 7px 0; color: var(--muted); } .sum .lines b { color: var(--text); font-weight: 500; }
.sum .tot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; }
.sum .tot b { font-size: 26px; font-weight: 600; }
.close-x { position: absolute; top: 12px; right: 12px; }
.modal.wide { position: relative; }

.trip-c { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; }
.trip-c + .trip-c { border-top: 1px solid var(--rule); }
.trip-c .thumb { border-radius: 10px; overflow: hidden; aspect-ratio: 8 / 5; } .trip-c .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.trip-c b { display: block; font-weight: 600; } .trip-c span.s { color: var(--muted); font-size: 13px; }

@media (max-width: 1099px) { .cars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 899px) {

/* Feedback messages. Each demo picks a style with <html data-fx="…">:

   flash (bubble at the pointer) · push (phone-style notification) · none (silent, warnings only) */
let lastPt = { x: innerWidth / 2, y: innerHeight * .6 };
addEventListener('pointerdown', (e) => { lastPt = { x: e.clientX, y: e.clientY }; }, true);
const WARN = /^(enter|check|not |only |describe|volume must|this period|generation limit|project limit)/i;
const fxHost = (cls, tag = 'div') => { let el = $('.' + cls); if (!el) { el = document.createElement(tag); el.className = cls; document.body.appendChild(el); } return el; };
const fxTimers = {};
const fxLater = (key, fn, ms) => { clearTimeout(fxTimers[key]); fxTimers[key] = setTimeout(fn, ms); };
const FX = {
  pill(msg) {
    const t = fxHost('toast'); t.setAttribute('role', 'status'); t.textContent = msg; void t.offsetWidth; t.classList.add('show');
    fxLater('pill', () => t.classList.remove('show'), 2600);
  },
  snack(msg) {
    const t = fxHost('snack'); t.setAttribute('role', 'status');
    t.innerHTML = `<span></span><button type="button" aria-label="Dismiss">✕</button>`; t.firstChild.textContent = msg;
    t.lastChild.onclick = () => t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
    fxLater('snack', () => t.classList.remove('show'), 4200);
  },
  banner(msg) {
    const t = fxHost('fxbar'); t.setAttribute('role', 'status'); t.textContent = msg; void t.offsetWidth; t.classList.add('show');
    fxLater('banner', () => t.classList.remove('show'), 3000);
  },
  corner(msg) {
    const host = fxHost('corner'); host.setAttribute('role', 'status');
    const c = document.createElement('div'); c.className = 'cn'; c.innerHTML = `<i></i><span></span><small>now</small>`; c.children[1].textContent = msg;
    host.prepend(c); while (host.children.length > 3) host.lastChild.remove();
    requestAnimationFrame(() => c.classList.add('show'));
    setTimeout(() => { c.classList.remove('show'); setTimeout(() => c.remove(), 260); }, 4200);
  },
  flash(msg) {
    const t = fxHost('flash'); t.setAttribute('role', 'status'); t.textContent = msg; t.classList.remove('show'); void t.offsetWidth;
    const w = Math.min(280, innerWidth - 24);
    t.style.maxWidth = w + 'px';
    t.style.left = Math.max(12 + w / 2, Math.min(innerWidth - 12 - w / 2, lastPt.x)) + 'px';
    t.style.top = Math.max(48, lastPt.y - 18) + 'px';
    t.classList.add('show'); fxLater('flash', () => t.classList.remove('show'), 2200);
  },
  push(msg) {
    const brand = ($('.brand-name') || {}).textContent || document.title.split(/[—·-]/)[0].trim();

const niceMax = (m) => { const mag = 10 ** Math.floor(Math.log10(m)); for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k * mag >= m * 1.02) return k * mag; return 10 * mag; };

/* bars: values with a marked bar; labels under, 3 faint gridlines */
function barsSVG(w, { labels, values, mark = values.length - 1, h = 190, fmtV = fmt, unit = '' }) {
  const L = 36, B = 26, T = 8, ph = h - B - T, pw = w - L - 4;
  const max = niceMax(Math.max(...values)), bw = Math.min(46, pw / values.length * 0.56), step = pw / values.length;
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = max / 3 * i, y = T + ph - (v / max) * ph; g += `<line class="grid-l" x1="${L}" x2="${w}" y1="${y}" y2="${y}"/><text x="${L - 8}" y="${y + 4}" text-anchor="end">${fmtV(v)}</text>`; }
  const bars = values.map((v, i) => {
    const x = L + step * i + (step - bw) / 2, bh = Math.max(2, (v / max) * ph), y = T + ph - bh;
    const on = Array.isArray(mark) ? mark.includes(i) : i === mark;
    return `<g><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="2" fill="var(--accent)" opacity="${on ? 1 : .38}"><title>${esc(labels[i])}: ${fmtV(v)} ${unit}</title></rect>
      <text x="${x + bw / 2}" y="${h - 8}" text-anchor="middle" ${on ? 'style="fill:var(--text)"' : ''}>${esc(labels[i])}</text>
      ${on ? `<text x="${x + bw / 2}" y="${y - 6}" text-anchor="middle" style="fill:var(--text);font-weight:600">${fmtV(v)}</text>` : ''}</g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(labels.map((l, i) => l + ' ' + fmtV(values[i])).join(', '))}">${g}${bars}</svg>`;
}
/* line: one series, 2px, no markers, end value labelled */
function lineSVG(w, { labels, values, h = 190, fmtV = fmt, xAt }) {
  const L = 44, B = 26, T = 12, R = 44, ph = h - B - T, pw = w - L - R;
  const max = niceMax(Math.max(...values)), n = values.length;
  const X = (i) => L + (pw * i) / (n - 1), Y = (v) => T + ph - (v / max) * ph;
  let g = '';

  const d = values.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');

  const last = values[n - 1];

  { id: 5,  n: 'Volkswagen Polo',  y: 2016, t: 'hatch', c: '#3d4a57', px: 27, seats: 5, tr: 'Manual', fuel: 'Petrol', r: 4.5, trips: 90, own: 'Stefan A.', where: 'Munich', dep: 300 },
  { id: 6,  n: 'Skoda Octavia RS Combi',    y: 2015, t: 'hatch', c: '#2f7d5b', px: 42, seats: 5, tr: 'Automatic', fuel: 'Petrol', r: 4.9, trips: 52, own: 'Petra T.', where: 'Prague', dep: 600 },
  { id: 7,  n: 'Hyundai Staria',   y: 2023, t: 'van',   c: '#e8e4da', px: 90, seats: 9, tr: 'Automatic', fuel: 'Diesel', r: 5.0, trips: 22, own: 'Joost B.', where: 'Amsterdam', dep: 1000 },
  { id: 8,  n: 'Toyota RAV4 Plug-in Hybrid',      y: 2022, t: 'suv',   c: '#1f2a36', px: 65, seats: 5, tr: 'Automatic', fuel: 'Plug-in hybrid', r: 4.8, trips: 74, own: 'Camille M.', where: 'Lyon', dep: 800 },
];
const TYPE = { sedan: 'Sedan', suv: 'Crossover', hatch: 'Hatchback', van: 'Minivan' };
/* every booking is one record; busy days, trips, occupancy and earnings all derive from it */
const B = [
  { id: 1, car: 1, who: 'Lukas N.', from: -6, to: -3 }, { id: 2, car: 1, who: 'Anna L.', from: 2, to: 5 }, { id: 3, car: 1, who: 'Marco T.', from: 9, to: 14 }, { id: 4, car: 1, who: 'Camille R.', from: 19, to: 21 },
  { id: 5, car: 2, who: 'Jonas V.', from: -5, to: -2 }, { id: 19, car: 2, who: 'Elena F.', from: -12, to: -9 }, { id: 20, car: 1, who: 'Pieter O.', from: -14, to: -11 }, { id: 6, car: 2, who: 'Sofia K.', from: 6, to: 12 }, { id: 7, car: 2, who: 'Hugo E.', from: 16, to: 20 },
  { id: 8, car: 6, who: 'You', from: -9, to: -6 }, 
  { id: 11, car: 5, who: 'You', from: 12, to: 14 }, 
  { id: 13, car: 5, who: 'Nora R.', from: 3, to: 9 }, { id: 14, car: 6, who: 'Felix S.', from: 5, to: 7 }, { id: 15, car: 7, who: 'Lusa Tours Lda', from: 0, to: 10 }, { id: 16, car: 7, who: 'Mira D.', from: 14, to: 18 },
  { id: 17, car: 8, who: 'Pavel P.', from: 2, to: 4 }, 
];
const car = (id) => CARS.find((c) => c.id === id);
const busy = (carId, d) => B.some((b) => b.car === carId && d >= b.from && d <= b.to);
const freeNext7 = (id) => { let n = 0; for (let d = 0; d < 7; d++) if (!busy(id, d)) n++; return n; };
const nextId = () => Math.max(...B.map((b) => b.id)) + 1;
const price = (c, n) => { const base = c.px * n, off = n >= 14 ? .15 : n >= 7 ? .1 : 0, disc = Math.round(base * off), fee = Math.round((base - disc) * .07); return { base, off, disc, fee, total: base - disc + fee }; };
/* totals reconcile: 3 days of the Polo, no discount */
console.assert(price(car(5), 3).total === 27 * 3 + Math.round(27 * 3 * .07) && price(car(1), 7).disc === 27, 'price');

const carPhoto = (c) => `<img src="img/car-${c.id}.jpg" alt="${esc(c.n)}" loading="lazy" decoding="async">`;

const tint = (c) => `color-mix(in srgb, ${c} 16%, #f6f5f1)`;

/* ── shell ────────────────────────────────────────────── */
const PAGES = { catalog: ['Catalogue', 'search'], trips: ['My trips', 'calendar'], host: ['My cars', 'wrench'] };
let page = 'catalog', type = 'all', sort = 'price', sel = null;       // sel: { car, a, b }
const myTrips = () => B.filter((b) => b.who === 'You').sort((a, b) => a.from - b.from);

function chrome() {
  $('#nav').innerHTML = Object.keys(PAGES).map((k) => `<a data-page="${k}" tabindex="0" role="link">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span></a>`).join('');
  $('#tabbar').innerHTML = Object.keys(PAGES).map((k) => `<a data-page="${k}" tabindex="0" role="link">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span></a>`).join('');
  setNav(page);
}
function render() { chrome(); $('#main').innerHTML = ({ catalog, trips, host })[page](); }
function go(p) { page = p; render(); window.scrollTo(0, 0); }
const head = (t, sub, actions = '') => `<header class="head"><div><h1>${t}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></header>`;

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-page]'); if (a) return go(a.dataset.page);
  const c = e.target.closest('[data-car]'); if (c) return openCar(+c.dataset.car);
  const act = e.target.closest('[data-act]'); if (act) return ACT[act.dataset.act](act.dataset);
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-page]')) { e.preventDefault(); go(e.target.dataset.page); } });
document.addEventListener('change', (e) => { if (e.target.id === 'sort') { sort = e.target.value; render(); } });

/* ── catalog ──────────────────────────────────────────── */
function catalog() {
  const list = CARS.filter((c) => type === 'all' || c.t === type).sort((a, b) => sort === 'price' ? a.px - b.px : sort === 'rating' ? b.r - a.r : freeNext7(b.id) - freeNext7(a.id));
  const cards = list.map((c) => { const f = freeNext7(c.id); return `<button class="car" data-car="${c.id}" aria-label="${esc(c.n)}, ${tg(c.px)} per day"><span class="car-art">${carPhoto(c)}</span>
    <span class="car-b" style="display:block"><h3>${esc(c.n)}</h3><div class="sub">${c.y} · ${TYPE[c.t]} · ${c.tr} · ${c.seats} seats</div>
    <span class="car-f"><span><b>${tg(c.px)}</b> <small>/ day</small></span><span style="text-align:right"><span class="free ${f < 3 ? 'busy' : ''}" style="display:block">${f === 7 ? 'Free all week' : f ? `Free ${f} of 7 days` : 'Booked all week'}</span><small>★ ${fmtD(c.r)} · ${c.trips} ${plural(c.trips, 'trip', 'trips', 'trips')}</small></span></span></span></button>`; }).join('');
  return head('Cars across Europe', `${list.length} ${plural(list.length, 'car', 'cars', 'cars')} from owners. Pick your dates inside a listing and the price is calculated for you.`) +
    `<div class="filters">${['all', 'sedan', 'suv', 'hatch', 'van'].map((k) => `<button class="chip ${type === k ? 'on' : ''}" data-act="type" data-v="${k}">${k === 'all' ? 'All' : TYPE[k]}</button>`).join('')}
    <select id="sort" aria-label="Sort"><option value="price" ${sort === 'price' ? 'selected' : ''}>Cheapest first</option><option value="rating" ${sort === 'rating' ? 'selected' : ''}>By rating</option><option value="free" ${sort === 'free' ? 'selected' : ''}>Most free days</option></select></div>
    <div class="cars">${cards}</div>`;
}

/* ── car detail + dates ───────────────────────────────── */
function openCar(id) {
  sel = { car: id, a: null, b: null };
  const c = car(id);
  modal(`<div class="det"><div class="det-l"><div class="det-art car-art" style="border-radius:12px;margin-bottom:18px">${carPhoto(c)}</div>
      <h2 style="font-size:22px">${esc(c.n)}, ${c.y}</h2><p class="muted">Owner: ${esc(c.own)} · ${c.where} · ★ ${fmtD(c.r)}</p>
      <div class="specs"><div><b>${c.seats}</b><span>seats</span></div><div><b>${c.tr}</b><span>gearbox</span></div><div><b>${c.fuel}</b><span>fuel</span></div><div><b>${tg(c.dep)}</b><span>deposit</span></div></div>
      <h3 style="font-size:15px">Select dates</h3><p class="muted" style="font-size:13px">Greyed-out days are booked. Click the start day, then the end day.</p><div class="cal" id="cal"></div></div>
    <div class="det-r sum" id="sum"></div></div><button class="btn sm close-x" onclick="closeModal()" aria-label="Close">${ic('x')}</button>`, () => { $('.modal').classList.add('wide'); drawCal(); });
}
function drawCal() {
  const c = car(sel.car), start = TODAY.getDay() === 0 ? 6 : TODAY.getDay() - 1;   // Monday-first offset
  let h = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map((d) => `<div class="dw">${d}</div>`).join('') + '<span></span>'.repeat(start);
  for (let d = 0; d < 28; d++) {
    const inn = sel.a !== null && d >= sel.a && d <= (sel.b ?? sel.a), edge = d === sel.a || d === sel.b;
    h += `<button class="day ${inn ? 'in' : ''} ${edge ? 'edge' : ''}" data-act="day" data-d="${d}" ${busy(c.id, d) ? 'disabled' : ''} aria-label="${dFmt(d)}${busy(c.id, d) ? ', booked' : ''}">${addDays(d).getDate()}</button>`;
  }
  $('#cal').innerHTML = h; drawSum();
}
function drawSum() {
  const c = car(sel.car), n = sel.a === null ? 0 : (sel.b ?? sel.a) - sel.a + 1;
  if (!n) { $('#sum').innerHTML = `<div class="tot" style="border:0"><span class="muted">${tg(c.px)} per day</span></div><p class="muted" style="margin:10px 0 18px">10% off from 7 days, 15% off from 14 days.</p><button class="btn primary" style="width:100%" disabled>Select dates</button>`; return; }
  const p = price(c, n);
  $('#sum').innerHTML = `<h3 style="font-size:15px;margin-bottom:2px">${n > 1 ? dFmt(sel.a) + ' — ' + dFmt(sel.b ?? sel.a) : dFmt(sel.a)}</h3><p class="muted" style="margin-bottom:12px">${days(n)}</p>
    <div class="lines"><div><span>${tg(c.px)} × ${n}</span><b>${tg(p.base)}</b></div>${p.disc ? `<div><span>Discount ${p.off * 100}%</span><b class="pos">−${tg(p.disc)}</b></div>` : ''}<div><span>Service fee 7%</span><b>${tg(p.fee)}</b></div></div>
    <div class="tot"><span>Total</span><b>${tg(p.total)}</b></div><p class="muted" style="font-size:13px;margin:8px 0 16px">The ${tg(c.dep)} deposit is held on your card and released after the trip.</p>
    <button class="btn primary" style="width:100%;height:42px" data-act="book">Book now</button>`;
}

/* ── trips ────────────────────────────────────────────── */
function trips() {
  const list = myTrips(), up = list.filter((b) => b.to >= 0);
  const rows = list.map((b) => { const c = car(b.car), n = b.to - b.from + 1, p = price(c, n), past = b.to < 0; return `<div class="trip-c"><span class="thumb">${carPhoto(c)}</span><div><b>${esc(c.n)}</b><span class="s">${dFmt(b.from)} — ${dFmt(b.to)} · ${days(n)} · ${tg(p.total)}</span></div>${past ? '<span class="pill">Completed</span>' : `<span style="display:flex;gap:8px;align-items:center"><span class="pill pos"><i></i>Confirmed</span><button class="btn sm" data-act="cancel" data-id="${b.id}">Cancel</button></span>`}</div>`; }).join('');
  const spent = list.reduce((a, b) => a + price(car(b.car), b.to - b.from + 1).total, 0);
  return head('My trips', `${up.length ? `Next: ${esc(car(up[0].car).n)}, from ${dFmt(up[0].from)}` : 'No upcoming trips'}`) +
    `<div class="kpis"><div class="kpi"><b>${list.length}</b><span>Total trips</span></div><div class="kpi"><b>${tg(spent)}</b><span>Spent</span></div></div><section class="card">${rows || '<p class="empty">Nothing here yet. Pick a car in the catalogue.</p>'}</section>`;
}

/* ── host cabinet ─────────────────────────────────────── */
function host() {
  const mine = CARS.filter((c) => c.own === 'You'), done = (b) => b.to < 0;
  const earn = (c) => B.filter((b) => b.car === c.id && done(b)).reduce((a, b) => { const n = b.to - b.from + 1, p = price(c, n); return a + (p.base - p.disc) * .9; }, 0);
  const occ = (c) => { let n = 0; for (let d = 0; d < 28; d++) if (busy(c.id, d)) n++; return n; };
  const tot = mine.reduce((a, c) => a + earn(c), 0), occAll = mine.reduce((a, c) => a + occ(c), 0) / (mine.length * 28);
  const cards = mine.map((c) => `<section class="card c6"><div class="card-h"><h2>${esc(c.n)}</h2><span>${tg(c.px)} / day</span></div>
    <div class="kpis" style="margin-bottom:12px;gap:28px"><div class="kpi"><b>${occ(c)}</b><span>Booked days out of 28</span></div><div class="kpi"><b>${tg(earn(c))}</b><span>Earned</span></div></div>
    <div style="display:grid;grid-template-columns:repeat(28,1fr);gap:2px" aria-label="Occupancy over 28 days">${Array.from({ length: 28 }, (_, d) => `<i title="${dFmt(d)}" style="height:22px;border-radius:3px;background:${busy(c.id, d) ? 'var(--accent)' : 'var(--raised)'}"></i>`).join('')}</div>
    <p class="muted" style="font-size:12px;margin-top:6px">${dFmt(0)} — ${dFmt(27)}</p>
    <h3 style="font-size:14px;margin:16px 0 4px">Upcoming bookings</h3>${B.filter((b) => b.car === c.id && b.to >= 0).sort((a, b) => a.from - b.from).slice(0, 3).map((b) => `<div class="trip-c" style="grid-template-columns:1fr auto;padding:8px 0"><div><b>${esc(b.who)}</b><span class="s">${dFmt(b.from)} — ${dFmt(b.to)}</span></div><b>${tg((price(c, b.to - b.from + 1).base - price(c, b.to - b.from + 1).disc) * .9)}</b></div>`).join('')}</section>`).join('');
  return head('My cars', `${mine.length} ${plural(mine.length, 'car', 'cars', 'cars')} listed. Service commission 10%.`) +
    `<div class="kpis"><div class="kpi"><b>${tg(tot)}</b><span>Earned from completed bookings</span></div><div class="kpi"><b>${Math.round(occAll * 100)}<small>%</small></b><span>28-day occupancy</span></div></div><div class="grid">${cards}</div>`;
}

/* ── actions ──────────────────────────────────────────── */
const ACT = {
  type(d) { type = d.v; render(); },
  day(d) {
    const x = +d.d, c = car(sel.car);
    if (sel.a === null || sel.b !== null || x < sel.a) { sel.a = x; sel.b = null; }
    else { for (let k = sel.a; k <= x; k++) if (busy(c.id, k)) { toast('This period includes booked days'); sel.a = x; sel.b = null; return drawCal(); } sel.b = x; }
    drawCal();
  },
  book() {
    const c = car(sel.car), a = sel.a, b = sel.b ?? sel.a;
    B.push({ id: nextId(), car: c.id, who: 'You', from: a, to: b }); closeModal(); toast(`${c.n}: booking ${dFmt(a)} — ${dFmt(b)} confirmed`); go('trips');
  },
  cancel(d) { const i = B.findIndex((b) => b.id === +d.id); B.splice(i, 1); toast('Booking cancelled, the deposit will be released to your card'); render(); },
};
/* ── live: other renters keep booking, so calendars and "free days" change under you ─ */
const RENTERS = ['Ana N.', 'Lars K.', 'Julie B.', 'Tim D.', 'Greta S.', 'Marek M.', 'Dana T.'];
setInterval(() => {
  if (document.hidden || $('#scrim')) return;
  const c = CARS[Math.floor(Math.random() * CARS.length)], start = 1 + Math.floor(Math.random() * 20), len = 1 + Math.floor(Math.random() * 3);
  for (let d = start; d <= start + len; d++) if (busy(c.id, d)) return;
  B.push({ id: nextId(), car: c.id, who: RENTERS[Math.floor(Math.random() * RENTERS.length)], from: start, to: start + len });
  toast(`${c.n}: someone just booked ${dFmt(start)} — ${dFmt(start + len)}`);
  if (page === 'catalog' || page === 'host') render();
}, 8000);
render();
</script>
</body>
</html>
