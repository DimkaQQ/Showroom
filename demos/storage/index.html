<style>
/* Shared kit for the Showroom demos. Inlined into each demo by tools/build-demos.mjs.

:root {

  --pos-bg: rgba(76,203,134,.13); --neg-bg: rgba(240,100,95,.14); --warn-bg: rgba(232,176,75,.14); --neutral-bg: rgba(255,255,255,.07);

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }

/* shell */

.nav .count { margin-left: auto; min-width: 20px; padding: 0 6px; height: 20px; border-radius: 10px; font-size: 12px; font-weight: 600; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }

.finding span { flex: 1; min-width: 0; }

.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }

.tabs { display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--raised); margin-bottom: var(--gap); }

.bar { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .5s var(--ease); }
.bar.thick { height: 10px; border-radius: 5px; }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select, .field textarea { height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); outline: none; transition: border-color .15s; }
.field textarea { height: 80px; padding: 8px 10px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }

.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 40; animation: fade .18s ease both; }
.modal { width: 100%; max-width: 440px; max-height: 92svh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; animation: pop .22s var(--ease) both; }
.modal h2 { font-size: 18px; margin-bottom: 4px; letter-spacing: -.01em; } .modal > p { color: var(--muted); margin-bottom: 18px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); opacity: 0; padding: 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; z-index: 60; transition: opacity .2s, transform .25s var(--ease); pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }

/* charts */
.chart { width: 100%; }
.chart text { font: 12px var(--font); fill: var(--faint); }
.chart .grid-l { stroke: var(--rule); stroke-width: 1; }
.chart .tip { pointer-events: none; }

/* phone: sidebar becomes a bottom tab bar */
.tabbar { display: none; }
@media (max-width: 899px) {
  :root { --pad: 16px; }

  .side { display: none; }
  .main { padding: 18px 16px 96px; }

    <div class="modal-actions"><button class="btn" onclick="closeModal()">Закрыть</button><button class="btn" id="a-out">Списать</button><button class="btn primary" id="a-in">Приход</button></div>`, () => {
    const apply = (sign) => { const v = $('#a-v').value, n = +$('#a-q').value; if (!(n > 0)) return toast('Укажите количество'); if (sign < 0 && n > i.qty[v]) return toast(`На точке только ${i.qty[v]} ${i.u}`); i.qty[v] = Math.round((i.qty[v] + sign * n) * 10) / 10; closeModal(); toast(`${i.n}: ${sign > 0 ? 'приход' : 'списано'} ${n} ${i.u}`); render(); };
    $('#a-out').onclick = () => apply(-1); $('#a-in').onclick = () => apply(1);
  });
}

/* ── orders + suppliers ───────────────────────────────── */
const ST = { ordered: ['В пути', 'warn'], received: ['Принят', 'pos'], cancelled: ['Отменён', ''] };
function orders() {
  const rows = [...PO].sort((a, b) => b.id - a.id).map((o) => `<div class="tr" style="--cols:.6fr 1.4fr 1.2fr .8fr .9fr .9fr;--colsm:1fr auto"><span class="hm muted">${o.id}</span><div class="cell-main"><b>${esc(sup(o.s).n)}</b><span>${VEN[o.v]} · ${o.date}${' · ' + o.lines.length + ' поз.'}</span></div><span class="hm">${o.lines.map(([i, qn]) => esc(item(i).n.split(' ')[0]) + ' ' + qn).join(', ')}</span><b class="hm r">${tg(poTotal(o))}</b><span class="hm"><span class="pill ${ST[o.st][1]}"><i></i>${ST[o.st][0]}</span></span>
    <span class="r">${o.st === 'ordered' ? `<button class="btn sm primary" data-act="receive" data-id="${o.id}">Принять</button>` : `<b>${tg(poTotal(o))}</b>`}</span></div>`).join('');
  return head('Закупки', `${PO.length} заказов · принятые заказы сразу попадают в остатки`) +
    `<section class="card"><div class="tbl"><div class="tr th" style="--cols:.6fr 1.4fr 1.2fr .8fr .9fr .9fr;--colsm:1fr auto"><span class="hm">№</span><span>Поставщик</span><span class="hm">Состав</span><span class="hm r">Сумма</span><span class="hm">Статус</span><span class="r"></span></div>${rows}</div></section>`;
}
function suppliers() {
  const rows = SUP.map((s) => { const mine = PO.filter((o) => o.s === s.id && o.st !== 'cancelled'), spent = mine.reduce((a, o) => a + poTotal(o), 0); return `<div class="tr" style="--cols:1.3fr 1.2fr 1fr .7fr .9fr;--colsm:1fr auto"><div class="cell-main"><b>${esc(s.n)}</b><span>${esc(s.who)} · ${s.tel}</span></div><span class="hm">${s.tel}</span><span class="hm stars">${'★'.repeat(s.r)}<i>${'★'.repeat(5 - s.r)}</i></span><span class="hm r">${mine.length}</span><b class="r">${tg(spent)}</b></div>`; }).join('');
  return head('Поставщики', `${SUP.length} поставщиков · потрачено ${tg(PO.filter((o) => o.st !== 'cancelled').reduce((a, o) => a + poTotal(o), 0))} за последние 2 недели`) +
    `<section class="card"><div class="tbl"><div class="tr th" style="--cols:1.3fr 1.2fr 1fr .7fr .9fr;--colsm:1fr auto"><span>Поставщик</span><span class="hm">Телефон</span><span class="hm">Рейтинг</span><span class="hm r">Заказов</span><span class="r">Сумма</span></div>${rows}</div></section>`;
}

/* ── actions ──────────────────────────────────────────── */
const nextPO = () => Math.max(...PO.map((o) => o.id)) + 1;
const ACT = {
  venue(d) { venue = d.v; render(); }, cat(d) { cat = d.v; render(); },
  order(d) { const x = drafts()[+d.k]; PO.push({ id: nextPO(), s: x.s, v: x.v, date: TODAY, st: 'ordered', lines: x.lines }); toast(`Заказ отправлен: ${sup(x.s).n}`); render(); },
  orderAll() { const ds = drafts(); ds.forEach((x) => PO.push({ id: nextPO(), s: x.s, v: x.v, date: TODAY, st: 'ordered', lines: x.lines })); toast(`Отправлено заказов: ${ds.length}`); render(); },
  receive(d) { const o = PO.find((x) => x.id === +d.id); o.lines.forEach(([i, qn]) => { item(i).qty[o.v] = (item(i).qty[o.v] || 0) + qn; }); o.st = 'received'; toast(`Принято: заказ ${o.id}, остатки обновлены`); render(); },
};
render();
</script>
</body>
</html>
