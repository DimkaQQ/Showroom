<!DOCTYPE html>
<html lang="en" data-theme="light" data-fx="pill">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockroom: purchasing for restaurant groups (demo)</title>
<meta name="description" content="Demo: stock levels by venue, supplier orders from draft to receipt, stock counts, waste and food-cost reports. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root[data-theme="light"]{--bg:#ebecee;--surface:#ffffff;--raised:#f4f5f6;--hover:#eceef0;--border:#dcdfe3;--rule:#eceef0;--text:#14171a;--muted:#565d66;--faint:#6a717b;--accent:#a85f00;--accent-ink:#ffffff;--accent-bg:#fbeed7;--pos:#1b7a4a;--neg:#b3302b;--warn:#8a5a0a;--font:"Commissioner",system-ui,sans-serif;--display:"Commissioner",system-ui,sans-serif;--eo:cubic-bezier(.23, 1,.32, 1);--shadow:0 14px 40px rgba(20, 23, 26,.16)}
.brand-name,.head h1,.big,.kpi b{font-weight:800;letter-spacing:-.02em}
.nav .count{background:var(--neg);color:#fff} .nav .count.n{background:var(--raised);color:var(--muted)} .nav .count.a{background:var(--accent);color:#fff}
.nav-label{padding:14px 10px 4px}
.side{overflow-y:auto}
.side-foot{flex-direction:column;align-items:stretch;gap:0}
.vt{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer}
.vt:hover{background:var(--hover);color:var(--text)}
.ver{font-size:11px;color:var(--faint);padding:2px 10px}
.pt{width:40px;height:40px;border-radius:11px;flex:none;overflow:hidden} .pt img{width:100%;height:100%;object-fit:cover;display:block}
.pt.sm{width:28px;height:28px;border-radius:8px} .pt.lg{width:52px;height:52px;border-radius:13px}
.cell-pt{display:flex;align-items:center;gap:12px;min-width:0}
.cell-main{min-width:0} .cell-main b{overflow-wrap:anywhere} .cell-main em{font-style:normal}
.line .pt{width:28px;height:28px;border-radius:8px} .line > span{display:flex;align-items:center;gap:10px;min-width:0}
.level{display:flex;align-items:center;gap:10px} .level .bar{flex:1;height:8px;min-width:40px}
.level .bar i.low{background:var(--neg)} .level .bar i.soon{background:var(--warn)} .level .bar i.ok{background:var(--pos)}
.level b{min-width:64px;text-align:right;font-weight:600}
.draft{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;animation:pop .25s var(--eo) both;min-width:0;display:flex;flex-direction:column}
.drafts{display:grid;grid-template-columns:repeat(2,minmax(0, 1fr));gap:var(--gap)}
.draft-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px} .draft-h b{font-size:15px;font-weight:700} .draft-h span{color:var(--muted);font-size:12px;text-align:right}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px} .meta .ic{width:14px;height:14px}
.line{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--muted)} .line b{color:var(--text);font-weight:500;white-space:nowrap}
.draft-f{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:12px;border-top:1px solid var(--rule)} .draft-f > div > b{font-size:18px;font-weight:700} .draft-f small{display:block;font-size:12px}
.bt{display:flex;gap:6px}
.pill.acc{background:var(--accent-bg);color:var(--accent)}
.sm{font-size:12px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm{display:none} @media (max-width:899px){.drafts{grid-template-columns:minmax(0, 1fr)} .level b{min-width:0} .dm{display:block}}
.btn[aria-disabled="true"]{opacity:.5}
.btn.danger{color:var(--neg)}
.lnk{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px}
.lnk:hover{text-decoration:underline}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--accent);margin:0}
/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.top .mb{display:none}
.gs{position:relative;flex:1 1 260px;min-width:0;max-width:440px}
.gs .ic{position:absolute;left:10px;top:9px;color:var(--faint)}
.gs input{width:100%;height:36px;padding:0 34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);outline:none;transition:border-color .15s}
.gs input:focus{border-color:var(--accent)}
.gs kbd{position:absolute;right:8px;top:8px;font:600 11px var(--font);color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:1px 6px}
.top .sp{flex:1}
.vsel,.sel2{height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:0 8px;max-width:100%}
.ib{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;color:var(--muted);flex:none;transition:background-color .15s,color .15s}
.ib:hover{color:var(--text);background:var(--hover)}
.ib .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--neg);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.ub{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 4px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left}
.ub:hover{background:var(--hover)}
.ub .avatar,.uh .avatar{width:28px;height:28px;background:var(--accent-bg);color:var(--accent)}
.ubn b{display:block;font-size:13px;line-height:1.1} .ubn small{font-size:11px;color:var(--muted)}
.ub > .ic{width:14px;height:14px;color:var(--faint)}
/* popovers */
.pop{position:fixed;z-index:45;width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:6px;animation:pop .16s var(--eo) both;max-height:min(480px, 72svh);overflow:auto}
.pop.gsp{width:min(440px,calc(100vw - 24px))}
.pop.sheet{left:12px;right:12px;bottom:72px;width:auto}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;font-weight:600}
.pop-l{padding:8px 10px 4px;font-size:12px;color:var(--faint)}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;text-align:left;cursor:pointer;color:var(--text)}
.mi:hover,.mi:focus-visible{background:var(--hover)}
.mi > .ic{color:var(--muted);align-self:flex-start;margin-top:1px}
.mi > span{flex:1;min-width:0} .mi small{display:block;color:var(--muted);font-size:12px}
.mi.unread::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.mi mark{background:var(--accent-bg);color:inherit;border-radius:2px}
.sep{height:1px;background:var(--rule);margin:4px 0}
.uh{display:flex;gap:10px;align-items:center;padding:10px} .uh .avatar{width:36px;height:36px} .uh small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.urole{padding:0 10px 8px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* page parts */
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 0;margin-bottom:8px;font-size:13px}
.back:hover{color:var(--text)} .back .ic{width:16px;height:16px}
.kpis{gap:20px 44px} .kpi span em{font-style:normal;font-size:12px;margin-left:4px}
.stack{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap} .sec-h h2{font-size:15px;font-weight:600} .sec-h span{color:var(--muted);font-size:12px}
.dl{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)} .dl:first-of-type{border-top:0;padding-top:0} .dl .cell-main{flex:1}
.act-r{display:flex;gap:10px;width:100%;text-align:left;padding:9px 0;border:0;background:none;cursor:pointer;color:var(--text);border-top:1px solid var(--rule);font-size:13px}
.act-r:first-of-type{border-top:0;padding-top:0}
.bub{width:28px;height:28px;border-radius:50%;background:var(--raised);display:grid;place-items:center;flex:none;color:var(--muted)} .bub .ic{width:15px;height:15px}
.act-r small{display:block;color:var(--muted);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{flex:1 1 220px;min-width:0;max-width:360px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:0 12px;outline:none} .search:focus{border-color:var(--accent)}
.tools .cnt{margin-left:auto;color:var(--muted);font-size:13px}
.tabs{max-width:100%;overflow-x:auto;scrollbar-width:none} .tabs button{white-space:nowrap} .tabs em{font-style:normal;color:var(--faint);font-size:12px;margin-left:4px}
.bulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;margin-bottom:12px;border-radius:10px;background:var(--accent-bg);animation:pop .18s var(--eo) both}
.bulk b{margin-right:4px}
.tr.sel{background:var(--accent-bg)} .tr[data-item],.tr[data-go]{cursor:pointer}
.cb{display:grid;place-items:center;width:28px;height:32px;cursor:pointer}
.sh{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;display:inline-flex;gap:3px;align-items:center}
.sh:hover,.sh.on{color:var(--text)} .sh .ic{width:12px;height:12px}
.r .sh{justify-content:flex-end}
.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:12px;margin-top:6px;border-top:1px solid var(--rule);flex-wrap:wrap;font-size:13px}
.pager > div{display:flex;align-items:center;gap:8px} .pager .btn{width:32px;padding:0}
.empty-s{text-align:center;padding:36px 12px;color:var(--muted)} .empty-s b{display:block;color:var(--text);font-size:15px;margin-bottom:4px} .empty-s .btn{margin-top:12px}
.perm{text-align:center;padding:56px 20px} .perm .ic{width:30px;height:30px;margin:0 auto 12px;color:var(--muted)} .perm b{display:block;font-size:17px;margin-bottom:6px} .perm p{color:var(--muted);max-width:420px;margin:0 auto}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--raised);color:var(--muted);margin-bottom:12px;font-size:13px}
.errbox{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--neg-bg);color:var(--neg);font-size:13px} .errbox .btn{margin-top:8px}
.okbox{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--pos-bg);color:var(--pos);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--rule)} .kv:first-child{border-top:0} .kv > span{color:var(--muted);flex:none} .kv b{font-weight:600;text-align:right;overflow-wrap:anywhere;min-width:0}
.h3{font-size:13px;font-weight:600;margin:20px 0 8px;display:flex;justify-content:space-between;gap:8px}
.spark{width:100%;height:56px;display:block} .spark.mini{height:22px;width:72px}
.spark .l{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round} .spark .a{fill:var(--accent);opacity:.1}
.sk{background:linear-gradient(90deg,var(--raised) 25%,var(--hover) 50%,var(--raised) 75%);background-size:200% 100%;animation:sk 1.1s linear infinite;border-radius:6px;height:14px}
@keyframes sk{to{background-position:-200% 0}}
.score{display:inline-flex;align-items:center;gap:8px} .score .bar{width:56px} .score .bar i{background:var(--pos)} .score.mid .bar i{background:var(--warn)}
/* drawer */
.dscrim{position:fixed;inset:0;background:rgba(20, 23, 26,.36);z-index:35;animation:fade .2s both}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px, 100vw);background:var(--surface);z-index:36;border-left:1px solid var(--border);display:flex;flex-direction:column;animation:din .3s var(--eo) both;box-shadow:var(--shadow)}
@keyframes din{from{transform:translateX(40px);opacity:0}}
.dh{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--rule)} .dh h2{font-size:18px;letter-spacing:-.01em} .dh .cell-main{flex:1}
.db{padding:18px 20px;overflow:auto;flex:1} .df{padding:12px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px, 1fr));gap:10px}
.vbox{border:1px solid var(--border);border-radius:10px;padding:12px} .vb-h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.big2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.kvl{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left} .kvl:hover{background:var(--hover)} .kvl small{display:block;color:var(--muted);font-size:12px}
.mv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:13px} .mv small{display:block;color:var(--muted);font-size:12px} .mv > b{white-space:nowrap}
/* forms */
.modal.wide{max-width:640px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0, 1fr));gap:0 12px} .fgrid.g3{grid-template-columns:repeat(3,minmax(0, 1fr))}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--neg)}
.ferr{color:var(--neg);font-size:12px} .hint{color:var(--muted);font-size:12px}
.vrow{display:grid;grid-template-columns:minmax(0, 1.4fr) 1fr 1fr;gap:12px;align-items:start} .vrow .chk{margin-top:30px}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.ni{width:100%;min-width:0;height:32px;border:1px solid var(--border);border-radius:6px;padding:0 8px;text-align:right;background:var(--bg);outline:none}
.ni:focus{border-color:var(--accent)} .ni.bad{border-color:var(--neg);background:var(--neg-bg)} .ni:disabled{opacity:.7}
select.ni{text-align:left;padding:0 4px}
.tr.chg{box-shadow:inset 3px 0 0 var(--accent)}
.savebar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-top:12px;border-radius:12px;background:var(--text);color:var(--surface);box-shadow:var(--shadow);animation:pop .2s var(--eo) both}
.savebar span{flex:1;min-width:140px} .savebar .btn{background:transparent;color:var(--surface);border-color:rgba(255, 255, 255,.3)} .savebar .btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap} .prog .bar{flex:1;min-width:120px;height:8px}
/* PO document */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0, 1fr));gap:8px;margin-bottom:var(--gap)}
.step{border-top:3px solid var(--border);padding-top:8px;font-size:13px;min-width:0} .step.done{border-color:var(--accent)} .step b{display:block} .step span{font-size:12px;color:var(--muted);display:block}
.doc{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:32px}
.doc-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:2px solid var(--text);margin-bottom:18px}
.doc-h .brand{padding:0} .doc-t{font-size:22px;font-weight:800;letter-spacing:-.02em}
.doc-g{display:grid;grid-template-columns:repeat(3,minmax(0, 1fr));gap:16px;margin-bottom:20px;font-size:13px}
.doc-g small{display:block;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px} .doc-g small:first-child{margin-top:0}
.doc-g b,.doc-g span{display:block;overflow-wrap:anywhere} .doc-g span{color:var(--muted)}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc th{text-align:left;font-weight:600;color:var(--faint);font-size:12px;padding:8px 6px;border-bottom:1px solid var(--border)}
.doc td{padding:9px 6px;border-bottom:1px solid var(--rule);vertical-align:middle} .doc .r{text-align:right} .doc tfoot td{border:0;font-size:15px;padding-top:12px}
.doc td .ni{width:76px;display:inline-block}
.doc-n{color:var(--muted);font-size:12px;margin-top:18px}
.doc-x{margin-top:18px;padding:14px;border-radius:10px;background:var(--raised);font-size:13px}
.addl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center} .addl select{flex:1 1 200px} .addl .ni{width:90px}
/* sign in */
.signin{min-height:calc(100svh - 29px);display:grid;place-items:center;padding:24px 16px}
.sbox{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 1px 2px rgba(0, 0, 0,.04)}
.sbox h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:18px} .sbox .brand{padding:0}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0, 1fr));gap:8px;margin:16px 0 18px;border:0;padding:0} .roles legend{font-size:13px;color:var(--muted);margin-bottom:6px;padding:0}
.role{position:relative;border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;font-size:12px;transition:border-color .15s,background-color .15s;min-width:0}
.role b{display:block;font-size:14px} .role span{color:var(--muted)} .role.on{border-color:var(--accent);background:var(--accent-bg)}
.role input{position:absolute;opacity:0} .role:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;flex-wrap:wrap}
.btn.wide{width:100%;height:40px}
.sfoot{text-align:center;color:var(--faint);font-size:12px;margin-top:16px}
#smsg:not(:empty){margin-bottom:12px;padding:10px 12px;border-radius:8px;background:var(--raised);font-size:13px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255, 255, 255,.4);border-top-color:#fff;animation:rot .7s linear infinite} @keyframes rot{to{transform:rotate(360deg)}}
body.out .app,body.out .tabbar{display:none}
/* undo toast */
.ut{position:fixed;left:50%;bottom:28px;z-index:61;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);padding:8px 8px 8px 16px;border-radius:10px;background:var(--text);color:var(--surface);font-weight:500;box-shadow:var(--shadow);transform:translate(-50%, 16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--eo)}
.ut.show{opacity:1;transform:translate(-50%, 0);pointer-events:auto}
.ut button{border:0;background:rgba(255, 255, 255,.14);color:inherit;font-weight:700;height:30px;padding:0 12px;border-radius:7px;cursor:pointer}
@media (max-width:1100px){.doc-g{grid-template-columns:repeat(2,minmax(0, 1fr))}}
@media (max-width:899px){.top{gap:8px;margin-bottom:16px} .top .mb{display:grid} .top .sp,.ubn,.ub > .ic,.gs kbd{display:none}
  .gs{flex:1 1 0} .vsel{order:9;width:100%}
  .ub{padding:0 4px}
  .toast,.ut{bottom:84px} .savebar{bottom:76px}
  .doc{padding:18px} .steps{gap:4px} .step{font-size:12px}
  .fgrid.g3{grid-template-columns:repeat(2,minmax(0, 1fr))}
  .tools .cnt{margin-left:0;width:100%}}
@media (max-width:560px){.fgrid,.fgrid.g3,.doc-g{grid-template-columns:minmax(0, 1fr)} .roles{grid-template-columns:minmax(0, 1fr)} .vrow{grid-template-columns:1fr 1fr} .vrow .chk{grid-column:1 / -1;margin-top:0;margin-bottom:8px} .sbox{padding:22px 18px}}
@media print{body{background:#fff} .notice,.side,.tabbar,.top,.back,.head,.steps,.ut,.toast{display:none !important}
  .app{display:block} .main{padding:0} .doc{border:0;padding:0} .noprint{display:none !important}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</head>
<body>
<div class="notice"><b>Demo</b> Stockroom · sample data</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg></div>
      <div><div class="brand-name">Stockroom</div><div class="brand-sub">Donau &amp; Isar Gastro</div></div>

${ed ? `<div class="addl noprint"><select class="sel2" id="po-add" aria-label="Product to add">${addable.map((i) => `<option value="${i.id}">${esc(i.n)} (${eur(i.px)} / ${i.u})</option>`).join('') || '<option value="">All products are on this order</option>'}</select><input class="ni" id="po-q" inputmode="decimal" placeholder="Qty" aria-label="Quantity to add"><button class="btn sm" data-act="poAdd">${ic('plus')}Add line</button></div>` : ''}
${rc ? `<div class="doc-x"><b>Goods receipt</b>${kv(`Delivery note`,`${esc(rc.note)}`)}${kv(`Received`,`${DF.format(rc.at)}, ${TF.format(rc.at)} by ${esc(rc.by)}${o.onTime ? '' : ' (late)'}`)}${rc.temp !== null ? `${kv(`Chilled goods temperature`,`${fmtD(rc.temp, 1)} °C`)}` : ''}${kv(`Discrepancies`,`${rc.lines.filter((l) => l.iss.length).length || 'None'}`)}${rc.credit ? `${kv(`Credit note requested`,`${eur(rc.credit)}`,'neg')}` : ''}</div>` : ''}
<p class="doc-n">Prices exclude VAT. Please quote PO-${o.id} on the delivery note and invoice. Chilled goods must arrive at 7 °C or below; deliveries outside goods-in hours may be refused.</p></article>`;
};

/* Receiving */
const RCC = '--cols:minmax(0,2fr) 1.1fr 1fr 1fr 1fr;--colsm:minmax(0,1fr) auto';
VIEWS.receive = () => {
  const exp = PO.filter((o) => ['sent', 'confirmed'].includes(o.st) && inV(o.v)).sort((a, b) => a.expected - b.expected);
  const recent = PO.filter((o) => o.rcv && inV(o.v)).sort((a, b) => b.rcv.at - a.rcv.at), wk = recent.filter((o) => wkOf(o.rcv.at) === 7);
  const disc = sumBy(wk, (o) => o.rcv.lines.filter((l) => l.iss.length).length), cred = sumBy(wk, (o) => o.rcv.credit || 0);
  const row = (o) => `<div class="tr" style="${RCC}" data-go="${o.rcv ? 'po' : 'rcv'}:${o.id}" tabindex="0" role="button"><div class="cell-main"><b>${esc(sup(o.s).n)}</b><span>PO-${o.id} · ${VEN[o.v]} · ${pl(o.lines.length, 'line')}</span></div><span class="hm">${o.rcv ? `${DS.format(o.rcv.at)}, ${TF.format(o.rcv.at)}` : dayRel(o.expected)}</span><b class="hm r">${eur(o.rcv ? rcvTotal(o) : poTotal(o))}</b><span class="hm">${o.rcv ? (o.rcv.lines.some((l) => l.iss.length) ? `<span class="pill warn"><i></i>${pl(o.rcv.lines.filter((l) => l.iss.length).length, 'discrepancy', 'discrepancies')}</span>` : '<span class="pill pos"><i></i>Complete</span>') : poPill(o)}</span><span class="r">${o.rcv ? `<span class="muted sm">${esc(o.rcv.by)}</span>` : '<span class="btn sm primary">Receive</span>'}</span></div>`;
  return head('Receiving', 'Check deliveries against the delivery note, then book them into stock') +
    `<div class="kpis">${kpi(`${exp.filter((o) => dayDiff(o.expected) === 0).length}`,`Due today`)}${kpi(`${exp.filter(isOver).length}`,`Overdue`,`${exp.some(isOver) ? 'neg' : ''}`)}${kpi(`${wk.length}`,`Received this week`)}${kpi(`${disc}`,`Discrepancies this week`)}${kpi(`${eur0(cred)}`,`Credit notes requested`)}</div>
<section class="card"><div class="card-h"><h2>Expected deliveries</h2><span>${pl(exp.length, 'order')}</span></div><div class="tbl">${exp.map(row).join('') || emptyS('Nothing expected', 'Sent and confirmed orders appear here until they are received.')}</div></section>
<section class="card" style="margin-top:var(--gap)"><div class="card-h"><h2>Recently received</h2><span>Last 10</span></div><div class="tbl">${recent.slice(0, 10).map(row).join('')}</div></section>`;
};
const CONDL = { ok: 'OK', damaged: 'Damaged', wrong: 'Wrong item', quality: 'Quality issue' };
function rcvCalc(o) {
  const f = RC[o.id], tmp = num(f.temp), hot = !isNaN(tmp) && tmp > 7;
  return o.lines.map((l, k) => {
    const x = f.lines[k], d = num(x.d), p = num(x.p), it = BY[l.i], chill = CHILL.includes(it.cat);
    const bad = isNaN(d) || d < 0 || isNaN(p) || p < 0 || (isInt(it) && d % 1 !== 0), rej = x.c !== 'ok' || (hot && chill), acc = bad || rej ? 0 : d, iss = [];
    if (bad) iss.push(['Check values', 'neg']);
    else { if (d < l.q) iss.push([`Short ${fq(l.q - d, it.u)}`, 'warn']); if (d > l.q) iss.push([`Over ${fq(d - l.q, it.u)}`, 'warn']); if (p > l.px + .004) iss.push([`Price +${eur(p - l.px)}`, 'neg']); if (p < l.px - .004) iss.push([`Price ${MINUS}${eur(l.px - p)}`, 'pos']); if (x.c !== 'ok') iss.push([CONDL[x.c], 'neg']); else if (hot && chill) iss.push(['Rejected: temperature', 'neg']); }
    return { l, d, p, acc, iss, bad, credit: bad ? 0 : (rej ? d * p : 0) + (!rej && p > l.px ? (p - l.px) * d : 0) };
  });
}
const rcvRes = (r) => r.iss.length ? r.iss.map(([t, c]) => `<span class="pill ${c}"><i></i>${t}</span>`).join(' ') : '<span class="pill pos"><i></i>Match</span>';
function rcvSum(o) {
  const res = rcvCalc(o), f = RC[o.id], tmp = num(f.temp), dis = res.filter((r) => r.iss.length).length, cred = sumBy(res, (r) => r.credit);
  return `<div class="card-h"><h2>Summary</h2></div>${kv(`Ordered`,`${eur(poTotal(o))}`)}${kv(`Accepted into stock`,`${eur(sumBy(res, (r) => r.acc * r.l.px))}`)}<div class="kv"><span>Discrepancies</span><b class="${dis ? 'warn' : ''}">${dis || 'None'}</b></div><div class="kv"><span>Credit note to request</span><b class="${cred ? 'neg' : ''}">${eur(cred)}</b></div>
${!isNaN(tmp) && tmp > 7 ? `<div class="errbox" style="margin-top:10px">${ic('alert')}<span>${fmtD(tmp, 1)} °C is above the 7 °C limit. Chilled lines will be rejected and returned with the driver.</span></div>` : ''}
<div class="modal-actions" style="flex-wrap:wrap"><button class="btn" data-go="po:${o.id}">Cancel</button><button class="btn primary" data-act="rcvDo">${ic('check')}Confirm receipt</button></div>`;
}
VIEWS.rcv = () => {
  const o = PO.find((x) => x.id === R.id);
  if (!o || !['sent', 'confirmed'].includes(o.st)) return head('Nothing to receive', o ? `PO-${o.id} is ${PS[o.st][0].toLowerCase()}.` : 'This order no longer exists.', '', ['page="receive"', 'Receiving']) + `<section class="card">${emptyS('Only sent or confirmed orders can be received', '', o ? `<button class="btn sm" data-go="po:${o.id}">Open PO-${o.id}</button>` : '')}</section>`;
  const sp = sup(o.s), chilled = o.lines.some((l) => CHILL.includes(BY[l.i].cat));
  const f = RC[o.id] ||= { note: '', time: TF.format(now()), by: me().n, temp: '', lines: o.lines.map((l) => ({ d: String(l.q), p: String(l.px), c: 'ok' })) };
  const res = rcvCalc(o);
  return head(`Receive PO-${o.id}`, `${esc(sp.n)} → ${VEN[o.v]} · expected ${dayRel(o.expected)}`, '', [`go="po:${o.id}"`, `PO-${o.id}`]) +
    `<div class="grid"><div class="c8 stack"><section class="card"><div class="card-h"><h2>1. Delivery note</h2><span>Copy from the driver's paper note</span></div>
<div class="fgrid ${chilled ? 'g3' : ''}">${fld(`Delivery note no.`,`<input id="r-note" data-rf="note" value="${esc(f.note)}" placeholder="LS-48213" autocomplete="off">`)}${fld(`Arrived at`,`<input id="r-time" data-rf="time" type="time" value="${f.time}">`)}${chilled ? `${fld(`Chilled goods, °C`,`<input id="r-temp" data-rf="temp" inputmode="decimal" value="${esc(f.temp)}" placeholder="e.g. 4.5"><small class="hint">Limit 7 °C</small>`)}` : ''}</div><p class="hint">Received by ${esc(f.by)}</p></section>
<section class="card"><div class="card-h"><h2>2. Check lines</h2><button class="lnk" data-act="rcvAll">Mark all as delivered in full</button></div><div class="tbl"><div class="tr th" style="--cols:minmax(0,1.8fr) .9fr .9fr 1fr minmax(0,1.3fr);--colsm:minmax(0,1fr) 80px"><span>Item, ordered</span><span class="r">Delivered</span><span class="r hm">Price on note, €</span><span class="hm">Condition</span><span class="hm">Result</span></div>
${o.lines.map((l, k) => { const i = BY[l.i], x = f.lines[k]; return `<div class="tr" style="--cols:minmax(0,1.8fr) .9fr .9fr 1fr minmax(0,1.3fr);--colsm:minmax(0,1fr) 80px"><div class="cell-main"><b>${esc(i.n)}</b><span>Ordered ${fq(l.q, i.u)} at ${eur(l.px)}${CHILL.includes(i.cat) ? ' · chilled' : ''}</span><div class="dm" id="rm-${k}" style="margin-top:4px">${rcvRes(res[k])}</div></div><input class="ni" data-rc="d:${k}" value="${esc(x.d)}" inputmode="decimal" aria-label="Delivered quantity of ${esc(i.n)}, ${i.u}"><input class="ni hm" data-rc="p:${k}" value="${esc(x.p)}" inputmode="decimal" aria-label="Price on note for ${esc(i.n)}"><select class="ni hm" data-rc="c:${k}" aria-label="Condition of ${esc(i.n)}">${Object.entries(CONDL).map(([c, t]) => `<option value="${c}" ${x.c === c ? 'selected' : ''}>${t}</option>`).join('')}</select><span class="hm" id="rr-${k}">${rcvRes(res[k])}</span></div>`; }).join('')}</div></section></div>
<aside class="c4"><section class="card" id="rsum" style="position:sticky;top:16px">${rcvSum(o)}</section></aside></div>`;
};
function rcvRefresh(o) { rcvCalc(o).forEach((r, k) => { const a = $('#rr-' + k), b = $('#rm-' + k); if (a) a.innerHTML = rcvRes(r); if (b) b.innerHTML = rcvRes(r); $(`[data-rc="d:${k}"]`)?.classList.toggle('bad', r.bad); }); $('#rsum').innerHTML = rcvSum(o); }
function rcvDo() {
  const o = PO.find((x) => x.id === R.id), f = RC[o.id], chilled = o.lines.some((l) => CHILL.includes(BY[l.i].cat));
  const ok = vForm([['r-note', (x) => !x.trim() ? 'Enter the delivery note number' : !/^[A-Za-z0-9][A-Za-z0-9\-/ ]{2,23}$/.test(x.trim()) ? 'Use 3 to 24 letters, digits or dashes, e.g. LS-48213' : ''], ['r-time', (x) => !x ? 'Enter the arrival time' : ''], ...(chilled ? [['r-temp', (x) => { const n = num(x); return isNaN(n) ? 'Measure and enter the temperature of the chilled goods' : n < -25 || n > 25 ? 'Enter a temperature between −25 and 25 °C' : ''; }]] : [])]);
  if (!ok) return;
  const res = rcvCalc(o);
  if (res.some((r) => r.bad)) { toast('Check the highlighted lines: quantities and prices must be numbers'); $('.ni.bad')?.focus(); return; }
  const dis = res.filter((r) => r.iss.length), cred = r2(sumBy(res, (r) => r.credit));
  const apply = () => {
    res.forEach((r) => { const i = BY[r.l.i]; i.q[o.v] = rq(i, (i.q[o.v] || 0) + r.acc); });
    const [hh, mm] = f.time.split(':').map(Number), at = new Date(NOW0); at.setHours(hh || 0, mm || 0); const t = at > now() ? now() : at;
    o.rcv = { at: t, note: f.note.trim(), by: f.by, temp: chilled ? num(f.temp) : null, credit: cred, lines: res.map((r) => ({ i: r.l.i, ord: r.l.q, dlv: r.d, acc: r.acc, px: r.l.px, npx: r.p, iss: r.iss.map((x) => x[0]) })) };
    o.st = 'received'; o.onTime = dayDiff(o.expected) >= 0; o.log.push(['received', now(), me().n]); delete RC[o.id];
    if (dis.length) notify(`PO-${o.id} received with ${pl(dis.length, 'discrepancy', 'discrepancies')}${cred ? `, credit note of ${eur(cred)} requested from ${sup(o.s).n}` : ''}`, 'alert', { page: 'po', id: o.id });
    toast(`PO-${o.id} received: ${pl(res.filter((r) => r.acc).length, 'line')} booked into stock at ${VEN[o.v]}`);
    go('po', o.id);
  };
  if (dis.length) confirmBox(`Receive with ${pl(dis.length, 'discrepancy', 'discrepancies')}?`, `Accepted goods go into stock at ${VEN[o.v]}.${cred ? ` A credit note request for ${eur(cred)} will be sent to ${esc(sup(o.s).n)}.` : ''} Short lines will not be invoiced.`, 'Confirm receipt', apply, false, 'Back to checking');
  else apply();
}

/* Stock count */
const cVar = (c) => sumBy(c.lines, (l) => l.cnt === '' || l.cnt === undefined ? 0 : (l.cnt - l.exp) * BY[l.i].px);
VIEWS.count = () => {
  if (!CNT) {
    const hist = COUNTS.filter((c) => inV(c.v));
    return head('Stock count', `Weekly full counts keep book stock honest. Next due: ${VEN[NEXTCOUNT]}, Sunday.`) +
      `<div class="grid"><section class="card c5"><div class="card-h"><h2>Start a count</h2></div><form id="cf" novalidate>
${fld(`Venue`,`<select id="c-v">${VS.map((v) => `<option value="${v}" ${(venue === 'all' ? NEXTCOUNT : venue) === v ? 'selected' : ''}>${VEN[v]}</option>`).join('')}</select>`)}
${fld(`Scope`,`<select id="c-s"><option value="All">Full count</option>${CATS.map((c) => `<option value="${c}">${c} only</option>`).join('')}</select>`)}
<label class="chk" style="margin-bottom:16px"><input type="checkbox" id="c-b"> Blind count (hide expected quantities)</label>
<div><button class="btn primary" type="submit">${ic('list')}Start count</button></div></form></section>

${hist.map((c) => { const v = cVar(c), acc = c.lines.filter((l) => l.cnt === l.exp).length / c.lines.length; return `<div class="tr" style="--cols:1fr 1.3fr .8fr 1fr;--colsm:1fr auto" data-act="countD" data-id="${c.id}" tabindex="0" role="button"><div class="cell-main"><b>${DF.format(c.started)}</b><span>${c.id} · ${esc(c.by)}</span></div><span class="hm">${VEN[c.v]} · ${c.scope}</span><span class="hm r">${pc(acc, 0)}</span><b class="r ${v < 0 ? 'neg' : 'pos'}">${v < 0 ? MINUS : '+'}${eur(Math.abs(v))}</b></div>`; }).join('') || emptyS('No counts yet', '')}</div></section></div>`;
  }

  const C = '--cols:minmax(0,2fr) .9fr 1fr .9fr .9fr;--colsm:minmax(0,1fr) 84px 70px';
  return head(`Stock count · ${VEN[CNT.v]}`, `${CNT.scope} · started ${rel(CNT.started)} by ${esc(CNT.by)}${CNT.blind ? ' · blind count' : ''}`, sub ? '' : `<button class="btn danger" data-act="cntDiscard">Discard</button><button class="btn primary" data-act="cntSubmit">Submit for approval</button>`) +
    (sub ? (can('approve') ? `<div class="finding">${ic('shield')}<span>Submitted ${rel(CNT.sub)} by ${esc(CNT.subBy)}. Approving posts the variance to stock and the food-cost report.</span><button class="btn sm" data-act="cntReturn">Return for recount</button><button class="btn sm primary" data-act="cntApprove">Approve and post</button></div>` : `<div class="banner">${ic('lock')}Waiting for a Manager to approve. Katharina Brandl has been notified. ${PERM.approve[1]}.</div>`) : '') +
    `<section class="card" style="margin-bottom:var(--gap)"><div class="prog" id="cprog">${cProg()}</div></section>
<div class="tools"><input class="search" data-q="count" value="${esc(s.q)}" placeholder="Find a product on the sheet" aria-label="Search count sheet"><div class="tabs" style="margin:0">${[['all', 'All'], ['todo', 'Not counted'], ['var', 'With variance']].map(([k, t]) => `<button class="${s.f === k ? 'on' : ''}" data-act="cntF" data-v="${k}">${t}</button>`).join('')}</div></div>
<section class="card"><div class="tbl"><div class="tr th" style="${C}"><span>Product</span><span class="r hm">Expected</span><span class="r">Counted</span><span class="r">Variance</span><span class="r hm">Value</span></div>
${rows.map(({ l, k }) => { const i = BY[l.i]; return `<div class="tr" style="${C}"><div class="cell-pt"><span class="pt sm hm">${ptImg(i.cat)}</span><div class="cell-main"><b>${esc(i.n)}</b><span>${i.sku} · ${i.u}</span></div></div><span class="r hm muted">${CNT.blind && !sub ? 'Hidden' : fq(l.exp, i.u)}</span><input class="ni" data-cn="${k}" value="${l.cnt}" inputmode="decimal" placeholder="—" aria-label="Counted ${esc(i.n)}, ${i.u}" ${sub ? 'disabled' : ''}><span class="r" id="cv-${k}">${cVarQ(l)}</span><span class="r hm" id="ce-${k}">${cVarE(l)}</span></div>`; }).join('') || emptyS('Nothing to show', s.f === 'todo' ? 'Every line has been counted.' : 'No lines match.')}</div></section>`;
};
const cVarQ = (l) => { if (l.cnt === '' || CNT.blind && CNT.st === 'open') return '<span class="muted">—</span>'; const d = l.cnt - l.exp; return d ? `<b class="${d < 0 ? 'neg' : 'pos'}">${d > 0 ? '+' : MINUS}${fq(Math.abs(d))}</b>` : '<span class="muted">0</span>'; };

/* Waste */

  el.innerHTML = `<div class="signin"><form class="sbox" id="sform" novalidate><div class="brand"><div class="brand-mark">${ic('box')}</div><div><div class="brand-name">Stockroom</div><div class="brand-sub">Donau &amp; Isar Gastro</div></div></div>

<fieldset class="roles"><legend>Demo account</legend>${Object.entries(USERS).map(([k, u]) => `<label class="role ${k === srole ? 'on' : ''}"><input type="radio" name="role" value="${k}" ${k === srole ? 'checked' : ''}><b>${u.t}</b><span>${u.n}</span></label>`).join('')}</fieldset>
${fld(`Work email`,`<input id="se" type="email" autocomplete="username" value="${USERS[srole].e}">`)}

function doSignin() {
  if (!vForm([['se', (x) => !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(x.trim()) ? 'Enter your work email' : ''], ['sp', (x) => !x ? 'Enter your password' : '']])) return;

}
const hl = (s, q) => { const i = s.toLowerCase().indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };

  const pos = PO.filter((o) => `po-${o.id}`.includes(s.replace(/^po\s*-?\s*/, 'po-')) || String(o.id).includes(s)).slice(-3).reverse();

  forgot() { $('#smsg').textContent = 'Password resets are handled by your administrator. In this demo the password is already filled in.'; },
  sort(d) { const s = L[d.k]; if (s.sort === d.s) s.dir *= -1; else { s.sort = d.s; s.dir = ['name', 'n', 'sup'].includes(d.s) ? 1 : -1; } view(); },
  pg(d) { L[d.k].p = +d.p; view(); $('#view .pager')?.scrollIntoView({ block: 'nearest' }); },

  clearF(d) { Object.assign(L[d.k], { q: '', cat: 'All', st: 'all', reason: 'All', p: 1 }); view(); },
  ost(d) { L.orders.st = d.v; L.orders.p = 1; view(); },
  draftAll() { const sg = suggestions(venue); sg.forEach((x) => addToDraft(x.s, x.v, x.lines)); L.orders.st = 'draft'; toast(`${pl(sg.length, 'draft order')} created. Review and send.`); go('orders'); },
  sugDraft(d) { const x = suggestions(venue)[+d.k]; if (!x) return; const o = addToDraft(x.s, x.v, x.lines); toast(`Draft PO-${o.id} for ${sup(x.s).n}`); render(); },
  sugSend(d) { const x = suggestions(venue)[+d.k]; if (!x) return; const o = addToDraft(x.s, x.v, x.lines); sendPO(o); },
  newPO(d) { newPOForm(d.id ? +d.id : null); },
  logWaste(d) { wasteForm(d.id ? +d.id : null); },
  newItem() { itemForm(); }, editItem(d) { itemForm(+d.id); },
  orderItem(d) {
    const i = BY[+d.id], made = [];
    VS.filter((v) => i.q[v] !== null && inV(v)).forEach((v) => { const n = Math.max(1, needQty(i, v) || Math.ceil(i.par[v] - i.min[v])); made.push(addToDraft(i.s, v, [{ i: i.id, q: n, px: i.px }])); });
    closeDrawer(true); toast(`${i.n} added to ${made.map((o) => 'PO-' + o.id).join(' and ')}`); render();
  },
  bulkOrder() {
    const os = new Set(); let n = 0;
    L.items.sel.forEach((id) => { const i = BY[id]; VS.filter((v) => i.q[v] !== null && inV(v)).forEach((v) => { const q = needQty(i, v); if (q) { os.add(addToDraft(i.s, v, [{ i: id, q, px: i.px }]).id); n++; } }); });
    if (!n) return toast('Nothing to add: the selected items are at par or already on order');

  },
  expItems(d) {
    const list = d.only ? ITEMS.filter((i) => L.items.sel.has(i.id)) : itemList();
    csv(`stockroom-catalogue-${iso(now())}.csv`, ['SKU', 'Product', 'Category', 'Supplier', 'Unit', 'Unit price EUR', 'In stock', 'Min', 'Par', 'Stock value EUR', 'Status', 'Venue'], list.map((i) => [i.sku, i.n, i.cat, sup(i.s).n, i.u, i.px.toFixed(2), qOf(i, venue), minOf(i, venue), parOf(i, venue), (qOf(i, venue) * i.px).toFixed(2), SL[stat(i, venue)][0], venue === 'all' ? 'All venues' : VEN[venue]]));
  },
  expOrders(d) { const list = d.only ? PO.filter((o) => L.orders.sel.has(o.id)) : orderList(); csv(`stockroom-orders-${iso(now())}.csv`, ['PO', 'Supplier', 'Venue', 'Created', 'Delivery', 'Status', 'Lines', 'Net total EUR'], list.map((o) => ['PO-' + o.id, sup(o.s).n, VEN[o.v], isoT(o.created), iso(o.expected), PS[o.st][0], o.lines.length, poTotal(o).toFixed(2)])); },
  expPO() { const o = curPO(); csv(`PO-${o.id}.csv`, ['Line', 'SKU', 'Product', 'Quantity', 'Unit', 'Unit price EUR', 'Line total EUR'], o.lines.map((l, k) => [k + 1, BY[l.i].sku, BY[l.i].n, l.q, BY[l.i].u, l.px.toFixed(2), (l.q * l.px).toFixed(2)])); },
  expWaste() { csv(`stockroom-waste-${iso(now())}.csv`, ['Date', 'Venue', 'Product', 'Quantity', 'Unit', 'Value EUR', 'Reason', 'Note', 'Logged by'], WASTE.filter((w) => inV(w.v)).map((w) => [isoT(w.at), VEN[w.v], BY[w.i].n, w.q, BY[w.i].u, w.val.toFixed(2), w.reason, w.note, w.by])); },
  expSup() { csv(`stockroom-suppliers-${iso(now())}.csv`, ['Supplier', 'City', 'Lead time days', 'Delivery days', 'Minimum order EUR', 'Terms', 'Reliability', 'On-time %', 'Fill rate %', 'Spend 8 weeks EUR'], SUP.map((x) => { const r = reli(x); return [x.n, x.city, x.lead, days(x), x.mov, x.terms, r.score, (r.ot * 100).toFixed(1), (r.fill * 100).toFixed(1), spend(x).toFixed(2)]; })); },
  expRules() { const v = L.rules.v; csv(`stockroom-reorder-rules-${v === 'center' ? 'wien' : 'muenchen'}.csv`, ['SKU', 'Product', 'Unit', 'On hand', 'Min', 'Par', 'Suggested min', 'Suggested par'], ITEMS.filter((i) => i.q[v] !== null).map((i) => [i.sku, i.n, i.u, i.q[v], i.min[v], i.par[v], sugMin(i, v), sugPar(i, v)])); },
  expRep() { const ws = [...Array(rep)].map((_, k) => 8 - rep + k); csv(`stockroom-food-cost-${iso(now())}.csv`, ['Week', 'Week starting', 'Revenue EUR', 'Consumption EUR', 'Food cost %', 'Purchases EUR', 'Waste EUR', ...CATS.map((c) => c + ' EUR')], ws.map((x) => [WKL(x), iso(dAt(x * 7)), revW(x).toFixed(0), consW(x).toFixed(2), (fcW(x) * 100).toFixed(1), purW(x).toFixed(2), sumBy(wasteIn(x * 7, x * 7 + 6), (w) => w.val).toFixed(2), ...CATS.map((c) => consW(x, c).toFixed(2))])); },
  rep(d) { rep = +d.v; view(); },
  print() { window.print(); },
  poEdit() { const o = curPO(); editPO = editPO === o.id ? null : o.id; view(); },
  poSend() { sendPO(curPO()); },
  poConfirm() { const o = curPO(); o.st = 'confirmed'; o.log.push(['confirmed', now(), me().n]); toast(`PO-${o.id} marked as confirmed by ${sup(o.s).n}`); render(); },
  poCancel() { const o = curPO(), prev = o.st; confirmBox(`Cancel PO-${o.id}?`, `${esc(sup(o.s).n)} will be told not to deliver. Stock suggestions will include these lines again.`, 'Cancel order', () => { o.st = 'cancelled'; o.log.push(['cancelled', now(), me().n]); render(); undo(`PO-${o.id} cancelled`, () => { o.st = prev; o.log.pop(); }); }, true, 'Keep order'); },
  poDelete() { const o = curPO(); confirmBox(`Delete draft PO-${o.id}?`, `${pl(o.lines.length, 'line')} worth ${eur(poTotal(o))} will be removed.`, 'Delete draft', () => { const k = PO.indexOf(o); PO.splice(k, 1); go('orders'); undo(`Draft PO-${o.id} deleted`, () => PO.splice(k, 0, o)); }, true, 'Keep draft'); },
  poDup() { const o = curPO(), n = newPO(o.s, o.v); n.lines = o.lines.map((l) => ({ i: l.i, q: l.q, px: BY[l.i].px })); editPO = n.id; toast(`Draft PO-${n.id} created from PO-${o.id} at current prices`); go('po', n.id); },
  poDel(d) { const o = curPO(); o.lines.splice(+d.k, 1); view(); },
  poAdd() { const o = curPO(), i = BY[+$('#po-add').value], n = num($('#po-q').value); if (!i) return; const e = qtyErr(i, n); if (e) { $('#po-q').classList.add('bad'); $('#po-err').textContent = e; $('#po-q').focus(); return; } o.lines.push({ i: i.id, q: n, px: i.px }); view(); $('#po-add')?.focus(); },
  rcvAll() { const o = curPO(); RC[o.id].lines.forEach((x, k) => { x.d = String(o.lines[k].q); x.p = String(o.lines[k].px); x.c = 'ok'; }); view(); },
  rcvDo,
  cntF(d) { L.count.f = d.v; view(); },
  cntDiscard() { confirmBox('Discard this count?', 'Counted quantities will be lost. Stock levels stay as they are.', 'Discard count', () => { CNT = null; render(); toast('Count discarded'); }, true, 'Keep counting'); },
  cntSubmit() {
    const todo = CNT.lines.filter((l) => l.cnt === '');
    const sub = () => { todo.forEach((l) => { l.cnt = l.exp; }); CNT.st = 'submitted'; CNT.sub = now(); CNT.subBy = me().n; notify(`${me().n} submitted the stock count for ${VEN[CNT.v]} (net variance ${eur(cVar(CNT))})`, 'list', { page: 'count' }); render(); toast(can('approve') ? 'Count submitted. Review and approve.' : 'Count submitted for approval'); };
    if (todo.length) confirmBox(`${pl(todo.length, 'line')} not counted`, 'Lines left blank will be treated as matching the expected quantity. Submit anyway?', 'Submit', sub, false, 'Keep counting'); else sub();
  },
  cntReturn() { CNT.st = 'open'; render(); toast('Count returned for recount'); },
  cntApprove() {
    if (!can('approve')) return toast(PERM.approve[1]);
    let val = 0; CNT.lines.forEach((l) => { const i = BY[l.i], adj = l.cnt - l.exp; if (adj && i.q[CNT.v] !== null) { i.q[CNT.v] = Math.max(0, rq(i, i.q[CNT.v] + adj)); CONS[CNT.v][7][i.cat] -= adj * i.px; val += adj * i.px; } });
    COUNTS.unshift({ id: 'SC-' + (31 + COUNTS.length), v: CNT.v, scope: CNT.scope, by: CNT.by, appr: me().n, started: CNT.started, done: now(), lines: CNT.lines.map((l) => ({ ...l })) });
    toast(`Count approved: ${val < 0 ? MINUS : '+'}${eur(Math.abs(val))} posted to ${VEN[CNT.v]}`); CNT = null; render();
  },
  countD(d) {
    const c = COUNTS.find((x) => x.id === d.id), vr = c.lines.filter((l) => l.cnt !== l.exp).sort((a, b) => Math.abs((b.cnt - b.exp) * BY[b.i].px) - Math.abs((a.cnt - a.exp) * BY[a.i].px));
    drawer(`<div class="dh"><div class="cell-main"><h2>Stock count ${c.id}</h2><span>${VEN[c.v]} · ${c.scope} · ${DF.format(c.started)}</span></div><button class="ib" data-act="closeD" aria-label="Close">${ic('x')}</button></div><div class="db">${kv(`Counted by`,`${esc(c.by)}`)}${kv(`Approved by`,`${esc(c.appr)}, ${DF.format(c.done)}`)}${kv(`Lines`,`${c.lines.length}`)}<div class="kv"><span>Net variance</span><b class="${cVar(c) < 0 ? 'neg' : 'pos'}">${eur(cVar(c))}</b></div>
<h3 class="h3">Lines with variance (${vr.length})</h3>${vr.map((l) => { const i = BY[l.i], dv = l.cnt - l.exp; return `<div class="mv"><span>${esc(i.n)}<small>Expected ${fq(l.exp, i.u)}, counted ${fq(l.cnt, i.u)}</small></span><b class="${dv < 0 ? 'neg' : 'pos'}">${dv > 0 ? '+' : MINUS}${eur(Math.abs(dv * i.px))}</b></div>`; }).join('') || '<p class="empty">Every line matched.</p>'}</div>`);
  },
  rulesV(d) { L.rules.v = d.v; view(); },
  rulesSug() { const v = L.rules.v; ITEMS.filter((i) => i.q[v] !== null && ruleGap(i, v) && (L.rules.cat === 'All' || i.cat === L.rules.cat)).forEach((i) => { RP[v][i.id] = { min: String(sugMin(i, v)), par: String(sugPar(i, v)) }; }); view(); toast('Suggestions applied. Review, then save.'); },
  rulesDiscard() { RP[L.rules.v] = {}; view(); },
  rulesSave() {
    if (!can('rules')) return toast(PERM.rules[1]);
    const v = L.rules.v, ids = Object.keys(RP[v]).map(Number), bad = ids.filter((id) => ruleErr(RP[v][id]));
    if (bad.length) { L.rules.q = ''; L.rules.cat = 'All'; view(); $(`[data-rule="min:${bad[0]}"]`)?.focus(); return toast(`Check ${pl(bad.length, 'highlighted row')} before saving`); }
    const old = ids.map((id) => [id, BY[id].min[v], BY[id].par[v]]);
    ids.forEach((id) => { BY[id].min[v] = num(RP[v][id].min); BY[id].par[v] = num(RP[v][id].par); });
    RP[v] = {}; logE(`${me().n} updated ${pl(ids.length, 'reorder rule')} at ${VEN[v]}`, 'sliders'); render();
    undo(`Saved ${pl(ids.length, 'rule')} for ${VEN[v]}`, () => old.forEach(([id, m, p]) => { BY[id].min[v] = m; BY[id].par[v] = p; }));
  },
  editSup: supForm,
  syncRetry() { const sp = sup(R.id); sp.sync = 2; view(); setTimeout(() => { sp.sync = 0; logE(`Price list from ${sp.n} imported`, 'check', `supd:${sp.id}`); if (R.page === 'supd') view(); toast(`Price list from ${sp.n} imported: 10 prices checked, no changes`); }, 1200); },
};

/* events */
document.addEventListener('click', (e) => {
  const t = e.target;
  if ($('#pop') && !t.closest('#pop') && !t.closest('[data-act=bell],[data-act=user],[data-act=more],#gq')) closePop();
  if (t.closest('[data-stop]')) return;
  const lk = t.closest('[data-lock]'); if (lk) return toast(PERM[lk.dataset.lock][1]);
  const act = t.closest('[data-act]'); if (act) { const f = ACT[act.dataset.act]; if (f) { if (act.closest('#pop') && !['readAll'].includes(act.dataset.act)) closePop(); f(act.dataset, act); } return; }
  const g = t.closest('[data-go]'); if (g) { closeModal(); const [p, id] = g.dataset.go.split(':'); return go(p, id ? +id : null); }
  const a = t.closest('[data-page]'); if (a) { closeModal(); return go(a.dataset.page); }
  const it = t.closest('[data-item]'); if (it) { closeModal(); return openItem(+it.dataset.item); }
});
document.addEventListener('submit', (e) => {
  e.preventDefault();
  ({ sform: doSignin, pf: () => saveItem(e.target), nf: saveNewPO, wf: saveWaste, sf: saveSup, cf: () => {
    const v = $('#c-v').value, sc = $('#c-s').value;
    CNT = { v, scope: sc === 'All' ? 'Full count' : sc + ' only', blind: $('#c-b').checked, st: 'open', started: now(), by: me().n, lines: ITEMS.filter((i) => i.q[v] !== null && (sc === 'All' || i.cat === sc)).map((i) => ({ i: i.id, exp: i.q[v], cnt: '' })) };
    L.count = { q: '', f: 'all' }; render(); toast(`Count started: ${pl(CNT.lines.length, 'line')} at ${VEN[v]}`);
  } })[e.target.id]?.();
});
document.addEventListener('change', (e) => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'venue') { venue = t.value; L.items.p = L.orders.p = L.waste.p = 1; L.items.sel.clear(); L.orders.sel.clear(); return render(); }
  if (ds.sel) { const s = L[ds.sel].sel; t.checked ? s.add(+t.value) : s.delete(+t.value); view(); return $(`[data-sel="${ds.sel}"][value="${t.value}"]`)?.focus(); }
  if (ds.selall) { const s = L[ds.selall]; s.ids.forEach((id) => t.checked ? s.sel.add(id) : s.sel.delete(id)); view(); return $(`[data-selall="${ds.selall}"]`)?.focus(); }
  if (ds.f) { const s = L[ds.k]; s[ds.f] = t.value; if ('p' in s) s.p = 1; view(); return $(`[data-f="${ds.f}"][data-k="${ds.k}"]`)?.focus(); }
  if (t.name === 'role') { srole = t.value; $$('.role').forEach((r) => r.classList.toggle('on', r.querySelector('input').checked)); $('#se').value = USERS[srole].e; fErr('se', ''); return; }
  if (t.id === 'w-v') { $('#w-i').innerHTML = wasteOpts(t.value); return wHint(); }
  if (t.id === 'w-i') return wHint();
  if (t.id === 'n-s') { const sp = sup(+t.value); $('#n-v').innerHTML = window.__venOpts(sp); $('#n-d').value = iso(nextDelivery(sp)); $('#n-h').textContent = `Earliest with ${pl(sp.lead, 'day')} lead time: ${WD.format(dAt(TI + sp.lead))}`; fErr('n-v', ''); fErr('n-d', ''); }
});
document.addEventListener('input', (e) => {
  const t = e.target, ds = t.dataset;
  if (t.id === 'gq') { gq = t.value; return gsearch(); }
  if (ds.q) { const k = ds.q; L[k].q = t.value; if ('p' in L[k]) L[k].p = 1; const pos = t.selectionStart; view(); const n = $(`[data-q="${k}"]`); n.focus(); n.setSelectionRange(pos, pos); return; }
  if (ds.rf) { RC[R.id][ds.rf] = t.value; fErr(t.id, ''); return rcvRefresh(curPO()); }
  if (ds.rc) { const [f, k] = ds.rc.split(':'); RC[R.id].lines[+k][{ d: 'd', p: 'p', c: 'c' }[f]] = t.value; return rcvRefresh(curPO()); }
  if (ds.cn) { const l = CNT.lines[+ds.cn], i = BY[l.i], n = num(t.value), bad = t.value.trim() !== '' && (isNaN(n) || n < 0 || (isInt(i) && n % 1)); t.classList.toggle('bad', bad); t.title = bad ? (isInt(i) ? `Whole ${i.u} only` : 'Enter 0 or more') : ''; l.cnt = t.value.trim() === '' || bad ? '' : n; $('#cv-' + ds.cn).innerHTML = cVarQ(l); $('#ce-' + ds.cn).innerHTML = cVarE(l); $('#cprog').innerHTML = cProg(); return; }
  if (ds.rule) {
    const [f, id] = ds.rule.split(':'), i = BY[+id], v = L.rules.v, r = { ...ruleVal(i, v), [f]: t.value };
    if (num(r.min) === i.min[v] && num(r.par) === i.par[v]) delete RP[v][id]; else RP[v][id] = r;
    const er = RP[v][id] ? ruleErr(r) : ''; $('#re-' + id).textContent = er; $$(`[data-rule$=":${id}"]`).forEach((x) => x.classList.toggle('bad', !!er)); t.closest('.tr').classList.toggle('chg', !!RP[v][id]);
    $('#savebar').innerHTML = saveBar(); return;
  }
  if (ds.pol) { const o = curPO(), l = o.lines[+ds.pol], n = num(t.value), er = qtyErr(BY[l.i], n); t.classList.toggle('bad', !!er); $('#po-err').textContent = er ? `${BY[l.i].n}: ${er}` : ''; if (!er) { l.q = n; $('#pol-t-' + ds.pol).textContent = eur(n * l.px); $('#po-tot').textContent = eur(poTotal(o)); } return; }
  if (t.id === 'po-q') { t.classList.remove('bad'); $('#po-err').textContent = ''; }
  if (t.closest('.field.bad')) fErr(t.id, '');
});
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if ($('#scrim')) return; if ($('#pop')) { const a = popA; closePop(); a?.focus?.(); return; } if ($('#drawer')) closeDrawer(); return; }
  if (!authed) return;
  if (e.key === '/' && !e.target.matches('input,textarea,select') && !$('#scrim')) { e.preventDefault(); ($('#view .search') || $('#gq'))?.focus(); return; }
  if (e.key === 'Enter' && e.target.id === 'gq') { e.preventDefault(); $('#pop.gsp .mi')?.click(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[tabindex][data-item],[tabindex][data-go],[tabindex][data-page],[tabindex][data-act]') && !e.target.matches('button,input,select')) { e.preventDefault(); e.target.click(); }
}, true);
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { closePop(); if (authed && $('#view [data-chart]')) view(); }, 150); });

/* reconciliation: every number must agree with every other one */
function check() {
  const low = lowItems('all').length;
  console.assert(low === new Set(lowLines().map((x) => x.i.id)).size, 'below-min count matches stock lines');
  console.assert(Math.abs(stockVal('all') - stockVal('center') - stockVal('north')) < .01, 'stock value adds up across venues');
  console.assert(ITEMS.every((i) => VS.every((v) => i.q[v] === null || i.q[v] >= 0)), 'no negative stock');
  console.assert(+($('#nav [data-page="today"] .count')?.textContent || 0) === low, 'nav badge matches below-min count');
  console.assert(PO.every((o) => !o.rcv || o.rcv.lines.every((l) => l.acc <= l.dlv + 1e-9)), 'accepted never exceeds delivered');
  console.assert(suggestions().every((d) => d.lines.every((l) => l.q > 0 && BY[l.i].q[d.v] + incoming(l.i, d.v) < BY[l.i].par[d.v])), 'suggestions refill to par');
  console.assert(Math.abs(sumBy(VS, (v) => sumBy(CATS, (c) => CONS[v][7][c])) - (venue === 'all' ? consW(7) : sumBy(VS, (v) => sumBy(CATS, (c) => CONS[v][7][c])))) < .01, 'consumption adds up');
}

/* live kitchens: stock is used all day, so statuses and suggestions move on their own */
function safeRender(force) {
  if (!authed) return;
  const busy = $('#scrim') || $('#drawer') || $('#pop') || document.activeElement?.matches('input,select,textarea');
  chrome(); if (!$('#pop') && document.activeElement?.id !== 'gq') topbar();
  if (!busy && (['today', 'items'].includes(R.page) || (force && ['po', 'orders', 'receive'].includes(R.page))) && !loading) view();
}
setInterval(() => {
  if (!authed || document.hidden) return;
  const pool = []; ITEMS.forEach((i) => VS.forEach((v) => { if (i.q[v] > 0 && i.u !== 'keg') pool.push([i, v]); }));
  const [i, v] = pool[Math.floor(Math.random() * pool.length)], was = stat1(i, v);
  const u = Math.min(i.q[v], isInt(i) ? 1 + Math.floor(Math.random() * 3) : [.5, 1, 1.5][Math.floor(Math.random() * 3)]);
  i.q[v] = rq(i, i.q[v] - u); CONS[v][7][i.cat] += u * i.px;
  if (was !== 'low' && stat1(i, v) === 'low') notify(`${i.n} at ${VEN[v]} fell below minimum (${fq(i.q[v], i.u)} left)`, 'alert', { item: i.id });
  safeRender();
}, 5000);
render();
