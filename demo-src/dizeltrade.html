<!DOCTYPE html>
<html lang="en" data-theme="dark" data-fx="banner">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DizelTrade ERP — demo</title>
<meta name="description" content="Demo: diesel fuel, trip and customer order management. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root { --display: "Unbounded", "Onest", system-ui, sans-serif; --accent: #c8f03c; }
.big, .kpi b { font-weight: 600; }
.tank-wrap { display: flex; gap: 22px; align-items: stretch; }
.tank { flex: none; }
.tank-list { flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-width: 0; }
.tank-list dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; }
.tank-list dt { color: var(--muted); } .tank-list dd { text-align: right; font-weight: 600; }
.trip { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; }
.trip + .trip { border-top: 1px solid var(--rule); }
.trip-ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--raised); color: var(--accent); }
.trip b { display: block; font-weight: 600; } .trip span { color: var(--muted); font-size: 13px; }
.load { display: inline-flex; align-items: center; gap: 8px; }
@media (max-width: 899px) { .trip { grid-template-columns: 36px 1fr; } .trip .btn { grid-column: 2; justify-self: start; } .tank-wrap { flex-direction: row; } }

.feedl { margin-top: 18px; border-top: 1px solid var(--rule); padding-top: 10px; } .feedl li { display: grid; grid-template-columns: 48px 1fr; gap: 8px; padding: 6px 0; color: var(--muted); font-size: 13px; } .feedl li b { color: var(--faint); font-weight: 500; } .feedl li:first-child { color: var(--text); animation: pop .3s var(--ease) both; }
.map { width: 100%; height: auto; display: block; margin: -4px 0 8px; }
.map .rt { stroke: var(--border); stroke-width: 2; stroke-dasharray: 3 6; fill: none; } .map .rt.on { stroke: var(--accent); opacity: .55; }
.map .site { fill: var(--raised); stroke: var(--faint); stroke-width: 2; } .map text { font: 12px var(--font); fill: var(--faint); }
.map .hub { fill: var(--accent); } .map .mk { fill: var(--accent); stroke: var(--bg); stroke-width: 3; } .map .pulse { fill: var(--accent); opacity: .25; animation: mp 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes mp { from { transform: scale(.6); opacity: .45; } to { transform: scale(2.2); opacity: 0; } }
.tp { height: 4px; border-radius: 2px; background: var(--raised); margin-top: 6px; overflow: hidden; } .tp i { display: block; height: 100%; background: var(--accent); transition: width 1.4s linear; }
</style>
</head>
<body>
<div class="notice"><b>Demo</b> DizelTrade ERP · sample data</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 01-12 0c0-4.5 6-11 6-11z"/></svg></div>
      <div><div class="brand-name">DizelTrade</div><div class="brand-sub">Leipzig Base</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="avatar">KB</div><div class="who"><b>K. Brandt</b><span>Partner · full access</span></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<script>
/*@kit.js*/
'use strict';

/* ── data ─────────────────────────────────────────────── */
const CAP = 2500;
const TODAY = '10.06.2026';
const S = {
  stockJun1: 1267,            // 1 June: 1 267 + 120 received − 540 shipped = 847
  shippedJun: 540,
  orders: [
    { id: 101, client: 'Baumann Bau GmbH',       date: '05.06.2026', total: 400,  delivered: 370,  transit: 20, sites: ['Wrocław', 'Hanover'],  price: 1640 },
    { id: 102, client: 'Kowalski Trans Sp. z o.o.',      date: '12.05.2026', total: 250,  delivered: 195,  transit: 12, sites: ['Prague'],                price: 1590 },
    { id: 103, client: 'Rheinkies Steinbruch GmbH', date: '20.05.2026', total: 600,  delivered: 510,  transit: 18, sites: ['Frankfurt', 'Nuremberg'],  price: 1580 },
    { id: 104, client: 'Leipzig Airport Services GmbH', date: '01.06.2026', total: 180,  delivered: 155,  transit: 0,  sites: ['Leipzig · airport'],       price: 1720 },
    { id: 105, client: 'Agrar Vlček s.r.o.',      date: '15.04.2026', total: 1200, delivered: 1150, transit: 0,  sites: ['Leipzig · depot', 'Berlin'],  price: 1550 },
  ],
  trucks: [
    { id: 1, name: 'MAN TGS 26.470',  plate: 'L-DT 412', owner: 'DTL',   tank: 20, driver: 'Schneider A. M.',   status: 'transit', last: 'Wrocław',     trips: 14 },
    { id: 2, name: 'Volvo FH 460',    plate: 'DD-FT 185', owner: 'DTL',   tank: 14, driver: 'Nowak S. P.',   status: 'base',    last: 'Prague',    trips: 11 },
    { id: 3, name: 'Scania R 450', plate: 'BA 741 KP', owner: 'DTL',   tank: 16, driver: 'De Vries R. J.', status: 'free',    last: 'Frankfurt', trips: 9 },
    { id: 4, name: 'DAF XF 480',  plate: 'WRO 329M', owner: 'Hoffmann', tank: 18, driver: 'Schneider A. M.',   status: 'transit', last: 'Nuremberg',    trips: 7 },
    { id: 5, name: 'Mercedes Actros 2545',   plate: 'PZ 558KH', owner: 'Hoffmann', tank: 12, driver: 'Moreau P. L.',  status: 'transit', last: 'Prague',    trips: 6 },
    { id: 6, name: 'Iveco S-Way 460',  plate: 'L-DT 770', owner: 'Hoffmann', tank: 16, driver: 'Rossi D. A.',  status: 'base',    last: 'Berlin',      trips: 8 },
  ],
  trips: [
    { id: 9, truck: 1, order: 101, site: 'Wrocław',     vol: 20, date: '10.06.2026', status: 'transit' },
    { id: 8, truck: 4, order: 103, site: 'Nuremberg',    vol: 18, date: '10.06.2026', status: 'transit' },
    { id: 7, truck: 5, order: 102, site: 'Prague',    vol: 12, date: '09.06.2026', status: 'transit' },
    { id: 6, truck: 1, order: 101, site: 'Wrocław',     vol: 20, date: '02.06.2026', status: 'done' },
    { id: 5, truck: 2, order: 102, site: 'Prague',    vol: 14, date: '28.05.2026', status: 'done' },
    { id: 4, truck: 3, order: 103, site: 'Frankfurt', vol: 16, date: '25.05.2026', status: 'done' },
    { id: 3, truck: 4, order: 101, site: 'Hanover', vol: 18, date: '20.05.2026', status: 'done' },
  ],
  receipts: [
    { id: 4, src: 'Nordfuel Leipzig', vol: 150, ttn: 'BOL-2026-1901', date: '08.06.2026', ok: false, jun: true },
    { id: 1, src: 'Nordfuel Leipzig', vol: 120, ttn: 'BOL-2026-1842', date: '03.06.2026', ok: true,  jun: true },
    { id: 2, src: 'EuroDiesel Supply',   vol: 200, ttn: 'BOL-2026-1791', date: '27.05.2026', ok: true,  jun: false },
    { id: 3, src: 'Brenner Mineralöl (private)', vol: 80, ttn: 'BOL-2026-1780', date: '20.05.2026', ok: true,  jun: false },
  ],
  months: [['Jan', 210], ['Feb', 260], ['Mar', 360], ['Apr', 450], ['May', 610], ['Jun', 540]],  // shipped, m³ (June includes 50 on the road)
};
const STATUS = { transit: ['In transit', 'warn'], base: ['At base', ''], free: ['Available', 'pos'] };

/* derived: every figure is computed from the rows */
const receivedJun = () => S.receipts.filter((r) => r.ok && r.jun).reduce((s, r) => s + r.vol, 0);
const pendingRc = () => S.receipts.filter((r) => !r.ok);
const stock = () => S.stockJun1 + receivedJun() - S.shippedJun;
const transitTrips = () => S.trips.filter((t) => t.status === 'transit');
const transitVol = () => transitTrips().reduce((s, t) => s + t.vol, 0);
const delivered = () => S.orders.reduce((s, o) => s + o.delivered, 0);
const revenue = () => S.orders.reduce((s, o) => s + o.delivered * o.price, 0);
const avgPrice = () => revenue() / delivered();
const truck = (id) => S.trucks.find((t) => t.id === id);
const order = (id) => S.orders.find((o) => o.id === id);
const mln = (n) => fmtD(n / 1e6, 1);
const pctOf = (a, b) => (b ? Math.round((a / b) * 100) : 0);
console.assert(stock() === 847 && transitVol() === 50 && delivered() === 2380, 'seed data must reconcile');

/* ── tank gauge: the product's one thing ───────────────── */
function tankSVG(level) {
  const W = 84, H = 210, y0 = 6, ph = H - 12, fill = ph * level;
  const ticks = [0.25, 0.5, 0.75].map((t) => `<line x1="10" x2="26" y1="${y0 + ph * (1 - t)}" y2="${y0 + ph * (1 - t)}" stroke="var(--border)" stroke-width="2"/>`).join('');
  return `<svg class="tank" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${Math.round(level * 100)}% full of ${fmt(CAP)} m³">
    <rect x="1" y="${y0}" width="${W - 2}" height="${ph}" rx="14" fill="var(--raised)" stroke="var(--border)" stroke-width="2"/>
    <clipPath id="tk"><rect x="1" y="${y0}" width="${W - 2}" height="${ph}" rx="14"/></clipPath>
    <rect x="0" y="${y0 + ph - fill}" width="${W}" height="${fill}" fill="var(--accent)" clip-path="url(#tk)" style="transition:all .6s var(--ease)"/>
    ${ticks}</svg>`;
}

/* ── pages ────────────────────────────────────────────── */
const PAGES = {
  dashboard: ['Dashboard', 'home'], base: ['Base', 'drop'], orders: ['Orders', 'box'], fleet: ['Fleet', 'truck'], analytics: ['Analytics', 'chart'],
};
let page = 'dashboard', baseTab = 'receipts';

function chrome() {
  const pend = pendingRc().length;
  const item = (k, extra = '') => `<a data-page="${k}" role="link" tabindex="0">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span>${extra}</a>`;
  $('#nav').innerHTML = item('dashboard') + `<div class="nav-label">Base</div>` + item('base', pend ? `<span class="count" title="Awaiting confirmation">${pend}</span>` : '') + item('orders') + `<div class="nav-label">Operations</div>` + item('fleet') + item('analytics');
  $('#tabbar').innerHTML = Object.keys(PAGES).map((k) => `<a data-page="${k}" role="link" tabindex="0">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span>${k === 'base' && pend ? `<b class="count">${pend}</b>` : ''}</a>`).join('');
  setNav(page);
}

function render() {
  chrome();
  $('#main').innerHTML = ({ dashboard, base, orders, fleet, analytics })[page]();
  mountCharts();
  window.scrollTo(0, 0);
}
function go(p) { page = p; render(); }
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-page]'); if (a) { go(a.dataset.page); return; }
  const act = e.target.closest('[data-act]'); if (act) { act.blur(); ACT[act.dataset.act](act.dataset); return; }
  const row = e.target.closest('[data-open]'); if (row) openOrder(+row.dataset.open);
  const tab = e.target.closest('[data-tab]'); if (tab) { baseTab = tab.dataset.tab; render(); }
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-page]')) { e.preventDefault(); go(e.target.dataset.page); } });

const head = (title, sub, actions = '') => `<header class="head"><div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></header>`;
const mainActions = `<button class="btn" data-act="newTrip">${ic('truck')}New trip</button><button class="btn primary" data-act="newReceipt">${ic('plus')}Log fuel receipt</button>`;

function dashboard() {
  const pend = pendingRc();
  const pv = pend.reduce((s, r) => s + r.vol, 0);
  const trips = transitTrips();
  const level = stock() / CAP;
  return head('Dashboard', `${TODAY} · Leipzig base`, mainActions) +
    (pend.length ? `<div class="finding">${ic('alert')}<span>Receipt ${esc(pend[0].ttn)} from ${esc(pend[0].src)}, ${pend[0].vol} m³, awaiting confirmation. Base stock will then be ${fmt(stock() + pv)} m³.</span><button class="btn sm" data-act="confirmRc" data-id="${pend[0].id}">Confirm</button></div>` : '') +
    `<div class="kpis">
      <div class="kpi"><b>€${mln(revenue())}<small>M</small></b><span>Revenue on delivered fuel</span></div>
      <div class="kpi"><b>${fmt(delivered())}<small>m³</small></b><span>Delivered to customers</span></div>
      <div class="kpi"><b>${S.orders.length}</b><span>Active orders</span></div>
    </div>
    <div class="grid">
      <section class="card c5"><div class="card-h"><h2>Base stock</h2><span>capacity ${fmt(CAP)} m³</span></div>
        <div class="tank-wrap">${tankSVG(level)}
          <div class="tank-list"><div><div class="big">${fmt(stock())}<small>m³</small></div><div class="muted" style="margin-top:6px">${pctOf(stock(), CAP)}% of capacity</div></div>
            <dl><dt>Received in June</dt><dd class="pos">${signed(receivedJun())}</dd><dt>Shipped in June</dt><dd>${signed(-S.shippedJun)}</dd><dt>Awaiting receipt</dt><dd class="${pv ? 'warn' : 'muted'}">${pv ? fmt(pv) : '—'}</dd></dl></div></div>
        <ul class="feedl" aria-label="Events">${LOG.slice(0, 5).map(([h, x]) => `<li><b>${h}</b><span>${esc(x)}</span></li>`).join('')}</ul>
      </section>
      <section class="card c7"><div class="card-h"><h2>Trips on the road${trips.length ? ` · ${trips.length}` : ''}</h2><span>${fmt(transitVol())} m³ on the road</span></div>
        ${mapSVG()}${trips.length ? trips.map((t) => `<div class="trip"><div class="trip-ic">${ic('truck')}</div><div><b>${esc(truck(t.truck).name)} → ${esc(t.site)}</b><span>${esc(truck(t.truck).driver)} · ${t.vol} m³ · left ${t.date.slice(0, 5)}</span><div class="tp"><i data-tp="${t.id}" style="width:${Math.round((TP[t.id] || 0) * 100)}%"></i></div></div><button class="btn sm" data-act="deliver" data-id="${t.id}">${ic('check')}Delivered</button></div>`).join('') : `<div class="empty">All trips delivered.<br><button class="btn sm" style="margin-top:10px" data-act="newTrip">Create trip</button></div>`}
      </section>
      <section class="card c7"><div class="card-h"><h2>Monthly shipments, m³</h2><span>June includes trips on the road</span></div><div id="ch-months"></div></section>
      <section class="card c5"><div class="card-h"><h2>Order fulfilment</h2><span>delivered of ordered</span></div>
        ${S.orders.map((o) => barRow(esc(o.client), pctOf(o.delivered, o.total), `${pctOf(o.delivered, o.total)}%`, `${fmt(o.delivered)} of ${fmt(o.total)} m³`)).join('')}
      </section>
    </div>`;
}

function base() {
  const rc = `<div class="tbl" style="--cols:92px 1.4fr 1.2fr 80px 130px;--colsm:1.4fr 70px 110px">
      <div class="tr th"><span class="hm">Date</span><span>Supplier</span><span class="hm">BOL</span><span class="r">m³</span><span class="r">Status</span></div>
      ${S.receipts.map((r) => `<div class="tr"><span class="hm muted">${r.date}</span><span class="cell-main"><b>${esc(r.src)}</b><span class="hm" style="display:none"></span></span><span class="hm muted">${esc(r.ttn)}</span><span class="r">${r.vol}</span><span class="r">${r.ok ? '<span class="pill pos"><i></i>Received</span>' : `<button class="btn sm primary" data-act="confirmRc" data-id="${r.id}">Receive</button>`}</span></div>`).join('')}</div>`;
  const tr = `<div class="tbl" style="--cols:92px 1.3fr 1.2fr 1fr 70px 110px;--colsm:1.2fr 1fr 60px">
      <div class="tr th"><span class="hm">Date</span><span>Truck</span><span class="hm">Driver</span><span>Site</span><span class="r">m³</span><span class="r hm">Status</span></div>
      ${S.trips.map((t) => `<div class="tr"><span class="hm muted">${t.date}</span><span class="cell-main"><b>${esc(truck(t.truck).name)}</b></span><span class="hm muted">${esc(truck(t.truck).driver)}</span><span>${esc(t.site)}</span><span class="r">${t.vol}</span><span class="r hm">${t.status === 'transit' ? '<span class="pill warn"><i></i>In transit</span>' : '<span class="pill pos"><i></i>Delivered</span>'}</span></div>`).join('')}</div>`;
  return head('Base', `Stock ${fmt(stock())} of ${fmt(CAP)} m³ · ${pctOf(stock(), CAP)}%`, mainActions) +
    `<div class="card" style="margin-bottom:var(--gap)"><div class="bar thick"><i style="width:${pctOf(stock(), CAP)}%"></i></div>
      <div style="display:flex;justify-content:space-between;margin-top:10px" class="muted"><span>0</span><span>${fmt(CAP / 2)}</span><span>${fmt(CAP)} m³</span></div></div>
    <div class="tabs" role="tablist"><button data-tab="receipts" class="${baseTab === 'receipts' ? 'on' : ''}">Receipts</button><button data-tab="trips" class="${baseTab === 'trips' ? 'on' : ''}">Trips</button></div>
    <div class="card">${baseTab === 'receipts' ? rc : tr}</div>`;
}

function orders() {
  return head('Customer orders', `${S.orders.length} active · ${fmt(S.orders.reduce((s, o) => s + o.total, 0))} m³ ordered`, `<button class="btn primary" data-act="newTrip">${ic('truck')}New trip</button>`) +
    `<div class="card"><div class="tbl" style="--cols:1.4fr 100px 1.3fr 130px 130px;--colsm:1.3fr 110px">
      <div class="tr th"><span>Customer</span><span class="hm">Date</span><span class="hm">Fulfilment</span><span class="r">Delivered</span><span class="r hm">Amount, €</span></div>
      ${S.orders.map((o) => `<div class="tr" data-open="${o.id}"><span class="cell-main"><b>${esc(o.client)}</b><span>${esc(o.sites.join(', '))}</span></span><span class="hm muted">${o.date}</span><span class="hm"><div class="bar"><i style="width:${pctOf(o.delivered, o.total)}%"></i></div></span><span class="r">${fmt(o.delivered)} <span class="muted">/ ${fmt(o.total)}</span></span><span class="r hm">€${fmt(o.total * o.price)}</span></div>`).join('')}</div></div>`;
}

function fleet() {
  const n = (s) => S.trucks.filter((t) => t.status === s).length;
  return head('Fleet', `${S.trucks.length} trucks · ${n('transit')} in transit, ${n('base') + n('free')} available to assign`, `<button class="btn primary" data-act="newTrip">${ic('plus')}New trip</button>`) +
    `<div class="card"><div class="tbl" style="--cols:1.3fr 90px 70px 1.2fr 1fr 80px 120px;--colsm:1.2fr 100px">
      <div class="tr th"><span>Truck</span><span class="hm">Owner</span><span class="hm r">Tank, m³</span><span class="hm">Driver</span><span class="hm">Last site</span><span class="hm r">Trips</span><span class="r">Status</span></div>
      ${S.trucks.map((t) => `<div class="tr"><span class="cell-main"><b>${esc(t.name)}</b><span>${esc(t.plate)}</span></span><span class="hm muted">${esc(t.owner)}</span><span class="hm r">${t.tank}</span><span class="hm">${esc(t.driver)}</span><span class="hm muted">${esc(t.last)}</span><span class="hm r">${t.trips}</span><span class="r"><span class="pill ${STATUS[t.status][1]}"><i></i>${STATUS[t.status][0]}</span></span></div>`).join('')}</div></div>`;
}

function analytics() {
  const best = S.months.reduce((a, b) => (b[1] > a[1] ? b : a));
  const rows = S.months.map(([m, v], i) => ({ m, v, d: i ? v - S.months[i - 1][1] : null, rev: v * avgPrice() }));
  return head('Analytics', 'Shipments and revenue year to date') +
    `<div class="kpis"><div class="kpi"><b>${fmt(S.months.reduce((s, m) => s + m[1], 0))}<small>m³</small></b><span>Shipped since January</span></div>
      <div class="kpi"><b>${best[0]}<small>${best[1]} m³</small></b><span>Best month</span></div>
      <div class="kpi"><b>€${fmt(avgPrice())}<small>/m³</small></b><span>Average sale price</span></div></div>
    <div class="grid"><section class="card c8"><div class="card-h"><h2>Shipments, m³ per month</h2></div><div id="ch-line"></div></section>
      <section class="card c4"><div class="card-h"><h2>Revenue by customer</h2><span>€ M</span></div>
        ${[...S.orders].sort((a, b) => b.delivered * b.price - a.delivered * a.price).map((o) => barRow(esc(o.client), (o.delivered * o.price) / (Math.max(...S.orders.map((x) => x.delivered * x.price))) * 100, '€' + mln(o.delivered * o.price))).join('')}</section>
      <section class="card c12"><div class="card-h"><h2>By month</h2><span>revenue at average price</span></div>
        <div class="tbl" style="--cols:1fr 1fr 1fr 1fr;--colsm:1fr 1fr 1fr"><div class="tr th"><span>Month</span><span class="r">m³</span><span class="r">Revenue, € M</span><span class="r hm">vs. previous month</span></div>
        ${rows.map((r) => `<div class="tr"><span>${r.m}${r.m === 'Jun' ? ' <span class="muted">(incomplete)</span>' : ''}</span><span class="r">${r.v}</span><span class="r">€${mln(r.rev)}</span><span class="r hm ${r.d > 0 ? 'pos' : r.d < 0 ? 'neg' : 'muted'}">${r.d == null ? '—' : signed(r.d) + ' m³'}</span></div>`).join('')}</div></section></div>`;
}

function mountCharts() {
  const labels = S.months.map((m) => m[0]), values = S.months.map((m) => m[1]);
  const a = $('#ch-months'); if (a) chart(a, (w) => barsSVG(w, { labels, values, unit: 'm³' }));
  const b = $('#ch-line'); if (b) chart(b, (w) => lineSVG(w, { labels, values }));
}

/* ── actions ──────────────────────────────────────────── */
/* ── live map: trucks drive along their routes; on arrival the trip closes by itself ─ */
const SITES = { 'Leipzig Base': [300, 150], 'Wrocław': [520, 60], 'Hanover': [90, 50], 'Prague': [490, 235], 'Frankfurt': [90, 235], 'Nuremberg': [320, 275], 'Berlin': [230, 25] };
let CLK = 14 * 60 + 36; const LOG = [['14:02', 'MAN TGS 26.470 left for Wrocław'], ['13:40', 'Mercedes Actros 2545 left for Prague'], ['12:15', 'Receipt BOL-2026-1901 awaiting confirmation']];
const clk = () => String(Math.floor(CLK / 60)).padStart(2, '0') + ':' + String(CLK % 60).padStart(2, '0');
const TP = { 9: .55, 8: .3, 7: .78 };
const pos = (site, p) => { const a = SITES['Leipzig Base'], b = SITES[site] || [300, 40]; return [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p]; };
function mapSVG() {
  const trips = transitTrips(), active = new Set(trips.map((t) => t.site));
  return `<svg class="map" viewBox="0 0 600 300" role="img" aria-label="Trips on the map">${Object.entries(SITES).filter(([n]) => n !== 'Leipzig Base').map(([n, [x, y]]) => `<line class="rt ${active.has(n) ? 'on' : ''}" x1="300" y1="150" x2="${x}" y2="${y}"/><circle class="site" cx="${x}" cy="${y}" r="7"/><text x="${x}" y="${y + (y > 150 ? 24 : -14)}" text-anchor="middle">${n}</text>`).join('')}
    <circle class="hub" cx="300" cy="150" r="10"/><text x="300" y="130" text-anchor="middle" style="fill:var(--text);font-weight:600">Leipzig Base</text>
    ${trips.map((t) => { const [x, y] = pos(t.site, TP[t.id] || 0); return `<g data-mk="${t.id}" transform="translate(${x} ${y})"><circle class="pulse" r="9"/><circle class="mk" r="8"/></g>`; }).join('')}</svg>`;
}
setInterval(() => {
  if (document.hidden || $('#scrim')) return;
  CLK++; let arrived = null;
  transitTrips().forEach((t) => { TP[t.id] = Math.min(1, (TP[t.id] || 0) + .012 + (t.id % 3) * .004); if (TP[t.id] >= 1 && !arrived) arrived = t; });
  if (arrived) { ACT.deliver({ id: arrived.id }); return; }
  if (page !== 'dashboard') return;
  transitTrips().forEach((t) => { const g = $(`[data-mk="${t.id}"]`), [x, y] = pos(t.site, TP[t.id] || 0); if (g) g.setAttribute('transform', `translate(${x} ${y})`); const b = $(`[data-tp="${t.id}"]`); if (b) b.style.width = Math.round((TP[t.id] || 0) * 100) + '%'; });
}, 1400);

const ACT = {
  deliver({ id }) {
    const t = S.trips.find((x) => x.id === +id); t.status = 'done';
    const o = order(t.order); o.transit -= t.vol; o.delivered += t.vol;
    truck(t.truck).status = 'base'; truck(t.truck).last = t.site; truck(t.truck).trips += 1;
    LOG.unshift([clk(), `${truck(t.truck).name} delivered ${t.vol} m³ to ${t.site}`]); toast(`Delivered: ${t.vol} m³ to ${t.site}`); render();
  },
  confirmRc({ id }) { const r = S.receipts.find((x) => x.id === +id); r.ok = true; toast(`Receipt confirmed: +${r.vol} m³ at base`); render(); },
  newReceipt() {
    modal(`<h2>Log fuel receipt</h2><p>The new receipt will be sent for confirmation.</p>
      <div class="field"><label>Supplier</label><select id="f-src"><option>Nordfuel Leipzig</option><option>EuroDiesel Supply</option><option>Brenner Mineralöl (private)</option></select></div>
      <div class="field"><label>Volume, m³</label><input id="f-vol" type="number" min="1" max="500" value="100"></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="f-ok">Save</button></div>`, () => {
      $('#f-ok').onclick = () => {
        const vol = +$('#f-vol').value; if (!(vol > 0)) return;
        S.receipts.unshift({ id: Date.now(), src: $('#f-src').value, vol, ttn: 'BOL-2026-' + (1902 + S.receipts.length - 4), date: TODAY, ok: false, jun: true });
        closeModal(); toast('Receipt saved, awaiting confirmation'); render();
      };
    });
  },
  newTrip(data = {}) {
    const free = S.trucks.filter((t) => t.status !== 'transit');
    if (!free.length) { toast('All trucks are in transit'); return; }
    modal(`<h2>New trip</h2><p>Fuel is deducted from base stock immediately. Base stock now: ${fmt(stock())} m³.</p>
      <div class="field"><label>Truck</label><select id="f-truck">${free.map((t) => `<option value="${t.id}">${esc(t.name)} · tank ${t.tank} m³</option>`).join('')}</select></div>
      <div class="field"><label>Order</label><select id="f-order">${S.orders.map((o) => `<option value="${o.id}">${esc(o.client)} · ${fmt(o.total - o.delivered - o.transit)} m³ left</option>`).join('')}</select></div>
      <div class="field"><label>Site</label><select id="f-site"></select></div>
      <div class="field"><label>Volume, m³</label><input id="f-vol" type="number" min="1" value="12"><span id="f-err" class="neg" style="font-size:13px"></span></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="f-ok">Dispatch trip</button></div>`, () => {
      const sync = () => {
        const o = order(+$('#f-order').value), t = truck(+$('#f-truck').value);
        $('#f-site').innerHTML = o.sites.map((s) => `<option>${esc(s)}</option>`).join('');
        $('#f-vol').max = t.tank; if (+$('#f-vol').value > t.tank) $('#f-vol').value = t.tank;
      };
      $('#f-order').onchange = sync; $('#f-truck').onchange = sync; sync();
      $('#f-ok').onclick = () => {
        const t = truck(+$('#f-truck').value), o = order(+$('#f-order').value), vol = +$('#f-vol').value, left = o.total - o.delivered - o.transit;
        const err = !(vol > 0) ? 'Enter a volume' : vol > t.tank ? `${t.name} tank holds ${t.tank} m³` : vol > stock() ? `Only ${fmt(stock())} m³ at base` : vol > left ? `Only ${left} m³ left on this order` : '';
        if (err) { $('#f-err').textContent = err; return; }
        S.trips.unshift({ id: Date.now(), truck: t.id, order: o.id, site: $('#f-site').value, vol, date: TODAY, status: 'transit' });
        t.status = 'transit'; o.transit += vol; S.shippedJun += vol;
        closeModal(); toast(`${t.name} dispatched: ${vol} m³`); render();
      };
    });
  },
};
function openOrder(id) {
  const o = order(id), trips = S.trips.filter((t) => t.order === id);
  modal(`<h2>${esc(o.client)}</h2><p>Order of ${o.date} · €${fmt(o.price)}/m³ · €${fmt(o.total * o.price)}</p>
    <div class="brow-t"><span>Delivered</span><b>${fmt(o.delivered)} of ${fmt(o.total)} m³</b></div><div class="bar thick" style="margin-bottom:6px"><i style="width:${pctOf(o.delivered, o.total)}%"></i></div>
    <p class="muted" style="margin:0 0 14px">${o.transit ? `${o.transit} m³ on the road · ` : ''}${fmt(o.total - o.delivered - o.transit)} m³ left to ship</p>
    ${trips.length ? trips.map((t) => `<div class="trip" style="grid-template-columns:1fr auto"><div><b>${esc(truck(t.truck).name)} → ${esc(t.site)}</b><span>${t.date} · ${t.vol} m³</span></div><span class="pill ${t.status === 'transit' ? 'warn' : 'pos'}"><i></i>${t.status === 'transit' ? 'In transit' : 'Delivered'}</span></div>`).join('') : '<p class="muted">No trips yet.</p>'}
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
}

render();
</script>
</body>
</html>
