<!DOCTYPE html>
<html lang="en" data-theme="light" data-fx="push">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RestOS HR — staff onboarding (demo)</title>
<meta name="description" content="Demo: a new-hire app for restaurant staff with learning paths, quizzes, certificates, shift checklists, e-signature and a manager console. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root[data-theme="light"] {
  --bg: #f3eef4; --surface: #ffffff; --raised: #f7f3f8; --hover: #efe8f1; --border: #e4dce7; --rule: #f0eaf2;
  --text: #1f1722; --muted: #62566a; --faint: #75697d;
  --accent: #b02a73; --accent-ink: #ffffff; --accent-bg: #f9e3ef;
  --pos: #1b7a4a; --neg: #b3302b; --warn: #8a5a0a;
  --font: "Nunito", system-ui, sans-serif; --display: "Nunito", system-ui, sans-serif;
  --e-out: cubic-bezier(.23, 1, .32, 1); --e-drawer: cubic-bezier(.32, .72, 0, 1);
  --shadow: 0 12px 32px rgba(40, 14, 40, .14);
}
body { font-size: 15px; font-weight: 500; overflow-x: hidden; }
.brand-name, .head h1, .big, .kpi b { font-weight: 800; }
.btn { font-weight: 700; } .btn.primary { font-weight: 800; }
.btn.danger { background: var(--neg); color: #fff; border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; } .btn.ghost:hover { background: var(--hover); }
.btn .ic { width: 16px; height: 16px; }
.ibtn { width: 38px; height: 38px; border-radius: 10px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--muted); position: relative; transition: background-color .15s, color .15s; }
.ibtn:hover { background: var(--hover); color: var(--text); } .ibtn:active { transform: scale(.96); }
.dotc { position: absolute; top: 4px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: #fff; font: 800 11px/17px var(--font); text-align: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--raised); color: var(--muted); white-space: nowrap; }
.tag .ic { width: 12px; height: 12px; } .tag.acc { background: var(--accent-bg); color: var(--accent); } .tag.neg { background: var(--neg-bg); color: var(--neg); } .tag.pos { background: var(--pos-bg); color: var(--pos); } .tag.warn { background: var(--warn-bg); color: var(--warn); }
.pill.acc { background: var(--accent-bg); color: var(--accent); }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 800; flex: none; }
.err { display: block; color: var(--neg); font-size: 12.5px; font-weight: 700; min-height: 0; }
.field input[aria-invalid="true"], .field textarea[aria-invalid="true"], .field select[aria-invalid="true"] { border-color: var(--neg); }
.field .hint { font-size: 12px; color: var(--faint); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sk { background: linear-gradient(90deg, var(--raised) 0, var(--hover) 50%, var(--raised) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 6px; }
@keyframes shimmer { to { background-position: -200% 0; } }
.scrim { z-index: 80; } .modal { max-width: 480px; } .modal.wide { max-width: 560px; }
.modal h2 { font-weight: 800; }

/* header */
.hdr { position: sticky; top: 0; z-index: 30; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; padding: 0; min-width: 0; }
.brand-mark { border-radius: 9px; }
.ver { font-size: 11px; font-weight: 800; color: var(--muted); background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; }
.venue { display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 700; font-size: 13.5px; padding-left: 14px; margin-left: 4px; border-left: 1px solid var(--border); white-space: nowrap; }
.venue .ic { width: 15px; height: 15px; }
.hsp { flex: 1; }
.ubtn { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 8px 0 4px; border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; }
.ubtn:hover { background: var(--hover); } .ubtn b { display: block; font-size: 13.5px; font-weight: 800; line-height: 1.2; } .ubtn span { font-size: 12px; color: var(--muted); }
.menu { position: absolute; top: 52px; right: 12px; width: 300px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 6px; z-index: 50; transform-origin: top right; animation: menuIn .16s var(--e-out) both; }
@keyframes menuIn { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
.menu.bell { width: 380px; padding: 0; }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 10px; border: 0; border-radius: 9px; background: none; cursor: pointer; font-weight: 700; color: var(--text); text-align: left; }
.mi:hover, .mi:focus-visible { background: var(--hover); } .mi .ic { color: var(--muted); } .mi small { margin-left: auto; color: var(--faint); font-size: 12px; }
.msep { height: 1px; background: var(--rule); margin: 6px 4px; }
.mwho { display: flex; gap: 10px; align-items: center; padding: 10px; } .mwho b { display: block; font-weight: 800; } .mwho span { color: var(--muted); font-size: 12.5px; word-break: break-all; }
.nh { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; } .nh b { font-weight: 800; font-size: 15px; }
.nh button { border: 0; background: none; color: var(--accent); font-weight: 800; cursor: pointer; font-size: 13px; padding: 4px; border-radius: 6px; }
.nlist { max-height: min(440px, 60svh); overflow: auto; padding: 0 6px 6px; }
.ni { display: grid; grid-template-columns: 34px minmax(0, 1fr) 8px; gap: 10px; align-items: start; width: 100%; padding: 10px 8px; border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left; }
.ni:hover { background: var(--hover); } .ni .nic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--raised); color: var(--muted); } .ni .nic .ic { width: 17px; height: 17px; }
.ni p { font-size: 13.5px; line-height: 1.35; color: var(--muted); } .ni p b { color: var(--text); font-weight: 800; } .ni small { color: var(--faint); font-size: 12px; }
.ni i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; } .ni.un i { background: var(--accent); } .ni.un .nic { background: var(--accent-bg); color: var(--accent); }

/* layout */
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 28px; max-width: 1440px; margin: 0 auto; align-items: start; padding: 22px 24px 32px; }
.wrap.employee { grid-template-columns: 400px; justify-content: center; }
.pcol { position: sticky; top: 78px; }
.plabel { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.plabel i { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); box-shadow: 0 0 0 3px var(--pos-bg); }
.phone { height: min(800px, calc(100svh - 150px)); min-height: 560px; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 34px; overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(60, 20, 60, .08); }
.scr { flex: 1; overflow: auto; padding: 18px 18px 24px; overscroll-behavior: contain; }
.offline { display: none; padding: 8px 14px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 700; text-align: center; }
.offline.on { display: block; }
.pnav { display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); }
.pnav button { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border: 0; background: none; color: var(--muted); font-size: 11.5px; font-weight: 700; cursor: pointer; position: relative; transition: color .15s; border-radius: 10px; }
.pnav button.on { color: var(--accent); } .pnav button .ic { width: 21px; height: 21px; }
.pnav .badge { position: absolute; top: 0; left: calc(50% + 5px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; display: grid; place-items: center; }

/* employee app */
.hero { border-radius: 20px; overflow: hidden; margin: 0 0 16px; position: relative; } .hero img { width: 100%; aspect-ratio: 380 / 130; object-fit: cover; display: block; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
.top h1 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; } .top p { color: var(--muted); font-size: 13px; }
.xp { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: var(--accent-bg); color: var(--accent); font-weight: 800; white-space: nowrap; flex: none; }
.xp .ic { width: 15px; height: 15px; }
.lvl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--raised); margin-bottom: 12px; }
.lvl b { font-weight: 800; font-size: 14px; } .lvl span { color: var(--muted); font-size: 12.5px; font-weight: 700; display: inline-flex; gap: 4px; align-items: center; } .lvl .bar { grid-column: 1 / -1; height: 8px; background: var(--border); }
.lvl .ic { width: 15px; height: 15px; color: #d0661c; }
.banner { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed var(--accent); background: var(--accent-bg); color: var(--text); cursor: pointer; text-align: left; margin-bottom: 12px; }
.banner b { display: block; font-weight: 800; font-size: 14px; } .banner span { font-size: 12.5px; color: var(--muted); } .banner > .ic { color: var(--accent); width: 22px; height: 22px; } .banner .ic:last-child { margin-left: auto; color: var(--muted); }
.lead { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 16px 0 6px; font-weight: 800; }
.path { position: relative; display: flex; flex-direction: column; gap: 6px; }
.node { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: center; padding: 10px 6px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 16px; position: relative; transition: background-color .15s; width: 100%; }
.node:hover:not(:disabled) { background: var(--raised); } .node:disabled { cursor: default; }
.node:not(:last-child)::after { content: ""; position: absolute; left: 32px; top: 64px; width: 4px; height: 20px; border-radius: 2px; background: var(--border); }
.node.done:not(:last-child)::after { background: var(--pos); }
.dot { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); color: var(--faint); border: 3px solid var(--border); position: relative; }
.dot .ic { width: 24px; height: 24px; stroke-width: 2.2; }
.node.done .dot { background: var(--pos); border-color: var(--pos); color: #fff; }
.node.cur .dot { background: var(--accent); border-color: var(--accent); color: #fff; animation: ring 2.2s ease-in-out infinite; }
@keyframes ring { 0%,100% { box-shadow: 0 0 0 0 rgba(176,42,115,.35); } 50% { box-shadow: 0 0 0 8px rgba(176,42,115,0); } }
.node b { display: block; font-size: 16px; font-weight: 800; line-height: 1.25; } .node span { color: var(--muted); font-size: 13px; }
.node.lock b { color: var(--faint); }
.node .mini { display: block; height: 4px; border-radius: 2px; background: var(--border); margin-top: 6px; overflow: hidden; } .node .mini i { display: block; height: 100%; background: var(--accent); }
.back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--muted); font-weight: 800; cursor: pointer; padding: 4px 6px 4px 0; border-radius: 6px; }
.back .ic { width: 16px; height: 16px; }
.learn h2 { font-size: 22px; font-weight: 800; line-height: 1.2; margin: 12px 0 10px; letter-spacing: -.01em; } .learn p.body { font-size: 16px; line-height: 1.6; }
.pbar { display: flex; gap: 4px; margin: 10px 0 8px; } .pbar i { flex: 1; height: 6px; border-radius: 3px; background: var(--border); transition: background-color .2s; } .pbar i.on { background: var(--accent); }
.meta { font-size: 13px; color: var(--muted); font-weight: 700; }
.cta { width: 100%; height: 50px; border-radius: 14px; font-size: 16px; margin-top: 20px; }
.cta2 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; margin-top: 20px; } .cta2 .btn { height: 50px; border-radius: 14px; font-size: 15px; }
.mhero { display: flex; gap: 14px; align-items: center; margin: 12px 0 6px; } .mhero .dot { background: var(--accent-bg); border-color: var(--accent-bg); color: var(--accent); }
.mhero h2 { font-size: 21px; font-weight: 800; line-height: 1.2; }
.ls { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 50px; padding: 6px 8px; border: 0; border-radius: 12px; background: none; text-align: left; cursor: pointer; }
.ls:hover:not(:disabled) { background: var(--raised); } .ls:disabled { cursor: default; color: var(--faint); }
.ls .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); font-size: 12.5px; font-weight: 800; color: var(--muted); }
.ls.ok .n { background: var(--pos); color: #fff; } .ls .n .ic { width: 15px; height: 15px; stroke-width: 3; } .ls b { font-weight: 700; } .ls small { color: var(--faint); font-size: 12px; }
.qcard { border: 1.5px solid var(--border); border-radius: 16px; padding: 14px; margin-top: 12px; } .qcard b { font-weight: 800; } .qcard p { color: var(--muted); font-size: 13px; margin-top: 2px; }
.opt { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; min-height: 52px; padding: 12px 14px; margin-bottom: 8px; border-radius: 14px; border: 2px solid var(--border); background: var(--surface); font-weight: 700; cursor: pointer; transition: border-color .15s, background-color .15s; }
.opt:hover:not(:disabled) { border-color: var(--faint); } .opt:disabled { cursor: default; } .opt .k { width: 26px; height: 26px; flex: none; border-radius: 8px; background: var(--raised); display: grid; place-items: center; font-size: 12.5px; color: var(--muted); }
.opt.ok { border-color: var(--pos); background: var(--pos-bg); } .opt.bad { border-color: var(--neg); background: var(--neg-bg); } .opt.dim { opacity: .55; }
.fb { margin-top: 6px; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.45; animation: pop .2s var(--e-out) both; } .fb b { display: block; font-weight: 800; } .fb.ok { background: var(--pos-bg); } .fb.ok b { color: var(--pos); } .fb.bad { background: var(--neg-bg); } .fb.bad b { color: var(--neg); }
.score { display: grid; place-items: center; margin: 14px 0 4px; } .score svg text { font-family: var(--display); }
.res { text-align: center; } .res h2 { font-size: 22px; font-weight: 800; margin-top: 4px; } .res p { color: var(--muted); }
.rq { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; text-align: left; padding: 9px 0; border-top: 1px solid var(--rule); font-size: 14px; } .rq .ic { width: 18px; height: 18px; stroke-width: 2.6; }
.certc { margin: 14px 0 0; padding: 16px; border: 2px solid var(--accent); border-radius: 16px; background: var(--accent-bg); text-align: left; display: flex; gap: 12px; align-items: center; width: 100%; cursor: pointer; }
.certc small { color: var(--accent); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 11px; } .certc b { display: block; font-weight: 800; font-size: 16px; } .certc span { color: var(--muted); font-size: 12.5px; } .certc .ic { width: 26px; height: 26px; color: var(--accent); flex: none; }
.big-xp { font: 900 54px/1 var(--display); color: var(--accent); text-align: center; margin: 10px 0 0; }

/* chat */
.msgs { display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px; }
.day { align-self: center; font-size: 12px; font-weight: 800; color: var(--faint); margin: 4px 0; }
.m { max-width: 82%; padding: 10px 14px; border-radius: 18px; background: var(--raised); border-bottom-left-radius: 6px; line-height: 1.4; overflow-wrap: anywhere; }
.m.new { animation: pop .2s var(--e-out) both; }
.m.me { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-left-radius: 18px; border-bottom-right-radius: 6px; }
.m small { display: block; font-size: 11px; opacity: .75; margin-top: 3px; }
.typing { align-self: flex-start; color: var(--faint); font-size: 13px; padding: 2px 6px; font-weight: 700; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; } .quick button { padding: 7px 12px; border-radius: 16px; border: 1.5px solid var(--border); background: none; font-weight: 700; color: var(--accent); cursor: pointer; } .quick button:hover { background: var(--accent-bg); }
.cform { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); } .cform input { flex: 1; min-width: 0; height: 42px; border-radius: 21px; border: 1.5px solid var(--border); padding: 0 16px; outline: none; background: var(--bg); } .cform input:focus { border-color: var(--accent); }
.cform button { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
.chead { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; } .chead b { display: block; font-weight: 800; font-size: 17px; } .chead span { font-size: 12.5px; color: var(--muted); }

/* checklists */
.shead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 18px; background: var(--raised); margin-bottom: 6px; }
.shead b { display: block; font-weight: 800; font-size: 16px; } .shead span { display: block; font-size: 12.5px; color: var(--muted); }
.cl h3 { font-size: 15px; font-weight: 800; margin: 18px 0 4px; display: flex; justify-content: space-between; align-items: baseline; } .cl h3 span { font-size: 12.5px; color: var(--muted); font-weight: 700; }
.ckr { border-top: 1px solid var(--rule); padding: 4px 0; }
.ck { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 50px; padding: 4px 0; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; border-radius: 8px; }
.ck .bx { width: 26px; height: 26px; border-radius: 8px; border: 2.5px solid var(--border); display: grid; place-items: center; color: #fff; transition: background-color .15s, border-color .15s; } .ck .bx .ic { width: 16px; height: 16px; stroke-width: 3.2; }
.ck.done .bx { background: var(--pos); border-color: var(--pos); } .ck.done b { color: var(--faint); text-decoration: line-through; } .ck b { font-weight: 700; display: block; line-height: 1.3; } .ck small { color: var(--muted); font-size: 12.5px; font-weight: 700; }
.ck .tg { display: flex; gap: 4px; margin-top: 3px; flex-wrap: wrap; }
.ckx { padding: 0 0 8px 40px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.photo { position: relative; width: 92px; height: 64px; border-radius: 10px; overflow: hidden; background: linear-gradient(135deg, #6d5a4b, #b49579 55%, #e2cfb5); color: #fff; display: flex; align-items: flex-end; padding: 5px 7px; font-size: 11px; font-weight: 800; }
.photo::before { content: ""; position: absolute; inset: 14px 18px auto auto; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,.35); box-shadow: -34px 14px 0 4px rgba(40,24,16,.25); }
.photo.v1 { background: linear-gradient(160deg, #39505a, #7c97a0 60%, #d6e1e2); } .photo.v2 { background: linear-gradient(120deg, #5a3a46, #a87986 55%, #ecd3d9); }
.photo span { position: relative; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.photo.sk { background-size: 200% 100%; }
.tform { display: flex; gap: 6px; align-items: center; } .tform input { width: 84px; height: 34px; border-radius: 8px; border: 1.5px solid var(--border); padding: 0 8px; background: var(--bg); outline: none; } .tform input:focus { border-color: var(--accent); }
.hist { display: flex; gap: 6px; align-items: flex-end; height: 70px; margin-top: 8px; } .hist div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.hist i { width: 100%; max-width: 26px; border-radius: 5px 5px 2px 2px; background: var(--accent); opacity: .4; min-height: 3px; } .hist div.on i { opacity: 1; } .hist small { font-size: 11px; color: var(--faint); font-weight: 700; }

/* news */
.news { border: 1.5px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: border-color .15s; width: 100%; text-align: left; background: var(--surface); display: block; }
.news:hover { border-color: var(--faint); } .news.un { border-color: var(--accent); }
.news h3 { font-size: 15px; font-weight: 800; line-height: 1.3; display: flex; gap: 8px; align-items: flex-start; } .news h3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 6px; }

    const role = Object.keys(CREDS).find((k) => CREDS[k] === m);
    if (!role || p !== 'demo2026') return errs($('#af'), { apw: 'Incorrect email or password. The demo password is demo2026' });
    S.signing = true; const b = $('#abtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Signing in…';
    setTimeout(() => { S.signing = false; S.auth = true; S.role = role; S.tab = 'path'; S.view = 'path'; S.mtab = 'overview'; S.loaded = { overview: true }; shell(); toast(`Signed in as ${role === 'manager' ? 'Marek Novák' : 'Sofia Weber'}`); }, 700);
  };
}

/* ── events ─────────────────────────────────────────────── */
document.addEventListener('click', (e) => {
  if (S.menu && !e.target.closest('.menu') && !e.target.closest('[data-act="menu"]')) { S.menu = null; header(); }
  const t = e.target.closest('[data-tab]'); if (t) { go(t.dataset.tab); return; }
  const mt = e.target.closest('[data-mtab]'); if (mt) return mtab(mt.dataset.mtab);
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a.dataset, e, a);
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form="temp"]'); if (!f) return; e.preventDefault();
  const k = f.dataset.k, raw = $('input', f).value.trim().replace(',', '.'), v = parseFloat(raw);
  if (!raw) S.ckErr[k] = 'Enter the reading in °C'; else if (!/^-?\d+(\.\d+)?$/.test(raw) || v < -10 || v > 20) S.ckErr[k] = 'Enter a number between −10 and 20 °C';
  else { delete S.ckErr[k]; S.temps[k] = v; tickOn(k); if (v > 4) { notify('manager', 'thermo', `Walk-in fridge at <b>Mitte</b> logged at ${fmtD(v)} °C by Sofia`, 'overview'); feed(`<b>Sofia Weber</b> logged the walk-in fridge at <span class="neg">${fmtD(v)} °C</span>`); toast('Reading saved. Above 4 °C, your manager has been alerted'); } else toast(`Reading saved: ${fmtD(v)} °C`); }
  render();
});
document.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.in; if (!k) return;
  S[k] = e.target.value; S.page = 0; mgr();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('#scrim')) return;
    if (S.menu) { const m = S.menu; S.menu = null; header(); $(m === 'bell' ? '#bellBtn' : '#userBtn')?.focus(); return; }
    if (S.drawer) { const id = S.drawer; S.drawer = null; drawer(); $(`[data-open="${id}"]`)?.focus(); }
    return;
  }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  if (e.key === '/' && !typing && S.auth && S.role === 'manager' && !$('#scrim')) { e.preventDefault(); if (S.mtab !== 'learners') { S.mtab = 'learners'; S.loaded.learners = true; S.drawer = null; render(); } $('#lq')?.focus(); }
  if (e.key === '?' && !typing && S.auth && !$('#scrim')) { e.preventDefault(); helpModal(); }
  if ((e.key === 'Enter' || e.key === ' ') && !typing && e.target.matches('[data-act="openL"], .news[data-act]')) { e.preventDefault(); e.target.click(); }
}, true);
addEventListener('online', () => $('#offline')?.classList.remove('on'));
addEventListener('offline', () => $('#offline')?.classList.add('on'));

function mtab(k) {
  S.mtab = k; S.drawer = null;
  if (!S.loaded[k]) { setTimeout(() => { S.loaded[k] = true; if (S.mtab === k) render(); }, 450); }
  render();
}
function tickOn(k) { if (!S.ticks.has(k)) { S.ticks.add(k); touch(); if (S.ticks.size === ckTotal()) { feed('<b>Sofia Weber</b> completed all shift checklists'); notify('manager', 'check', '<b>Sofia Weber</b> completed every checklist item today', 'sofia'); toast('All checklists completed'); } } }
function startQuiz(i) {
  const m = MODS[i], n = (S.att[i] || []).length + 1, order = m.quiz.map((_, k) => k); for (let r = 0; r < (n - 1) % Math.max(1, order.length); r++) order.push(order.shift());
  S.qz = { mod: i, i: 0, picks: [], order, n, gain: 0 }; S.view = 'quiz'; render(); $('#scr').scrollTop = 0;
}
function finish(i, score) {
  const m = MODS[i], first = !S.done.has(i); let gain = 0;
  if (score != null) { (S.att[i] = S.att[i] || []).push({ score, at: now() }); }
  if (score != null && score < PASS) { feed(`<b>Sofia Weber</b> scored ${score}% on ${esc(m.t)} (attempt ${S.att[i].length})`); return 0; }
  if (score === 100 && !S.perfect.has(i)) { S.perfect.add(i); gain += 25; }
  if (first) {
    S.done.add(i); gain += m.xp; S.certAt[i] = now(); delete S.read[i + 1]; S.read[i + 1] = S.read[i + 1] || new Set();
    feed(`<b>Sofia Weber</b> completed ${esc(m.t)}${score != null ? ` with ${score}%` : ''}, +${m.xp} XP`);
    notify('manager', 'award', `<b>Sofia Weber</b> completed ${esc(m.t)}${score != null ? ` (${score}%)` : ''}`, 'sofia');
    notify('employee', 'award', `Certificate issued: <b>${esc(m.t)}</b>`, 'me');
  }
  touch(); return gain;
}
const ACT = {
  menu(d) { S.menu = S.menu === d.m ? null : d.m; header(); const f = $('.menu .mi, .menu .ni, .menu .nh button'); if (S.menu && f) f.focus(); },
  readAll() { S.notes[S.role].forEach((n) => { n.un = false; }); header(); },
  note(d) {
    const n = S.notes[S.role].find((x) => x.id === d.id); if (!n) return; n.un = false; S.menu = null;
    const g = n.go;
    if (S.role === 'employee' || ['news', 'path', 'docs', 'me', 'chat'].includes(g)) { if (g === 'docs') go('path', 'docs'); else if (['news', 'path', 'me', 'chat'].includes(g)) go(g); else render(); if (S.role === 'employee' || ['news', 'path', 'docs', 'me', 'chat'].includes(g)) return; }
    if (g === 'sofia') { S.mtab = 'learners'; S.loaded.learners = true; S.drawer = me().id; render(); return; }
    if (g === 'overdue') { S.mtab = 'learners'; S.loaded.learners = true; S.fStatus = 'overdue'; S.page = 0; render(); return; }
    mtab(g === 'learners' ? 'learners' : 'overview');
  },
  help() { S.menu = null; header(); helpModal(); },
  denied() { S.menu = null; header(); modal(`<div class="lock"><div class="li">${ic('lock')}</div><h3>Manager access required</h3><p>Your account (Sofia Weber, Server) cannot open the manager console. Sign in with a manager account, or ask Marek Novák to change your role.</p><div style="display:flex;gap:8px;justify-content:center"><button class="btn" data-act="mclose">Close</button><button class="btn primary" data-act="signAsMgr">Sign in as manager</button></div></div>`); },
  signAsMgr() { closeModal(); S.auth = false; S.signRole = 'manager'; shell(); },
  switchRole() { S.role = S.role === 'manager' ? 'employee' : 'manager'; S.tab = 'path'; S.view = 'path'; shell(); toast(`Switched to the ${S.role} view`); },
  signOut() { S.auth = false; S.signRole = S.role; S.menu = null; shell(); toast('You have been signed out'); },
  signRole(d) { S.signRole = d.r; const em = $('#aem'); if (em) em.value = CREDS[d.r]; $$('.seg button').forEach((b) => { const on = b.dataset.r === d.r; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); }); errs($('#af'), {}); },
  forgot() { toast('Ask your general manager to reset your password'); },
  mclose() { closeModal(); },
  view(d) { S.view = d.v; render(); $('#scr').scrollTop = 0; },
  open(d) { S.mod = +d.i; S.view = 'mod'; render(); $('#scr').scrollTop = 0; },
  exit() { S.view = 'path'; S.qz = null; render(); $('#scr').scrollTop = 0; },
  lesson(d) { S.step = +d.i; (S.read[S.mod] = S.read[S.mod] || new Set()).add(S.step); S.view = 'learn'; touch(); render(); $('#scr').scrollTop = 0; },
  prev() { if (S.step) { S.step--; render(); $('#scr').scrollTop = 0; } },
  next() {
    const m = MODS[S.mod], rd = (S.read[S.mod] = S.read[S.mod] || new Set());
    if (S.step < m.steps.length - 1) { S.step++; rd.add(S.step); render(); $('#scr').scrollTop = 0; return; }
    if (S.done.has(S.mod)) { S.view = 'mod'; render(); return; }
    if (m.quiz.length) return startQuiz(S.mod);
    ACT.complete();
  },
  complete() { const g = finish(S.mod, null); S.qz = { mod: S.mod, order: [], picks: [], gain: g }; S.view = 'result'; render(); $('#scr').scrollTop = 0; },
  quiz() { startQuiz(S.mod); },
  leaveQuiz() { if (!S.qz || !S.qz.picks.length) return ACT.view({ v: 'mod' }); confirmBox('Leave the quiz?', 'Your answers in this attempt will not be saved.', 'Leave quiz', () => { S.qz = null; S.view = 'mod'; render(); }, true); },
  pick(d) { const z = S.qz; if (z.picks[z.i] != null) return; z.picks[z.i] = +d.i; render(); $('#qnext')?.focus({ preventScroll: true }); const s = $('#scr'); s.scrollTop = s.scrollHeight; },
  qnext() {
    const z = S.qz, m = MODS[z.mod];
    if (z.i < z.order.length - 1) { z.i++; render(); $('#scr').scrollTop = 0; return; }
    const ok = z.order.filter((qi, k) => z.picks[k] === m.quiz[qi].a).length, sc = Math.round(ok / z.order.length * 100);
    z.gain = finish(z.mod, sc); S.view = 'result'; render(); $('#scr').scrollTop = 0;
  },
  cert(d) { certModal(+d.i); },
  print() { setTimeout(() => window.print(), 50); },
  sign(d) { signModal(d.id); },
  tick(d) {
    const k = d.k, [li, i] = k.split('-').map(Number), kind = CHECK[li][1][i][2];
    if (S.ticks.has(k)) { S.ticks.delete(k); if (kind === 'temp') delete S.temps[k]; render(); return; }
    if (kind === 'photo' && !S.photos[k]) { S.ckErr[k] = 'Add a photo to complete this item'; render(); return; }
    if (kind === 'temp') { S.ckErr[k] = 'Enter the reading below and press Save'; render(); $(`#tmp-${k}`)?.focus(); return; }
    delete S.ckErr[k]; tickOn(k); render();
  },
  photo(d) {
    const k = d.k; S.loadingPhoto = k; delete S.ckErr[k]; render();
    setTimeout(() => { if (S.loadingPhoto !== k) return; S.loadingPhoto = null; S.photos[k] = 'IMG ' + TF.format(now()); tickOn(k); toast('Photo uploaded'); render(); }, 700);
  },
  rmPhoto(d) { delete S.photos[d.k]; S.ticks.delete(d.k); render(); },
  say(d) { say(d.t); },
  openNews(d, e) {
    if (e.target.closest('[data-act="ack"]')) return;
    const n = S.news.find((x) => x.id === d.id); S.newsOpen = S.newsOpen === d.id ? null : d.id;
    if (n && !n.mineRead) { n.mineRead = true; n.reads++; }
    render();
  },
  ack(d) { const n = S.news.find((x) => x.id === d.id); if (!n || n.mineAck) return; n.mineAck = now(); n.acks++; if (!n.mineRead) { n.mineRead = true; n.reads++; } feed(`<b>Sofia Weber</b> confirmed “${esc(n.t)}”`); toast('Thanks, your manager can see you have read it'); render(); },
  badge(d) { const b = BADGES.find(([k]) => k === d.k), on = badges()[d.k]; toast(`${b[1]}: ${on ? 'unlocked' : b[2]}`); },
  /* manager */
  sort(d) { S.sort = [d.k, S.sort[0] === d.k ? -S.sort[1] : (d.k === 'name' || d.k === 'venue' ? 1 : -1)]; S.page = 0; mgr(); },
  page(d) { S.page = +d.p; mgr(); },
  clearF() { S.q = ''; S.fVenue = 'all'; S.fStatus = 'all'; S.page = 0; mgr(); },
  openL(d) { S.drawer = d.id; drawer(); },
  closeDrawer() { const id = S.drawer; S.drawer = null; drawer(); $(`[data-open="${id}"]`)?.focus(); },
  showOverdue() { S.fStatus = 'overdue'; S.page = 0; mtab('learners'); },
  remind(d) { const l = S.learners.find((x) => x.id === d.id); l.reminded = now(); feed(`<b>Marek</b> sent a reminder to ${esc(l.name)}`); if (l.me) notify('employee', 'bell', '<b>Marek</b> reminded you to keep going with your training', 'path'); toast(`Reminder sent to ${l.name}`); render(); },
  extend(d) { const l = S.learners.find((x) => x.id === d.id), old = l.due; l.due = new Date(Math.max(l.due, NOW0) + 7 * DAY); feed(`<b>Marek</b> extended ${esc(l.name)}’s target to ${DFs.format(l.due)}`); render(); undoToast(`Target moved to ${DF.format(l.due)}`, () => { l.due = old; render(); }); },
  removeL(d) {
    const l = S.learners.find((x) => x.id === d.id);
    confirmBox(`Remove ${esc(l.name)}?`, 'They lose access to RestOS HR and leave every report. Their training record is kept for 12 months for compliance.', 'Remove learner', () => { l.removed = true; S.drawer = null; render(); undoToast(`${l.name} removed`, () => { l.removed = false; render(); }); }, true);
  },
  addLearner() { if (S.role !== 'manager') return; learnerForm(); },
  csv() {
    const L = S.mtab === 'learners' ? rowsFiltered() : active(), q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const head = ['ID', 'Name', 'Email', 'Role', 'Venue', 'Start date', 'Target date', 'Modules completed', 'Modules published', 'Progress %', 'Quiz average %', 'Documents signed', 'Last active', 'Status'];
    const rows = L.map((l) => [l.id, l.name, l.email, l.role, 'Lindenhof ' + l.venue, iso(l.start), iso(l.due), doneOf(l), P(), pct(l), l.quiz ?? '', l.docs, l.active ? l.active.toISOString() : '', STAT[status(l)][0]]);
    const csv = '﻿' + [head, ...rows].map((r) => r.map(q).join(',')).join('\r\n');
    const u = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), a = document.createElement('a');
    a.href = u; a.download = `restos-hr-learners-${iso(NOW0)}.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
    toast(`Exported ${pl(L.length, 'learner')} to CSV`);
  },
  bsel(d) { S.bsel = +d.i; mgr(); },
  newMod() { moduleForm(true); },
  editMod() { moduleForm(false); },
  addLesson(d) { lessonForm(d.i != null ? +d.i : null); },
  addQ(d) { questionForm(d.i != null ? +d.i : null); },
  mvLesson(d) { const m = MODS[S.bsel], k = +d.i, j = k + +d.d; if (j < 0 || j >= m.steps.length) return; [m.steps[k], m.steps[j]] = [m.steps[j], m.steps[k]]; render(); },
  delLesson(d) {
    const m = MODS[S.bsel], k = +d.i;
    if (m.pub && m.steps.length === 1) return toast('Only one lesson left. A published module needs at least one lesson');
    confirmBox('Delete this lesson?', `“${esc(m.steps[k][0])}” will be removed from ${esc(m.t)}.`, 'Delete lesson', () => { const [x] = m.steps.splice(k, 1); render(); undoToast('Lesson deleted', () => { m.steps.splice(k, 0, x); render(); }); }, true);
  },
  delQ(d) { const m = MODS[S.bsel], k = +d.i; confirmBox('Delete this question?', `It will no longer appear in the ${esc(m.t)} quiz.`, 'Delete question', () => { const [x] = m.quiz.splice(k, 1); render(); undoToast('Question deleted', () => { m.quiz.splice(k, 0, x); render(); }); }, true); },
  publish() {
    const m = MODS[S.bsel]; if (!m.steps.length) return toast('Only published modules reach staff. Add at least one lesson first');
    const done = active().filter((l) => status(l) === 'done').length;
    confirmBox(`Publish “${esc(m.t)}”?`, `${pl(active().length, 'learner')} will see it in their path.${done ? ` ${pl(done, 'learner')} who finished the path will be back in progress.` : ''}`, 'Publish', () => {
      m.pub = true; feed(`<b>Marek</b> published ${esc(m.t)}`); notify('employee', 'book', `New module: <b>${esc(m.t)}</b>`, 'path'); toast(`${m.t} is live`); render();
    });
  },
  delMod() { const k = S.bsel, m = MODS[k]; confirmBox(`Delete “${esc(m.t)}”?`, 'This draft and its lessons will be deleted.', 'Delete draft', () => { MODS.splice(k, 1); S.bsel = Math.max(0, k - 1); render(); undoToast('Draft deleted', () => { MODS.splice(k, 0, m); S.bsel = k; render(); }); }, true); },
  compose() { composeForm(); },
  pin(d) { const n = S.news.find((x) => x.id === d.id); n.pin = !n.pin; render(); },
  delNews(d) { const k = S.news.findIndex((x) => x.id === d.id), n = S.news[k]; confirmBox('Delete this announcement?', `“${esc(n.t)}” will disappear from everyone’s News tab.`, 'Delete', () => { S.news.splice(k, 1); render(); undoToast('Announcement deleted', () => { S.news.splice(k, 0, n); render(); }); }, true); },
};

/* ── live: the manager writes, colleagues move through modules ── */
const PINGS = ['Don’t forget the briefing at 9:45', 'Has anyone seen the new aprons? They are at the host desk', 'Menu quiz again tomorrow, review the allergens', 'Great work yesterday, guests were praising you'];
let beat = 0;
setInterval(() => {
  if (document.hidden || !S.auth) return;
  beat++;
  if (beat % 3 === 0) {
    const pool = active().filter((l) => !l.me && doneOf(l) < P() && l.active), team = pool.filter((l) => l.team), w = (team.length ? team : pool)[beat % Math.max(1, (team.length ? team : pool).length)];
    if (w) { w.done = doneOf(w) + 1; w.lessons = 0; w.active = now(); w.quiz = Math.min(100, (w.quiz || 70) + 1); feed(`<b>${esc(w.name)}</b> completed ${esc(MODS[pubIdx()[w.done - 1]].t)}, now ${w.done} of ${P()}`); }
    const n = S.news.find((x) => x.reads < active().length * .9); if (n) { n.reads++; if (n.ack && n.acks < n.reads - 2) n.acks++; }
    render();
  }
  if (beat % 5 === 0 && S.chat.length < 14) { S.chat.push({ me: false, t: PINGS[(beat / 5 - 1) % PINGS.length], at: now() }); if (S.tab !== 'chat') { S.unread++; toast('Marek sent you a message'); } render(); if (S.tab === 'chat') { const s = $('#scr'); s.scrollTop = 1e6; } }
}, 6000);

shell();
console.assert(me().done === undefined && doneOf(me()) === 2, 'Sofia reconciles with the path');
console.assert(funnel()[0][1] === active().length, 'funnel top equals learners');
