<!DOCTYPE html>
<html lang="en" data-theme="dark" data-fx="none">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingLearn — trading course and simulator (demo)</title>
<meta name="description" content="Demo: learn to trade with a virtual €10,000. Live chart, orders with stop-loss, hands-on lessons, trade journal and leaderboard. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root {
  --bg: #080b10; --surface: #0f141b; --raised: #161c26; --hover: #1b2330; --border: #1f2833; --rule: #171e28;
  --text: #ecf0f6; --muted: #9aa5b5; --faint: #7a8696;
  --accent: #8b7bff; --accent-ink: #0c0a1f; --accent-bg: rgba(139,123,255,.14);
  --pos: #25d195; --neg: #ff6b78;
  --font: "Geologica", system-ui, sans-serif; --display: "Geologica", system-ui, sans-serif;
}
.brand-name, .head h1, .big, .kpi b { font-weight: 600; letter-spacing: -.02em; }
.btn.long { background: var(--pos); color: #04150e; border-color: transparent; font-weight: 600; }
.btn.short { background: var(--neg); color: #1c0508; border-color: transparent; font-weight: 600; }

.dm { display: none; } .field label { display: flex; align-items: center; } .field input[type=checkbox] { height: auto; width: auto; margin-right: 8px; accent-color: var(--accent); }
.cover { width: 64px; height: 64px; border-radius: 16px; flex: none; overflow: hidden; } .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.course-h .ch { display: flex; align-items: center; gap: 14px; }
.cheer { display: inline-flex; gap: 6px; align-items: center; } .delta { font-size: 12px; margin-left: 8px; }
.coach { display: flex; align-items: center; gap: 14px; padding: 12px 14px; margin-bottom: var(--gap); border-radius: var(--radius); background: var(--accent-bg); }
.coach .ic { color: var(--accent); } .coach span { flex: 1; min-width: 0; }
.lvl { display: flex; align-items: center; gap: 12px; }
.lvl .bar { width: 120px; }

.term { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--gap); align-items: start; }
.chart-h { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
.chart-h .px { font: 600 28px/1 var(--display); letter-spacing: -.02em; }
.syms { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.syms button { height: 28px; padding: 0 11px; border-radius: 14px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s; }
.syms button:hover { color: var(--text); } .syms button.on { background: var(--raised); color: var(--text); border-color: var(--faint); }
#chart svg { display: block; width: 100%; }
#chart text { font: 11px var(--font); fill: var(--faint); }
.dirs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
.dirs button { height: 38px; border-radius: 8px; border: 1px solid var(--border); background: none; color: var(--muted); font-weight: 600; cursor: pointer; transition: background-color .15s, color .15s, border-color .15s; }
.dirs button.on.l { background: var(--pos); color: #04150e; border-color: transparent; } .dirs button.on.s { background: var(--neg); color: #1c0508; border-color: transparent; }
.quick { display: flex; gap: 6px; margin-top: 6px; } .quick button { flex: 1; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--muted); cursor: pointer; font-size: 12px; } .quick button:hover { color: var(--text); background: var(--hover); }
.risk { padding: 10px 12px; margin: 4px 0 14px; border-radius: 8px; background: var(--raised); color: var(--muted); font-size: 13px; } .risk b { color: var(--text); font-weight: 600; }
.pos-row { display: grid; grid-template-columns: 1.1fr 1fr 1fr 1fr auto; gap: 12px; align-items: center; padding: 10px 0; }
.pos-row + .pos-row { border-top: 1px solid var(--rule); }
.pos-row b { font-weight: 600; } .pos-row small { display: block; color: var(--muted); font-size: 12px; }

.course { padding: 18px 0; } .course + .course { border-top: 1px solid var(--rule); }
.course-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.course-h h3 { font-size: 16px; font-weight: 600; }
.lesson { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 48px; padding: 6px 0; }
.lesson .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; }
.lesson.done .dot { background: var(--pos); border-color: var(--pos); color: #04150e; } .lesson.done .dot .ic { width: 13px; height: 13px; stroke-width: 3; }
.lesson.lock { opacity: .5; }
.lesson b { font-weight: 500; display: block; } .lesson small { color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opts button { text-align: left; min-height: 42px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: none; cursor: pointer; transition: background-color .15s, border-color .15s; }
.opts button:hover { background: var(--hover); border-color: var(--faint); }
.me { background: var(--accent-bg); border-radius: 8px; }

@media (max-width: 1099px) { .term { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 899px) { .dm { display: inline; } .syms { margin-left: 0; } .pos-row { grid-template-columns: 1fr 1fr auto; } .pos-row .hm { display: none; } .lvl .bar { width: 72px; } }
</style>
</head>
<body>
<div class="notice"><b>Demo</b> TradingLearn · training simulator, virtual money, sample data</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9M15 6h5v5"/></svg></div>
      <div><div class="brand-name">TradingLearn</div><div class="brand-sub">Learn and practise</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="avatar">DM</div><div class="who"><b>Darian</b><span id="side-lvl"></span></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<script>
/*@kit.js*/
'use strict';

/* ── market data: seeded candles, so the first screen is always the same ─ */
const SYM = { BTC: { p: 67420, vol: .004 }, ETH: { p: 3521, vol: .005 }, SOL: { p: 183, vol: .008 }, BNB: { p: 412, vol: .004 }, XRP: { p: 0.548, vol: .006 } };
const rng = (seed) => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const dec = (p) => p >= 1000 ? 0 : p >= 10 ? 2 : 4;
const usd = (n, d = 2) => '€' + n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const px = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: dec(n), maximumFractionDigits: dec(n) });
const pnlF = (n) => (n >= 0 ? '+' : '−') + usd(Math.abs(n));
const MARKET = {};
Object.entries(SYM).forEach(([k, s], idx) => {
  const r = rng(11 + idx * 7919), c = []; let p = s.p * 0.93;
  for (let i = 0; i < 120; i++) { const o = p, d = (r() - .47) * s.vol * 2.4; p = o * (1 + d); const h = Math.max(o, p) * (1 + r() * s.vol * .7), l = Math.min(o, p) * (1 - r() * s.vol * .7); c.push({ o, h, l, c: p }); }
  const k2 = s.p / p; c.forEach((x) => { x.o *= k2; x.h *= k2; x.l *= k2; x.c *= k2; });   // end exactly on today's price
  MARKET[k] = c;
});
const last = (k) => MARKET[k][MARKET[k].length - 1];
const price = (k) => last(k).c;

/* ── account: balance is always derived from the journal ─ */
const START = 10000;
const J = [   // sym, dir, size €, entry, exit, hours ago, how closed
  ['BTC', 'long', 1500, 64200, 66100, 150, 'take'], ['ETH', 'short', 1000, 3480, 3555, 128, 'stop'], ['SOL', 'long', 800, 171, 178.5, 110, 'manual'], ['BTC', 'long', 2000, 65800, 65100, 96, 'stop'],
  ['XRP', 'long', 600, 0.521, 0.538, 80, 'manual'], ['ETH', 'long', 1200, 3390, 3490, 70, 'take'], ['BNB', 'short', 700, 421, 418, 54, 'manual'], ['SOL', 'short', 900, 186, 189, 40, 'stop'],
  ['BTC', 'long', 1800, 66400, 67050, 30, 'manual'], ['ETH', 'long', 1000, 3500, 3538, 20, 'manual'], ['SOL', 'long', 800, 179, 183.5, 9, 'take'], ['XRP', 'short', 500, 0.552, 0.546, 4, 'manual'],
].map(([sym, dir, size, entry, exit, ago, how], i) => ({ id: i + 1, sym, dir, size, entry, exit, ago, how }));
const pnlOf = (t) => (t.dir === 'long' ? t.exit / t.entry - 1 : 1 - t.exit / t.entry) * t.size;
const realized = () => J.reduce((a, t) => a + pnlOf(t), 0);
const balance = () => START + realized();
let POS = [], nextPos = 1, nextJ = 13;
const upnl = (p) => (p.dir === 'long' ? price(p.sym) / p.entry - 1 : 1 - price(p.sym) / p.entry) * p.size;
const unreal = () => POS.reduce((a, p) => a + upnl(p), 0);
const equity = () => balance() + unreal();
const freeCash = () => balance() - POS.reduce((a, p) => a + p.size, 0);

/* ── learning ─ */
const LES = [
  { id: 1, c: 1, t: 'What a candle shows', q: 'A green candle on the chart means…', o: ['Close price is above the open price', 'Price fell', 'Trading was halted'], a: 0, done: true },
  { id: 2, c: 1, t: 'Long and short', q: 'When do you open a short?', o: ['You expect the price to rise', 'You expect the price to fall', 'You want to close a trade'], a: 1, done: true },
  { id: 3, c: 1, t: 'Position size', q: 'What is position size?', o: ['The amount you put into a trade', 'How many times you have traded', 'Entry price'], a: 0, done: true },
  { id: 4, c: 2, t: 'Stop-loss in practice', task: 'Open a position on the chart and set a stop-loss', done: false },
  { id: 5, c: 2, t: 'Risk to reward', q: 'Risk €50, target €150. What is the ratio?', o: ['1 to 3', '3 to 1', '1 to 1.5'], a: 0, done: true },
  { id: 6, c: 2, t: 'No more than 2% per trade', q: 'Deposit €10,000. What is the most you can risk on one trade under the 2% rule?', o: ['€20', '€200', '€2,000'], a: 1, done: false },
  { id: 7, c: 3, t: 'Support and resistance', q: 'A support level is…', o: ['A zone where price often bounces up', 'The yearly high', 'The exchange fee'], a: 0, done: false },
  { id: 8, c: 3, t: 'How to spot a trend', q: 'An uptrend is…', o: ['Every low is higher than the previous one', 'Price stays flat', 'Only red candles'], a: 0, done: false },
  { id: 9, c: 3, t: 'Trading volume', q: 'A price rise on low volume is usually…', o: ['A weak signal', 'The strongest signal', 'Always meaningless'], a: 0, done: false },
];
const COURSES = { 1: 'Basics', 2: 'Risk management', 3: 'Chart analysis' };
const XP = 100, PER = 500;
const xp = () => LES.filter((l) => l.done).length * XP, level = () => Math.floor(xp() / PER) + 1;
const courseDone = (c) => LES.filter((l) => l.c === c).every((l) => l.done);
const locked = (c) => c > 1 && !courseDone(c - 1);
console.assert(xp() === 400 && level() === 1, 'xp');


/* course covers: photos (CC0, see demos/CREDITS.md), one per course */
const coverImg = (c) => `<img src="img/cover-${c}.jpg" alt="" loading="lazy" decoding="async">`;
let RIVALS = [['Lukas_M', 12840], ['mila.k', 11975], ['Matteo', 11420], ['pierre_trade', 10310], ['Hanna V.', 9870], ['Jan', 9560], ['Sofia_R', 9120], ['Elena', 8740]];

/* ── shell ────────────────────────────────────────────── */
const PAGES = { practice: ['Practice', 'chart'], learn: ['Courses', 'graduation'], journal: ['Journal', 'list'], rank: ['Leaderboard', 'star'] };
let page = 'practice', sym = 'BTC', dir = 'long', sl = 2, tp = 4, useSl = true, useTp = true, size = 1000;
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function chrome() {
  $('#nav').innerHTML = Object.keys(PAGES).map((k) => `<a data-page="${k}" tabindex="0" role="link">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span></a>`).join('');
  $('#tabbar').innerHTML = $('#nav').innerHTML;
  $('#side-lvl').textContent = `Level ${level()} · ${xp()} XP`;
  setNav(page);
}
function render() { chrome(); $('#main').innerHTML = ({ practice, learn, journal, rank })[page](); mount(); }
function go(p) { page = p; render(); window.scrollTo(0, 0); }
const head = (t, sub, actions = '') => `<header class="head"><div><h1>${t}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></header>`;

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-page]'); if (a) return go(a.dataset.page);
  const act = e.target.closest('[data-act]'); if (act) return ACT[act.dataset.act](act.dataset);
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-page]')) { e.preventDefault(); go(e.target.dataset.page); } });
document.addEventListener('input', (e) => {
  if (e.target.id === 'f-size') { size = Math.max(0, +e.target.value || 0); drawRisk(); }
  if (e.target.id === 'f-sl') { sl = Math.max(0.1, +e.target.value || 0.1); drawRisk(); }
  if (e.target.id === 'f-tp') { tp = Math.max(0.1, +e.target.value || 0.1); drawRisk(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'u-sl') { useSl = e.target.checked; drawRisk(); } if (e.target.id === 'u-tp') { useTp = e.target.checked; drawRisk(); }
});

/* ── practice ─────────────────────────────────────────── */
function candleSVG(w) {
  const k = MARKET[sym], v = k.slice(-72), h = 330, L = 6, R = 64, T = 10, B = 22, pw = w - L - R, ph = h - T - B;
  const lines = POS.filter((p) => p.sym === sym).flatMap((p) => [[p.entry, 'var(--text)', 'entry'], ...(p.sl ? [[p.sl, 'var(--neg)', 'stop']] : []), ...(p.tp ? [[p.tp, 'var(--pos)', 'take']] : [])]);
  let mn = Math.min(...v.map((x) => x.l), ...lines.map((x) => x[0])), mx = Math.max(...v.map((x) => x.h), ...lines.map((x) => x[0])); const pad = (mx - mn) * .06; mn -= pad; mx += pad;
  const Y = (p) => T + ph - (p - mn) / (mx - mn) * ph, step = pw / v.length, bw = Math.max(2, step * .62);
  let g = ''; for (let i = 0; i <= 4; i++) { const p = mn + (mx - mn) * i / 4, y = Y(p); g += `<line class="grid-l" x1="${L}" x2="${w - R + 4}" y1="${y}" y2="${y}"/><text x="${w - R + 10}" y="${y + 4}">${px(p).replace('$', '')}</text>`; }
  const cs = v.map((x, i) => { const cx = L + step * i + step / 2, up = x.c >= x.o, col = up ? 'var(--pos)' : 'var(--neg)'; return `<line x1="${cx}" x2="${cx}" y1="${Y(x.h)}" y2="${Y(x.l)}" stroke="${col}" stroke-width="1.2"/><rect x="${cx - bw / 2}" y="${Y(Math.max(x.o, x.c))}" width="${bw}" height="${Math.max(1.5, Math.abs(Y(x.o) - Y(x.c)))}" fill="${col}" rx="1"/>`; }).join('');
  const cur = price(sym), ly = Y(cur), up = last(sym).c >= last(sym).o;
  const lv = lines.map(([p, c, n]) => `<line x1="${L}" x2="${w - R + 4}" y1="${Y(p)}" y2="${Y(p)}" stroke="${c}" stroke-width="1" stroke-dasharray="5 4" opacity=".9"/><text x="${L + 6}" y="${Y(p) - 4}" style="fill:${c}">${n} ${px(p)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" height="${h}" role="img" aria-label="${sym} candlestick chart, price ${px(cur)}">${g}${cs}${lv}<line x1="${L}" x2="${w - R + 4}" y1="${ly}" y2="${ly}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3"/><rect x="${w - R + 4}" y="${ly - 10}" width="${R - 4}" height="20" rx="4" fill="var(--accent)"/><text x="${w - R + 9}" y="${ly + 4}" style="fill:var(--accent-ink);font-weight:600">${px(cur).replace('$', '')}</text></svg>`;
}
function practice() {
  const task = LES.find((l) => l.task && !l.done), quiz = LES.find((l) => l.q && !l.done && !locked(l.c));
  const coach = task ? `<div class="coach">${ic('zap')}<span><b>Lesson “${task.t}”.</b> ${task.task}. A stop limits your loss if the price moves against you. +${XP} XP for the lesson.</span><button class="btn sm" data-act="goLearn">To lessons</button></div>`
    : quiz ? `<div class="coach">${ic('graduation')}<span>Next lesson: “${quiz.t}”, 1 question, +${XP} XP.</span><button class="btn sm primary" data-act="quiz" data-id="${quiz.id}">Start</button></div>` : '';
  const c = last(sym), chg = (price(sym) / MARKET[sym][MARKET[sym].length - 25].c - 1) * 100;
  return head('Practice', `Virtual deposit. Balance ${usd(balance())}, free ${usd(freeCash())}`, `<div class="lvl"><span class="muted">Lvl ${level()}</span><div class="bar"><i style="width:${xp() % PER / PER * 100}%"></i></div><span class="muted">${xp()} XP</span></div>`) + coach +
    `<div class="kpis"><div class="kpi"><b id="k-eq">${usd(equity())}</b><span>Equity</span></div><div class="kpi"><b id="k-un" class="${unreal() >= 0 ? 'pos' : 'neg'}">${pnlF(unreal())}</b><span>Open P&amp;L</span></div><div class="kpi"><b>${pnlF(realized())}</b><span>Realised P&amp;L</span></div></div>
    <div class="term"><div><section class="card"><div class="chart-h"><span class="px" id="c-px">${px(price(sym))}</span><span id="c-chg" class="${chg >= 0 ? 'pos' : 'neg'}">${chg >= 0 ? '+' : '−'}${Math.abs(chg).toFixed(2)}% in 24h</span><div class="syms">${Object.keys(SYM).map((k) => `<button class="${k === sym ? 'on' : ''}" data-act="sym" data-v="${k}">${k}</button>`).join('')}</div></div><div id="chart"></div></section>
      <section class="card" style="margin-top:var(--gap)"><div class="card-h"><h2>Open positions</h2><span>${POS.length}</span></div><div id="pos">${posHTML()}</div></section></div>
      <aside class="card"><div class="card-h"><h2>New trade</h2><span>${sym}/USDT</span></div>
        <div class="dirs"><button class="l ${dir === 'long' ? 'on' : ''}" data-act="dir" data-v="long">Long</button><button class="s ${dir === 'short' ? 'on' : ''}" data-act="dir" data-v="short">Short</button></div>
        <div class="field"><label for="f-size">Size, €</label><input id="f-size" type="number" min="1" value="${size}"><div class="quick">${[10, 25, 50].map((p) => `<button data-act="pct" data-v="${p}">${p}%</button>`).join('')}</div></div>
        <div class="field"><label><input type="checkbox" id="u-sl" ${useSl ? 'checked' : ''}> Stop-loss, %</label><input id="f-sl" type="number" step="0.1" min="0.1" value="${sl}" ${useSl ? '' : 'disabled'}></div>
        <div class="field"><label><input type="checkbox" id="u-tp" ${useTp ? 'checked' : ''}> Take-profit, %</label><input id="f-tp" type="number" step="0.1" min="0.1" value="${tp}" ${useTp ? '' : 'disabled'}></div>
        <div class="risk" id="risk"></div><button class="btn ${dir === 'long' ? 'long' : 'short'}" style="width:100%;height:42px" data-act="open">${dir === 'long' ? 'Buy' : 'Sell'} ${sym}</button></aside></div>`;
}
function posHTML() {
  if (!POS.length) return '<p class="empty">No positions. Open a trade on the right.</p>';
  return POS.map((p) => { const u = upnl(p); return `<div class="pos-row"><div><b>${p.sym} ${p.dir === 'long' ? 'long' : 'short'}</b><small>${usd(p.size, 0)} · entry ${px(p.entry)}</small></div><div class="hm"><small>Stop</small>${p.sl ? px(p.sl) : '—'}</div><div class="hm"><small>Take</small>${p.tp ? px(p.tp) : '—'}</div><div><b class="${u >= 0 ? 'pos' : 'neg'}">${pnlF(u)}</b><small>${(u / p.size * 100).toFixed(2)}%</small></div><button class="btn sm" data-act="close" data-id="${p.id}">Close</button></div>`; }).join('');
}
function drawRisk() {
  const el = $('#risk'); if (!el) return;
  const cash = freeCash(), risk = useSl ? size * sl / 100 : size, gain = useTp ? size * tp / 100 : null;
  el.innerHTML = `${useSl ? `If the stop triggers, you lose <b>${usd(risk)}</b> (${fmtD(risk / balance() * 100)}% of the deposit).` : '<b>Without a stop</b> you risk the whole trade amount.'}${gain !== null ? ` Take-profit earns <b>${usd(gain)}</b>${useSl ? `, that is 1 to ${fmtD(gain / risk)}` : ''}.` : ''}${size > cash ? ` <b class="neg">Not enough free funds: ${usd(cash)}.</b>` : ''}`;
}
function mount() {
  if (page !== 'practice') return;
  const c = $('#chart'); chart(c, (w) => candleSVG(w)); drawRisk();
}

/* live market: only the chart, price and open P&L repaint; the form is never touched */
setInterval(() => {
  if (!document.hidden) {
    for (const [k, s] of Object.entries(SYM)) { const cd = last(k); cd.c *= 1 + (Math.random() - .495) * s.vol * .45; cd.h = Math.max(cd.h, cd.c); cd.l = Math.min(cd.l, cd.c); }
    checkExits();
    if (page === 'practice') {
      const c = $('#chart'); if (c) c.innerHTML = candleSVG(Math.max(160, c.clientWidth));
      const chg = (price(sym) / MARKET[sym][MARKET[sym].length - 25].c - 1) * 100;
      $('#c-px').textContent = px(price(sym)); $('#c-chg').textContent = `${chg >= 0 ? '+' : '−'}${Math.abs(chg).toFixed(2)}% in 24h`; $('#c-chg').className = chg >= 0 ? 'pos' : 'neg';
      $('#k-eq').textContent = usd(equity()); $('#k-un').textContent = pnlF(unreal()); $('#k-un').className = unreal() >= 0 ? 'pos' : 'neg'; $('#pos').innerHTML = posHTML();
    }
  }
}, 1500);
setInterval(() => { if (!document.hidden) for (const k of Object.keys(SYM)) { const cd = last(k); MARKET[k].push({ o: cd.c, h: cd.c, l: cd.c, c: cd.c }); MARKET[k].shift(); } }, 12000);

function closePos(p, how, at) {
  const exit = at ?? price(p.sym);
  J.unshift({ id: nextJ++, sym: p.sym, dir: p.dir, size: p.size, entry: p.entry, exit, ago: 0, how }); POS = POS.filter((x) => x !== p);
  const t = J[0], r = pnlOf(t); toast(`${p.sym} closed (${how}): ${pnlF(r)}`);
}
function checkExits() {
  [...POS].forEach((p) => { const cur = price(p.sym), long = p.dir === 'long';
    if (p.sl && (long ? cur <= p.sl : cur >= p.sl)) { closePos(p, 'stop', p.sl); if (page === 'practice') render(); }
    else if (p.tp && (long ? cur >= p.tp : cur <= p.tp)) { closePos(p, 'take', p.tp); if (page === 'practice') render(); } });
}

/* ── learn ────────────────────────────────────────────── */
function learn() {
  const body = [1, 2, 3].map((c) => { const ls = LES.filter((l) => l.c === c), d = ls.filter((l) => l.done).length, lk = locked(c);
    return `<section class="course"><div class="course-h"><span class="ch"><span class="cover">${coverImg(c)}</span><h3>${c}. ${COURSES[c]}</h3></span><span class="muted">${lk ? 'Unlocks after course ' + (c - 1) : `${d} of ${ls.length}`}</span></div><div class="bar" style="margin-bottom:8px"><i style="width:${d / ls.length * 100}%"></i></div>
    ${ls.map((l) => `<div class="lesson ${l.done ? 'done' : ''} ${lk ? 'lock' : ''}"><span class="dot">${l.done ? ic('check') : ''}</span><div><b>${l.t}</b><small>${l.task ? 'Chart practice' : 'Question · 1 min'}</small></div>${l.done ? '<span class="pill pos">+' + XP + ' XP</span>' : lk ? ic('lock') : l.task ? '<button class="btn sm primary" data-act="goPractice">Try it</button>' : `<button class="btn sm primary" data-act="quiz" data-id="${l.id}">Start</button>`}</div>`).join('')}</section>`; }).join('');
  return head('Courses', `${LES.filter((l) => l.done).length} of ${LES.length} lessons. Every ${PER} XP unlocks a new level.`) + `<section class="card">${body}</section>`;
}

/* ── journal ──────────────────────────────────────────── */
function journal() {
  const ts = [...J].sort((a, b) => a.ago - b.ago), res = ts.map(pnlOf), wins = res.filter((r) => r > 0), loss = res.filter((r) => r < 0);
  const sums = {}; J.forEach((t) => { sums[t.sym] = (sums[t.sym] || 0) + pnlOf(t); }); const mxs = Math.max(...Object.values(sums).map(Math.abs));
  const bySym = Object.entries(sums).sort((a, b) => b[1] - a[1]).map(([k, v]) => barRow(k, Math.abs(v) / mxs * 100, `<span class="${v >= 0 ? 'pos' : 'neg'}">${pnlF(v)}</span>`, (n => n + ' ' + (n === 1 ? 'trade' : 'trades'))(J.filter((t) => t.sym === k).length))).join('');
  const rows = ts.map((t) => { const r = pnlOf(t); return `<div class="tr" style="--cols:1fr .8fr 1fr 1fr 1fr .8fr;--colsm:1fr auto"><div class="cell-main"><b>${t.sym} ${t.dir === 'long' ? 'long' : 'short'}</b><span>${t.ago === 0 ? 'just now' : t.ago < 24 ? t.ago + ' h ago' : Math.round(t.ago / 24) + ' d ago'}<span class="dm"> · ${t.how}</span></span></div><span class="hm r">${usd(t.size, 0)}</span><span class="hm r">${px(t.entry)}</span><span class="hm r">${px(t.exit)}</span><span class="hm"><span class="pill ${t.how === 'stop' ? 'neg' : ''}">${t.how}</span></span><b class="r ${r >= 0 ? 'pos' : 'neg'}">${pnlF(r)}</b></div>`; }).join('');
  return head('Trade journal', `${J.length} closed trades. Balance ${usd(balance())} = ${usd(START, 0)} ${realized() >= 0 ? '+' : '−'} ${usd(Math.abs(realized()))}`) +
    `<div class="kpis"><div class="kpi"><b>${Math.round(wins.length / res.length * 100)}<small>%</small></b><span>Winning trades</span></div><div class="kpi"><b class="pos">${pnlF(wins.reduce((a, b) => a + b, 0) / (wins.length || 1))}</b><span>Average win</span></div><div class="kpi"><b class="neg">${pnlF(loss.reduce((a, b) => a + b, 0) / (loss.length || 1))}</b><span>Average loss</span></div><div class="kpi"><b class="${realized() >= 0 ? 'pos' : 'neg'}">${pnlF(realized())}</b><span>Total</span></div></div>
    <div class="grid"><section class="card c4"><div class="card-h"><h2>Result by symbol</h2></div>${bySym}</section><section class="card c8"><div class="card-h"><h2>Trades</h2></div><div class="tbl"><div class="tr th" style="--cols:1fr .8fr 1fr 1fr 1fr .8fr;--colsm:1fr auto"><span>Trade</span><span class="hm r">Size</span><span class="hm r">Entry</span><span class="hm r">Exit</span><span class="hm">Closed by</span><span class="r">Result</span></div>${rows}</div></section></div>`
;
}
/* ── rank ─────────────────────────────────────────────── */
function rank() {
  const me = ['You', Math.round(equity())], all = [...RIVALS, me].sort((a, b) => b[1] - a[1]), pos = all.findIndex((x) => x === me) + 1;
  return head('Leaderboard', `You are ranked ${pos} of ${all.length} by equity this month`) + `<section class="card"><div class="tbl">${all.map((x, i) => `<div class="tr ${x === me ? 'me' : ''}" style="--cols:48px 1fr auto"><b>${i + 1}</b><span>${x === me ? '<b>You</b>' : esc(x[0])}</span><b class="r">${usd(x[1], 0)}</b></div>`).join('')}</div></section>`;
}

/* ── actions ──────────────────────────────────────────── */
const levelBefore = () => level();
function finishLesson(l) { const lv = levelBefore(); l.done = true; toast(level() > lv ? `Lesson complete! New level: ${level()}` : `Lesson complete: +${XP} XP`); }
const ACT = {
  sym(d) { sym = d.v; render(); }, dir(d) { dir = d.v; render(); }, goLearn() { go('learn'); }, goPractice() { go('practice'); },
  pct(d) { size = Math.floor(freeCash() * +d.v / 100); $('#f-size').value = size; drawRisk(); },
  open() {
    if (!(size >= 1)) return toast('Enter a trade size');
    if (size > freeCash()) return toast('Not enough free funds');
    const cur = price(sym), long = dir === 'long', f = (pc) => cur * (1 + (long ? 1 : -1) * pc / 100);
    POS.push({ id: nextPos++, sym, dir, size, entry: cur, sl: useSl ? f(-sl) : null, tp: useTp ? f(tp) : null });
    const task = LES.find((l) => l.task && !l.done); if (task && useSl) finishLesson(task); else toast(`${sym}: position opened`);
    render();
  },
  close(d) { closePos(POS.find((p) => p.id === +d.id), 'manual'); render(); },
  quiz(d) {
    const l = LES.find((x) => x.id === +d.id);
    modal(`<h2>${l.t}</h2><p>${l.q}</p><div class="opts">${l.o.map((o, i) => `<button data-act="ans" data-id="${l.id}" data-i="${i}">${o}</button>`).join('')}</div>`);
  },
  ans(d) { const l = LES.find((x) => x.id === +d.id); if (+d.i === l.a) { closeModal(); finishLesson(l); render(); } else toast('Not quite. Try again'); },
};
setInterval(() => {
  if (document.hidden) return;
  RIVALS.forEach((r) => { r[1] = Math.max(1000, Math.round(r[1] * (1 + (Math.random() - .48) * .004))); });
  if (page === 'rank' && !$('#scrim')) render();
}, 3000);
render();
</script>
</body>
</html>
