<!DOCTYPE html>
<html lang="en" data-theme="light" data-fx="flash">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BotFactory — Telegram Bot Builder (demo)</title>
<meta name="description" content="Demo: build Telegram shop and booking bots from blocks, test them in a live preview, send broadcasts and track sales, buyers and payouts. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root[data-theme="light"] {
  --bg: #eef2f6; --surface: #ffffff; --raised: #f3f6f9; --hover: #eaf0f6; --border: #dde4ec; --rule: #eaeff4;
  --text: #121a24; --muted: #53606f; --faint: #66737f;
  --accent: #1b78c8; --accent-ink: #ffffff; --accent-bg: #e3f0fb; --accent-tx: #135d9c;
  --font: "Manrope", system-ui, sans-serif; --display: "Manrope", system-ui, sans-serif;
  --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-drawer: cubic-bezier(.32, .72, 0, 1);
  --shadow: 0 16px 40px rgba(18, 26, 36, .14), 0 2px 6px rgba(18, 26, 36, .06);
}
[hidden] { display: none !important; }
.brand-name, .head h1, .big, .kpi b { font-weight: 800; letter-spacing: -.02em; }
.nav .count { background: var(--accent); color: #fff; }
.nav a .lk { margin-left: auto; width: 14px; height: 14px; color: var(--faint); }
.ver { font-size: 11px; color: var(--faint); padding: 8px 8px 0; display: flex; justify-content: space-between; }
.side-foot { padding: 0; border-top: 0; }
.userbtn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 8px; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; cursor: pointer; border-radius: 0 0 8px 8px; transition: background-color .15s; }
.userbtn:hover { background: var(--hover); }
.userbtn .ic { margin-left: auto; color: var(--faint); width: 16px; height: 16px; }
.avatar { background: var(--accent-bg); color: var(--accent-tx); }

/* top bar */
.top { display: flex; align-items: center; gap: 6px; margin: -10px 0 12px; min-height: 40px; }
.top .crumb { margin-right: auto; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-width: 0; }
.top .crumb b { color: var(--text); font-weight: 600; }
.top .mbrand { display: none; align-items: center; gap: 8px; font-weight: 800; }
.top .mbrand .brand-mark { width: 28px; height: 28px; }
.env { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 12px; background: var(--pos-bg); color: var(--pos); font-size: 12px; font-weight: 600; }
.env i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.iconbtn { position: relative; width: 36px; height: 36px; border-radius: 9px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s, transform .12s var(--ease); flex: none; }
.iconbtn:hover { background: var(--surface); color: var(--text); }
.iconbtn:active { transform: scale(.95); }
.iconbtn .avatar { width: 30px; height: 30px; }
.badge { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: #d93a34; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }

/* popovers, menus, sheet */
.pop { position: fixed; z-index: 45; width: min(360px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; animation: popin .16s var(--ease-out) both; max-height: min(520px, calc(100svh - 80px)); overflow: auto; }
.pop.sm { width: 230px; }
@keyframes popin { from { opacity: 0; transform: scale(.97) translateY(-4px); } }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 7px 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; color: var(--text); font: inherit; }
.mi:hover, .mi:focus-visible { background: var(--hover); }
.mi .ic { color: var(--muted); width: 16px; height: 16px; }
.mi.danger, .mi.danger .ic { color: var(--neg); }
.mi small { margin-left: auto; color: var(--faint); font-size: 12px; }
.msep { height: 1px; background: var(--rule); margin: 5px 4px; }
.mhead { padding: 10px 10px 8px; }
.mhead b { display: block; } .mhead span { font-size: 12px; color: var(--muted); }
.pop-h { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; }
.pop-h b { font-size: 14px; }
.lnk { border: 0; background: none; color: var(--accent); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.lnk:hover { text-decoration: underline; }
.nt { display: grid; grid-template-columns: 32px minmax(0, 1fr) 8px; gap: 10px; width: 100%; padding: 10px; border: 0; background: none; text-align: left; border-radius: 8px; cursor: pointer; color: var(--text); font: inherit; }
.nt:hover { background: var(--hover); }
.nt .ni { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); color: var(--muted); }
.nt .ni.pos { background: var(--pos-bg); color: var(--pos); } .nt .ni.neg { background: var(--neg-bg); color: var(--neg); } .nt .ni.acc { background: var(--accent-bg); color: var(--accent); }
.nt b { display: block; font-size: 13px; font-weight: 600; } .nt span { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; } .nt small { font-size: 11px; color: var(--faint); }
.nt i.u { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 5px; } .nt i:not(.u) { width: 8px; }
.sheet-s { position: fixed; inset: 0; background: rgba(18, 26, 36, .35); z-index: 44; animation: fade .2s both; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--surface); border-radius: 16px 16px 0 0; padding: 8px 10px calc(14px + env(safe-area-inset-bottom)); animation: sheetin .26s var(--ease-drawer) both; max-height: 85svh; overflow: auto; }
.sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 2px auto 8px; }
@keyframes sheetin { from { transform: translateY(100%); } }

/* drawer */
.dscrim { position: fixed; inset: 0; background: rgba(18, 26, 36, .32); z-index: 35; animation: fade .2s both; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: var(--surface); border-left: 1px solid var(--border); z-index: 36; display: flex; flex-direction: column; animation: slidein .28s var(--ease-drawer) both; box-shadow: var(--shadow); }
@keyframes slidein { from { transform: translateX(100%); } }
.dr-h { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.dr-h h2 { font-size: 18px; letter-spacing: -.01em; overflow-wrap: anywhere; } .dr-h p { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.dr-h > div { flex: 1; min-width: 0; }
.dr-b { flex: 1; overflow: auto; padding: 18px 20px 24px; }
.dr-b h3 { font-size: 13px; font-weight: 700; margin: 20px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.dr-b h3:first-child { margin-top: 0; }
.dr-f { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { overflow-wrap: anywhere; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stats3 > div { background: var(--raised); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.stats3 b { display: block; font-size: 17px; font-weight: 800; } .stats3 span { font-size: 12px; color: var(--muted); }
.tl { position: relative; padding-left: 20px; }
.tl li { position: relative; padding-bottom: 12px; font-size: 13px; }
.tl li::before { content: ""; position: absolute; left: -16px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.tl li.neg::before { background: var(--neg); } .tl li.warn::before { background: var(--warn); }
.tl li + li::after { content: ""; position: absolute; left: -12px; top: -9px; height: 14px; width: 1px; background: var(--border); }
.tl small { display: block; color: var(--muted); font-size: 12px; }

/* toolbars, tables */
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.search { position: relative; flex: 1 1 220px; max-width: 340px; min-width: 0; }
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); width: 16px; height: 16px; }
.search input { width: 100%; height: 34px; padding: 0 30px 0 32px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 600 11px var(--font); color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; line-height: 16px; background: var(--raised); }
.search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }
.sel { height: 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 0 8px; max-width: 100%; min-width: 0; cursor: pointer; }
.sel:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.tools .grow { flex: 1; }
.th .sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; gap: 2px; align-items: center; border-radius: 4px; }
.th .sort:hover, .th .sort.on { color: var(--text); }
.th .sort .ic { width: 14px; height: 14px; }
.th .r .sort, .th .sort.rr { justify-content: flex-end; }
.tr.click { cursor: pointer; }
.tr.click:focus-visible { outline-offset: -2px; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.pager div { display: flex; gap: 6px; align-items: center; }
.cust { display: flex; align-items: center; gap: 10px; min-width: 0; }
.cust .av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; }
.cust .cell-main { min-width: 0; } .cust .cell-main b, .cust .cell-main span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--accent-bg); color: var(--accent-tx); font-size: 12px; font-weight: 600; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tag.g { background: var(--neutral-bg); color: var(--muted); }
.tag.v { background: #f6ecd7; color: #7a5208; }
.tag button { border: 0; background: none; color: inherit; cursor: pointer; padding: 0; display: grid; place-items: center; border-radius: 3px; }
.tag button .ic { width: 12px; height: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tbl-empty { padding: 40px 12px; text-align: center; color: var(--muted); }
.tbl-empty .ic { width: 28px; height: 28px; margin: 0 auto 10px; color: var(--faint); }
.tbl-empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
.tbl-empty .btn { margin-top: 14px; }
.sk { display: block; background: linear-gradient(90deg, var(--raised) 0, var(--hover) 50%, var(--raised) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 6px; height: 14px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; display: inline-block; flex: none; }
.lockst { padding: 56px 20px; text-align: center; max-width: 440px; margin: 0 auto; }
.lockst .ic { width: 36px; height: 36px; margin: 0 auto 14px; color: var(--faint); }
.lockst h2 { font-size: 18px; margin-bottom: 6px; } .lockst p { color: var(--muted); margin-bottom: 16px; }
.delta { font-size: 12px; font-weight: 600; margin-left: 6px; }
.kpi { min-width: 0; }
.kpi em { display: block; font-style: normal; font-size: 12px; color: var(--faint); margin-top: 2px; }
.card-h .btn { flex: none; }
.ok { color: var(--pos); }

/* forms */
.field.err input, .field.err textarea, .field.err select, input.err { border-color: var(--neg) !important; }
.ferr { color: var(--neg); font-size: 12px; display: flex; gap: 4px; align-items: center; }
.hint { color: var(--faint); font-size: 12px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 12px; }
.chk { display: flex; align-items: center; gap: 8px; min-height: 30px; cursor: pointer; font-size: 14px; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; flex: none; }
.chk small { color: var(--faint); margin-left: auto; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--raised); border-radius: 9px; flex-wrap: wrap; }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; font-weight: 500; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.counter { font-size: 12px; color: var(--faint); text-align: right; }
.counter.neg { color: var(--neg); }
.fmt { display: flex; gap: 4px; }
.fmt button { width: 30px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; font-weight: 700; }
.savebar { position: sticky; bottom: 12px; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; margin-top: 16px; border-radius: 12px; background: var(--text); color: #fff; box-shadow: var(--shadow); flex-wrap: wrap; }
.savebar span { flex: 1; min-width: 140px; }
.savebar .btn { border-color: rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fff; }
.savebar .btn.primary { background: var(--accent); border-color: transparent; }
.undo { position: fixed; left: 50%; bottom: 24px; z-index: 65; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 16px; border-radius: 10px; background: var(--text); color: #fff; font-weight: 500; box-shadow: var(--shadow); transform: translate(-50%, 12px); opacity: 0; transition: opacity .2s, transform .25s var(--ease-out); max-width: calc(100vw - 32px); }
.undo.show { opacity: 1; transform: translate(-50%, 0); }
.undo button { border: 0; background: rgba(255,255,255,.12); color: #fff; font: inherit; font-weight: 700; height: 30px; padding: 0 12px; border-radius: 7px; cursor: pointer; }
.modal { max-width: 480px; }
.modal.wide { max-width: 640px; }
.modal .x { float: right; margin: -6px -8px 0 0; }
.danger-btn { background: var(--neg) !important; color: #fff !important; border-color: transparent !important; }
.btn .ic { width: 16px; height: 16px; }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }

/* builder */
.build { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.flow { position: relative; display: flex; flex-direction: column; gap: 10px; padding-left: 28px; }
.flow::before { content: ""; position: absolute; left: 11px; top: 18px; bottom: 54px; width: 2px; background: var(--border); border-radius: 1px; }
.step { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); transition: border-color .15s; }
.step::before { content: attr(data-n); position: absolute; left: -28px; top: 14px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); }
.step.open { border-color: var(--accent); }
.step.open::before { border-color: var(--accent); color: var(--accent); }
.step.bad { border-color: var(--neg); } .step.bad::before { border-color: var(--neg); color: var(--neg); }
.step-h { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--radius); }
.step-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); }
.step-ic.k-cond, .step-ic.k-delay { background: #efeafc; color: #6a4bc4; } .step-ic.k-pay, .step-ic.k-catalog { background: var(--pos-bg); color: var(--pos); } .step-ic.k-remind, .step-ic.k-sub { background: var(--warn-bg); color: var(--warn); }
.step-h b { display: block; font-weight: 700; } .step-h span:not(.step-ic) { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-h .ic.chev { color: var(--faint); transition: transform .2s var(--ease); } .step.open .chev { transform: rotate(180deg); }
.step-h b em { font-style: normal; color: var(--neg); font-size: 12px; font-weight: 600; margin-left: 6px; }
.step-b { padding: 4px 14px 14px 60px; }
.step-b .field { margin-bottom: 12px; }
.step-b textarea { width: 100%; }
.opt-row { display: flex; gap: 6px; margin-bottom: 6px; } .opt-row input { flex: 1; min-width: 0; }
.step-tools { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.add-step { margin-top: 4px; justify-self: start; align-self: flex-start; }
.subbox { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: var(--raised); }
.subbox .field input, .subbox .field select { background: var(--surface); }
.prow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; cursor: pointer; }
.prow input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.prow em { font-style: normal; color: var(--muted); }
.condline { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr) minmax(0, 1.2fr); gap: 8px; }
.bstat { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
.palette { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.palette button { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); cursor: pointer; transition: border-color .15s, background-color .15s, transform .12s var(--ease); }
.palette button:hover { border-color: var(--accent); background: var(--raised); }
.palette button:active { transform: scale(.98); }
.palette b { display: block; font-size: 13px; } .palette span:not(.step-ic) { display: block; font-size: 12px; color: var(--muted); }

/* phone */
.phone { position: sticky; top: 16px; width: 340px; border: 1px solid var(--border); border-radius: 28px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; height: min(660px, calc(100svh - 70px)); box-shadow: 0 10px 30px rgba(18, 26, 36, .08); }
.tg-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.tg-av { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; }
.tg-h > div { min-width: 0; } .tg-h b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tg-h span { font-size: 12px; color: var(--muted); }
.tg-h span.ty { color: var(--accent); }
.tg-h .btn { margin-left: auto; }
.chat { flex: 1; overflow: auto; padding: 14px 12px; background: #dfe8ef; display: flex; flex-direction: column; gap: 6px; }
.m { max-width: 86%; padding: 8px 11px; border-radius: 14px; background: #fff; align-self: flex-start; border-bottom-left-radius: 4px; word-wrap: break-word; white-space: pre-wrap; font-size: 13.5px; }
.m.me { align-self: flex-end; background: #d4ecb8; border-radius: 14px; border-bottom-right-radius: 4px; }
.new { animation: pop .2s var(--ease) both; }
.m small { display: block; margin-top: 4px; font-size: 11px; color: #5f7a90; }
.m.file { display: flex; align-items: center; gap: 8px; }
.m.file .ic { color: var(--accent); }
.inl { display: flex; flex-direction: column; gap: 4px; align-self: stretch; }
.inl button { min-height: 34px; padding: 4px 8px; border: 0; border-radius: 10px; background: rgba(27,120,200,.88); color: #fff; font-weight: 600; cursor: pointer; transition: background-color .15s, transform .12s; }
.inl button:hover { background: #1b78c8; } .inl button:active { transform: scale(.97); }
.inl button.pay { background: #2f9e57; }
.inl button:disabled { opacity: .5; cursor: default; }
.note { align-self: center; font-size: 12px; color: #54697b; background: rgba(255,255,255,.65); padding: 3px 10px; border-radius: 10px; text-align: center; max-width: 92%; }
.typing { align-self: flex-start; background: #fff; border-radius: 14px; border-bottom-left-radius: 4px; padding: 11px 12px; display: flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: #8aa0b2; animation: blink 1s infinite both; }

  expPay() { const rows = payRows(); download(`botfactory-payments-${isoD(NOW).slice(0, 10)}.csv`, csv([['Order', 'Payment ID', 'Date', 'Customer', 'Bot', 'Items', 'Method', 'Status', 'Amount (EUR)', 'Fee (EUR)', 'Net (EUR)'], ...rows.map((o) => [o.id, o.pi, isoD(o.t), custById.get(o.cust).name, botN(o.bot), o.items.map((i) => `${i.q} x ${i.n}`).join('; '), METHODS[o.method], PST[o.status][1], (o.amount / 100).toFixed(2), (o.fee / 100).toFixed(2), ((o.status === 'paid' ? o.amount - o.fee : 0) / 100).toFixed(2)])])); },
  instant() { const av = available(), fee = Math.max(50, Math.round(av * .01));
    confirmBox(`Pay out ${eurC(av - fee)} now?`, `Instant payouts reach ${S.bank.name} •••• 4821 within 30 minutes. Fee: 1%, ${eurC(fee)}.`, 'Pay out now', () => { ledgerAdd(NOW, -fee, 'fee', 'instant'); const id = 'po_1Q' + rstr(12), es = S.ledger.filter((e) => !e.po); es.forEach((e) => { e.po = id; }); S.payouts.unshift({ id, t: NOW, arrive: NOW + 30 * MIN, amount: av - fee, n: es.filter((e) => e.kind === 'payment').length, status: 'transit', instant: true }); reconcile(); render(); toast('Instant payout on its way'); }, false); },
  bankEdit() { modal(`<h2>Payout bank account</h2><p>Payouts go to a business account in your company's name.</p><form id="bk" novalidate>${F('Account holder', `<input id="bk-h" value="${esc(S.bank.holder)}">`)}${F('IBAN', `<input id="bk-i" value="${esc(S.bank.iban)}" class="mono">`)}${F('Payout schedule', `<select id="bk-s">${[['daily', 'Every business day'], ['weekly', 'Weekly on Mondays'], ['monthly', 'Monthly on the 1st']].map(([k, l]) => `<option value="${k}" ${S.bank.sched === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`, (s) => { $('#bk', s).onsubmit = (e) => { e.preventDefault(); clearErrs(s); if (!$('#bk-h').value.trim()) return fieldErr('#bk-h', 'Enter the account holder.'); if (!ibanOk($('#bk-i').value)) return fieldErr('#bk-i', 'This IBAN does not pass the bank check. Look for a typo.'); S.bank.holder = $('#bk-h').value.trim(); S.bank.iban = $('#bk-i').value.toUpperCase(); S.bank.sched = $('#bk-s').value; closeModal(); render(); toast('Bank account saved'); }; }); },
  delCmd(d) { U.sdraft.cmds.splice(+d.i, 1); U.sdirty = true; render(); },
  addCmd() { U.sdraft.cmds.push({ c: '', d: '' }); U.sdirty = true; render(); const ins = $$('.cmd .pre input'); ins[ins.length - 1].focus(); },
  sDiscard() { U.sdraft = null; render(); toast('Changes discarded'); },
  sSave() { const b = S.bots.find((x) => x.id === U.sbot), { id, ...set } = U.sdraft; b.set = structuredClone(set); b.name = set.name; U.sdirty = false; render(); toast('Settings saved and synced to Telegram'); },
  plan(d) { const P = PLANS[d.k], cur = PLANS[S.plan];
    if (S.bots.length > P.bots) return modal(`<h2>${P.name} allows ${pl(P.bots, 'bot')}</h2><p>You have ${pl(S.bots.length, 'bot')}. Delete or merge bots until ${P.bots === 1 ? 'one is' : P.bots + ' are'} left, then switch plans.</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">OK</button></div>`);
    const pr = Math.round((P.price - cur.price) * 24 / 30);
    confirmBox(`Switch to ${P.name}?`, pr > 0 ? `You pay ${eurC(Math.round(pr * 1.21))} today (24 days prorated, VAT included), then ${eurC(Math.round(P.price * 1.21))} a month.` : `The change applies on 1 December. ${P.fee}.`, `Switch to ${P.name}`, () => { S.plan = d.k; if (pr > 0) INVOICES.unshift({ id: 'INV-2026-' + String(12 + INVOICES.length - 11).padStart(4, '0'), t: NOW, net: pr, vat: Math.round(pr * .21), status: 'Paid' }); render(); toast(`You are on ${P.name} now`); }, false); },
  billEdit() { const B = S.billing; modal(`<h2>Billing details</h2><p>Shown on every BotFactory invoice.</p><form id="bl" novalidate>${F('Company', `<input id="bl-c" value="${esc(B.company)}">`)}${F('VAT ID', `<input id="bl-v" value="${esc(B.vat)}" class="mono">`, '', 'EU VAT ID, for example NL862145903B01. Reverse charge applies outside NL.')}${F('Address', `<input id="bl-a" value="${esc(B.addr)}">`)}${F('Invoice email', `<input id="bl-e" type="email" value="${esc(B.email)}">`)}<div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`, (s) => { $('#bl', s).onsubmit = (e) => { e.preventDefault(); clearErrs(s); if (!$('#bl-c').value.trim()) return fieldErr('#bl-c', 'Enter the company name.'); if (!/^[A-Z]{2}[A-Z0-9]{8,12}$/.test($('#bl-v').value.replace(/\s/g, '').toUpperCase())) return fieldErr('#bl-v', 'Enter a valid EU VAT ID: country code and 8 to 12 characters.'); if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test($('#bl-e').value.trim())) return fieldErr('#bl-e', 'Enter a valid email address.'); Object.assign(B, { company: $('#bl-c').value.trim(), vat: $('#bl-v').value.replace(/\s/g, '').toUpperCase(), addr: $('#bl-a').value.trim(), email: $('#bl-e').value.trim() }); closeModal(); render(); toast('Billing details saved'); }; }); },
  inv(d) { const v = INVOICES.find((x) => x.id === d.k), B = S.billing; download(`${v.id}.html`, `<!doctype html><meta charset="utf-8"><title>${v.id}</title><body style="font:14px system-ui;max-width:640px;margin:40px auto"><h1>Invoice ${v.id}</h1><p>BotFactory B.V. · Keizersgracht 221, Amsterdam · VAT NL859321447B01</p><p>Billed to: ${esc(B.company)}<br>${esc(B.addr)}<br>VAT ID ${esc(B.vat)}</p><p>Date: ${fDate(v.t)}</p><table style="width:100%;border-collapse:collapse"><tr><td>BotFactory ${PLANS[S.plan].name}, monthly</td><td style="text-align:right">${eurC(v.net)}</td></tr><tr><td>VAT 21%</td><td style="text-align:right">${eurC(v.vat)}</td></tr><tr><th style="text-align:left">Total paid</th><th style="text-align:right">${eurC(v.net + v.vat)}</th></tr></table><p>Sample invoice from a demo.</p>`, 'text/html'); },
  expInv() { download('botfactory-invoices.csv', csv([['Invoice', 'Date', 'Net (EUR)', 'VAT (EUR)', 'Total (EUR)', 'Status'], ...INVOICES.map((v) => [v.id, isoD(v.t).slice(0, 10), (v.net / 100).toFixed(2), (v.vat / 100).toFixed(2), ((v.net + v.vat) / 100).toFixed(2), v.status])])); },
};

/* ── live: buyers keep arriving, broadcasts keep delivering ─────── */
const busy = () => $('#scrim') || $('.drawer') || popEl || $('.sheet') || (document.activeElement && document.activeElement.matches('input,textarea,select'));
setInterval(() => {
  NOW = NOW0 + (Date.now() - BOOT); if (document.hidden || !S.authed) return;
  const live = S.bots.filter((b) => b.live && b.token && b.id <= 4); if (!live.length) return;
  const b = pick(live); b.fun[0][0]++; if (rnd() < .7) b.fun[0][1]++;
  if (rnd() < .5) {
    const pool = S.customers.filter((c) => !c.blocked), c = rnd() < .4 ? pick(pool.filter((x) => x.bots.has(b.id)).concat(pool).slice(0, 40)) : pick(pool);
    const o = newOrder(b.id, c, NOW); if (o.method === 'sepa') o.status = 'pending';
    S.orders.unshift(o); const f = b.fun[0]; f[1] = Math.max(f[1], f[2] + 1); f[2]++; f[0] = Math.max(f[0], f[1]);
    if (o.status === 'paid') ledgerAdd(NOW, o.amount - o.fee, 'payment', o.id);
    notify('pos', o.status === 'paid' ? 'New payment' : 'SEPA payment started', `${eurC(o.amount)} from ${c.name} · ${b.name}`, { page: 'payments', order: o.id });
    toast(`New payment ${eurC(o.amount)} · ${b.name}`); autoTags(); reconcile();
  } else { const f = b.fun[0]; f[1] = Math.min(f[1], f[0]); }
  if (['bots', 'analytics'].includes(U.page) && !busy() && !U.loading) render(); else chrome();
}, 9000);
setInterval(() => {
  let ch = false;
  for (const b of S.broadcasts) if (b.status === 'sending') { ch = true; b.del = Math.min(Math.round(b.n * .97), b.del + Math.ceil(b.n / 7)); if (b.del >= Math.round(b.n * .97)) { b.status = 'sent'; b.blocked = Math.round(b.n * .005); notify('acc', 'Broadcast delivered', `"${b.name}" reached ${fmt(b.del)} of ${fmt(b.n)} subscribers.`, { page: 'broadcasts', bc: b.id }); if (S.authed) chrome(); } }
  if (ch && U.page === 'broadcasts' && !U.bc.compose && !busy()) render();
}, 700);
render();
</script>
