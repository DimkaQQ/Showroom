<!DOCTYPE html>
<html lang="en" data-theme="light" data-fx="flash">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BotFactory — Telegram Bot Builder (demo)</title>
<meta name="description" content="Demo: build a Telegram bot from blocks and test it instantly in a live preview. Sales, funnel and buyers. All data is fictional.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root[data-theme="light"] {
  --bg: #eef2f6; --surface: #ffffff; --raised: #f3f6f9; --hover: #eaf0f6; --border: #dde4ec; --rule: #eaeff4;
  --text: #121a24; --muted: #53606f; --faint: #66737f;
  --accent: #1b78c8; --accent-ink: #ffffff; --accent-bg: #e3f0fb;
  --font: "Manrope", system-ui, sans-serif; --display: "Manrope", system-ui, sans-serif;
}
.brand-name, .head h1, .big, .kpi b { font-weight: 800; letter-spacing: -.02em; }
.nav .count { background: var(--accent); color: #fff; }

/* builder */
.build { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.flow { position: relative; display: flex; flex-direction: column; gap: 10px; padding-left: 28px; }
.flow::before { content: ""; position: absolute; left: 11px; top: 18px; bottom: 54px; width: 2px; background: var(--border); border-radius: 1px; }
.step { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); animation: pop .25s var(--ease) both; transition: border-color .15s; }
.step::before { content: attr(data-n); position: absolute; left: -28px; top: 14px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted); }
.step.open { border-color: var(--accent); }
.step.open::before { border-color: var(--accent); color: var(--accent); }
.step-h { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: var(--radius); }
.step-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); }
.step-h b { display: block; font-weight: 700; } .step-h span:not(.step-ic) { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.step-h .ic.chev { color: var(--faint); transition: transform .2s var(--ease); } .step.open .chev { transform: rotate(180deg); }
.step-b { padding: 4px 14px 14px 60px; }
.step-b .field { margin-bottom: 10px; }
.step-b textarea { width: 100%; }
.opt-row { display: flex; gap: 6px; margin-bottom: 6px; } .opt-row input { flex: 1; min-width: 0; }
.step-tools { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.add-step { margin-top: 4px; justify-self: start; }

/* phone */
.phone { position: sticky; top: 16px; width: 340px; border: 1px solid var(--border); border-radius: 28px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; height: min(640px, calc(100svh - 70px)); }
.tg-h { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.tg-av { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; }
.tg-h b { display: block; font-size: 14px; } .tg-h span { font-size: 12px; color: var(--muted); }
.tg-h .btn { margin-left: auto; }
.chat { flex: 1; overflow: auto; padding: 14px 12px; background: #dfe8ef; display: flex; flex-direction: column; gap: 6px; }
.m { max-width: 84%; padding: 8px 11px; border-radius: 14px; background: #fff; align-self: flex-start; border-bottom-left-radius: 4px; animation: pop .2s var(--ease) both; word-wrap: break-word; }
.m.me { align-self: flex-end; background: #d4ecb8; border-radius: 14px; border-bottom-right-radius: 4px; }
.m small { display: block; margin-top: 4px; font-size: 11px; color: #5f7a90; }
.m.file { display: flex; align-items: center; gap: 8px; }
.m.file .ic { color: var(--accent); }
.inl { display: flex; flex-direction: column; gap: 4px; align-self: stretch; animation: pop .2s var(--ease) both; }
.inl button { height: 34px; border: 0; border-radius: 10px; background: rgba(27,120,200,.88); color: #fff; font-weight: 600; cursor: pointer; transition: background-color .15s, transform .12s; }
.inl button:hover { background: #1b78c8; } .inl button:active { transform: scale(.97); }
.inl button.pay { background: #2f9e57; }
.note { align-self: center; font-size: 12px; color: #54697b; background: rgba(255,255,255,.6); padding: 3px 10px; border-radius: 10px; }
.tg-f { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--surface); }
.tg-f input { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--border); border-radius: 18px; padding: 0 14px; background: var(--bg); outline: none; }
.tg-f input:focus { border-color: var(--accent); }
.tg-f button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; }
.tg-f input:disabled, .tg-f button:disabled { opacity: .45; cursor: default; }
.bmode { display: none; } .dm { display: none; }

/* dashboard */
.funnel { display: flex; flex-direction: column; gap: 14px; }
.fn { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: 14px; align-items: center; }
.fn .bar { height: 22px; border-radius: 6px; } .fn .bar i { border-radius: 6px; }
.fn .bar i.lost { background: var(--neg); opacity: .8; }
.fn b { text-align: right; font-weight: 700; }
.fn-note { margin-top: 14px; color: var(--muted); }
.botrow-n { display: flex; align-items: center; gap: 10px; }
.botrow-n .step-ic { width: 32px; height: 32px; }

@media (max-width: 1099px) { .build { grid-template-columns: minmax(0, 1fr); } .phone { position: relative; top: 0; width: 100%; max-width: 380px; margin: 0 auto; height: 560px; } }
@media (max-width: 899px) {
  .bmode { display: inline-flex; } .dm { display: block; }
  .build[data-mode="flow"] .phone, .build[data-mode="chat"] .flow { display: none; }
  .fn { grid-template-columns: 110px minmax(0, 1fr) 48px; gap: 10px; }
  .step-b { padding-left: 14px; }
}
</style>
</head>
<body>
<div class="notice"><b>Demo</b> BotFactory · data is fictional</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M5 9h14v10H5zM12 5v4M9 14h.01M15 14h.01M3 13v3M21 13v3"/></svg></div>
      <div><div class="brand-name">BotFactory</div><div class="brand-sub">Marta's Studio</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="avatar">MJ</div><div class="who"><b>Marta Jansen</b><span>Master plan</span></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<script>
/*@kit.js*/
'use strict';

/* ── data ─────────────────────────────────────────────── */
const eur = (n) => '€' + fmt(n);
const TODAY = new Date(2026, 9, 21, 15, 20);          // Wed 21 Oct 2026
const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const dayOf = (ago) => new Date(TODAY.getTime() - ago * 864e5);
const dLabel = (ago) => ago === 0 ? 'Today' : ago === 1 ? 'Yesterday' : dayOf(ago).toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });

const TPL = {
  salon: { name: 'Appointment booking', icon: 'calendar', steps: () => [
    { t: 'msg', text: "Hi! I'm Marta, a nail artist in Amsterdam. I'll book you in a minute." },
    { t: 'buttons', text: 'What would you like to do?', opts: ['Manicure · €45', 'Pedicure · €55', 'Removal · €15'] },
    { t: 'ask', text: 'What is your name?' },
    { t: 'pay', text: 'A prepayment secures your slot. It is deducted from the price.', price: 25 },
    { t: 'give', text: 'You are booked! Address: 12 Prinsengracht, room 4.', file: 'Before your visit.pdf' },
  ] },
  course: { name: 'Course sales', icon: 'graduation', steps: () => [
    { t: 'msg', text: 'Hello! This is the bot for the "First Launch" course: 12 lessons on getting your first sales.' },
    { t: 'buttons', text: 'Where shall we start?', opts: ['What is inside the course', 'I want to buy'] },
    { t: 'pay', text: 'Lifetime access to the course. Pay by card, PayPal, Klarna or SEPA transfer.', price: 79 },
    { t: 'give', text: 'Payment received, thank you! Your lessons are now unlocked.', file: 'Open course' },
  ] },
  channel: { name: 'Private members channel', icon: 'lock', steps: () => [
    { t: 'msg', text: 'Hi! Every day I review buyer requests here. The channel is private, access by subscription.' },
    { t: 'buttons', text: 'Want a peek inside?', opts: ['Show a sample review', 'Subscribe'] },
    { t: 'pay', text: '30-day subscription via Stripe, no auto-renewal.', price: 19 },
    { t: 'give', text: 'Welcome! This link works only for you.', file: 'Join channel' },
  ] },
};
const STEP = {
  msg: ['Message', 'chat'], ask: ['Question', 'edit'], buttons: ['Buttons', 'grid'], pay: ['Payment', 'coin'], give: ['Delivery', 'file'], remind: ['Reminder', 'clock'],
};

const S = {
  bots: [
    { id: 1, name: 'Booking Nail Studio', user: '@marta_nails_bot', tpl: 'salon', live: true, steps: TPL.salon.steps(), starts: 96, answered: 71, atPay: 38 },
    { id: 2, name: 'Course "First Launch"', user: '@first_launch_bot', tpl: 'course', live: true, steps: TPL.course.steps(), starts: 180, answered: 120, atPay: 41 },
    { id: 3, name: 'Members channel', user: '@marta_club_bot', tpl: 'channel', live: true, steps: TPL.channel.steps(), starts: 64, answered: 52, atPay: 19 },
  ],
  sales: [],
};
/* sales are derived from days-ago lists, so every total on every page reconciles */
const BUYERS = ['Anna L.', 'Sofia R.', 'Lukas M.', 'Camille D.', 'Elena P.', 'Jonas B.', 'Giulia F.', 'Mateo G.', 'Katarzyna W.', 'Pieter V.', 'Ingrid S.', 'Hugo N.', 'Aoife K.'];
const DAYS = { 1: [0, 0, 0, 1, 1, 2, 2, 3, 3, 4, 5, 5, 6, 6], 2: [0, 1, 3, 4, 6, 6], 3: [0, 0, 1, 1, 2, 3, 3, 4, 5, 6, 6] };
const PRICE = { 1: 25, 2: 79, 3: 19 };
(() => {
  let k = 0;
  for (const id of [1, 2, 3]) DAYS[id].forEach((ago, i) => { S.sales.push({ bot: id, ago, buyer: BUYERS[(k * 5 + i * 3 + id) % BUYERS.length], amount: PRICE[id], min: 540 + ((k * 137) % 780) }); k++; });
  S.sales.sort((a, b) => a.ago - b.ago || b.min - a.min);
})();
const sold = (id) => S.sales.filter((s) => s.bot === id);
const botPrice = (b) => (b.steps.find((s) => s.t === 'pay') || {}).price || 0;
const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const stats = (b) => { const paid = sold(b.id).length, rev = paid * PRICE[b.id]; return { paid, rev, conv: b.starts ? paid / b.starts : 0 }; };
const totals = () => { const r = S.bots.map(stats); return { rev: r.reduce((a, x) => a + x.rev, 0), paid: r.reduce((a, x) => a + x.paid, 0), starts: S.bots.reduce((a, b) => a + b.starts, 0) }; };
console.assert(S.sales.length === 31 && totals().rev === 1033, 'sales reconcile');
console.assert(S.bots.every((b) => b.starts >= b.answered && b.answered >= b.atPay && b.atPay >= sold(b.id).length), 'funnel narrows');

/* ── shell ────────────────────────────────────────────── */
const PAGES = { dashboard: ['Bots', 'home'], builder: ['Builder', 'sliders'], sales: ['Sales', 'coin'], buyers: ['Buyers', 'users'] };
let page = 'dashboard', cur = 1, openStep = 0, salesBot = 0, mode = 'flow', fbot = 2;

function chrome() {
  const item = (k) => `<a data-page="${k}" tabindex="0" role="link">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span></a>`;
  $('#nav').innerHTML = item('dashboard') + item('builder') + `<div class="nav-label">Money and people</div>` + item('sales') + item('buyers');
  $('#tabbar').innerHTML = Object.keys(PAGES).map((k) => `<a data-page="${k}" tabindex="0" role="link">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span></a>`).join('');
  setNav(page);
}
function render() { chrome(); $('#main').innerHTML = ({ dashboard, builder, sales, buyers })[page](); mount(); }
function go(p) { page = p; render(); window.scrollTo(0, 0); }
const bot = () => S.bots.find((b) => b.id === cur);
const head = (t, sub, actions = '') => `<header class="head"><div><h1>${t}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></header>`;

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-page]'); if (a) return go(a.dataset.page);
  const o = e.target.closest('[data-openbot]'); if (o) { cur = +o.dataset.openbot; openStep = 0; resetRun(); return go('builder'); }
  const act = e.target.closest('[data-act]'); if (act) ACT[act.dataset.act](act.dataset, act);
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-page]')) { e.preventDefault(); go(e.target.dataset.page); } });
document.addEventListener('input', (e) => {
  const f = e.target.dataset.f; if (!f) return;
  const s = bot().steps[+e.target.dataset.i];
  if (f === 'text') s.text = e.target.value;
  if (f === 'file') s.file = e.target.value;
  if (f === 'price') s.price = Math.max(0, +e.target.value || 0);
  if (f === 'opt') s.opts[+e.target.dataset.o] = e.target.value;
  const sub = e.target.closest('.step')?.querySelector('.step-h span'); if (sub) sub.textContent = summary(s);
  resetRun(); drawChat();
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'bot-sel') { cur = +e.target.value; openStep = 0; resetRun(); render(); }
});
document.addEventListener('submit', (e) => { if (e.target.id === 'tg-form') { e.preventDefault(); answer(); } });

/* ── dashboard ────────────────────────────────────────── */
function dashboard() {
  const t = totals(), conv = t.paid / t.starts;
  const worst = S.bots.map((b) => ({ b, lost: b.atPay - sold(b.id).length })).filter((x) => !x.b.steps.some((s) => s.t === 'remind') && x.lost >= 30).sort((a, b) => b.lost - a.lost)[0];
  const finding = worst ? `<div class="finding">${ic('alert')}<span>In "${esc(worst.b.name)}", ${worst.lost} of ${worst.b.atPay} people reached payment and left. A reminder an hour later usually wins some of them back.</span><button class="btn sm primary" data-act="addRemind" data-bot="${worst.b.id}">Add reminder</button></div>` : '';
  const rows = S.bots.map((b) => { const s = stats(b); return `<div class="tr" data-openbot="${b.id}" tabindex="0" style="cursor:pointer;--cols:1.6fr .8fr .7fr .7fr .9fr;--colsm:1fr auto">
    <div class="botrow-n"><span class="step-ic">${ic(TPL[b.tpl].icon)}</span><div class="cell-main"><b>${esc(b.name)}</b><span>${esc(b.user)}</span></div></div>
    <div class="hm"><span class="pill ${b.live ? 'pos' : ''}"><i></i>${b.live ? 'Live' : 'Draft'}</span></div>
    <div class="hm r">${fmt(b.starts)}</div><div class="hm r">${s.paid}</div><div class="r"><b>${eur(s.rev)}</b></div></div>`; }).join('');
  const fb = S.bots.find((b) => b.id === fbot) || S.bots[0], paid = sold(fb.id).length;
  const steps = [['Pressed "Start"', fb.starts], ['Replied to bot', fb.answered], ['Reached payment', fb.atPay], ['Paid', paid]];
  const fn = steps.map(([l, v], i) => `<div class="fn"><span>${l}</span><div class="bar"><i style="width:${fb.starts ? v / fb.starts * 100 : 0}%;${i === 3 ? '' : 'opacity:.4'}"></i></div><b>${fmt(v)}</b></div>`).join('');
  const dropAt = fb.atPay - paid;
  return head('Bots', `${WD[TODAY.getDay()]}, 21 October · last 7 days`, `<button class="btn primary" data-act="newBot">${ic('plus')}New bot</button>`) + finding +
    `<div class="kpis"><div class="kpi"><b>${eur(t.rev)}</b><span>Revenue, 7 days</span></div><div class="kpi"><b>${t.paid}</b><span>Payments</span></div><div class="kpi"><b>${fmt(t.starts)}</b><span>Bot starts</span></div><div class="kpi"><b>${fmtD(conv * 100)}<small>%</small></b><span>Starts that ended in a purchase</span></div></div>
    <div class="grid">
      <section class="card c7"><div class="card-h"><h2>Revenue by day</h2><span>€</span></div><div id="ch-rev"></div></section>
      <section class="card c5"><div class="card-h"><h2>Funnel</h2></div>
        <div class="tabs" role="tablist">${S.bots.map((b) => `<button class="${b.id === fb.id ? 'on' : ''}" data-act="fbot" data-id="${b.id}">${esc(b.name.split(' ')[0])}</button>`).join('')}</div>
        <div class="funnel">${fn}</div><p class="fn-note">${dropAt ? `Lost between payment and purchase: ${dropAt} of ${fb.atPay}.` : 'Everyone who reached payment paid.'}</p></section>
      <section class="card c12"><div class="card-h"><h2>Your bots</h2><span>click to open the flow</span></div>
        <div class="tbl"><div class="tr th" style="--cols:1.6fr .8fr .7fr .7fr .9fr;--colsm:1fr auto"><span>Bot</span><span class="hm">Status</span><span class="hm r">Starts</span><span class="hm r">Payments</span><span class="r">Revenue</span></div>${rows}</div></section>
    </div>`;
}

/* ── builder ──────────────────────────────────────────── */
const summary = (s) => s.t === 'buttons' ? s.opts.join(' · ') || 'No buttons' : s.t === 'pay' ? `${eur(s.price)} · ${s.text}` : s.t === 'give' ? `${s.file ? '📎 ' + s.file : ''}` || s.text : s.text;
function stepEditor(s, i) {
  const ta = `<div class="field"><label>Message text</label><textarea data-f="text" data-i="${i}">${esc(s.text)}</textarea></div>`;
  let body = ta;
  if (s.t === 'buttons') body += `<div class="field"><label>Buttons</label>${s.opts.map((o, k) => `<div class="opt-row"><input data-f="opt" data-i="${i}" data-o="${k}" value="${esc(o)}"><button class="btn sm" data-act="delOpt" data-i="${i}" data-o="${k}" aria-label="Delete button">${ic('x')}</button></div>`).join('')}<button class="btn sm" data-act="addOpt" data-i="${i}" ${s.opts.length >= 5 ? 'disabled' : ''}>${ic('plus')}Button</button></div>`;
  if (s.t === 'pay') body += `<div class="field"><label>Price, €</label><input data-f="price" data-i="${i}" type="number" min="0" value="${s.price}"></div>`;
  if (s.t === 'give') body += `<div class="field"><label>File or link</label><input data-f="file" data-i="${i}" value="${esc(s.file || '')}"></div>`;
  return body + `<div class="step-tools"><button class="btn sm" data-act="mv" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''}>${ic('up')}Up</button><button class="btn sm" data-act="mv" data-i="${i}" data-d="1" ${i === bot().steps.length - 1 ? 'disabled' : ''}>${ic('down')}Down</button><button class="btn sm" data-act="delStep" data-i="${i}">${ic('trash')}Delete</button></div>`;
}
function builder() {
  const b = bot(), p = botPrice(b);
  const flow = b.steps.map((s, i) => `<article class="step${openStep === i ? ' open' : ''}" data-n="${i + 1}"><button class="step-h" data-act="toggle" data-i="${i}" aria-expanded="${openStep === i}"><span class="step-ic">${ic(STEP[s.t][1])}</span><div><b>${STEP[s.t][0]}</b><span>${esc(summary(s))}</span></div>${ic('down', 'chev')}</button>${openStep === i ? `<div class="step-b">${stepEditor(s, i)}</div>` : ''}</article>`).join('');
  return head('Builder', `Flow for ${esc(b.user)}. It runs for real on the right.`,
    `<select id="bot-sel" class="btn" aria-label="Bot">${S.bots.map((x) => `<option value="${x.id}" ${x.id === cur ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select><button class="btn primary" data-act="publish">${b.live ? 'Unpublish' : 'Publish'}</button>`) +
    `<div class="tabs bmode" role="tablist"><button class="${mode === 'flow' ? 'on' : ''}" data-act="mode" data-m="flow">Flow</button><button class="${mode === 'chat' ? 'on' : ''}" data-act="mode" data-m="chat">Preview</button></div>
    <div class="build" data-mode="${mode}">
      <div class="flow">${flow}<button class="btn add-step" data-act="addStep">${ic('plus')}Add block</button></div>
      <aside class="phone" aria-label="Bot preview"><div class="tg-h"><span class="tg-av">${esc(b.name[0])}</span><div><b>${esc(b.name)}</b><span>bot · ${b.live ? 'online' : 'draft'}${p ? ' · ' + eur(p) : ''}</span></div><button class="btn sm" data-act="restart">${ic('play')}Restart</button></div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <form class="tg-f" id="tg-form"><input id="tg-in" placeholder="Message" autocomplete="off" aria-label="Reply to bot"><button aria-label="Send" id="tg-send">${ic('arrow')}</button></form></aside>
    </div>`;
}

/* preview engine: runs the real scenario; a step that needs the buyer pauses the run */
let run = null;
function resetRun() { run = null; }
function startRun() { run = { i: 0, log: [], wait: null, done: false, name: '' }; step(); }
function step() {
  const steps = bot().steps;
  while (run.i < steps.length) {
    const s = steps[run.i];
    if (s.t === 'msg') run.log.push({ k: 'bot', text: s.text });
    else if (s.t === 'remind') run.log.push({ k: 'note', text: `If they do not pay, the bot will remind them in an hour: "${s.text}"` });
    else if (s.t === 'give') { run.log.push({ k: 'bot', text: s.text }); if (s.file) run.log.push({ k: 'file', text: s.file }); }
    else { run.log.push({ k: 'bot', text: (s.t === 'ask' ? s.text : s.text).replace('{name}', run.name || 'friend') }); run.wait = s; break; }
    run.i++;
  }
  if (run.i >= steps.length) run.done = true;
}
function drawChat() {
  const c = $('#chat'); if (!c) return;
  if (!run) startRun();
  const last = run.log.map((m) => m.k).lastIndexOf('bot');
  const lastBot = run.done ? run.log.length - 1 - [...run.log].reverse().findIndex((m) => m.k === 'bot' || m.k === 'file') : -1;
  c.innerHTML = run.log.map((m, i) => m.k === 'me' ? `<div class="m me">${esc(m.text)}</div>`
    : m.k === 'note' ? `<div class="note">${esc(m.text)}</div>`
    : m.k === 'file' ? `<div class="m file">${ic('file')}<b>${esc(m.text)}</b>${run.done && i === lastBot ? '<small>Made with @DragDropBot</small>' : ''}</div>`
    : `<div class="m">${esc(m.text)}${run.done && i === lastBot ? '<small>Made with @DragDropBot</small>' : ''}</div>`).join('') + waitUI();
  c.scrollTop = c.scrollHeight;
  const ask = run.wait && run.wait.t === 'ask';
  $('#tg-in').disabled = !ask; $('#tg-send').disabled = !ask; $('#tg-in').placeholder = ask ? 'Reply to the bot…' : run.done ? 'Flow finished' : 'Choose a button';
}
function waitUI() {
  const w = run.wait; if (!w || run.done) return run.done ? '' : '';
  if (w.t === 'buttons') return `<div class="inl">${w.opts.map((o, k) => `<button data-act="pick" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
  if (w.t === 'pay') return `<div class="inl"><button class="pay" data-act="pay">Pay ${eur(w.price)}</button></div>`;
  return '';
}
function answer(text) {
  if (!run.wait) return;
  const inp = $('#tg-in'), v = (text ?? inp.value).trim(); if (!v) return;
  if (run.wait.t === 'ask') run.name = v;
  run.log.push({ k: 'me', text: v }); run.wait = null; run.i++; inp.value = ''; step(); drawChat();
}

/* ── sales + buyers ───────────────────────────────────── */
function sales() {
  const list = S.sales.filter((s) => !salesBot || s.bot === salesBot), sum = list.reduce((a, s) => a + s.amount, 0);
  const rows = list.map((s) => { const b = S.bots.find((x) => x.id === s.bot); return `<div class="tr" style="--cols:1fr 1.3fr 1.3fr .8fr;--colsm:1fr auto"><div class="cell-main hm"><b>${dLabel(s.ago)}</b><span>${hhmm(s.min)}</span></div><div class="cell-main dm"><b>${esc(s.buyer)}</b><span>${dLabel(s.ago)}, ${hhmm(s.min)} · ${esc(b.name)}</span></div><div class="hm">${esc(s.buyer)}</div><div class="hm">${esc(b.name)}</div><div class="r"><b>${eur(s.amount)}</b></div></div>`; }).join('');
  return head('Sales', `${list.length} ${list.length === 1 ? 'payment' : 'payments'} totalling ${eur(sum)} in 7 days`) +
    `<div class="tabs"><button class="${!salesBot ? 'on' : ''}" data-act="sbot" data-id="0">All</button>${S.bots.map((b) => `<button class="${salesBot === b.id ? 'on' : ''}" data-act="sbot" data-id="${b.id}">${esc(b.name.split(' ')[0])}</button>`).join('')}</div>
    <section class="card"><div class="tbl"><div class="tr th" style="--cols:1fr 1.3fr 1.3fr .8fr;--colsm:1fr auto"><span>When</span><span class="hm">Buyer</span><span class="hm">Bot</span><span class="r">Amount</span></div>${rows}</div></section>`;
}
function buyers() {
  const map = {};
  S.sales.forEach((s) => { const x = map[s.buyer] || (map[s.buyer] = { n: s.buyer, c: 0, sum: 0, ago: 99 }); x.c++; x.sum += s.amount; x.ago = Math.min(x.ago, s.ago); });
  const list = Object.values(map).sort((a, b) => b.sum - a.sum);
  const rows = list.map((x) => `<div class="tr" style="--cols:1.4fr .6fr .9fr 1fr;--colsm:1fr auto"><div class="cell-main"><b>${esc(x.n)}</b><span class="muted">${x.c} ${x.c === 1 ? 'purchase' : 'purchases'} · ${dLabel(x.ago).toLowerCase()}</span></div><div class="hm r">${x.c}</div><div class="hm r">${dLabel(x.ago)}</div><div class="r"><b>${eur(x.sum)}</b></div></div>`).join('');
  const rep = list.filter((x) => x.c > 1).length;
  return head('Buyers', `${list.length} ${list.length === 1 ? 'person' : 'people'}, ${rep} bought more than once`) +
    `<section class="card"><div class="tbl"><div class="tr th" style="--cols:1.4fr .6fr .9fr 1fr;--colsm:1fr auto"><span>Buyer</span><span class="hm r">Purchases</span><span class="hm r">Last</span><span class="r">Total</span></div>${rows}</div></section>`;
}

function mount() {
  const a = $('#ch-rev');
  if (a) { const vals = [], labels = []; for (let ago = 6; ago >= 0; ago--) { vals.push(S.sales.filter((s) => s.ago === ago).reduce((x, s) => x + s.amount, 0)); labels.push(ago === 0 ? 'Wed' : WD[dayOf(ago).getDay()]); }
    chart(a, (w) => barsSVG(w, { labels, values: vals, fmtV: (x) => '€' + fmt(x) })); }
  drawChat();
}

/* ── actions ──────────────────────────────────────────── */
const ACT = {
  fbot(d) { fbot = +d.id; render(); },
  sbot(d) { salesBot = +d.id; render(); },
  mode(d) { mode = d.m; render(); },
  toggle(d) { openStep = openStep === +d.i ? -1 : +d.i; render(); },
  restart() { resetRun(); drawChat(); },
  pick(d) { const w = run.wait; run.log.push({ k: 'me', text: w.opts[+d.k] }); run.wait = null; run.i++; step(); drawChat(); },
  pay() { const w = run.wait; run.log.push({ k: 'note', text: `Payment of ${eur(w.price)} received` }); run.wait = null; run.i++; step(); drawChat(); },
  mv(d) { const s = bot().steps, i = +d.i, j = i + +d.d; [s[i], s[j]] = [s[j], s[i]]; openStep = j; resetRun(); render(); },
  delStep(d) { bot().steps.splice(+d.i, 1); openStep = -1; resetRun(); render(); toast('Block deleted'); },
  addOpt(d) { bot().steps[+d.i].opts.push('New button'); resetRun(); render(); },
  delOpt(d) { bot().steps[+d.i].opts.splice(+d.o, 1); resetRun(); render(); },
  publish() { const b = bot(); b.live = !b.live; toast(b.live ? 'Bot published' : 'Bot unpublished'); render(); },
  addRemind(d) {
    const b = S.bots.find((x) => x.id === +d.bot), at = b.steps.findIndex((s) => s.t === 'pay');
    b.steps.splice(at + 1, 0, { t: 'remind', text: 'You have not finished your payment. The course is waiting, and the link is valid for 24 hours.' });
    cur = b.id; openStep = at + 1; resetRun(); toast('Reminder added to the flow'); go('builder');
  },
  addStep() {
    modal(`<h2>New block</h2><p>It will be added to the end of the flow.</p><div class="field"><label>Type</label><select id="n-t">${Object.entries(STEP).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="n-ok">Add</button></div>`, () => {
      $('#n-ok').onclick = () => {
        const t = $('#n-t').value, def = { msg: { text: 'New message' }, ask: { text: 'What is your name?' }, buttons: { text: 'Choose an option', opts: ['Option 1', 'Option 2'] }, pay: { text: 'Order payment', price: 10 }, give: { text: 'Thank you! Here is your access.', file: 'Link' }, remind: { text: 'A reminder about your order' } }[t];
        const s = bot().steps; s.push({ t, ...structuredClone(def) }); openStep = s.length - 1; closeModal(); resetRun(); render();
      };
    });
  },
  newBot() {
    modal(`<h2>New bot</h2><p>Pick a template, then adjust it to your needs.</p><div class="field"><label>Name</label><input id="b-n" placeholder="E.g. Massage booking"></div>
      <div class="field"><label>Template</label><select id="b-t">${Object.entries(TPL).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('')}</select></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="b-ok">Create</button></div>`, () => {
      $('#b-ok').onclick = () => {
        const n = $('#b-n').value.trim(); if (!n) { $('#b-n').focus(); return; }
        const t = $('#b-t').value, id = Math.max(...S.bots.map((x) => x.id)) + 1;
        S.bots.push({ id, name: n, user: '@' + ['new', 'bot', id].join('_'), tpl: t, live: false, steps: TPL[t].steps(), starts: 0, answered: 0, atPay: 0 });
        PRICE[id] = botPrice(S.bots.at(-1)); DAYS[id] = [];
        cur = id; openStep = 0; resetRun(); closeModal(); toast('Bot created. It is a draft, so adjust the flow'); go('builder');
      };
    });
  },
};
/* ── live sales: buyers keep arriving, every number on every page follows ─ */
let NOWM = 15 * 60 + 20;
const NEWBUY = ['Aliya N.', 'Kamila E.', 'Zarina T.', 'Laura S.', 'Gulmira D.', 'Aruzhan K.', 'Tomiris A.', 'Diana F.'];
setInterval(() => {
  if (document.hidden || $('#scrim')) return;
  NOWM++;
  const live = S.bots.filter((b) => b.live && DAYS[b.id]); if (!live.length) return;
  S.bots.forEach((b) => { if (b.live && Math.random() < .7) { b.starts += 1; if (Math.random() < .65) b.answered += 1; } });
  S.bots.forEach((b) => { b.answered = Math.min(b.starts, b.answered); b.atPay = Math.min(b.answered, b.atPay); });
  const b = live[Math.floor(Math.random() * live.length)];
  if (Math.random() < .55) {
    if (sold(b.id).length + 1 > b.atPay) { b.atPay = sold(b.id).length + 1; b.answered = Math.max(b.answered, b.atPay); b.starts = Math.max(b.starts, b.answered); }
    const buyer = NEWBUY[Math.floor(Math.random() * NEWBUY.length)];
    S.sales.unshift({ bot: b.id, ago: 0, buyer, amount: PRICE[b.id], min: NOWM });
    toast(`New payment ${eur(PRICE[b.id])} · ${b.name}`);
  }
  if (['dashboard', 'sales', 'buyers'].includes(page)) render();
}, 7000);
render();
</script>
</body>
