<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RentoWorld — аренда авто у владельцев (демо)</title>
<meta name="description" content="Демо: каталог авто от владельцев, календарь занятости, расчёт цены по датам, мои поездки и кабинет владельца. Данные вымышлены.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root[data-theme="light"] {
  --bg: #f6f5f1; --surface: #ffffff; --raised: #f2f1ec; --hover: #ecebe5; --border: #e3e1d9; --rule: #eeede7;
  --text: #17181a; --muted: #5a5d62; --faint: #6d7076;
  --accent: #0c8a5f; --accent-ink: #ffffff; --accent-bg: #dff3ea;
  --font: "Rubik", system-ui, sans-serif; --display: "Rubik", system-ui, sans-serif;
}
.head h1, .big, .kpi b { font-weight: 600; letter-spacing: -.025em; }

/* top navigation instead of a sidebar: this one is a consumer product */
.app { display: block; min-height: 0; } .side { display: none; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 28px; height: 60px; padding: 0 var(--pad); background: var(--surface); border-bottom: 1px solid var(--border); }
.top .brand { padding: 0; } .top .brand-name { font-weight: 700; }
.top .nav { flex-direction: row; gap: 4px; } .top .nav a { height: 36px; }
.top .who-top { margin-left: auto; display: flex; align-items: center; gap: 10px; } .top .who-top b { font-weight: 500; }
.main { margin: 0 auto; max-width: 1240px; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.chip { height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s, border-color .15s; }
.chip:hover { color: var(--text); border-color: var(--faint); }
.chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
.filters select { height: 34px; border-radius: 17px; border: 1px solid var(--border); background: var(--surface); padding: 0 12px; margin-left: auto; }
.cars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
.car { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; transition: border-color .15s, transform .2s var(--ease); animation: pop .3s var(--ease) both; }
.car:hover { border-color: var(--faint); transform: translateY(-2px); }
.car-art { display: block; position: relative; aspect-ratio: 8 / 5; overflow: hidden; }
.car-art > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.car-art .carfg { position: absolute; left: 8%; right: 8%; bottom: 12%; } .car-art .carfg svg { width: 100%; height: auto; display: block; }
.car-art .carfg svg { animation: drift 5s ease-in-out infinite alternate; } @keyframes drift { to { transform: translateX(6px); } }
.car-b { padding: 14px 16px 16px; }
.car-b h3 { font-size: 16px; font-weight: 600; }
.car-b .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.car-f { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; gap: 8px; }
.car-f b { font-size: 20px; font-weight: 600; } .car-f small { color: var(--muted); font-size: 13px; }
.free { font-size: 12px; color: var(--accent); font-weight: 500; }
.free.busy { color: var(--faint); }

/* detail */
.modal.wide { max-width: 860px; padding: 0; overflow: auto; }
.det { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.det-l { padding: 24px; } .det-r { padding: 24px; border-left: 1px solid var(--border); background: var(--raised); }
.det-art { border-radius: 12px; }
.specs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 14px 0 22px; }
.specs div b { display: block; font-weight: 600; } .specs div span { font-size: 12px; color: var(--muted); }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.cal .dw { text-align: center; font-size: 12px; color: var(--faint); padding-bottom: 2px; }
.day { height: 38px; border-radius: 8px; border: 0; background: var(--surface); color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; transition: background-color .12s; }
.day:hover:not(:disabled) { background: var(--hover); }
.day:disabled { background: transparent; color: var(--faint); cursor: not-allowed; text-decoration: line-through; opacity: .6; }
.day.in { background: var(--accent-bg); border-radius: 0; } .day.edge, .day.edge:hover:not(:disabled) { background: var(--accent); color: #fff; border-radius: 8px; }
.day.past { visibility: hidden; }
.sum .lines div { display: flex; justify-content: space-between; padding: 7px 0; color: var(--muted); } .sum .lines b { color: var(--text); font-weight: 500; }
.sum .tot { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--border); margin-top: 6px; padding-top: 12px; }
.sum .tot b { font-size: 26px; font-weight: 600; }
.close-x { position: absolute; top: 12px; right: 12px; }
.modal.wide { position: relative; }

.trip-c { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 0; }
.trip-c + .trip-c { border-top: 1px solid var(--rule); }
.trip-c .thumb { border-radius: 10px; padding: 6px 8px 0; }
.trip-c b { display: block; font-weight: 600; } .trip-c span.s { color: var(--muted); font-size: 13px; }

@media (max-width: 1099px) { .cars { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 899px) {
  .top { height: 52px; gap: 12px; } .top .nav, .top .who-top { display: none; }
  .cars { grid-template-columns: minmax(0, 1fr); } .filters select { margin-left: 0; }
  .det { grid-template-columns: minmax(0, 1fr); } .det-r { border-left: 0; border-top: 1px solid var(--border); } .det-l, .det-r { padding: 18px; }
  .specs { grid-template-columns: repeat(2, 1fr); }
  .trip-c { grid-template-columns: 84px minmax(0, 1fr); } .trip-c .btn { grid-column: 2; justify-self: start; }
  .modal.wide { max-height: 94svh; }
}
</style>
</head>
<body>
<div class="notice"><b>Демо</b> RentoWorld · данные вымышлены</div>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brand-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M5 16V11l2-4h10l2 4v5M3 16h18M7.5 19a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM16.5 19a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/></svg></div><div class="brand-name">RentoWorld</div></div>
    <nav class="nav" id="nav"></nav>
    <div class="who-top"><b>Тимур</b><div class="avatar">ТЖ</div></div>
  </header>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>

<script>
/*@kit.js*/
'use strict';

/* ── data ─────────────────────────────────────────────── */
const tg = (n) => fmt(n) + ' ₸';
const TODAY = new Date(2026, 8, 28);
const addDays = (d) => new Date(TODAY.getTime() + d * 864e5);
const dFmt = (d) => addDays(d).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }).replace('.', '');
const plural = (n, a, b, c) => { const m = n % 100, k = n % 10; return m > 10 && m < 15 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };
const days = (n) => `${n} ${plural(n, 'день', 'дня', 'дней')}`;

const CARS = [
  { id: 1,  n: 'Toyota Camry',     y: 2022, t: 'sedan', c: '#c9ced6', px: 22000, seats: 5, tr: 'Автомат', fuel: 'Бензин', r: 4.9, trips: 63, own: 'Вы', where: 'Алматы', dep: 80000 },
  { id: 2,  n: 'Kia Sportage',     y: 2023, t: 'suv',   c: '#2d5b8c', px: 28000, seats: 5, tr: 'Автомат', fuel: 'Бензин', r: 4.8, trips: 41, own: 'Вы', where: 'Алматы', dep: 100000 },
  { id: 3,  n: 'Hyundai Solaris',  y: 2021, t: 'sedan', c: '#b8352f', px: 14000, seats: 5, tr: 'Автомат', fuel: 'Бензин', r: 4.7, trips: 118, own: 'Марат К.', where: 'Алматы', dep: 50000 },
  { id: 4,  n: 'Chevrolet Tracker', y: 2022, t: 'suv',  c: '#e0b43a', px: 24000, seats: 5, tr: 'Автомат', fuel: 'Бензин', r: 4.6, trips: 37, own: 'Динара С.', where: 'Алматы', dep: 90000 },
  { id: 5,  n: 'Volkswagen Polo',  y: 2020, t: 'hatch', c: '#3d4a57', px: 12000, seats: 5, tr: 'Механика', fuel: 'Бензин', r: 4.5, trips: 90, own: 'Ербол А.', where: 'Алматы', dep: 40000 },
  { id: 6,  n: 'Skoda Octavia',    y: 2022, t: 'hatch', c: '#2f7d5b', px: 19000, seats: 5, tr: 'Автомат', fuel: 'Бензин', r: 4.9, trips: 52, own: 'Айгуль Т.', where: 'Алматы', dep: 70000 },
  { id: 7,  n: 'Hyundai Staria',   y: 2023, t: 'van',   c: '#e8e4da', px: 45000, seats: 9, tr: 'Автомат', fuel: 'Дизель', r: 5.0, trips: 22, own: 'Нурлан Б.', where: 'Алматы', dep: 150000 },
  { id: 8,  n: 'Toyota RAV4',      y: 2021, t: 'suv',   c: '#1f2a36', px: 30000, seats: 5, tr: 'Автомат', fuel: 'Гибрид', r: 4.8, trips: 74, own: 'Сауле М.', where: 'Алматы', dep: 110000 },
  { id: 9,  n: 'Lada Vesta',       y: 2020, t: 'sedan', c: '#8a9aa8', px: 9000,  seats: 5, tr: 'Механика', fuel: 'Бензин', r: 4.3, trips: 130, own: 'Асхат Ж.', where: 'Алматы', dep: 30000 },
];
const TYPE = { sedan: 'Седан', suv: 'Кроссовер', hatch: 'Хэтчбек', van: 'Минивэн' };
/* every booking is one record; busy days, trips, occupancy and earnings all derive from it */
const B = [
  { id: 1, car: 1, who: 'Айдос Н.', from: -6, to: -3 }, { id: 2, car: 1, who: 'Анна Л.', from: 2, to: 5 }, { id: 3, car: 1, who: 'Серик Т.', from: 9, to: 14 }, { id: 4, car: 1, who: 'Мадина Р.', from: 19, to: 21 },
  { id: 5, car: 2, who: 'Олег В.', from: -5, to: -2 }, { id: 19, car: 2, who: 'Асель Ф.', from: -12, to: -9 }, { id: 20, car: 1, who: 'Бахыт О.', from: -14, to: -11 }, { id: 6, car: 2, who: 'Дина К.', from: 6, to: 12 }, { id: 7, car: 2, who: 'Руслан Э.', from: 16, to: 20 },
  { id: 8, car: 3, who: 'Вы', from: -9, to: -6 }, { id: 9, car: 3, who: 'Игорь М.', from: 1, to: 4 }, { id: 10, car: 3, who: 'Лейла Х.', from: 8, to: 10 },
  { id: 11, car: 4, who: 'Вы', from: 12, to: 14 }, { id: 12, car: 4, who: 'Эльдар Б.', from: 0, to: 6 },
  { id: 13, car: 5, who: 'Тоня Р.', from: 3, to: 9 }, { id: 14, car: 6, who: 'Данияр С.', from: 5, to: 7 }, { id: 15, car: 7, who: 'Компания «Тур-Ас»', from: 0, to: 10 }, { id: 16, car: 7, who: 'Мира Д.', from: 14, to: 18 },
  { id: 17, car: 8, who: 'Влад П.', from: 2, to: 4 }, { id: 18, car: 9, who: 'Кирилл З.', from: 1, to: 2 },
];
const car = (id) => CARS.find((c) => c.id === id);
const busy = (carId, d) => B.some((b) => b.car === carId && d >= b.from && d <= b.to);
const freeNext7 = (id) => { let n = 0; for (let d = 0; d < 7; d++) if (!busy(id, d)) n++; return n; };
const nextId = () => Math.max(...B.map((b) => b.id)) + 1;
const price = (c, n) => { const base = c.px * n, off = n >= 14 ? .15 : n >= 7 ? .1 : 0, disc = Math.round(base * off), fee = Math.round((base - disc) * .07); return { base, off, disc, fee, total: base - disc + fee }; };
/* totals reconcile: 3 days of the Solaris, no discount */
console.assert(price(car(3), 3).total === 14000 * 3 + Math.round(14000 * 3 * .07) && price(car(1), 7).disc === 15400, 'price');

function carSVG(t, c) {
  const body = {
    sedan: 'M10 72 L16 54 Q22 46 44 44 L72 28 Q88 22 118 22 Q146 22 162 34 L196 44 Q226 48 230 66 L230 72 Z',
    suv:   'M10 72 L12 42 Q14 32 34 30 L54 12 Q62 6 100 6 L170 6 Q192 6 204 22 L218 34 Q234 38 234 58 L234 72 Z',
    hatch: 'M12 72 L12 50 Q12 42 24 38 L52 22 Q64 16 100 16 L152 16 Q178 18 192 38 L214 46 Q230 50 230 62 L230 72 Z',
    van:   'M10 72 L10 38 Q10 22 28 20 L168 20 Q190 20 204 38 L226 48 Q232 52 232 62 L232 72 Z',
  }[t];
  const glass = {
    sedan: 'M60 44 L78 31 Q90 27 116 27 Q140 27 152 36 L172 44 Z',
    suv:   'M48 30 L62 14 Q70 11 100 11 L166 11 Q184 11 192 23 L206 30 Z',
    hatch: 'M32 38 L52 25 Q64 21 100 21 L148 21 Q170 23 182 38 Z',
    van:   'M22 38 Q22 28 34 26 L166 26 Q184 26 194 38 Z',
  }[t];
  return `<svg viewBox="0 0 240 92" aria-hidden="true"><ellipse cx="121" cy="86" rx="104" ry="4" fill="#000" opacity=".08"/><path d="${body}" fill="${c}"/><path d="${glass}" fill="#fff" opacity=".6"/>
    <path d="M10 72 H232" stroke="#000" stroke-opacity=".12" stroke-width="2"/>${[62, 182].map((x) => `<circle cx="${x}" cy="74" r="14" fill="#1b1d20"/><circle cx="${x}" cy="74" r="6" fill="#c8cbd0"/>`).join('')}</svg>`;
}

/* scenery behind each car: sky, sun, hills and road, tinted by the car colour */
function sceneSVG(c, seed) {
  const sky = `color-mix(in srgb, ${c} 14%, #eef3f6)`, hill = `color-mix(in srgb, ${c} 28%, #cfd9cf)`, hill2 = `color-mix(in srgb, ${c} 20%, #b9c9bd)`, sx = 30 + (seed * 47) % 170;
  return `<svg viewBox="0 0 240 150" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="240" height="150" fill="${sky}"/><circle cx="${sx}" cy="34" r="${14 + seed % 5}" fill="#fff" opacity=".85"/>
    <path d="M0 98 Q40 66 90 90 T180 80 T240 92 V150 H0z" fill="${hill2}"/><path d="M0 108 Q60 84 120 104 T240 100 V150 H0z" fill="${hill}"/>
    <rect y="112" width="240" height="38" fill="#4a4f57"/><path d="M0 131 H240" stroke="#f6f1d8" stroke-width="2" stroke-dasharray="14 12" opacity=".8"/></svg>`;
}
const carArt = (c, i) => `<span class="art">${sceneSVG(c.c, i)}<span class="carfg">${carSVG(c.t, c.c)}</span></span>`;

const tint = (c) => `color-mix(in srgb, ${c} 16%, #f6f5f1)`;

/* ── shell ────────────────────────────────────────────── */
const PAGES = { catalog: ['Каталог', 'search'], trips: ['Мои поездки', 'calendar'], host: ['Мои авто', 'wrench'] };
let page = 'catalog', type = 'all', sort = 'price', sel = null;       // sel: { car, a, b }
const myTrips = () => B.filter((b) => b.who === 'Вы').sort((a, b) => a.from - b.from);

function chrome() {
  $('#nav').innerHTML = Object.keys(PAGES).map((k) => `<a data-page="${k}" tabindex="0" role="link">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span></a>`).join('');
  $('#tabbar').innerHTML = Object.keys(PAGES).map((k) => `<a data-page="${k}" tabindex="0" role="link">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span></a>`).join('');
  setNav(page);
}
function render() { chrome(); $('#main').innerHTML = ({ catalog, trips, host })[page](); }
function go(p) { page = p; render(); window.scrollTo(0, 0); }
const head = (t, sub, actions = '') => `<header class="head"><div><h1>${t}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></header>`;

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-page]'); if (a) return go(a.dataset.page);
  const c = e.target.closest('[data-car]'); if (c) return openCar(+c.dataset.car);
  const act = e.target.closest('[data-act]'); if (act) return ACT[act.dataset.act](act.dataset);
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-page]')) { e.preventDefault(); go(e.target.dataset.page); } });
document.addEventListener('change', (e) => { if (e.target.id === 'sort') { sort = e.target.value; render(); } });

/* ── catalog ──────────────────────────────────────────── */
function catalog() {
  const list = CARS.filter((c) => type === 'all' || c.t === type).sort((a, b) => sort === 'price' ? a.px - b.px : sort === 'rating' ? b.r - a.r : freeNext7(b.id) - freeNext7(a.id));
  const cards = list.map((c) => { const f = freeNext7(c.id); return `<button class="car" data-car="${c.id}" aria-label="${esc(c.n)}, ${tg(c.px)} в сутки"><span class="car-art">${sceneSVG(c.c, c.id)}<span class="carfg">${carSVG(c.t, c.c)}</span></span>
    <span class="car-b" style="display:block"><h3>${esc(c.n)}</h3><div class="sub">${c.y} · ${TYPE[c.t]} · ${c.tr} · ${c.seats} мест</div>
    <span class="car-f"><span><b>${tg(c.px)}</b> <small>/ сутки</small></span><span style="text-align:right"><span class="free ${f < 3 ? 'busy' : ''}" style="display:block">${f === 7 ? 'Свободна всю неделю' : f ? `Свободно ${f} из 7 дней` : 'На неделю занята'}</span><small>★ ${fmtD(c.r)} · ${c.trips} ${plural(c.trips, 'поездка', 'поездки', 'поездок')}</small></span></span></span></button>`; }).join('');
  return head('Авто в Алматы', `${list.length} ${plural(list.length, 'машина', 'машины', 'машин')} от владельцев. Выберите даты внутри карточки, цена посчитается сама.`) +
    `<div class="filters">${['all', 'sedan', 'suv', 'hatch', 'van'].map((k) => `<button class="chip ${type === k ? 'on' : ''}" data-act="type" data-v="${k}">${k === 'all' ? 'Все' : TYPE[k]}</button>`).join('')}
    <select id="sort" aria-label="Сортировка"><option value="price" ${sort === 'price' ? 'selected' : ''}>Сначала дешёвые</option><option value="rating" ${sort === 'rating' ? 'selected' : ''}>По рейтингу</option><option value="free" ${sort === 'free' ? 'selected' : ''}>Больше свободных дней</option></select></div>
    <div class="cars">${cards}</div>`;
}

/* ── car detail + dates ───────────────────────────────── */
function openCar(id) {
  sel = { car: id, a: null, b: null };
  const c = car(id);
  modal(`<div class="det"><div class="det-l"><div class="det-art car-art" style="border-radius:12px;margin-bottom:18px">${sceneSVG(c.c, c.id)}<span class="carfg">${carSVG(c.t, c.c)}</span></div>
      <h2 style="font-size:22px">${esc(c.n)}, ${c.y}</h2><p class="muted">Владелец: ${esc(c.own)} · ${c.where} · ★ ${fmtD(c.r)}</p>
      <div class="specs"><div><b>${c.seats}</b><span>мест</span></div><div><b>${c.tr}</b><span>коробка</span></div><div><b>${c.fuel}</b><span>топливо</span></div><div><b>${tg(c.dep)}</b><span>залог</span></div></div>
      <h3 style="font-size:15px">Выберите даты</h3><p class="muted" style="font-size:13px">Серые дни заняты. Нажмите день начала, потом день конца.</p><div class="cal" id="cal"></div></div>
    <div class="det-r sum" id="sum"></div></div><button class="btn sm close-x" onclick="closeModal()" aria-label="Закрыть">${ic('x')}</button>`, () => { $('.modal').classList.add('wide'); drawCal(); });
}
function drawCal() {
  const c = car(sel.car), start = TODAY.getDay() === 0 ? 6 : TODAY.getDay() - 1;   // Monday-first offset
  let h = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((d) => `<div class="dw">${d}</div>`).join('') + '<span></span>'.repeat(start);
  for (let d = 0; d < 28; d++) {
    const inn = sel.a !== null && d >= sel.a && d <= (sel.b ?? sel.a), edge = d === sel.a || d === sel.b;
    h += `<button class="day ${inn ? 'in' : ''} ${edge ? 'edge' : ''}" data-act="day" data-d="${d}" ${busy(c.id, d) ? 'disabled' : ''} aria-label="${dFmt(d)}${busy(c.id, d) ? ', занято' : ''}">${addDays(d).getDate()}</button>`;
  }
  $('#cal').innerHTML = h; drawSum();
}
function drawSum() {
  const c = car(sel.car), n = sel.a === null ? 0 : (sel.b ?? sel.a) - sel.a + 1;
  if (!n) { $('#sum').innerHTML = `<div class="tot" style="border:0"><span class="muted">${tg(c.px)} за сутки</span></div><p class="muted" style="margin:10px 0 18px">От 7 суток скидка 10%, от 14 суток 15%.</p><button class="btn primary" style="width:100%" disabled>Выберите даты</button>`; return; }
  const p = price(c, n);
  $('#sum').innerHTML = `<h3 style="font-size:15px;margin-bottom:2px">${n > 1 ? dFmt(sel.a) + ' — ' + dFmt(sel.b ?? sel.a) : dFmt(sel.a)}</h3><p class="muted" style="margin-bottom:12px">${days(n)}</p>
    <div class="lines"><div><span>${tg(c.px)} × ${n}</span><b>${tg(p.base)}</b></div>${p.disc ? `<div><span>Скидка ${p.off * 100}%</span><b class="pos">−${tg(p.disc)}</b></div>` : ''}<div><span>Сервисный сбор 7%</span><b>${tg(p.fee)}</b></div></div>
    <div class="tot"><span>Итого</span><b>${tg(p.total)}</b></div><p class="muted" style="font-size:13px;margin:8px 0 16px">Залог ${tg(c.dep)} блокируется на карте и возвращается после поездки.</p>
    <button class="btn primary" style="width:100%;height:42px" data-act="book">Забронировать</button>`;
}

/* ── trips ────────────────────────────────────────────── */
function trips() {
  const list = myTrips(), up = list.filter((b) => b.to >= 0);
  const rows = list.map((b) => { const c = car(b.car), n = b.to - b.from + 1, p = price(c, n), past = b.to < 0; return `<div class="trip-c"><span class="thumb" style="background:${tint(c.c)}">${carSVG(c.t, c.c)}</span><div><b>${esc(c.n)}</b><span class="s">${dFmt(b.from)} — ${dFmt(b.to)} · ${days(n)} · ${tg(p.total)}</span></div>${past ? '<span class="pill">Завершена</span>' : `<span style="display:flex;gap:8px;align-items:center"><span class="pill pos"><i></i>Подтверждена</span><button class="btn sm" data-act="cancel" data-id="${b.id}">Отменить</button></span>`}</div>`; }).join('');
  const spent = list.reduce((a, b) => a + price(car(b.car), b.to - b.from + 1).total, 0);
  return head('Мои поездки', `${up.length ? `Ближайшая: ${esc(car(up[0].car).n)}, с ${dFmt(up[0].from)}` : 'Ближайших поездок нет'}`) +
    `<div class="kpis"><div class="kpi"><b>${list.length}</b><span>Поездок всего</span></div><div class="kpi"><b>${tg(spent)}</b><span>Потрачено</span></div></div><section class="card">${rows || '<p class="empty">Пока пусто. Выберите машину в каталоге.</p>'}</section>`;
}

/* ── host cabinet ─────────────────────────────────────── */
function host() {
  const mine = CARS.filter((c) => c.own === 'Вы'), done = (b) => b.to < 0;
  const earn = (c) => B.filter((b) => b.car === c.id && done(b)).reduce((a, b) => { const n = b.to - b.from + 1, p = price(c, n); return a + (p.base - p.disc) * .9; }, 0);
  const occ = (c) => { let n = 0; for (let d = 0; d < 28; d++) if (busy(c.id, d)) n++; return n; };
  const tot = mine.reduce((a, c) => a + earn(c), 0), occAll = mine.reduce((a, c) => a + occ(c), 0) / (mine.length * 28);
  const cards = mine.map((c) => `<section class="card c6"><div class="card-h"><h2>${esc(c.n)}</h2><span>${tg(c.px)} / сутки</span></div>
    <div class="kpis" style="margin-bottom:12px;gap:28px"><div class="kpi"><b>${occ(c)}</b><span>Занятых дней из 28</span></div><div class="kpi"><b>${tg(earn(c))}</b><span>Заработано</span></div></div>
    <div style="display:grid;grid-template-columns:repeat(28,1fr);gap:2px" aria-label="Занятость на 28 дней">${Array.from({ length: 28 }, (_, d) => `<i title="${dFmt(d)}" style="height:22px;border-radius:3px;background:${busy(c.id, d) ? 'var(--accent)' : 'var(--raised)'}"></i>`).join('')}</div>
    <p class="muted" style="font-size:12px;margin-top:6px">${dFmt(0)} — ${dFmt(27)}</p>
    <h3 style="font-size:14px;margin:16px 0 4px">Ближайшие брони</h3>${B.filter((b) => b.car === c.id && b.to >= 0).sort((a, b) => a.from - b.from).slice(0, 3).map((b) => `<div class="trip-c" style="grid-template-columns:1fr auto;padding:8px 0"><div><b>${esc(b.who)}</b><span class="s">${dFmt(b.from)} — ${dFmt(b.to)}</span></div><b>${tg((price(c, b.to - b.from + 1).base - price(c, b.to - b.from + 1).disc) * .9)}</b></div>`).join('')}</section>`).join('');
  return head('Мои авто', `${mine.length} ${plural(mine.length, 'машина', 'машины', 'машин')} сдаёте. Комиссия сервиса 10%.`) +
    `<div class="kpis"><div class="kpi"><b>${tg(tot)}</b><span>Заработано за завершённые брони</span></div><div class="kpi"><b>${Math.round(occAll * 100)}<small>%</small></b><span>Загрузка на 28 дней</span></div></div><div class="grid">${cards}</div>`;
}

/* ── actions ──────────────────────────────────────────── */
const ACT = {
  type(d) { type = d.v; render(); },
  day(d) {
    const x = +d.d, c = car(sel.car);
    if (sel.a === null || sel.b !== null || x < sel.a) { sel.a = x; sel.b = null; }
    else { for (let k = sel.a; k <= x; k++) if (busy(c.id, k)) { toast('В этом периоде есть занятые дни'); sel.a = x; sel.b = null; return drawCal(); } sel.b = x; }
    drawCal();
  },
  book() {
    const c = car(sel.car), a = sel.a, b = sel.b ?? sel.a;
    B.push({ id: nextId(), car: c.id, who: 'Вы', from: a, to: b }); closeModal(); toast(`${c.n}: бронь ${dFmt(a)} — ${dFmt(b)} подтверждена`); go('trips');
  },
  cancel(d) { const i = B.findIndex((b) => b.id === +d.id); B.splice(i, 1); toast('Бронь отменена, залог вернётся на карту'); render(); },
};
/* ── live: other renters keep booking, so calendars and "free days" change under you ─ */
const RENTERS = ['Айгерим Н.', 'Рустем К.', 'Алия Б.', 'Тимур Д.', 'Жанар С.', 'Ерлан М.', 'Дана Т.'];
setInterval(() => {
  if (document.hidden || $('#scrim')) return;
  const c = CARS[Math.floor(Math.random() * CARS.length)], start = 1 + Math.floor(Math.random() * 20), len = 1 + Math.floor(Math.random() * 3);
  for (let d = start; d <= start + len; d++) if (busy(c.id, d)) return;
  B.push({ id: nextId(), car: c.id, who: RENTERS[Math.floor(Math.random() * RENTERS.length)], from: start, to: start + len });
  toast(`${c.n}: кто-то только что забронировал ${dFmt(start)} — ${dFmt(start + len)}`);
  if (page === 'catalog' || page === 'host') render();
}, 8000);
render();
</script>
</body>
</html>
