<!DOCTYPE html>
<html lang="en" data-theme="light" data-fx="snack">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RentoWorld — peer-to-peer car rental (demo)</title>
<meta name="description" content="Demo: peer-to-peer car rental marketplace. Search, listing pages with availability and reviews, checkout with card verification, trips, messages and a host dashboard. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root[data-theme="light"] {
  --bg: #f6f5f1; --surface: #ffffff; --raised: #f2f1ec; --hover: #ecebe5; --border: #e3e1d9; --rule: #eeede7;
  --text: #17181a; --muted: #5a5d62; --faint: #6d7076;
  --accent: #0c8a5f; --accent-ink: #ffffff; --accent-bg: #dff3ea; --accent-d: #08684a;
  --star: #b87a00; --heart: #d93a52;
  --font: "Rubik", system-ui, sans-serif; --display: "Rubik", system-ui, sans-serif;
  --sh: 0 1px 2px rgba(23,24,26,.05), 0 8px 24px rgba(23,24,26,.07);
  --sh-l: 0 2px 6px rgba(23,24,26,.06), 0 22px 56px rgba(23,24,26,.18);
  --e-out: cubic-bezier(.23,1,.32,1); --e-drw: cubic-bezier(.32,.72,0,1);
}
.head h1, .big, .kpi b { font-weight: 600; letter-spacing: -.025em; }
.app { display: block; min-height: 0; } .side { display: none; }
.main { margin: 0 auto; max-width: 1240px; animation: fade .2s ease both; }
body.out .top, body.out .tabbar, body.out .foot { display: none; }
.sm-t { font-size: 13px; } .xs { font-size: 12px; }
.lnk { all: unset; cursor: pointer; color: var(--accent); font-weight: 500; } .lnk:hover { text-decoration: underline; } .lnk:focus-visible { outline: 2px solid var(--accent); border-radius: 3px; }
.btn.primary { background: var(--accent); } .btn.primary:hover { background: var(--accent-d); filter: none; }
.btn.danger { background: var(--neg); color: #fff; border-color: transparent; }
.btn.lg { height: 46px; font-size: 15px; border-radius: 10px; }
.btn.ghost { background: transparent; border-color: transparent; }
.spin { width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .6s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
.sel, .inp { height: 36px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 0 10px; min-width: 0; }
.inp:focus, .sel:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.av.lg { width: 56px; height: 56px; font-size: 18px; }
.stars { color: var(--star); letter-spacing: 1px; } .stars i { color: var(--border); font-style: normal; }
.rt { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; white-space: nowrap; } .rt .ic { width: 14px; height: 14px; fill: var(--star); stroke: var(--star); } .rt em { font-style: normal; color: var(--muted); font-weight: 400; }

/* header */
.top { position: sticky; top: 0; z-index: 20; padding: 0 var(--pad); background: color-mix(in srgb, var(--surface) 94%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(12px); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--border); }
.top-in { max-width: 1184px; margin: 0 auto; display: flex; align-items: center; gap: 24px; height: 64px; }
.top .brand { padding: 0; cursor: pointer; border: 0; background: none; } .top .brand-name { font-weight: 700; font-size: 17px; }
.brand-name em { font-style: normal; color: var(--accent); }
.top .nav { flex-direction: row; gap: 2px; } .top .nav a { height: 36px; padding: 0 12px; }
.tb-r { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.ib { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); display: grid; place-items: center; cursor: pointer; transition: background-color .15s, color .15s, transform .12s var(--e-out); }
.ib:hover { background: var(--hover); color: var(--text); } .ib:active { transform: scale(.94); }
.badge { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--neg); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; border: 2px solid var(--surface); }
.um { display: flex; align-items: center; gap: 8px; height: 40px; padding: 3px 10px 3px 3px; margin-left: 6px; border: 1px solid var(--border); border-radius: 22px; background: var(--surface); cursor: pointer; transition: box-shadow .15s; }
.um:hover { box-shadow: var(--sh); } .um .av { width: 32px; height: 32px; font-size: 12px; } .um b { font-weight: 500; } .um .ic { width: 14px; height: 14px; color: var(--muted); }
.pop { position: fixed; z-index: 50; width: min(360px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--sh-l); transform-origin: top right; animation: popin .16s var(--e-out) both; overflow: hidden; }
@keyframes popin { from { opacity: 0; transform: scale(.97) translateY(-4px); } }
.pop-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px; } .pop-h b { font-size: 15px; font-weight: 600; }
.pop-l { max-height: min(420px, 60svh); overflow: auto; padding: 0 6px 6px; }
.pi { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: none; text-align: left; cursor: pointer; color: var(--text); }
.pi:hover { background: var(--hover); } .pi .ic { margin-top: 1px; color: var(--muted); }
.pi span { flex: 1; min-width: 0; } .pi small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
.pi.unread span { font-weight: 500; } .pi .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; }
.pi.unread .ib-ic { color: var(--accent); }
.pop hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.um-h { display: flex; gap: 12px; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
.um-h b { display: block; font-weight: 600; } .um-h span { display: block; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.role { display: inline-flex !important; align-items: center; gap: 4px; margin-top: 4px; height: 20px; padding: 0 8px; border-radius: 10px; background: var(--accent-bg); color: var(--accent-d) !important; font-size: 12px !important; font-weight: 500; }
.pi.out { color: var(--neg); } .pi.out .ic { color: var(--neg); }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px 32px; align-items: center; padding: 30px 32px 26px; margin-bottom: 22px; border-radius: 20px; background: radial-gradient(120% 140% at 0% 0%, #0f5a41 0%, #0a3a2b 55%, #082c21 100%); color: #fff; overflow: hidden; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #a8e6cc; margin-bottom: 10px; } .eyebrow .ic { width: 15px; height: 15px; }
.hero h1 { font: 600 40px/1.08 var(--display); letter-spacing: -.03em; }
.hero h1 span { color: #7fe0b6; }
.hero p.lead { margin-top: 12px; color: rgba(255,255,255,.78); font-size: 16px; max-width: 46ch; }
.hero-art { position: relative; height: 210px; border-radius: 14px; overflow: hidden; }
.hero-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-art .float { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 10px; align-items: center; padding: 8px 12px 8px 8px; border-radius: 12px; background: rgba(255,255,255,.95); color: var(--text); box-shadow: var(--sh); font-size: 13px; max-width: calc(100% - 24px); }
.float b { display: block; font-weight: 600; } .float span { color: var(--muted); }
.search { grid-column: 1 / -1; display: grid; grid-template-columns: 1.3fr 1fr 1fr .8fr auto; align-items: stretch; background: var(--surface); color: var(--text); border-radius: 14px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.sf { display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 14px; min-width: 0; border-radius: 10px; cursor: pointer; transition: background-color .15s; }
.sf + .sf { box-shadow: -1px 0 0 var(--rule); } .sf:hover { background: var(--raised); }
.sf span { font-size: 12px; color: var(--muted); font-weight: 500; }
.sf input, .sf select { border: 0; background: none; padding: 0; height: 24px; outline: none; min-width: 0; width: 100%; font-weight: 500; cursor: pointer; }
.sf:focus-within { background: var(--raised); box-shadow: inset 0 0 0 2px var(--accent); }
.search .btn { height: auto; min-height: 50px; padding: 0 22px; border-radius: 10px; }
.s-err { grid-column: 1 / -1; color: #ffd2cc; font-size: 13px; margin-top: -8px; } .s-err:empty { display: none; }
.trust { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 22px; color: rgba(255,255,255,.78); font-size: 13px; }
.trust li { display: flex; align-items: center; gap: 6px; } .trust .ic { width: 15px; height: 15px; color: #7fe0b6; }

/* explore */
.cities { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: 0 -2px 10px; }
.cities::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s, border-color .15s, transform .12s var(--e-out); }
.chip:hover { color: var(--text); border-color: var(--faint); } .chip:active { transform: scale(.97); }
.chip.on { background: var(--text); color: var(--bg); border-color: transparent; }
.chip em { font-style: normal; font-size: 12px; opacity: .7; }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
.srch { position: relative; display: flex; align-items: center; flex: 1 1 220px; min-width: 0; max-width: 300px; }
.srch .ic { position: absolute; left: 10px; color: var(--faint); width: 16px; height: 16px; pointer-events: none; }
.srch input { width: 100%; height: 38px; padding: 0 30px 0 34px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.srch input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.srch kbd { position: absolute; right: 8px; font: 11px var(--font); color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; }
.fpanel { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.fs { display: flex; flex-direction: column; gap: 3px; } .fs > span { font-size: 12px; color: var(--muted); }
.fs .sel { height: 38px; border-radius: 10px; }
.ftog { display: none; height: 38px; border-radius: 10px; } .ftog em { font-style: normal; min-width: 18px; height: 18px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; display: grid; place-items: center; }
.sortc { margin-left: auto; }
.rng { display: flex; flex-direction: column; gap: 3px; width: 190px; } .rng > div:first-child { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); } .rng b { color: var(--text); font-weight: 500; }
.rng-t { position: relative; height: 32px; }
.rng-t::before { content: ''; position: absolute; left: 0; right: 0; top: 15px; height: 3px; border-radius: 2px; background: var(--border); }
.rng-t i { position: absolute; top: 15px; height: 3px; background: var(--accent); }
.rng-t input { position: absolute; left: 0; top: 6px; width: 100%; height: 20px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.rng-t input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); cursor: grab; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
.rng-t input::-moz-range-thumb { pointer-events: auto; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); cursor: grab; }
.rng-t input::-webkit-slider-runnable-track { background: none; } .rng-t input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-bg); }
.swl { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 38px; cursor: pointer; user-select: none; }
.swl input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 34px; height: 20px; border-radius: 10px; background: #cfcdc4; position: relative; transition: background-color .15s; flex: none; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s var(--e-out); }
.swl input:checked + .sw { background: var(--accent); } .swl input:checked + .sw::after { transform: translateX(14px); }
.swl input:focus-visible + .sw { outline: 2px solid var(--accent); outline-offset: 2px; }
.res-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 4px 0 14px; flex-wrap: wrap; }
.res-h h2 { font-size: 18px; font-weight: 600; } .res-h p { color: var(--muted); font-size: 13px; }
.cars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.car { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color .15s, box-shadow .2s, transform .2s var(--e-out); animation: pop .3s var(--e-out) both; }
@media (hover: hover) and (pointer: fine) { .car:hover { border-color: #d3d1c7; box-shadow: var(--sh); transform: translateY(-2px); } }
.car.off { opacity: .62; }
.car-art { display: block; position: relative; aspect-ratio: 8 / 5; overflow: hidden; background: var(--raised); }
.car-art > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.tagi { position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: 13px; background: rgba(255,255,255,.94); font-size: 12px; font-weight: 500; }
.tagi .ic { width: 13px; height: 13px; color: var(--accent); fill: var(--accent); }
.fav { position: absolute; top: 10px; right: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.94); display: grid; place-items: center; cursor: pointer; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: transform .14s var(--e-out); }
.fav:active { transform: scale(.9); } .fav.on .ic { fill: var(--heart); stroke: var(--heart); }
.car-b { padding: 14px 16px 16px; }
.car-t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.car-t h3 { font-size: 16px; font-weight: 600; min-width: 0; }
.hit { all: unset; cursor: pointer; } .hit::after { content: ''; position: absolute; inset: 0; z-index: 1; border-radius: 14px; }
.hit:focus-visible { outline: none; } .hit:focus-visible::after { box-shadow: inset 0 0 0 2px var(--accent); }
.car-b .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.car-f { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; gap: 8px; }
.car-f b { font-size: 20px; font-weight: 600; } .car-f small { color: var(--muted); font-size: 13px; }
.car-f .tot { font-size: 13px; text-align: right; } .car-f .tot.ok { color: var(--accent-d); font-weight: 500; }
.sk { background: linear-gradient(90deg, var(--raised) 0, var(--hover) 50%, var(--raised) 100%); background-size: 200% 100%; animation: sk 1.1s linear infinite; border-radius: 6px; }
@keyframes sk { to { background-position: -200% 0; } }
.empty-s { text-align: center; padding: 48px 16px; border: 1px dashed var(--border); border-radius: 14px; background: var(--surface); }
.empty-s .ic-w { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 14px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); }
.empty-s h3 { font-size: 17px; font-weight: 600; } .empty-s p { color: var(--muted); max-width: 44ch; margin: 6px auto 16px; }
.how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 40px; }
.how > div { padding: 20px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.how .n { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-bg); color: var(--accent-d); font-weight: 600; display: grid; place-items: center; margin-bottom: 10px; }
.how h3 { font-size: 15px; font-weight: 600; } .how p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.cta { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 20px; padding: 22px 24px; border-radius: 14px; background: var(--accent-bg); flex-wrap: wrap; }
.cta h3 { font-size: 17px; font-weight: 600; } .cta p { color: var(--muted); }

/* listing */
.crumbs { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
.crumbs button { all: unset; cursor: pointer; } .crumbs button:hover { color: var(--text); text-decoration: underline; } .crumbs button:focus-visible { outline: 2px solid var(--accent); }
.lp-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.lp-h h1 { font-size: 28px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; }
.lp-h p { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); margin-top: 6px; align-items: center; }
.lp-h .acts { display: flex; gap: 8px; }
.btn.on .ic { fill: var(--heart); stroke: var(--heart); }
.gal { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; height: 430px; border-radius: 16px; overflow: hidden; margin-bottom: 30px; }
.gal > figure { position: relative; min-height: 0; min-width: 0; }
.gal > figure:first-child { grid-row: 1 / 3; } .gal img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gp { background: var(--raised); display: flex; flex-direction: column; padding: 12px 14px 10px; }
.gp svg { flex: 1; min-height: 0; width: 100%; }
.gp figcaption { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.gp figcaption b { color: var(--text); font-weight: 500; }
.gp .svg-t { font: 11px var(--font); fill: var(--muted); }
.lp { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 48px; align-items: start; }
.lp-side { position: sticky; top: 84px; }
.sec { padding: 28px 0; border-top: 1px solid var(--border); } .sec:first-child { border-top: 0; padding-top: 0; }
.sec > h2 { font-size: 19px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 14px; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; } .sec-h h2 { font-size: 19px; font-weight: 600; }
.specs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.specs div { padding: 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
.specs .ic { color: var(--accent); margin-bottom: 6px; } .specs b { display: block; font-weight: 600; font-size: 14px; } .specs span { font-size: 12px; color: var(--muted); }
.desc { color: var(--text); max-width: 68ch; } .desc + .desc { margin-top: 10px; }
.feat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
.feat li { display: flex; gap: 10px; align-items: center; } .feat .ic { color: var(--accent); }
.hostc { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; padding: 20px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.hostc h3 { font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sh { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; background: #fbf0d6; color: #7a5200; font-size: 12px; font-weight: 500; }
.vb { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.vb span { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--accent-bg); color: var(--accent-d); font-size: 12px; font-weight: 500; }
.vb .ic { width: 14px; height: 14px; }
.hstat { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 12px 0 14px; } .hstat b { display: block; font-weight: 600; } .hstat span { font-size: 12px; color: var(--muted); }
.cal-nav { display: flex; gap: 6px; }
.cals { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.mo-t { font-weight: 600; text-align: center; margin-bottom: 6px; }
.mo-g { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px; }
.dw { text-align: center; font-size: 12px; color: var(--faint); padding: 4px 0; }
.day { height: 40px; border: 0; background: none; border-radius: 20px; color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; display: grid; place-items: center; transition: background-color .12s; }
.day:hover:not(:disabled) { background: var(--hover); }
.day:disabled { color: #a9aba6; cursor: not-allowed; text-decoration: line-through; }
.day.past { color: #b9bab4; cursor: default; }
.day.in { background: var(--accent-bg); border-radius: 0; }
