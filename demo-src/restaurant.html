<!DOCTYPE html>
<html lang="en" data-theme="light" data-fx="flash">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RestOS — Restaurant Operating System (Demo)</title>
<meta name="description" content="Demo: RestOS restaurant operating system with live order board, POS, floor plan, kitchen display, reservations, shifts, inventory, guest loyalty and end-of-day report. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root[data-theme="light"]{
--bg:#efece6;--surface:#ffffff;--raised:#f6f3ee;--hover:#efebe4;--border:#e2ded4;--rule:#eeeae2;
--text:#1d1a16;--muted:#5f5a50;--faint:#716b60;
--accent:#d9461f;--accent-ink:#ffffff;
--font:"Golos Text",system-ui,sans-serif;--display:"Fraunces",Georgia,serif;
--info:#3a4fa0;--info-bg:#eef1fb;
}
.brand-mark{background:var(--accent);color:#fff}
.brand-name{font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:-.01em}
.head h1,.big,.kpi b{font-family:var(--display);font-weight:600;letter-spacing:-.02em}
.nav .count{background:var(--accent);color:#fff}
.nav .count.soft{background:var(--raised);color:var(--muted);border:1px solid var(--border)}
.side{overflow-y:auto}
.side-foot{flex-direction:column;align-items:stretch;gap:4px;font-size:12px;color:var(--muted)}
.side-foot b{color:var(--text);font-weight:500}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);align-items:start}
.col-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.col-h h2{font-size:15px;font-weight:600}.col-h span{color:var(--muted);font-size:13px}
.tickets{display:flex;flex-direction:column;gap:10px;min-height:64px}
.ticket{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 12px;cursor:pointer;transition:border-color .15s}
.ticket:hover{border-color:var(--faint)}
.ticket.late{border-color:var(--accent)}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.t-top b{font-size:15px}.t-top span{font-size:13px;color:var(--muted)}
.t-top .late{color:var(--accent);font-weight:600}
.t-top .tt{display:flex;align-items:center;gap:10px;min-width:0}
.t-items{color:var(--muted);font-size:13px;margin-bottom:12px}
.t-items li + li{margin-top:2px}
.t-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.none{color:var(--faint);padding:18px 4px;text-align:center;border:1px dashed var(--border);border-radius:var(--radius)}
.thumb{width:44px;height:44px;border-radius:12px;flex:none;overflow:hidden}.thumb svg,.thumb img{width:100%;height:100%;display:block}.thumb img{object-fit:cover}
.ticket.fresh{animation:fresh 1.6s var(--ease) both}
@keyframes fresh{0%{transform:translateY(-14px) scale(.97);opacity:0;box-shadow:0 0 0 0 rgba(217,70,31,.5)}30%{transform:none;opacity:1;box-shadow:0 0 0 10px rgba(217,70,31,0)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes lp{50%{opacity:.3}}
.kpis.k5{gap:32px}
.kpi span em{font-style:normal;color:var(--faint)}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.dcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;min-width:0;transition:transform .25s var(--ease),border-color .15s}
.dcard:hover{transform:translateY(-3px);border-color:var(--faint)}
.dcard.off{opacity:.65}.dcard.off .dart svg,.dcard.off .dart img{filter:grayscale(1)}
.dart{display:block;width:100%;padding:8px 10px 0;border:0;background:none;cursor:pointer}.dart svg{width:100%;height:auto;display:block}.dart img{width:100%;aspect-ratio:4 / 3;object-fit:cover;border-radius:10px;display:block}
.dbody{padding:10px 14px 14px}.dbody>b{display:block;font-weight:600;line-height:1.25}
.dfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.dfoot>span{font:600 17px var(--display)}
.sw{width:40px;height:24px;border-radius:12px;border:0;background:var(--border);position:relative;cursor:pointer;transition:background-color .18s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.sw[aria-pressed="true"]{background:var(--pos)}.sw[aria-pressed="true"]::after{transform:translateX(16px)}
.posbar .btn{color:var(--text)}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-10px 0 18px;min-height:40px}
.top-l{display:flex;align-items:center;gap:12px;min-width:0}
.mbrand{display:none;align-items:center;gap:8px;font:600 17px var(--display)}
.mbrand .brand-mark{width:28px;height:28px}
.clock{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:15px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--muted);white-space:nowrap}
.clock i{width:7px;height:7px;border-radius:50%;background:var(--pos);animation:lp 1.6s ease-in-out infinite}
.top-r{display:flex;align-items:center;gap:6px;position:relative}
.ib{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:9px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted);transition:background-color .15s,color .15s}
.ib:hover,.ib[aria-expanded="true"]{background:var(--surface);border-color:var(--border);color:var(--text)}
.ib .dot{position:absolute;top:1px;right:0;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.ub{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 4px;border-radius:20px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left}
.ub .avatar{width:30px;height:30px;background:var(--accent);color:#fff}
.ub b{display:block;font-size:13px;line-height:1.2;font-weight:600}.ub small{display:block;font-size:11px;color:var(--muted)}
.pop{position:absolute;top:calc(100% + 8px);right:0;z-index:35;width:min(360px,calc(100vw - 32px));max-height:70svh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 40px rgba(29,26,22,.16);padding:6px;transform-origin:top right;animation:popin .16s var(--ease) both}
@keyframes popin{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;font-weight:600}
.pop .mi{display:flex;gap:10px;align-items:flex-start;width:100%;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer}
.pop .mi:hover{background:var(--hover)}
.pop .mi .ic{margin-top:1px;color:var(--muted)}
.mi b{display:block;font-weight:500}.mi span{display:block;font-size:12px;color:var(--muted)}
.mi.unread b::after{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.pop hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
.ver{font-size:11px;color:var(--faint);padding:6px 10px}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;font-weight:500}

/* drawer,undo,states */
.dw-scrim{position:fixed;inset:0;z-index:38;background:rgba(29,26,22,.32);animation:fade .18s ease both}
.dw{position:absolute;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;animation:slin .26s var(--ease) both}
@keyframes slin{from{transform:translateX(32px);opacity:0}}
.dw-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.dw-h h2{font:600 20px var(--display)}.dw-h p{color:var(--muted);font-size:13px;margin-top:2px}
.dw-b{flex:1;overflow:auto;padding:16px 20px}
.dw-f{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;border-top:1px solid var(--rule);justify-content:flex-end}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-bottom:8px}
.kv span{display:block;font-size:12px;color:var(--faint)}.kv b{font-weight:500;overflow-wrap:anywhere}
.sec{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--rule)}
.ln small{grid-column:1;color:var(--muted);font-size:12px}
.ln .ok{color:var(--pos);display:inline-flex;vertical-align:-3px}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-top:10px;border-top:1px solid var(--border);margin-top:4px}
.sum .tot{font:600 18px var(--display)}
.undo{position:fixed;left:50%;bottom:24px;z-index:65;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 16px;border-radius:10px;background:var(--text);color:var(--bg);font-weight:500;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);max-width:calc(100vw - 32px)}
.undo.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.undo .btn{background:transparent;color:#ffb59e;border-color:rgba(255,255,255,.22)}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar2 .sp{flex:1}
.inp{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);outline:none;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,70,31,.12)}
.srch{position:relative;flex:1 1 220px;max-width:340px}.srch .ic{position:absolute;left:10px;top:8px;color:var(--faint);pointer-events:none}.srch input{width:100%;padding-left:34px}
.srch kbd{position:absolute;right:8px;top:7px;font:11px var(--font);color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.th button{all:unset;cursor:pointer;display:inline-flex;gap:3px;align-items:center;border-radius:4px}
.th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.th .r button{justify-content:flex-end}
.th .ic{width:12px;height:12px}
.tr[tabindex]{cursor:pointer}
.pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;margin-top:6px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
.pager div{display:flex;gap:6px}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--raised) 25%,var(--hover) 50%,var(--raised) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.state{text-align:center;padding:56px 16px}.state .ic{width:28px;height:28px;margin:0 auto 10px;color:var(--faint)}.state h2{font-size:17px;margin-bottom:4px}.state p{color:var(--muted);max-width:420px;margin:0 auto 14px}
.state.errs{background:var(--neg-bg);border-radius:var(--radius);padding:18px;text-align:left;margin:10px 0}.state.errs .ic{margin:0;color:var(--neg);display:inline-block;vertical-align:-4px}
.err{color:var(--neg);font-size:12px}[aria-invalid="true"]{border-color:var(--neg) !important}
.btn.danger{background:var(--neg);color:#fff;border-color:transparent}
.btn.ghost{background:none;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap;transition:background-color .15s,color .15s}.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}.chip em{font-style:normal;opacity:.65;margin-left:4px}
.modal.wide{max-width:620px}
.modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}.chk input{width:16px;height:16px;accent-color:var(--accent)}.chk em{margin-left:auto;font-style:normal;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--raised);border:1px solid var(--border);color:var(--muted);margin:2px 4px 0 0}
.pill.info{background:var(--info-bg);color:var(--info)}
.lst li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}.lst li:first-child{border-top:0}.lst li>span{min-width:0}.lst small{display:block;color:var(--muted);font-size:12px}

/* floor */
.zones{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:var(--gap)}
.zone{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;min-width:0}
.zone h2{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px}.zone h2 span{font-weight:400;color:var(--muted);font-size:12px}
.fp{display:grid;grid-template-columns:repeat(var(--c,4),minmax(0,1fr));gap:12px}
.tb{min-height:104px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-width:0;transition:transform .15s var(--ease),border-color .15s}
.tb:hover{border-color:var(--faint)}.tb:active{transform:scale(.98)}
.tb>div{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tb b{font:600 19px var(--display)}.tb small{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb .st{font-size:12px;font-weight:600}
.tb.free .st{color:var(--pos)}
.tb.seated{background:#fdf0ea;border-color:#f2c3b2}.tb.seated .st{color:var(--accent)}
.tb.bill{background:var(--warn-bg);border-color:#e9cf96}.tb.bill .st{color:var(--warn)}
.tb.reserved{background:var(--info-bg);border-color:#c9d2ef}.tb.reserved .st{color:var(--info)}
.tb.cleaning{background:repeating-linear-gradient(-45deg,var(--raised) 0 8px,var(--surface) 8px 16px)}.tb.cleaning .st{color:var(--muted)}
.tb>.seats{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start}.seats i{width:6px;height:6px;border-radius:50%;background:var(--border)}.seats i.f{background:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:14px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--border)}

/* POS */
.posl{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:var(--gap);align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;margin-top:12px}
.pi{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;min-width:0;transition:transform .12s var(--ease),border-color .15s}
.pi:hover{border-color:var(--faint)}.pi:active{transform:scale(.97)}.pi[aria-disabled="true"]{opacity:.55;cursor:not-allowed}.pi[aria-disabled="true"] .thumb{filter:grayscale(1)}
.pi .thumb{width:100%;height:auto;aspect-ratio:4 / 3;border-radius:8px}
.pi b{font-weight:500;font-size:13px;line-height:1.25;min-height:2.5em}.pi>span{font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.pi .pill{height:18px;font-size:11px;padding:0 6px}
.tk{padding:0;display:flex;flex-direction:column;position:sticky;top:16px;max-height:calc(100svh - 60px)}
.tk-h{padding:16px 16px 12px;border-bottom:1px solid var(--rule)}.tk-h h2{font-size:15px;margin-bottom:10px}
.tk-b{flex:1;overflow:auto;padding:0 16px;min-height:110px}
.tk-f{padding:12px 16px 16px;border-top:1px solid var(--rule)}
.tk-f .btn{flex:1}
.tl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center}
.tl>button{all:unset;cursor:pointer;min-width:0;border-radius:4px}.tl>button:focus-visible{outline:2px solid var(--accent)}
.tl small{display:block;color:var(--accent);font-size:12px}
.qty{display:inline-flex;align-items:center;gap:4px}.qty button{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--raised);cursor:pointer;display:grid;place-items:center}.qty b{min-width:18px;text-align:center}
.tk .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tk select,.tk input{width:100%}
.posbar{display:none}

/* KDS */
.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
.kt{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.kt-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--raised);border-bottom:1px solid var(--border)}
.kt.warn .kt-h{background:var(--warn-bg)}.kt.late .kt-h{background:var(--accent);color:#fff}.kt.late .kt-h small{color:rgba(255,255,255,.85)}
.kt-h b{font-size:15px}.kt-h small{display:block;font-size:12px;color:var(--muted)}.kt-h .tm{font:600 20px var(--display);white-space:nowrap}
.ki{display:flex;gap:10px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer}
.ki:hover{background:var(--hover)}.ki .n{font-weight:700;min-width:22px}.ki small{display:block;color:var(--accent);font-size:12px}.ki.done{color:var(--faint)}.ki.done>span:last-child{text-decoration:line-through}.ki.other{opacity:.45}
.ki em{font-style:normal;font-size:11px;color:var(--faint);margin-left:6px}
.kt-f{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}

/* reservations */
.days{display:grid;grid-template-columns:repeat(7,minmax(84px,1fr));gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.dy{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;min-width:0}.dy.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.dy b{display:block}.dy small{display:block;color:var(--muted);font-size:12px}
.avail{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.slot{flex:none;width:56px;padding:5px 0;border-radius:8px;text-align:center;font-size:11px;border:1px solid var(--border);background:var(--pos-bg);color:var(--pos);cursor:pointer}.slot b{display:block;font-size:13px;color:var(--text);font-weight:500}
.slot.tight{background:var(--warn-bg);color:var(--warn)}.slot.full{background:var(--neg-bg);color:var(--neg);cursor:not-allowed}.slot.past{opacity:.4;cursor:not-allowed;background:var(--raised);color:var(--muted)}
.tlw{overflow-x:auto;margin-top:4px}
.tlg{display:grid;grid-template-columns:76px repeat(22,minmax(30px,1fr));min-width:820px;font-size:12px;position:relative}
.tlg .hd{color:var(--faint);padding:4px 0 6px 4px;border-left:1px solid var(--rule)}
.tlg .rl{padding:9px 0;font-weight:500;border-top:1px solid var(--rule);white-space:nowrap}
.tlg .cl{border-top:1px solid var(--rule);border-left:1px solid var(--rule);min-height:38px}
.tlg .nowl{border-left:2px solid var(--accent);z-index:1;pointer-events:none}
.rb{position:relative;z-index:2;margin:4px 2px;border-radius:7px;padding:0 7px;height:30px;background:var(--info-bg);color:var(--info);border:1px solid #c9d2ef;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;font-size:12px;text-align:left}
.rb.seated{background:var(--pos-bg);color:var(--pos);border-color:#b9e2c9}.rb.no-show{background:var(--neg-bg);color:var(--neg);border-color:#f2c2bd}.rb.completed{background:var(--raised);color:var(--muted);border-color:var(--border)}
.rlist{display:none}

/* shifts */
.sgw{overflow-x:auto}
.sg{display:grid;grid-template-columns:190px repeat(7,minmax(88px,1fr)) 76px;min-width:900px;font-size:13px}
.sg>div{padding:5px;border-top:1px solid var(--rule);min-width:0}
.sg .hd{color:var(--faint);font-size:12px;border-top:0}.sg .hd b{display:block;color:var(--text);font-weight:500}
.sg .td{background:rgba(217,70,31,.05)}
.sg .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sg .nm span{font-size:12px;color:var(--muted)}

function eod(){

const byM={};pays.forEach((p)=>{byM[p.m]=r2((byM[p.m]||0)+p.a);});
const byC={},vat={10:0,20:0},top={};
closed.forEach((o)=>{const f=sub(o)?due(o)/sub(o):0;o.items.forEach((l)=>{const v=lt(l)*f;byC[l.c]=(byC[l.c]||0)+v;vat[l.vat]+=v;});});
live.forEach((o)=>o.items.forEach((l)=>{top[l.n]=(top[l.n]||0)+l.q;}));
const hours={};for(let h=11;h<=23;h++)hours[h]=0;pays.forEach((p)=>{const h=Math.min(23,Math.floor(p.t/60));hours[h]=r2(hours[h]+p.a);});
const waiters={};closed.forEach((o)=>{const w=waiters[o.waiter]||(waiters[o.waiter]={n:0,cov:0,v:0});w.n++;w.cov+=o.cov;w.v=r2(w.v+due(o));});

return{closed,live,pays,taken,tips,net,gross,discounts,partial,byM,byC,vat,top,hours,waiters,covers,cancelled:S.orders.filter((o)=>o.st==='cancel'),
open:sum(S.orders.filter((o)=>OPEN.includes(o.st)),left),openN:S.orders.filter((o)=>OPEN.includes(o.st)).length};
}
function reconcile(e=eod()){
console.assert(Math.abs(sum(Object.values(e.byM),(x)=>x)-e.taken)<.01,'payments by method add up to takings');
console.assert(Math.abs(Object.values(e.byC).reduce((s,x)=>s+x,0)-e.net)<.05,'sales mix adds up to net sales');

}

/* table: sortable, paginated; rows open a drawer */
const TB={};
function dtable(key,rows,cols,{size=12,open,empty='Nothing matches these filters. Try clearing the search.'}={}){
const st=TB[key]||(TB[key]={s:null,d:1,pg:0});
if(!rows.length)return `<div class="state">${ic('search')}<h2>No results</h2><p>${empty}</p></div>`;
const l=rows.slice();
if(st.s){const c=cols.find((x)=>x.k===st.s);l.sort((a,b)=>{const x=c.v(a),y=c.v(b);return(x>y?1:x<y?-1:0)*st.d;});}
const pages=Math.max(1,Math.ceil(l.length/size));st.pg=Math.min(st.pg,pages-1);
const v=l.slice(st.pg*size,st.pg*size+size),cl=(c)=>`${c.cls||''}${c.m?'':' hm'}`;
const th=cols.map((c)=>`<span class="${cl(c)}" role="columnheader" ${c.v?`aria-sort="${st.s===c.k?(st.d>0?'ascending':'descending'):'none'}"`:''}>${c.v?`<button data-act="sort" data-k="${key}:${c.k}">${c.l}${st.s===c.k?ic(st.d>0?'up':'down'):''}</button>`:c.l}</span>`).join('');
return `<div class="tbl" role="table" style="--cols:${cols.map((c)=>c.w).join(' ')};--colsm:${cols.filter((c)=>c.m).map((c)=>c.m===true?c.w:c.m).join(' ')}"><div class="tr th" role="row">${th}</div>
    ${v.map((r)=>`<div class="tr" role="row" tabindex="0" data-act="${open}" data-id="${r.id}">${cols.map((c)=>`<span class="${cl(c)}" role="cell">${c.h(r)}</span>`).join('')}</div>`).join('')}</div>
    <div class="pager"><span>Showing ${fmt(st.pg*size+1)}–${fmt(st.pg*size+v.length)} of ${fmt(l.length)}</span>${pages>1?`<div><button class="btn sm" data-act="pg" data-k="${key}:-1" ${st.pg?'':'disabled'}>Previous</button><button class="btn sm" data-act="pg" data-k="${key}:1" ${st.pg<pages-1?'':'disabled'}>Next</button></div>`:''}</div>`;
}

/* dashboard: the live board */
const wait=(o)=>Math.max(0,Math.floor(NOW-(o.st==='new'?o.t:o.fired)));
function ticket(o){
const w=wait(o),late=o.st!=='ready'&&w>=(o.st==='new'?5:18);
return `<article class="ticket${late?' late':''}${o.id===FRESH?' fresh':''}" data-act="openOrder" data-id="${o.id}" tabindex="0" aria-label="Order ${o.id}, ${where(o)}">
    <div class="t-top"><span class="tt"><span class="thumb">${dishArt(o.items[0].n,o.items[0].c)}</span><b>${esc(where(o))} <span>#${o.id}</span></b></span><span class="${late?'late':''}">${w} min</span></div>
    <ul class="t-items">${o.items.slice(0,3).map((i)=>`<li>${esc(i.n)}${i.q>1?' × '+i.q:''}${i.mods.length?` <em>· ${esc(i.mods.join(', '))}</em>`:''}</li>`).join('')}${o.items.length>3?`<li>+${o.items.length-3} more</li>`:''}</ul>
    <div class="t-foot"><b>${eur(due(o))}</b><button class="btn sm ${o.st==='new'?'primary':''}" data-act="adv" data-id="${o.id}">${NEXT[o.st]}</button></div></article>`;
}
function finding(){
const stopNew=S.orders.find((o)=>o.st==='new'&&o.items.some((l)=>!isAvail(dish(l.n))));
if(stopNew){const l=stopNew.items.find((x)=>!isAvail(dish(x.n)));return `<div class="finding">${ic('alert')}<span>Order #${stopNew.id} includes “${esc(l.n)}”, which is on the stop-list (${esc(why(dish(l.n)).toLowerCase())}). Call the guest before accepting it.</span><button class="btn sm" data-act="openOrder" data-id="${stopNew.id}">Open order</button></div>`;}
const clash=RES.filter((r)=>r.o===0&&r.st==='booked'&&r.t>=NOW-15&&r.t-NOW<=30).find((r)=>['seated','bill'].includes(tstat(tbl(r.table))));
if(clash)return `<div class="finding">${ic('calendar')}<span>${esc(clash.name)} (${clash.size}) is booked for ${hm(clash.t)} at Table ${clash.table}, which is still occupied. Move the booking or turn the table.</span><button class="btn sm" data-act="openRes" data-id="${clash.id}">Reassign</button></div>`;
const waiting=S.orders.filter((o)=>o.st==='new').sort((a,b)=>a.t-b.t)[0];
if(waiting&&wait(waiting)>=4)return `<div class="finding">${ic('clock')}<span>${esc(waiting.type)} order #${waiting.id} has waited ${pl(wait(waiting),'minute')} for acceptance.</span><button class="btn sm primary" data-act="adv" data-id="${waiting.id}">Accept & fire</button></div>`;
return '';
}

    <div class="tk-f"><div class="sum"><span>Subtotal</span><span>${eur(subT)}</span>${dT?`<span>Discount · ${esc(POS.disc.why)}</span><span>${eur(-dT)}</span>`:''}<b>Total</b><b class="tot">${eur(subT-dT)}</b><span class="hint">incl. VAT ${eur(vatOf(t,10))} (10%) · ${eur(vatOf(t,20))} (20%)</span></div>
      ${POS.err&&POS.err!=='table'?`<p class="err" role="alert" style="margin-top:8px">${esc(POS.err)}</p>`:POS.err==='table'?`<p class="err" role="alert" style="margin-top:8px">Choose a table for a dine-in order.</p>`:''}
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-act="posDisc" ${POS.lines.length?'':'disabled'}>${ic('pct')}Discount</button><button class="btn" data-act="posClear" ${POS.lines.length?'':'disabled'}>Clear</button></div>

    ${n?`<div class="posbar"><span>${pl(n,'item')} · <b>${eur(subT-dT)}</b></span><button class="btn sm" data-act="toTicket">View ticket</button></div>`:''}`;
};
function vatOf(o,rate){const s=sub(o),f=s?(s-disc(o)-redeemV(o))/s:0;return r2(o.items.filter((l)=>l.vat===rate).reduce((a,l)=>a+lt(l)*f,0)*rate/(100+rate));}

/* floor plan */

return head('Floor plan',`${occ} of ${TABLES.length} tables occupied · ${cov} of ${CAP} covers`,`<button class="btn primary" data-act="walkIn">${ic('users')}Seat walk-in</button>`)+
`<div class="legend">${[['free','var(--surface)'],['seated','#fdf0ea'],['bill','var(--warn-bg)'],['reserved','var(--info-bg)'],['cleaning','var(--raised)']].map(([k,c])=>`<span><i style="background:${c}"></i>${TST[k]}</span>`).join('')}</div>

function errs(map){

/* payment */
let PAY=null;
const TERMS=['Terminal 1 · bar','Terminal 2 · floor'];
function payOrder(id){const o=S.orders.find((x)=>x.id===+id);if(!o)return;if(o.st==='new')return toast('Accept the order before taking payment');PAY={id:o.id,mode:'full',parts:2,done:0,sel:[],m:'Card',term:0,tender:'',tip:0,tipC:'',busy:false,err:''};modal('<div id="payb"></div>');wide();payRender();}
function payAmt(o){
const L=left(o);if(PAY.mode==='equal'){const k=PAY.parts-PAY.done;return k<=1?L:r2(L/k);}
if(PAY.mode==='items'){const f=sub(o)?due(o)/sub(o):0;return Math.min(L,r2(PAY.sel.reduce((s,i)=>s+lt(o.items[i])*f,0)));}
return L;
}
function payRender(){
const b=$('#payb');if(!b)return;const o=S.orders.find((x)=>x.id===PAY.id),g=guest(o.gid),a=payAmt(o);
const tip=r2(a*PAY.tip),chg=PAY.m==='Cash'&&+PAY.tender?r2(+PAY.tender-a-tip):0;
b.innerHTML=`<h2>Payment · #${o.id} ${esc(where(o))}</h2><p>Total ${eur(due(o))}${paid(o)?` · paid ${eur(paid(o))}`:''} · <b>${eur(left(o))} to pay</b></p>
    ${g&&g.points>=100&&!o.redeem&&!o.pays.length?`<div class="finding" style="background:var(--info-bg)">${ic('star')}<span>${esc(g.name)} has ${fmt(g.points)} points. Redeem ${fmt(Math.min(Math.floor(g.points/100)*100,Math.floor(left(o)/5)*100))} points for ${eur(Math.min(Math.floor(g.points/100),Math.floor(left(o)/5))*5)} off.</span><button class="btn sm" data-act="redeem">Redeem</button></div>`:''}
    <div class="tabs" role="tablist"><button data-act="payMode" data-k="full" class="${PAY.mode==='full'?'on':''}">Full bill</button><button data-act="payMode" data-k="equal" class="${PAY.mode==='equal'?'on':''}">Split equally</button><button data-act="payMode" data-k="items" class="${PAY.mode==='items'?'on':''}" ${o.pays.length&&PAY.mode!=='items'?'disabled':''}>By item</button></div>
    ${PAY.mode==='equal'?`<div class="field"><label for="pay-parts">Number of guests</label><select class="inp" id="pay-parts" data-payk="parts">${[2,3,4,5,6,7,8].map((n)=>`<option ${PAY.parts===n?'selected':''} ${n<=PAY.done?'disabled':''}>${n}</option>`).join('')}</select><span class="hint">Part ${PAY.done+1} of ${PAY.parts}</span></div>`:''}
    ${PAY.mode==='items'?`<div class="field"><label>Items this guest pays for</label>${o.items.map((l,i)=>l.pd?`<div class="chk muted">${l.q} × ${esc(l.n)}<em>paid</em></div>`:`<label class="chk"><input type="checkbox" data-payi="${i}" ${PAY.sel.includes(i)?'checked':''}>${l.q} × ${esc(l.n)}<em>${eur(lt(l))}</em></label>`).join('')}</div>`:''}
    <div class="field"><label>Method</label><div class="chips">${['Card','Cash','Voucher'].map((m)=>`<button class="chip ${PAY.m===m?'on':''}" data-act="payM" data-k="${m}" aria-pressed="${PAY.m===m}">${m}</button>`).join('')}</div></div>
    <div class="row2">${PAY.m==='Card'?`<div class="field"><label for="pay-term">Card terminal</label><select class="inp" id="pay-term" data-payk="term">${TERMS.map((t,i)=>`<option value="${i}" ${PAY.term===i?'selected':''}>${t}${i?' (offline)':''}</option>`).join('')}</select></div>`:PAY.m==='Cash'?`<div class="field"><label for="pay-tender">Cash received, €</label><input class="inp" id="pay-tender" type="number" min="0" step="0.5" inputmode="decimal" data-payk="tender" value="${esc(PAY.tender)}" placeholder="${fmtD(a+tip,2)}"><span class="hint">${chg>0?'Change '+eur(chg):'Enter the amount handed over'}</span></div>`:`<div class="field"><label for="pay-vc">Voucher code</label><input class="inp" id="pay-vc" placeholder="NL-XXXX-XXXX" data-payk="vc" value="${esc(PAY.vc||'')}"></div>`}
    <div class="field"><label>Tip</label><div class="chips">${[[0,'None'],[.05,'5%'],[.1,'10%'],[.15,'15%']].map(([v,t])=>`<button class="chip ${PAY.tip===v?'on':''}" data-act="payTip" data-k="${v}">${t}</button>`).join('')}</div></div></div>
    ${PAY.err?`<div class="state errs" role="alert">${ic('alert')} <b>${esc(PAY.err)}</b><p style="margin:4px 0 0">${PAY.term?'Terminal 2 has not responded for 4 minutes. Use Terminal 1 or take cash.':''}</p>${PAY.term?'<button class="btn sm" data-act="payT1" style="margin-top:8px">Switch to Terminal 1</button>':''}</div>`:''}
    <div class="modal-actions"><button class="btn" data-act="closeModal">Close</button><button class="btn primary" data-act="payGo" ${PAY.busy||a<=0?'disabled':''}>${PAY.busy?`<span class="spin"></span> Waiting for card on ${TERMS[PAY.term].split(' ·')[0]}…`:`Charge ${eur(a+tip)}`}</button></div>`;
}
function payGo(){
const o=S.orders.find((x)=>x.id===PAY.id),a=payAmt(o),tip=r2(a*PAY.tip);
PAY.err='';
if(PAY.mode==='items'&&!PAY.sel.length){PAY.err='Select at least one item';return payRender();}
if(PAY.m==='Cash'&&PAY.tender!==''&&+PAY.tender<a+tip-.001){payRender();return errs({'pay-tender':`Not enough cash: ${eur(a+tip)} is due`});}

const el=e.target,b=el.dataset.bind;
if(b){const[p,k]=b.split('.');if(p==='pos')POS[k]=el.value;else F[p][k]=bindVal(el);const tk={orders:'orders',guests:'guests',inv:'inv'}[p];if(tk&&TB[tk])TB[tk].pg=0;return renderView();}
if(el.dataset.pos){const k=el.dataset.pos;if(k==='guest'){POS.guest=el.value;const g=S.guests.find((x)=>x.name===el.value||x.phone===el.value),was=POS.gid;POS.gid=g?g.id:null;if(e.type==='change'||was===POS.gid)return;}else if(k==='cov'){POS.cov=Math.round(+el.value);return;}else{POS[k]=el.value;if(k==='type'&&el.value!=='Dine-in')POS.table='';}if(POS.err==='table'&&POS.table)POS.err='';return renderView();}
if(el.dataset.payk){const k=el.dataset.payk;PAY[k]=k==='parts'||k==='term'?+el.value:el.value;if(k==='parts'||k==='term')payRender();else{const btn=$('[data-act="payGo"]');const o=S.orders.find((x)=>x.id===PAY.id),a=payAmt(o),tip=r2(a*PAY.tip);if(btn&&!PAY.busy)btn.textContent=`Charge ${eur(a+tip)}`;const h=el.parentNode.querySelector('.hint');if(h&&k==='tender'){const c=r2(+el.value-a-tip);h.textContent=+el.value?(c>=0?'Change '+eur(c):`${eur(-c)} short`):'Enter the amount handed over';}}return;}
if(el.dataset.payi!=null){const i=+el.dataset.payi;PAY.sel=el.checked?[...PAY.sel,i]:PAY.sel.filter((x)=>x!==i);payRender();}
}
document.addEventListener('input',(e)=>{if(e.target.matches('input[type=search], input[data-payk], input[data-pos="guest"]'))onField(e);});
document.addEventListener('change',(e)=>{if(!e.target.matches('input[type=search]'))onField(e);});

/* live service: the clock runs, orders keep arriving, the pass marks tickets ready */
let beat=0;
const busy=()=>$('#scrim')||$('#drawer')||pop||/^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement||{}).tagName||'');
setInterval(()=>{
if(document.hidden||!SIGNED)return;
beat++;NOW+=1;
if(beat % 3===0)spawn();else if(beat % 4===0)kitchenTick();else if(beat % 10===5)settleTick();
if(busy()){const c=$('#clk');if(c)c.textContent=`${DF.format(day(0))} · ${hm(NOW)}`;if(!pop)chrome();return;}
if(['dashboard','orders','kitchen','floor','report'].includes(page)){render();FRESH=null;}else chrome();
},5000);
render();
</script>
