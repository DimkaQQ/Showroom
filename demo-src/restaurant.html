    <div class="t-top"><span class="tt"><span class="thumb">${dishSVG(o.items[0].n, cat(o.items[0].n))}</span><b>${esc(o.table)} <span>${o.id}</span></b></span><span class="${late ? 'late' : ''}">${w} мин</span></div>
    <ul class="t-items">${o.items.slice(0, 3).map((i) => `<li><span>${esc(i.n)}${i.q > 1 ? ' × ' + i.q : ''}</span></li>`).join('')}${o.items.length > 3 ? `<li><span>и ещё ${o.items.length - 3}</span></li>` : ''}</ul>

/* ── live kitchen: the clock runs, orders keep arriving, the pass marks dishes ready ─ */
let FRESH = null, beat = 0;
const WHO = ['Айбек Т.', 'Мадина Р.', 'Тимур С.', 'Лейла К.', 'Ерлан Ж.', 'Асель Б.', 'Данияр М.', 'Сауле Н.'];
const WHERE = ['Стол 1', 'Стол 3', 'Стол 6', 'Стол 2', 'Стол 4', 'Стол 8', 'Доставка'];
const hm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function spawn() {
  const avail = S.menu.filter((m) => m.a), pick = () => avail[Math.floor(Math.random() * avail.length)].n, items = new Map();
  for (let k = 0, n = 1 + Math.floor(Math.random() * 3); k < n; k++) items.set(pick(), 1 + Math.floor(Math.random() * 2));
  const id = '#' + (Math.max(...S.orders.map((o) => +o.id.slice(1))) + 1), where = WHERE[Math.floor(Math.random() * WHERE.length)];
  S.orders.unshift(O(id, where, where === 'Доставка' ? 'Доставка' : 'Зал', WHO[Math.floor(Math.random() * WHO.length)], [...items], 'new', NOW));
  FRESH = id; toast(`Новый заказ ${id} · ${where}`);
}
setInterval(() => {
  if (document.hidden) return;
  beat++; NOW = hm(mins(NOW) + 1);
  if (beat % 3 === 0) spawn();
  else if (beat % 4 === 0) { const c = S.orders.find((o) => o.status === 'cooking'); if (c) { c.status = 'ready'; toast(`${c.id} готов к выдаче`); } }
  if (['dashboard', 'orders', 'analytics', 'finance'].includes(page) && !$('#scrim')) { render(); FRESH = null; }
}, 5000);
render();
</script>
</body>
</html>
