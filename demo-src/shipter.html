<!DOCTYPE html>
<html lang="en" data-theme="dark" data-fx="banner">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipter — product launch planner (demo)</title>
<meta name="description" content="Demo: Shipter turns a product brief into a week-by-week launch plan, then runs it on a task board with tracked links, templates, team roles and billing. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root {
  --bg: #0e0c0b; --surface: #151211; --raised: #1d1917; --hover: #241f1d; --border: #2a2422; --rule: #1f1a18;

  --ease-out: cubic-bezier(.23, 1, .32, 1); --ease-drawer: cubic-bezier(.32, .72, 0, 1);
}
body { font-size: 15px; }
.brand-name, .head h1, .big, .kpi b { font-weight: 800; letter-spacing: -.02em; }
.head h1 { font-size: 28px; }
.nav .count { background: var(--accent); color: var(--accent-ink); }
.nav .count.neg { background: var(--neg-bg); color: var(--neg); }
.app { min-height: calc(100svh - 29px); }
.colm { min-width: 0; display: flex; flex-direction: column; }
.side { overflow-y: auto; }
.nav-label { padding: 14px 10px 4px; }
.sfoot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.sfoot .bar { margin: 6px 0 10px; }
.sfoot .ver { display: flex; justify-content: space-between; gap: 8px; color: var(--faint); }
.lnk { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
/* top bar */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; height: 58px; padding: 0 var(--pad); border-bottom: 1px solid var(--border); background: color-mix(in srgb, var(--bg) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.tb-brand { display: none; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
.tb-brand .brand-mark { width: 28px; height: 28px; }
.gs { position: relative; flex: 1; max-width: 440px; }
.gs input { width: 100%; height: 36px; padding: 0 44px 0 36px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); outline: none; transition: border-color .15s; }
.gs input:focus { border-color: var(--accent); }
.gs > .ic { position: absolute; left: 11px; top: 9px; color: var(--faint); pointer-events: none; }
.gs kbd { position: absolute; right: 9px; top: 8px; }
kbd { display: inline-block; min-width: 20px; text-align: center; font: 600 11px/18px var(--font); padding: 0 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 5px; color: var(--muted); background: var(--raised); }
.spacer { flex: 1; }
.ib { position: relative; width: 38px; height: 38px; border-radius: 9px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); cursor: pointer; transition: background-color .15s, color .15s, transform .12s var(--ease-out); flex: none; }
.ib:hover { background: var(--hover); color: var(--text); } .ib:active { transform: scale(.95); }
.ib .dot { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
.me { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px 0 4px; border-radius: 19px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; flex: none; }
.me:hover { border-color: var(--faint); }
.me .nm { font-weight: 600; font-size: 13px; line-height: 1.1; text-align: left; } .me .nm small { display: block; font-weight: 500; color: var(--muted); font-size: 11.5px; }

.tile { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #fff; background: linear-gradient(140deg, hsl(var(--h) 72% 54%), hsl(calc(var(--h) + 38) 58% 30%)); flex: none; letter-spacing: -.01em; }
.tile.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 9.5px; } .tile.lg { width: 54px; height: 54px; border-radius: 14px; font-size: 19px; }
.ro-bar { display: flex; align-items: center; gap: 10px; padding: 9px var(--pad); background: var(--warn-bg); font-size: 13.5px; }
.ro-bar .ic { color: var(--warn); } .ro-bar span { flex: 1; }
.ro [data-w] { opacity: .5; }
/* popovers, drawers, snack */
.pop { position: fixed; z-index: 50; width: 300px; max-width: calc(100vw - 16px); max-height: min(520px, calc(100svh - 80px)); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 18px 44px rgba(0,0,0,.45); padding: 6px; animation: popin .16s var(--ease-out) both; transform-origin: var(--to, top right); }
@keyframes popin { from { opacity: 0; transform: scale(.97) translateY(-4px); } }

.pop-h small { font-weight: 500; color: var(--muted); }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 6px 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; color: var(--text); font-size: 14px; }
.mi:hover, .mi:focus-visible { background: var(--hover); outline: none; }
.mi .ic { color: var(--muted); } .mi.danger, .mi.danger .ic { color: var(--neg); }
.mi .r { margin-left: auto; color: var(--faint); font-size: 12px; }

.sep { height: 1px; background: var(--border); margin: 6px 4px; }
.nt { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; padding: 9px 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; color: var(--text); }
.nt:hover { background: var(--hover); } .nt i { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: transparent; } .nt.unread i { background: var(--accent); }
.nt span { font-size: 13.5px; } .nt small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
.dscrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 44; animation: fade .2s ease both; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); z-index: 45; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; animation: slidein .3s var(--ease-drawer) both; box-shadow: -20px 0 50px rgba(0,0,0,.35); }
@keyframes slidein { from { transform: translateX(100%); } }
.dh { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.dh h2 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; } .dh p { color: var(--muted); font-size: 13px; margin-top: 2px; }
.dh > div { flex: 1; min-width: 0; }
.db { flex: 1; overflow: auto; padding: 18px 20px; }
.df { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.df .l { margin-right: auto; }
.usnack { position: fixed; left: 20px; bottom: 20px; z-index: 65; display: flex; align-items: center; gap: 12px; max-width: min(420px, calc(100vw - 32px)); padding: 10px 10px 10px 16px; border-radius: 10px; background: var(--text); color: var(--bg); font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: opacity .2s, transform .25s var(--ease-out); }
.usnack.out { opacity: 0; transform: translateY(12px); pointer-events: none; }
.usnack span { flex: 1; min-width: 0; }
.usnack button { flex: none; height: 30px; padding: 0 12px; border-radius: 7px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; cursor: pointer; }
/* buttons, fields */
.btn.danger { background: var(--neg); color: #1c0606; border-color: transparent; font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); } .btn.ghost:hover { color: var(--text); background: var(--hover); }
.btn .ic { width: 16px; height: 16px; }

.frow { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }

.fbox .ic { color: var(--neg); margin-top: 1px; }
.fbox.info { background: var(--accent-bg); } .fbox.info .ic { color: var(--accent); }
.fbox.ok { background: var(--pos-bg); } .fbox.ok .ic { color: var(--pos); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip2:hover { border-color: var(--faint); }
.chip2:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
.chip2 input { accent-color: var(--accent); margin: 0; }
.chip2 small { color: var(--faint); }
.pill.acc { background: var(--accent-bg); color: var(--accent); }
/* tables and toolbars */
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.tools .tabs { margin-bottom: 0; flex-wrap: wrap; }
.srch { position: relative; flex: 1; min-width: 180px; max-width: 320px; }
.srch input { width: 100%; height: 34px; padding: 0 10px 0 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); outline: none; }
.srch input:focus { border-color: var(--accent); }
.srch .ic { position: absolute; left: 10px; top: 8px; width: 17px; height: 17px; color: var(--faint); }
.sel { height: 34px; padding: 0 30px 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); max-width: 100%; }
.tabs button .n { margin-left: 6px; font-size: 12px; color: var(--faint); }

.th button:hover, .th button.on { color: var(--text); }
.th .ic { width: 13px; height: 13px; }
.tr.selr { background: var(--accent-bg); }
.tr .tcell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmain { display: flex; gap: 12px; align-items: center; min-width: 0; }
.pmain > div { min-width: 0; } .pmain b { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .pmain span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 14px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.pager div { display: flex; gap: 6px; }
.bulk { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; margin-bottom: 12px; border-radius: 10px; background: var(--accent-bg); font-size: 13.5px; }
.bulk b { margin-right: auto; }
.mini { display: flex; align-items: center; gap: 8px; } .mini .bar { flex: 1; min-width: 40px; } .mini small { color: var(--muted); font-size: 12px; min-width: 34px; text-align: right; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.empty .ic { width: 32px; height: 32px; margin: 0 auto 10px; color: var(--faint); }
.empty b { display: block; color: var(--text); margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }
/* skeleton */
.sk { border-radius: 8px; background: linear-gradient(90deg, var(--raised) 25%, var(--hover) 50%, var(--raised) 75%); background-size: 200% 100%; animation: shim 1.3s linear infinite; }
@keyframes shim { to { background-position: -200% 0; } }
/* launch board */
.kpis { gap: 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.kpi b { font-size: 28px; } .kpi span { display: flex; align-items: center; } .kpi em { display: block; font-style: normal; font-size: 12px; color: var(--faint); margin-top: 4px; }
.livedot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pos); margin-right: 6px; animation: pulse2 1.8s ease-in-out infinite; flex: none; } @keyframes pulse2 { 50% { opacity: .3; } }
.task { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 46px; padding: 5px 0; }
.task + .task { border-top: 1px solid var(--rule); }
.cb { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); background: none; cursor: pointer; display: grid; place-items: center; color: var(--accent-ink); transition: background-color .15s, border-color .15s, transform .12s var(--ease-out); padding: 0; }
.cb:hover { border-color: var(--accent); } .cb:active { transform: scale(.9); } .cb[aria-checked="true"] { background: var(--accent); border-color: var(--accent); } .cb .ic { width: 14px; height: 14px; stroke-width: 3; }
.cb[aria-checked="mixed"] { border-color: var(--warn); }
.task.done .t { color: var(--faint); text-decoration: line-through; }
.task .w { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.task .t { min-width: 0; }
.task .rt { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.due-late { color: var(--neg) !important; }
.feed li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 8px 0; font-size: 13.5px; } .feed li + li { border-top: 1px solid var(--rule); }
.feed small { display: block; color: var(--faint); font-size: 12px; }
.ul-rows > * { display: flex; align-items: center; gap: 12px; padding: 9px 0; } .ul-rows > * + * { border-top: 1px solid var(--rule); }
.cd { text-align: right; flex: none; } .cd b { display: block; font-size: 15px; } .cd span { font-size: 12px; color: var(--muted); }
/* project page */
.week { padding: 14px 0; } .week + .week { border-top: 1px solid var(--rule); }
.week-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; } .week-h b { font-size: 16px; font-weight: 800; } .week-h span { color: var(--muted); font-size: 13px; }
.chh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; font-weight: 700; }
.chh .muted { font-weight: 500; font-size: 13px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; } .kv dt { color: var(--muted); } .kv dd { min-width: 0; overflow-wrap: anywhere; }
.win { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 0; } .win + .win { border-top: 1px solid var(--rule); } .win small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
/* generator */
.gen { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: var(--gap); align-items: start; }
.out-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
.steps li { display: flex; align-items: center; gap: 10px; padding: 7px 0; color: var(--faint); font-size: 14px; transition: color .2s; }
.steps li.on { color: var(--text); } .steps li.ok { color: var(--muted); }
.steps .st { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center; flex: none; }
.steps li.ok .st { background: var(--pos); border-color: var(--pos); color: #06180e; } .steps li.ok .st .ic { width: 12px; height: 12px; stroke-width: 3; }
.steps li.on .st { border-color: var(--accent); border-top-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.stream { margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); min-height: 72px; font-size: 14px; }
.cursor::after { content: ""; display: inline-block; width: 7px; height: 1em; margin-left: 2px; vertical-align: -2px; background: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.reveal { animation: pop .3s var(--ease-out) both; }
.ech { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-top: 10px; background: var(--bg); }
.ech-h { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; } .ech-h b { flex: 1; min-width: 140px; }
.etask { display: grid; grid-template-columns: minmax(0, 1fr) 110px 32px; gap: 6px; margin-top: 6px; }
.etask input, .etask select, .ech select { height: 32px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); outline: none; min-width: 0; }
.etask input:focus { border-color: var(--accent); } .etask input[aria-invalid="true"] { border-color: var(--neg); }
.ib.sm { width: 32px; height: 32px; } .ib.sm .ic { width: 16px; height: 16px; }
.summary { padding: 14px; border-radius: 10px; background: var(--accent-bg); font-size: 14px; margin-bottom: 6px; }
/* kanban */
.kb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
.kcol { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; display: flex; flex-direction: column; max-height: calc(100svh - 250px); min-height: 280px; }
.kcol header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); font-weight: 700; }
.kcol header i { width: 9px; height: 9px; border-radius: 50%; }
.kcol header span { color: var(--muted); font-weight: 500; font-size: 13px; }
.kcol header .btn { margin-left: auto; }
.klist { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; transition: background-color .15s; border-radius: 0 0 var(--radius) var(--radius); }
.klist.over { background: var(--accent-bg); }
.kc { position: relative; background: var(--raised); border: 1px solid var(--border); border-radius: 9px; padding: 10px 40px 10px 12px; cursor: grab; transition: border-color .15s, transform .15s var(--ease-out), opacity .15s; }
.kc:hover { border-color: var(--faint); } .kc:focus-visible { outline-offset: 1px; }
.kc.drag { opacity: .4; }

.kc.done h4 { color: var(--muted); }

.kc .km .av { margin-left: auto; }

.kc .pill { height: 20px; font-size: 11.5px; padding: 0 7px; }
.kmore { margin: 2px auto 4px; }
/* cards grids */
.gal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
.gcard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: border-color .15s; }
.gcard:hover { border-color: var(--faint); }
.gcard h3 { font-size: 16px; font-weight: 800; letter-spacing: -.01em; } .gcard p { color: var(--muted); font-size: 13.5px; flex: 1; }
.gcard .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.gcard .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.chic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); flex: none; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--border); } .dots i.on { background: var(--accent); }

const setErr = (id, msg) => { const f = document.getElementById(id), e = document.getElementById('e-' + id); if (f) f.setAttribute('aria-invalid', msg ? 'true' : 'false'); if (e) e.innerHTML = msg ? ic('alert') + esc(msg) : ''; return !msg; };
const fld = (id, label, input, hint = '') => `<div class="field"><label for="${id}">${label}</label>${input}${hint ? `<span class="hint">${hint}</span>` : ''}<span class="err" id="e-${id}" aria-live="polite"></span></div>`;
const val = (id) => (document.getElementById(id)?.value ?? '').trim();
const opts = (o, cur) => Object.entries(o).map(([k, v]) => `<option value="${k}" ${String(cur) === String(k) ? 'selected' : ''}>${esc(v)}</option>`).join('');
const URL_RE = /^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+(\/[^\s]*)?$/i, EMAIL_RE = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;

/* ── shared table: search / sort / filter / pagination / bulk ─ */
const TS = {};
const tst = (k, sort, dir = 1, per = 10) => TS[k] || (TS[k] = { q: '', sort, dir, page: 0, per, sel: new Set(), f: 'all', f2: 'all' });
function table(k, { cols, rows, colsm, empty, bulk, rowAct }) {
  const st = TS[k], c = cols.find((x) => x.k === st.sort);
  if (c && c.v) rows = rows.slice().sort((a, b) => { const x = c.v(a), y = c.v(b); return (typeof x === 'string' ? x.localeCompare(y, 'en-GB') : x - y) * st.dir; });
  const pages = Math.max(1, Math.ceil(rows.length / st.per)); st.page = Math.min(st.page, pages - 1);
  const vis = rows.slice(st.page * st.per, st.page * st.per + st.per);
  for (const id of [...st.sel]) if (!rows.some((r) => r.id === id)) st.sel.delete(id);
  const all = vis.length && vis.every((r) => st.sel.has(r.id));
  const grid = (bulk ? '28px ' : '') + cols.map((x) => x.w).join(' '), gridm = (bulk ? '28px ' : '') + (colsm || cols.filter((x) => !x.hm).map((x) => x.w).join(' '));
  const th = cols.map((x) => `<div class="${x.hm ? 'hm' : ''} ${x.r ? 'r' : ''}" ${x.v ? `aria-sort="${st.sort === x.k ? (st.dir > 0 ? 'ascending' : 'descending') : 'none'}"` : ''}>${x.v ? `<button class="${st.sort === x.k ? 'on' : ''}" data-act="sort" data-t="${k}" data-k="${x.k}">${x.l}${st.sort === x.k ? ic(st.dir > 0 ? 'up' : 'down') : ''}</button>` : x.l}</div>`).join('');
  const bar = bulk && st.sel.size ? `<div class="bulk" role="region" aria-label="Bulk actions"><b>${fmt(st.sel.size)} selected</b>${bulk}<button class="btn sm ghost" data-act="selClear" data-t="${k}">Clear</button></div>` : '';
  const body = vis.map((r) => `<div class="tr ${st.sel.has(r.id) ? 'selr' : ''}" ${rowAct ? `data-act="${rowAct}" data-id="${r.id}" tabindex="0" role="link" aria-label="Open ${esc(r.name || r.slug || r.id)}"` : ''} style="${rowAct ? 'cursor:pointer' : ''}">${bulk ? `<div><input type="checkbox" class="chk" data-act="sel" data-t="${k}" data-id="${r.id}" ${st.sel.has(r.id) ? 'checked' : ''} aria-label="Select ${esc(r.name || r.slug || r.id)}"></div>` : ''}${cols.map((x) => `<div class="tcell ${x.hm ? 'hm' : ''} ${x.r ? 'r' : ''}">${x.c(r)}</div>`).join('')}</div>`).join('');
  const from = rows.length ? st.page * st.per + 1 : 0, to = Math.min(rows.length, (st.page + 1) * st.per);
  return `${bar}<div class="tbl" role="table" style="--cols:${grid};--colsm:${gridm}"><div class="tr th" role="row">${bulk ? `<div><input type="checkbox" class="chk" data-act="selAll" data-t="${k}" ${all ? 'checked' : ''} aria-label="Select all on this page"></div>` : ''}${th}</div>${body || `<div style="padding:4px 0">${empty}</div>`}</div>
    ${rows.length > st.per ? `<div class="pager"><span>Showing ${fmt(from)}–${fmt(to)} of ${fmt(rows.length)}</span><div><button class="btn sm" data-act="pg" data-t="${k}" data-d="-1" ${st.page === 0 ? 'disabled' : ''} aria-label="Previous page">${ic('left')}Previous</button><button class="btn sm" data-act="pg" data-t="${k}" data-d="1" ${st.page >= pages - 1 ? 'disabled' : ''} aria-label="Next page">Next${ic('right')}</button></div></div>` : rows.length ? `<div class="pager"><span>${pl(rows.length, 'result')}</span></div>` : ''}`;
}
const srch = (k, ph) => `<label class="srch">${ic('search')}<span class="sr">${ph}</span><input id="q-${k}" type="search" data-search data-in="q" data-t="${k}" value="${esc(TS[k].q)}" placeholder="${ph}" autocomplete="off"></label>`;
const match = (q, ...f) => !q || f.some((x) => String(x ?? '').toLowerCase().includes(q.toLowerCase()));

/* ── small renderers ───────────────────────────────────── */
const tile = (p, cls = '') => `<span class="tile ${cls}" style="--h:${p.hue}" aria-hidden="true">${esc(inits(p.name))}</span>`;
const avatar = (m, cls = '') => m ? `<span class="av ${cls}" style="--h:${m.hue}" title="${esc(m.name)}">${esc(inits(m.name))}</span>` : `<span class="av none ${cls}" title="Unassigned">–</span>`;
const stPill = (st) => `<span class="pill ${STATUS[st][1]}"><i></i>${STATUS[st][0]}</span>`;
const cb = (done, attrs) => `<button class="cb" role="checkbox" aria-checked="${done}" data-w ${attrs}>${done ? ic('check') : ''}</button>`;
const dueTxt = (t) => { const late = t.st !== 'done' && t.due < T0; return `<span class="${late ? 'due-late' : ''}">${late ? 'Overdue · ' : ''}${relDay(t.due)}</span>`; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const short = (l) => `go.shipter.app/${l.slug}`;
const utmUrl = (l) => `${l.dest}${l.dest.includes('?') ? '&' : '?'}utm_source=${encodeURIComponent(l.src)}&utm_medium=${encodeURIComponent(l.med)}&utm_campaign=${encodeURIComponent(l.camp)}${l.content ? '&utm_content=' + encodeURIComponent(l.content) : ''}`;
const dayLabels = (n) => Array.from({ length: n }, (_, i) => fD(day(i - n)));
const series = (pid, n = 30) => Array.from({ length: n }, (_, i) => sum(S.links.filter((l) => pid === 'all' || l.pid === +pid).map((l) => l.daily[30 - n + i])));
const CHARTS = {
  dash14: (w) => { const v = series('all', 14), lab = dayLabels(14); return barsSVG(w, { labels: lab.map((x, i) => i % 2 ? '' : x), values: v, h: 200, mark: [13] }); },
  links30: (w) => { const v = series(LF.pid), lab = dayLabels(30); return v.some(Boolean) ? lineSVG(w, { labels: lab, values: v, h: 230, xAt: [0, 7, 14, 21, 29] }) : `<div class="empty" style="height:230px;display:grid;place-content:center">${ic('chart')}<b>No clicks yet</b>Share a tracked link to start collecting data.</div>`; },
};

/* ── launch board ──────────────────────────────────────── */
VIEWS.dash = () => {
  const act = live().filter((p) => p.st === 'active' || p.st === 'planning'), actIds = new Set(act.map((p) => p.id));
  const ts = S.tasks.filter((t) => actIds.has(t.pid)), done = ts.filter((t) => t.st === 'done').length;
  const next = ts.filter((t) => t.st !== 'done').sort((a, b) => a.due - b.due).slice(0, 7);
  const od = overdue().length, u = usage(), L = LIM();
  const up = live().filter((p) => p.launch >= T0 && p.st !== 'paused').sort((a, b) => a.launch - b.launch).slice(0, 5);
  const hr = new Date().getHours(), greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const finding = od ? `<div class="finding">${ic('alert')}<span>${pl(od, 'task is', 'tasks are')} overdue across your launches. Clear them before the next launch on ${fD(up[0] ? up[0].launch : T0)}.</span><button class="btn sm primary" data-page="tasks">Open board</button></div>` : u.gen / L.gen > .8 ? `<div class="finding">${ic('zap')}<span>${pct(u.gen, L.gen)}% of this cycle’s AI generations used. The limit resets on ${fD(S.renew)}.</span><button class="btn sm primary" data-page="billing">See plans</button></div>` : '';
  return head('Launch board', `${greet}, ${esc(ME.name.split(' ')[0])}. Here is what moves your launches forward today.`, `<button class="btn" data-page="gen">${ic('zap')}Generate plan</button><button class="btn primary" data-act="wizard" data-w>${ic('plus')}New project</button>`) + finding +
    `<div class="kpis"><div class="kpi"><b>${act.length}</b><span>Launches in progress</span><em>${pl(live().filter((p) => p.st === 'launched').length, 'product')} already launched</em></div>
    <div class="kpi"><b>${fmt(done)}<small>of ${fmt(ts.length)}</small></b><span>Tasks done</span><em>${pct(done, ts.length)}% of active plans</em></div>
    <div class="kpi"><b data-vis="all">${fmt(visToday())}</b><span><i class="livedot"></i>Link clicks today</span><em>${fmt(vis30())} in the last 30 days</em></div>
    <div class="kpi"><b>${fmt(u.gen)}<small>of ${fmt(L.gen)}</small></b><span>AI generations</span><em>Resets ${relDay(S.renew)}</em></div></div>
    <div class="grid" style="margin-top:16px"><section class="card c7"><div class="card-h"><h2>Next up</h2><button class="lnk" data-page="tasks">Open task board</button></div>${next.map((t) => { const p = proj(t.pid); return `<div class="task"><span>${cb(false, `data-act="tick" data-id="${t.id}" aria-label="Mark done: ${esc(t.title)}"`)}</span><div class="t"><div class="ell" title="${esc(t.title)}">${esc(t.title)}</div><div class="w ell">${esc(p.name)} · ${esc(catOf(t.ch).n)}</div></div><div class="rt">${dueTxt(t)}${avatar(member(t.who), 'sm')}</div></div>`; }).join('') || emptyState('check', 'All clear', 'No open tasks in your active launches.')}</section>
    <section class="card c5"><div class="card-h"><h2>Link clicks, last 14 days</h2><span>All projects</span></div><div data-chart="dash14"></div></section>
    <section class="card c5"><div class="card-h"><h2>Upcoming launches</h2><button class="lnk" data-page="projects">All projects</button></div><div class="ul-rows">${up.map((p) => `<div style="cursor:pointer" data-act="openProj" data-id="${p.id}">${tile(p)}<div style="flex:1;min-width:0"><b class="ell" style="display:block">${esc(p.name)}</b><span class="muted" style="font-size:12.5px">${doneOf(p.id)} of ${projTasks(p.id).length} tasks · ${MARKETS[p.market]}</span></div><div class="cd"><b>${dayDiff(p.launch) === 0 ? 'Today' : pl(dayDiff(p.launch), 'day')}</b><span>${fD(p.launch)}</span></div></div>`).join('') || emptyState('calendar', 'Nothing scheduled', 'Set a launch date on a project to see it here.')}</div></section>
    <section class="card c7"><div class="card-h"><h2>Progress by project</h2><span>Active plans</span></div>${act.filter((p) => p.plan).slice(0, 6).map((p) => barRow(esc(p.name), pct(doneOf(p.id), projTasks(p.id).length), `${doneOf(p.id)} of ${projTasks(p.id).length}`)).join('')}</section>
    <section class="card c12"><div class="card-h"><h2>Recent activity</h2><span>Everyone in Northlight Studio</span></div><ul class="feed">${S.act.slice(0, 6).map((a) => `<li>${avatar(member(a.who))}<div><b>${esc(member(a.who)?.name || 'Former member')}</b> ${esc(a.t)}${a.p ? ` <span class="muted">in ${esc(a.p)}</span>` : ''}<small>${ago(a.ts)}</small></div></li>`).join('')}</ul></section></div>`;
};

/* ── projects list ─────────────────────────────────────── */
tst('projects', 'launch', 1, 8);
VIEWS.projects = () => {
  const st = TS.projects, all = live();
  const cnt = (f) => f === 'all' ? all.length : all.filter((p) => p.st === f).length;
  const rows = all.filter((p) => (st.f === 'all' || p.st === st.f) && (st.f2 === 'all' || p.type === st.f2) && match(st.q, p.name, p.desc, p.aud, MARKETS[p.market]));
  const cols = [
    { k: 'name', l: 'Project', w: 'minmax(0,2.4fr)', v: (p) => p.name, c: (p) => `<div class="pmain">${tile(p)}<div><b>${esc(p.name)}</b><span>${p.type} · ${esc(p.desc)}</span></div></div>` },
    { k: 'st', l: 'Status', w: '112px', v: (p) => Object.keys(STATUS).indexOf(p.st), c: (p) => stPill(p.st) },

    `<div class="tools"><div class="tabs" role="tablist" aria-label="Filter by status">${['all', ...Object.keys(STATUS)].map((f) => `<button role="tab" aria-selected="${st.f === f}" class="${st.f === f ? 'on' : ''}" data-act="tf" data-t="projects" data-v="${f}">${f === 'all' ? 'All' : STATUS[f][0]}<span class="n">${cnt(f)}</span></button>`).join('')}</div>${srch('projects', 'Search projects')}<select class="sel" aria-label="Filter by type" data-chg="tf2" data-t="projects"><option value="all">All types</option>${TYPES.map((t) => `<option ${st.f2 === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    <section class="card">${table('projects', { cols, rows, colsm: 'minmax(0,1fr) 104px', rowAct: 'openProj', bulk: `<button class="btn sm" data-act="bulkProjCsv">${ic('dl')}Export</button><button class="btn sm" data-act="bulkPause" data-w>Pause</button><button class="btn sm danger" data-act="bulkArchive" data-w>${ic('trash')}Archive</button>`, empty: emptyState('search', 'No projects match', st.q ? `Nothing matches “${esc(st.q)}”. Try a shorter search or clear the filters.` : 'No projects with this status yet.', '<button class="btn sm" data-act="clearFilters" data-t="projects">Clear filters</button>') })}</section>`;
};

/* ── project detail ────────────────────────────────────── */

  const weeks = p.plan ? [1, 2, 3, 4].map((w) => ({ w, cs: p.plan.chs.filter((c) => c.week === w) })).filter((x) => x.cs.length) : [];
  const links = S.links.filter((l) => l.pid === p.id), r = p.plan ? reachOf(p.plan.chs.map((c) => c.id)) : null;
  const wkRange = (w) => `${fD(p.launch - (21 - (w - 1) * 7) * DAY)} – ${fD(p.launch - (15 - (w - 1) * 7) * DAY)}`;
  return `<button class="btn ghost sm" data-page="projects" style="margin:-6px 0 12px -10px">${ic('left')}All projects</button>` + head(`<span style="display:inline-flex;gap:14px;align-items:center">${tile(p, 'lg')}<span>${esc(p.name)}</span></span>`, `${stPill(p.st)} &nbsp;${p.type} · ${MARKETS[p.market]} · ${p.budget ? EUR0.format(p.budget) + '/mo budget' : 'no paid budget'} · launch ${fD(p.launch, 1)}`,
    `<button class="btn" data-act="editProj" data-id="${p.id}" data-w>${ic('edit')}Edit</button><button class="btn" data-act="exportMenu" data-id="${p.id}" aria-haspopup="menu">${ic('dl')}Export</button><button class="btn primary" data-act="planFor" data-id="${p.id}" data-w>${ic('zap')}${p.plan ? 'Regenerate plan' : 'Generate plan'}</button>`) +
    `<div class="kpis"><div class="kpi"><b>${d}<small>of ${ts.length}</small></b><span>Tasks done</span><em>${pct(d, ts.length)}% complete</em></div><div class="kpi"><b data-vis="p${p.id}">${fmt(visToday(p.id))}</b><span><i class="livedot"></i>Clicks today</span><em>${fmt(vis30(p.id))} in 30 days</em></div><div class="kpi"><b>${p.plan ? p.plan.chs.length : 0}</b><span>Channels in plan</span><em>${p.plan ? `Plan v${p.plan.v} · ${ago(p.plan.at)}` : 'No plan yet'}</em></div><div class="kpi"><b>${r ? fmtReach(r) : '–'}</b><span>Estimated monthly reach</span><em>People who may see the launch</em></div></div>
    <div class="grid" style="margin-top:16px"><section class="card c8"><div class="card-h"><h2>Launch plan</h2><span>${p.plan ? 'Tick tasks as you go' : ''}</span></div>${p.plan ? weeks.map(({ w, cs }) => `<div class="week"><div class="week-h"><b>Week ${w}</b><span>${wkRange(w)}</span></div>${cs.map((c) => { const ch = catOf(c.id), ct = ts.filter((t) => t.ch === c.id); return `<div class="chh">${esc(ch.n)} <span class="muted">· ${fmtReach(ch.reach)} reach · ${costTxt(ch)} · ${ct.filter((t) => t.st === 'done').length}/${ct.length} done</span></div>${ct.map((t) => `<div class="task ${t.st === 'done' ? 'done' : ''}"><span>${cb(t.st === 'done', `data-act="tick" data-id="${t.id}" aria-label="${esc(t.title)}"`)}</span><div class="t" style="cursor:pointer" data-act="openTask" data-id="${t.id}">${esc(t.title)}<div class="w">${CATS[t.cat]}${t.st === 'doing' ? ' · <span class="warn">In progress</span>' : ''}</div></div><div class="rt">${dueTxt(t)}${avatar(member(t.who), 'sm')}</div></div>`).join('')}`; }).join('')}</div>`).join('') : emptyState('zap', 'No plan yet', 'Generate a 4-week plan from this brief. It uses 1 AI generation.', `<button class="btn primary" data-act="planFor" data-id="${p.id}" data-w>${ic('zap')}Generate plan</button>`)}</section>
    <div class="c4" style="display:flex;flex-direction:column;gap:var(--gap)"><section class="card"><div class="card-h"><h2>Brief</h2><button class="lnk" data-act="editProj" data-id="${p.id}">Edit</button></div><dl class="kv"><dt>Product</dt><dd>${esc(p.desc)}</dd><dt>Audience</dt><dd>${esc(p.aud)}</dd><dt>Problem</dt><dd>${esc(p.problem || '–')}</dd><dt>Goal</dt><dd>${GOALS[p.goal]}</dd><dt>Website</dt><dd>${esc(p.site.replace('https://', ''))}</dd><dt>Owner</dt><dd>${esc(member(p.owner)?.name || 'Unassigned')}</dd></dl></section>
    ${p.plan && p.plan.wins.length ? `<section class="card"><div class="card-h"><h2>Quick wins</h2><span>From the AI plan</span></div>${p.plan.wins.map((w) => `<div class="win"><span>${esc(w.t)}</span><small><span class="pill ${w.impact === 'High' ? 'pos' : ''}">${w.impact} impact</span><span class="pill">${w.effort} effort</span><span class="pill">${w.time}</span></small></div>`).join('')}</section>` : ''}
    <section class="card"><div class="card-h"><h2>Tracked links</h2><button class="lnk" data-act="linksFor" data-id="${p.id}">Manage</button></div>${links.length ? links.map((l) => `<div class="brow-t" style="padding:6px 0"><span class="mono ell">${esc(short(l))}</span><b>${fmt(l30(l))}</b></div>`).join('') : emptyState('link', 'No links yet', 'Create a tracked link to see where clicks come from.')}</div></section></div>
    <div style="margin-top:20px;display:flex;justify-content:flex-end"><button class="btn ghost" data-act="archiveProj" data-id="${p.id}" data-w>${ic('trash')}Archive project</button></div>`;
};

/* ── AI plan generator ─────────────────────────────────── */
const G = { st: 'idle', step: 0, text: '', out: null, t: [], form: null, err: '' };
const GSTEPS = ['Reading the product brief', 'Profiling the audience', `Scoring ${CH.length} channels for market and budget`, 'Drafting the 4-week sequence', 'Writing tasks and quick wins', 'Estimating reach'];
const formFrom = (p) => ({ pid: p.id, aud: p.aud, problem: p.problem, market: p.market, budget: p.budget, goal: p.goal, launch: isoD(p.launch) });
VIEWS.gen = () => {
  if (!G.form) G.form = formFrom(live()[0]);
  const f = G.form, u = usage(), L = LIM(), left = L.gen - u.gen, busy = G.st === 'running';
  return head('AI plan', 'Describe the launch and get a week-by-week channel plan with tasks you can edit before saving.') + `<div class="gen"><section class="card"><div class="meter" style="margin-bottom:18px"><div class="brow-t"><span>AI generations this cycle</span><b>${fmt(u.gen)} of ${fmt(L.gen)}</b></div><div class="bar thick"><i style="width:${u.gen / L.gen * 100}%"></i></div><p class="muted" style="font-size:12.5px;margin-top:6px">${left > 0 ? `${pl(left, 'generation')} left · resets ${fD(S.renew)}` : 'Limit reached. Upgrade or wait for the reset.'}</p></div>
    <form id="gform" novalidate>${fld('g-p', 'Project', `<select id="g-p" data-chg="gproj" ${busy ? 'disabled' : ''}>${live().map((p) => `<option value="${p.id}" ${f.pid === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`)}

    if (e.key === 'Enter') { e.preventDefault(); return ACT.openTask({ id }); }
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || $('#scrim') || !$('#signin').hidden) return;
  if (e.key === '/') { e.preventDefault(); const s = $('#main [data-search]') || (getComputedStyle($('.gs')).display !== 'none' ? $('#gq') : null); if (s) { s.focus(); s.select(); } }
  else if (e.key === '?') { e.preventDefault(); ACT.help({ tab: 'keys' }); }
}, true);
/* drag and drop between kanban columns */
let dragId = null;
document.addEventListener('dragstart', (e) => { const c = e.target.closest && e.target.closest('.kc'); if (!c) return; if (S.viewer) { e.preventDefault(); return deny(); } dragId = +c.dataset.task; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragId)); requestAnimationFrame(() => c.classList.add('drag')); });
document.addEventListener('dragend', () => { $$('.kc.drag').forEach((c) => c.classList.remove('drag')); $$('.klist.over').forEach((l) => l.classList.remove('over')); dragId = null; });
document.addEventListener('dragover', (e) => { const l = e.target.closest && e.target.closest('.klist'); if (!l || dragId == null) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; $$('.klist.over').forEach((x) => x !== l && x.classList.remove('over')); l.classList.add('over'); });
document.addEventListener('drop', (e) => { const l = e.target.closest && e.target.closest('.klist'); if (!l || dragId == null) return; e.preventDefault(); const id = dragId; dragId = null; moveTask(id, l.dataset.drop); });
addEventListener('resize', () => closePop());
addEventListener('scroll', () => { if (popEl && !popEl.contains(document.activeElement)) closePop(); }, { passive: true });

/* ── sign in / out ─────────────────────────────────────── */
function signOut() {
  closeDrawer(); closePop(); $('#app').hidden = true; $('#tabbar').hidden = true;
  const s = $('#signin'); s.hidden = false;
  s.innerHTML = `<div class="sbox"><div class="brand"><div class="brand-mark"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11a2.8 2.8 0 00-4-4L4 15zM13 6l5 5"/></svg></div><div class="brand-name">Shipter</div></div><h1>Sign in</h1><p>Plan, run and measure your product launches.</p>
    <div class="fbox ok">${ic('check')}<span>You have been signed out.</span></div>
    <form id="siform" novalidate>${fld('si-email', 'Email', `<input id="si-email" type="email" autocomplete="username" value="${esc(ME.email)}">`)}${fld('si-pw', 'Password', '<input id="si-pw" type="password" autocomplete="current-password" value="launch-demo-2026">')}<button class="btn primary" type="submit" id="si-ok">Sign in</button></form>
    <p class="demo">Demo credentials are filled in. <button class="lnk" type="button" data-act="forgot">Forgot password?</button></p></div>`;
  $('#si-ok').focus();
}
SUBMIT.siform = () => {
  const e = val('si-email'), p = $('#si-pw').value;
  const ok = [setErr('si-email', !EMAIL_RE.test(e) ? 'Enter the email you signed up with.' : ''), setErr('si-pw', p.length < 8 ? 'The password has at least 8 characters.' : '')].every(Boolean);
  if (!ok) return;
  const b = $('#si-ok'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Signing in';
  setTimeout(() => { $('#signin').hidden = true; $('#app').hidden = false; $('#tabbar').hidden = false; S.viewer = false; go('dash'); toast(`Welcome back, ${ME.name.split(' ')[0]}`); }, reduced ? 150 : 700);
};
ACT.forgot = () => toast(`We sent a reset link to ${ME.email}`);

/* live clicks trickle in on launched and launching projects */
setInterval(() => {
  if (document.hidden || !S.links.length) return;
  const pool = S.links.filter((l) => ['launched', 'active'].includes(proj(l.pid).st) && !proj(l.pid).archived); if (!pool.length) return;
  const l = pool[Math.floor(Math.random() * pool.length)]; l.today += 1 + Math.floor(Math.random() * 2);
  for (const [k, v] of [['all', visToday()], ['p' + l.pid, visToday(l.pid)], ['l' + l.id, l.today]]) $$(`[data-vis="${k}"]`).forEach((el) => { el.textContent = fmt(v); });
}, 2200);
render();
</script>
