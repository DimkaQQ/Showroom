<!DOCTYPE html>
<html lang="en" data-theme="dark" data-fx="banner">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shipter — product launch planner (demo)</title>
<meta name="description" content="Demo: AI builds a distribution plan for a digital product, and the launch board walks you through the tasks. Plans with generation limits. Sample data shown.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*@kit.css*/
:root {
  --bg: #0e0c0b; --surface: #151211; --raised: #1d1917; --hover: #241f1d; --border: #2a2422; --rule: #1f1a18;
  --text: #f4efec; --muted: #b0a7a2; --faint: #8b827d;
  --accent: #ff7a45; --accent-ink: #1d0a02; --accent-bg: rgba(255,122,69,.13);
  --pos: #5fd39a; --neg: #ff6b6b; --warn: #f0b95a;
  --font: "Sofia Sans", system-ui, sans-serif; --display: "Sofia Sans", system-ui, sans-serif;
}
body { font-size: 15px; }
.brand-name, .head h1, .big, .kpi b { font-weight: 800; letter-spacing: -.02em; }
.head h1 { font-size: 28px; }
.nav .count { background: var(--accent); color: var(--accent-ink); }

.cvr { width: 72px; height: 72px; border-radius: 16px; overflow: hidden; flex: none; } .cvr img { width: 100%; height: 100%; object-fit: cover; display: block; }
.proj { grid-template-columns: 72px minmax(0, 1fr) 200px auto !important; }
.vis { font: 800 22px var(--display); } .vis small { font: 500 13px var(--font); color: var(--muted); margin-left: 6px; }
.livedot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--pos); margin-right: 6px; animation: pulse2 1.8s ease-in-out infinite; } @keyframes pulse2 { 50% { opacity: .3; } }
@media (max-width: 899px) { .proj { grid-template-columns: 72px minmax(0, 1fr) !important; } .proj .prog, .proj > .btn { grid-column: 1 / -1; } }
.checks li { list-style: none; }
.task { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 44px; padding: 4px 0; }
.task + .task { border-top: 1px solid var(--rule); }
.cb { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border); background: none; cursor: pointer; display: grid; place-items: center; color: var(--accent-ink); transition: background-color .15s, border-color .15s; padding: 0; }
.cb:hover { border-color: var(--accent); } .cb[aria-checked="true"] { background: var(--accent); border-color: var(--accent); } .cb .ic { width: 14px; height: 14px; stroke-width: 3; }
.task.done .t { color: var(--faint); text-decoration: line-through; }
.task .w { color: var(--muted); font-size: 13px; }
.proj { display: grid; grid-template-columns: minmax(0, 1fr) 200px auto; gap: 20px; align-items: center; padding: 16px 0; cursor: pointer; }
.proj + .proj { border-top: 1px solid var(--rule); }
.proj h3 { font-size: 17px; font-weight: 700; } .proj p { color: var(--muted); margin-top: 2px; }
.proj .meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.prog { font-size: 13px; color: var(--muted); } .prog .bar { margin-top: 6px; }
.week { padding: 16px 0; } .week + .week { border-top: 1px solid var(--rule); }
.week-h { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; } .week-h b { font-size: 16px; font-weight: 700; } .week-h span { color: var(--muted); font-size: 13px; }
.gen { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: var(--gap); align-items: start; }
.out-h { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.cursor::after { content: ""; display: inline-block; width: 8px; height: 1em; margin-left: 3px; vertical-align: -2px; background: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.reveal { animation: pop .3s var(--ease) both; }
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap); }
.plan { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; }
.plan.cur { border-color: var(--accent); }
.plan h3 { font-size: 15px; color: var(--muted); font-weight: 600; } .plan .pr { font: 800 40px/1.1 var(--display); letter-spacing: -.02em; margin: 6px 0 2px; } .plan .pr small { font-size: 15px; color: var(--muted); font-weight: 500; }
.plan ul { margin: 16px 0 20px; flex: 1; } .plan li { display: flex; gap: 8px; padding: 5px 0; } .plan li .ic { color: var(--accent); width: 16px; height: 16px; margin-top: 3px; stroke-width: 2.4; } .plan li.off { color: var(--faint); } .plan li.off .ic { color: var(--faint); }
.meter { margin-bottom: var(--gap); }
@media (max-width: 1099px) { .gen { grid-template-columns: minmax(0, 1fr); } .plans { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 899px) { .proj { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
</style>
</head>
<body>
<div class="notice"><b>Demo</b> Shipter · plans are built from templates, sample data</div>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11a2.8 2.8 0 00-4-4L4 15zM13 6l5 5"/></svg></div>
      <div><div class="brand-name">Shipter</div><div class="brand-sub" id="side-plan"></div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="avatar">EM</div><div class="who"><b>Elena Marchetti</b><span id="side-who"></span></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<script>
/*@kit.js*/
'use strict';

/* ── catalog the planner picks from ───────────────────── */
const CH = [
  { id: 'nl',   n: 'Newsletters and Slack communities your audience follows', m: ['dach'], paid: false, lo: 2, hi: 6, tasks: ['List 15 newsletters and communities where your audience hangs out', 'Secure 3 reviews or mentions'] },
  { id: 'pr',   n: 'Heise, Sifted and dev.to', m: ['dach'], paid: false, lo: 3, hi: 9, tasks: ['Write a 1,000-word "how we built it" breakdown', 'Reply to comments within the first 2 hours of publishing'] },
  { id: 'ph',   n: 'Product Hunt', m: ['global', 'eu', 'uk'], paid: false, lo: 2, hi: 8, tasks: ['Prepare the page, 4 screenshots and a short video', 'Schedule the launch for a Tuesday and ask 20 friends to support it'] },
  { id: 'rd',   n: 'Reddit, Hacker News and Indie Hackers', m: ['global', 'eu', 'uk'], paid: false, lo: 1, hi: 5, tasks: ['Find 5 communities that discuss your problem', 'Help in replies for two weeks, then show your product'] },
  { id: 'dm',   n: 'Direct messages to first customers', m: ['dach', 'global', 'eu', 'uk'], paid: false, lo: 0.1, hi: 0.4, tasks: ['List 30 people who have this pain', 'Message each one personally and offer a free trial'] },
  { id: 'em',   n: 'Email campaign to your list', m: ['dach', 'global', 'eu', 'uk'], paid: false, lo: 0.5, hi: 2, tasks: ['Add a signup form to your landing page', 'Send 3 emails: story, value, offer'] },
  { id: 'inf',  n: 'Creators and partners', m: ['dach', 'global', 'eu', 'uk'], paid: true, lo: 5, hi: 15, tasks: ['Pick 5 creators with an engaged audience in your niche', 'Offer a sales commission instead of a flat fee'] },
  { id: 'ads',  n: 'LinkedIn Ads or Google Ads', m: ['dach', 'global', 'eu', 'uk'], paid: true, lo: 8, hi: 20, tasks: ['Run 3 ads with different headlines at €5 a day', 'After 4 days, keep the one that brought leads at the lowest cost'] },
];
const MARKETS = { dach: 'DACH', global: 'Global', eu: 'Europe', uk: 'UK & Ireland' };
const BUDGETS = [['0', 'No budget'], ['100', '€100–500 per month'], ['500', '€500–2000 per month'], ['2000', '€2000+ per month']];
const LIM = { trial: 10, starter: 200, pro: Infinity };
const PLAN_N = { trial: 'Trial', starter: 'Starter', pro: 'Pro' };

/* the planner: same inputs, same plan. Free channels first; paid ones only when there is a budget */
function makePlan(market, budget) {
  const pick = CH.filter((c) => c.m.includes(market) && (!c.paid || +budget >= 100)).sort((a, b) => (+a.paid - +b.paid) || b.hi - a.hi).slice(0, +budget >= 500 ? 6 : 5);
  const ch = pick.map((c, i) => ({ id: c.id, week: Math.min(4, 1 + Math.floor(i * 4 / pick.length)), tasks: c.tasks.map((t) => ({ t, done: false })) }));
  return ch;
}
const catOf = (id) => CH.find((c) => c.id === id);
const reach = (plan) => plan.reduce((a, c) => [a[0] + catOf(c.id).lo, a[1] + catOf(c.id).hi], [0, 0]);
const taskCount = (p) => p.plan.reduce((a, c) => a + c.tasks.length, 0), doneCount = (p) => p.plan.reduce((a, c) => a + c.tasks.filter((t) => t.done).length, 0);


/* cover photos (CC0, see demos/CREDITS.md): three images, cycled by project id */
const coverImg = (id) => `<img src="img/cover-${(id - 1) % 3 + 1}.jpg" alt="" loading="lazy" decoding="async">`;
const visits = (p) => p.vis ?? 0;
const S = {
  plan: 'trial', used: 7, trialDays: 5,
  projects: [
    { id: 1, name: 'Invoicely Pro', type: 'SaaS', desc: 'A platform where freelancers send invoices, collect SEPA and card payments, and track cash flow.', aud: 'Freelancers and consultants in Germany, Austria and Switzerland', market: 'dach', budget: '0' },
    { id: 2, name: 'SaaS Landing Kit', type: 'Landing', desc: 'A set of ready-made landing pages for SaaS startups.', aud: 'B2B SaaS founders', market: 'global', budget: '100' },
    { id: 3, name: 'GameApp Store', type: 'App', desc: 'A mini-game catalogue with one-tap purchase.', aud: 'Players aged 18–30', market: 'uk', budget: '500' },
  ],
};
S.projects.forEach((p, i) => { p.plan = makePlan(p.market, p.budget); p.vis = [214, 96, 41][i]; });
{ // seed some progress so the board has something to show
  const mark = (p, n) => { let k = 0; for (const c of p.plan) for (const t of c.tasks) if (k++ < n) t.done = true; };
  mark(S.projects[0], 4); mark(S.projects[1], 2); mark(S.projects[2], 0);
}
console.assert(S.projects[0].plan.length === 4 && taskCount(S.projects[0]) === 8 && doneCount(S.projects[0]) === 4, 'plan');
const limit = () => LIM[S.plan], left = () => limit() - S.used;
const fmtReach = ([a, b]) => `${fmtD(a, a % 1 ? 1 : 0)}–${fmtD(b, b % 1 ? 1 : 0)} k`;

/* ── shell ────────────────────────────────────────────── */
const PAGES = { dash: ['Launch', 'home'], projects: ['Projects', 'list'], gen: ['AI plan', 'zap'], pricing: ['Pricing', 'coin'] };
let page = 'dash', openId = null, filter = 'all', timers = [], genState = null;
const proj = (id) => S.projects.find((p) => p.id === id);

function chrome() {
  $('#nav').innerHTML = Object.keys(PAGES).map((k) => `<a data-page="${k}" tabindex="0" role="link">${ic(PAGES[k][1])}<span>${PAGES[k][0]}</span></a>`).join('');
  $('#tabbar').innerHTML = $('#nav').innerHTML;
  $('#side-plan').textContent = S.plan === 'trial' ? `Trial · ${S.trialDays} days` : `${PLAN_N[S.plan]} plan`;
  $('#side-who').textContent = S.plan === 'pro' ? 'Unlimited generations' : `Generations: ${left()} of ${limit()}`;
  setNav(page === 'project' ? 'projects' : page);
}
function render() { timers.forEach(clearTimeout); timers = []; chrome(); $('#main').innerHTML = ({ dash, projects, project: projectPage, gen, pricing })[page](); }
function go(p, id) { page = p; if (id !== undefined) openId = id; render(); window.scrollTo(0, 0); }
const head = (t, sub, actions = '') => `<header class="head"><div><h1>${t}</h1><p>${sub}</p></div><div class="head-actions">${actions}</div></header>`;

document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-page]'); if (a) return go(a.dataset.page);
  const o = e.target.closest('[data-open]'); if (o && !e.target.closest('button,input')) return go('project', +o.dataset.open);
  const act = e.target.closest('[data-act]'); if (act) return ACT[act.dataset.act](act.dataset);
});
document.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-page]')) { e.preventDefault(); go(e.target.dataset.page); } });

const cb = (done, attrs) => `<button class="cb" role="checkbox" aria-checked="${done}" ${attrs}>${done ? ic('check') : ''}</button>`;

/* ── dashboard ────────────────────────────────────────── */
function dash() {
  const all = S.projects.reduce((a, p) => a + taskCount(p), 0), done = S.projects.reduce((a, p) => a + doneCount(p), 0);
  const today = S.projects.flatMap((p) => p.plan.filter((c) => c.week === 1).flatMap((c) => c.tasks.map((t, ti) => ({ p, c, t, ti })))).filter((x) => !x.t.done).slice(0, 5);
  const finding = S.plan === 'trial' ? `<div class="finding">${ic('clock')}<span>Trial ends in ${S.trialDays} days, ${left()} of ${limit()} ${left() === 1 ? 'generation' : 'generations'} left.</span><button class="btn sm primary" data-page="pricing">Choose a plan</button></div>` : '';
  return head('Launch board', 'What to do today to get your products in front of first customers', `<button class="btn primary" data-act="newProject">${ic('plus')}New project</button>`) + finding +
    `<div class="kpis"><div class="kpi"><b>${S.projects.length}</b><span>Active projects</span></div><div class="kpi"><b>${done}<small>of ${all}</small></b><span>Tasks done</span></div><div class="kpi"><b data-vis="all">${fmt(S.projects.reduce((a, p) => a + visits(p), 0))}</b><span><i class="livedot"></i>Link visits today</span></div><div class="kpi"><b>${S.used}${S.plan === 'pro' ? '' : `<small>of ${limit()}</small>`}</b><span>Generations used</span></div></div>
    <div class="grid"><section class="card c7"><div class="card-h"><h2>Do in week one</h2><span>${today.length ? 'tick when done' : 'all done'}</span></div>${today.map((x) => `<div class="task"><span>${cb(false, `data-act="tick" data-p="${x.p.id}" data-c="${x.c.id}" data-i="${x.ti}" aria-label="Mark done: ${esc(x.t.t)}"`)}</span><div class="t">${esc(x.t.t)}<div class="w">${esc(x.p.name)} · ${catOf(x.c.id).n}</div></div></div>`).join('') || '<p class="empty">No tasks for week one.</p>'}</section>
    <section class="card c5"><div class="card-h"><h2>Progress by project</h2></div>${S.projects.map((p) => barRow(esc(p.name), taskCount(p) ? doneCount(p) / taskCount(p) * 100 : 0, `${doneCount(p)} of ${taskCount(p)}`)).join('')}</section></div>`;
}

/* ── projects ─────────────────────────────────────────── */
function projects() {
  const types = ['all', ...new Set(S.projects.map((p) => p.type))], list = S.projects.filter((p) => filter === 'all' || p.type === filter);
  return head('Projects', `${S.projects.length} ${S.projects.length === 1 ? 'product' : 'products'}. Open a project to see its plan and tick off tasks.`, `<button class="btn primary" data-act="newProject">${ic('plus')}New project</button>`) +
    `<div class="tabs">${types.map((t) => `<button class="${filter === t ? 'on' : ''}" data-act="filter" data-v="${t}">${t === 'all' ? 'All' : t}</button>`).join('')}</div>
    <section class="card">${list.map((p) => { const t = taskCount(p), d = doneCount(p); return `<div class="proj" data-open="${p.id}"><span class="cvr">${coverImg(p.id)}</span><div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="meta"><span class="pill">${p.type}</span><span class="pill">${MARKETS[p.market]}</span></div></div><div class="prog">${t ? `${d} of ${t} tasks` : 'No plan yet'}<div class="bar"><i style="width:${t ? d / t * 100 : 0}%"></i></div></div><button class="btn sm" data-act="${t ? 'open' : 'planFor'}" data-id="${p.id}">${t ? 'Open' : 'Build plan'}</button></div>`; }).join('') || '<p class="empty">Nothing here yet.</p>'}</section>`;
}
function projectPage() {
  const p = proj(openId), t = taskCount(p), d = doneCount(p), r = reach(p.plan);
  const weeks = [1, 2, 3, 4].map((w) => ({ w, cs: p.plan.filter((c) => c.week === w) })).filter((x) => x.cs.length);
  return head(esc(p.name), `${esc(p.aud)} · ${MARKETS[p.market]} · ${BUDGETS.find((b) => b[0] === p.budget)[1].toLowerCase()}`, `<button class="btn" data-page="projects">${ic('arrow')}Back to projects</button><button class="btn" data-act="planFor" data-id="${p.id}">Rebuild plan</button>`) +
    `<div class="kpis"><div class="kpi"><b>${d}<small>of ${t}</small></b><span>Tasks done</span></div><div class="kpi"><b data-vis="${p.id}">${fmt(visits(p))}</b><span><i class="livedot"></i>Visits today</span></div><div class="kpi"><b>${p.plan.length}</b><span>Channels in plan</span></div><div class="kpi"><b>${t ? fmtReach(r) : '—'}</b><span>Estimated monthly reach</span></div></div>
    <section class="card">${weeks.map(({ w, cs }) => `<div class="week"><div class="week-h"><b>Week ${w}</b></div>${cs.map((c) => `<div style="margin-top:12px"><b>${catOf(c.id).n}</b> <span class="muted">· ${fmtReach([catOf(c.id).lo, catOf(c.id).hi])}${catOf(c.id).paid ? ' · paid' : ''}</span>${c.tasks.map((tk, i) => `<div class="task ${tk.done ? 'done' : ''}"><span>${cb(tk.done, `data-act="tick" data-p="${p.id}" data-c="${c.id}" data-i="${i}" aria-label="${esc(tk.t)}"`)}</span><div class="t">${esc(tk.t)}</div></div>`).join('')}</div>`).join('')}</div>`).join('') || '<p class="empty">No plan yet. Click “Rebuild plan”.</p>'}</section>`;
}

/* ── generator ────────────────────────────────────────── */
function meterHTML() {
  return S.plan === 'pro' ? '' : `<div class="meter"><div class="brow-t"><span>Generations</span><b>${S.used} of ${limit()}</b></div><div class="bar thick"><i style="width:${S.used / limit() * 100}%"></i></div></div>`;
}
function gen() {
  const g = genState || { pid: 1, aud: S.projects[0].aud, market: S.projects[0].market, budget: S.projects[0].budget, out: null };
  genState = g;
  return head('AI plan', 'Tell us about your product and get a week-by-week channel plan with tasks') + `<div class="gen"><section class="card">${meterHTML()}
    <div class="field"><label for="g-p">Project</label><select id="g-p" onchange="genState.pid=+this.value;const p=proj(genState.pid);genState.aud=p.aud;genState.market=p.market;genState.budget=p.budget;render()">${S.projects.map((p) => `<option value="${p.id}" ${g.pid === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="g-a">Target audience</label><input id="g-a" value="${esc(g.aud)}" oninput="genState.aud=this.value"></div>
    <div class="field"><label for="g-m">Market</label><select id="g-m" onchange="genState.market=this.value">${Object.entries(MARKETS).map(([k, v]) => `<option value="${k}" ${g.market === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label for="g-b">Promotion budget</label><select id="g-b" onchange="genState.budget=this.value">${BUDGETS.map(([k, v]) => `<option value="${k}" ${g.budget === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <button class="btn primary" style="width:100%;height:42px" data-act="run" id="g-run">${ic('zap')}Build plan</button></section>
    <section class="card" id="g-out" aria-live="polite">${g.out ? outHTML(g.out) : `<p class="empty" style="padding:60px 12px">Nothing yet. Fill in the settings on the left and click “Build plan”. Results are built from templates; this is a demo.</p>`}</section></div>`;
}
function outHTML(o) {
  const r = reach(o.plan);
  return `<div class="out-h"><div><h2 style="font-size:18px;font-weight:700">4-week plan for “${esc(proj(o.pid).name)}”</h2><p class="muted">${o.plan.length} ${o.plan.length === 1 ? 'channel' : 'channels'} · estimated reach ${fmtReach(r)} per month</p></div><button class="btn primary" data-act="save">Save to project</button></div>`
    + o.plan.map((c) => `<div class="week reveal"><div class="week-h"><b>${catOf(c.id).n}</b><span>week ${c.week} · ${fmtReach([catOf(c.id).lo, catOf(c.id).hi])}${catOf(c.id).paid ? ' · paid' : ''}</span></div><ul class="checks">${c.tasks.map((t) => `<li class="muted" style="padding:3px 0">— ${esc(t.t)}</li>`).join('')}</ul></div>`).join('');
}

/* ── pricing ──────────────────────────────────────────── */
function pricing() {
  const P = [['trial', 'Trial', '€0', '7 days free', ['Up to 3 projects', '10 generations', 'Basic channel plan'], ['Multiple projects', 'Priority support']],
    ['starter', 'Starter', '€9', 'per month, cancel anytime', ['Up to 10 projects', '200 generations per month', 'Full plan with tasks', 'Email support'], ['API access']],
    ['pro', 'Pro', '€29', 'per month, cancel anytime', ['Unlimited projects', 'Unlimited generations', 'API access', '24/7 support'], []]];
  return head('Pricing', 'The generation limit changes as soon as you pick a plan. Payments (Stripe, SEPA, PayPal) are not connected in this demo.') +
    `<div class="plans">${P.map(([k, n, pr, per, yes, no]) => `<article class="plan ${S.plan === k ? 'cur' : ''}"><h3>${n}${S.plan === k ? ' · your plan' : ''}</h3><div class="pr">${pr}<small> ${k === 'trial' ? '' : '/ mo'}</small></div><p class="muted">${per}</p><ul>${yes.map((y) => `<li>${ic('check')}${y}</li>`).join('')}${no.map((y) => `<li class="off">${ic('x')}${y}</li>`).join('')}</ul><button class="btn ${S.plan === k ? '' : 'primary'}" data-act="plan" data-v="${k}" ${S.plan === k ? 'disabled' : ''}>${S.plan === k ? 'Current plan' : 'Choose ' + n}</button></article>`).join('')}</div>`;
}

/* ── actions ──────────────────────────────────────────── */
const ACT = {
  filter(d) { filter = d.v; render(); }, open(d) { go('project', +d.id); },
  tick(d) { const c = proj(+d.p).plan.find((x) => x.id === d.c), t = c.tasks[+d.i]; t.done = !t.done; render(); if (t.done) toast('Done'); },
  plan(d) { S.plan = d.v; if (d.v !== 'trial') S.trialDays = 0; toast(`${PLAN_N[d.v]} plan: ${d.v === 'pro' ? 'no limit' : 'limit ' + LIM[d.v] + ' generations'}`); render(); },
  planFor(d) { genState = null; const p = proj(+d.id); genState = { pid: p.id, aud: p.aud, market: p.market, budget: p.budget, out: null }; go('gen'); },
  run() {
    if (left() <= 0) { toast('Generation limit reached. Choose a plan'); return go('pricing'); }
    const g = genState; if (!g.aud.trim()) return toast('Describe your audience');
    S.used++; g.out = null; chrome();
    const out = $('#g-out'), btn = $('#g-run'); btn.disabled = true;
    out.innerHTML = `<p class="cursor" style="padding:40px 4px;color:var(--muted)">Analysing audience “${esc(g.aud)}” and the ${esc(MARKETS[g.market])} market</p>`;
    const plan = makePlan(g.market, g.budget); const res = { pid: g.pid, plan };
    timers.push(setTimeout(() => {
      plan.forEach((_, i) => timers.push(setTimeout(() => {
        out.innerHTML = outHTML({ ...res, plan: plan.slice(0, i + 1) });
        if (i === plan.length - 1) { g.out = res; $('#g-run').disabled = false; }
      }, 380 * i)));
    }, 900));
    const m = $('.meter'); if (m) m.outerHTML = meterHTML();
  },
  save() { const g = genState, p = proj(g.pid); p.aud = g.aud; p.market = g.market; p.budget = g.budget; const was = new Set(p.plan.flatMap((c) => c.tasks.filter((t) => t.done).map((t) => t.t))); p.plan = g.out.plan.map((c) => ({ ...c, tasks: c.tasks.map((t) => ({ t: t.t, done: was.has(t.t) })) })); toast('Plan saved to project'); go('project', p.id); },
  newProject() {
    modal(`<h2>New project</h2><p>You will build the plan in the next step.</p><div class="field"><label for="n-n">Name</label><input id="n-n" placeholder="e.g. My SaaS"></div>
      <div class="field"><label for="n-t">Type</label><select id="n-t"><option>SaaS</option><option>App</option><option>Game</option><option>Landing</option><option>Bot</option></select></div><div class="field"><label for="n-d">Description</label><textarea id="n-d" placeholder="What the product does"></textarea></div>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="n-ok">Create</button></div>`, () => {
      $('#n-ok').onclick = () => {
        const n = $('#n-n').value.trim(); if (!n) return $('#n-n').focus();
        if (S.projects.length >= { trial: 3, starter: 10, pro: 999 }[S.plan]) { closeModal(); toast('Project limit reached on this plan'); return go('pricing'); }
        const id = Math.max(...S.projects.map((x) => x.id)) + 1; S.projects.push({ id, name: n, type: $('#n-t').value, desc: $('#n-d').value.trim() || 'No description', aud: 'Your audience', market: 'dach', budget: '0', plan: [] });
        closeModal(); toast('Project created'); render();
      };
    });
  },
};
/* live traffic: visits trickle in from the channels in each plan */
setInterval(() => {
  if (document.hidden) return;
  const p = S.projects[Math.floor(Math.random() * S.projects.length)]; p.vis += 1 + Math.floor(Math.random() * 3);
  const all = $('[data-vis="all"]'); if (all) all.textContent = fmt(S.projects.reduce((a, x) => a + visits(x), 0));
  const one = $(`[data-vis="${p.id}"]`); if (one) one.textContent = fmt(visits(p));
}, 1800);
render();
</script>
</body>
</html>
